/* Weight of headings: Marxy's own, lighter on dark grounds (03: "keeps Marxy's weight"). */
[data-theme="ink"],[data-theme="dusk"],[data-theme="night"],[data-theme="fjord"]{--marxy-weight-heading:560}
[data-theme="paper"],[data-theme="sepia"]{--marxy-weight-heading:580}
[data-theme="hc-dark"],[data-theme="hc-light"]{--marxy-weight-heading:700}

/* Roles: type set "Classic". Chrome is always the platform face at 13px. */
:root{
  --face-chrome:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;
  --marxy-face-serif:"Literata","Literata Fallback",Georgia,serif;
  --marxy-face-sans:"Atkinson Hyperlegible Next","Segoe UI",system-ui,sans-serif;
  --marxy-face-readme:"Inter",-apple-system,"Segoe UI",system-ui,sans-serif;
  --marxy-face-mono:"JetBrains Mono","Cascadia Mono",Consolas,ui-monospace,monospace;
  --chrome-size:13px;
  --r-sm:6px;--r-md:9px;--r-lg:13px;
  --ease:cubic-bezier(.2,.7,.2,1);
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--doc);color:var(--fg);font:var(--chrome-size)/1.4 var(--face-chrome);-webkit-font-smoothing:antialiased;overflow:hidden}
::selection{background:var(--sel)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
kbd{font:500 11px/1 var(--face-chrome);display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:4px;border:1px solid var(--line-strong);border-bottom-width:2px;background:var(--raised);color:var(--fg-muted)}

/* ================= Kind profiles =================
   A kind is a scope. Inside it the same --marxy-* tokens take other values (03, "Themes can restyle any kind").
   --marxy-measure-chars is in average characters; --marxy-avg is the measured advance of the face, in em. */
[data-marxy-kind]{
  --marxy-font-text:var(--marxy-face-serif);
  --marxy-size-body:20px;--marxy-line-box:30px;--marxy-measure-chars:66;
  --marxy-avg:.5;--marxy-code-scale:.86;
  --marxy-align:left;--marxy-hyphens:manual;
  --u:calc(var(--marxy-line-box) / 2);
  --col-w:calc(var(--marxy-measure-chars) * var(--marxy-avg) * var(--marxy-size-body));
}
[data-marxy-kind="prose"]{--marxy-font-text:var(--marxy-face-serif);--marxy-size-body:20px;--marxy-line-box:30px;--marxy-measure-chars:66;--marxy-align:justify;--marxy-hyphens:auto;--marxy-code-scale:.85}
[data-marxy-kind="readme"]{--marxy-font-text:var(--marxy-face-readme);--marxy-size-body:16px;--marxy-line-box:26px;--marxy-measure-chars:84;--marxy-code-scale:.9}
[data-marxy-kind="report"]{--marxy-font-text:var(--marxy-face-sans);--marxy-size-body:17px;--marxy-line-box:26px;--marxy-measure-chars:74;--marxy-code-scale:.9}
[data-marxy-kind="transcript"]{--marxy-font-text:var(--marxy-face-sans);--marxy-size-body:16px;--marxy-line-box:26px;--marxy-measure-chars:76;--marxy-code-scale:.9}
[data-marxy-kind="log"]{--marxy-font-text:var(--marxy-face-mono);--marxy-size-body:15px;--marxy-line-box:24px;--marxy-measure-chars:92;--marxy-avg:.6;--marxy-code-scale:1}
[data-marxy-kind="data"]{--marxy-font-text:var(--marxy-face-mono);--marxy-size-body:15px;--marxy-line-box:24px;--marxy-measure-chars:92;--marxy-avg:.6;--marxy-code-scale:1}
[data-marxy-kind="contents"]{--marxy-font-text:var(--marxy-face-serif);--marxy-size-body:20px;--marxy-line-box:30px;--marxy-measure-chars:66}

/* ================= The page: at rest, only this ================= */
#stage{position:fixed;inset:0;transform-origin:50% 50%;transition:transform .18s var(--ease),filter .18s var(--ease)}
#stage.eased{transform:scale(.9);filter:brightness(.7)}
#page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  background:var(--marxy-color-bg,var(--doc));
  padding:calc(var(--u) * 8) clamp(36px,6vw,110px) calc(var(--u) * 16);
  scrollbar-width:thin;scrollbar-color:transparent transparent}
#page:hover{scrollbar-color:var(--line-strong) transparent}

.rd{
  width:min(var(--col-w),100%);margin:0 auto;
  font-family:var(--marxy-font-text);font-size:var(--marxy-size-body);line-height:var(--marxy-line-box);
  font-weight:var(--text-wght);color:var(--marxy-color-text,var(--fg));
  font-kerning:normal;font-optical-sizing:auto;text-rendering:optimizeLegibility;font-synthesis:none;
  overflow-wrap:break-word;
}
.rd>*{margin:0}
.rd>*+*{margin-top:var(--u)}
.rd p{text-align:var(--marxy-align);hyphens:var(--marxy-hyphens);-webkit-hyphens:var(--marxy-hyphens);text-wrap:pretty}
.rd strong{font-weight:var(--strong-wght);color:var(--fg-strong)}
.rd em{font-style:italic}
.rd a{color:var(--marxy-color-accent,var(--accent));text-decoration:underline;text-decoration-thickness:.06em;text-underline-offset:.2em;text-decoration-color:color-mix(in srgb,currentColor 45%,transparent)}
.rd a:hover{text-decoration-color:currentColor}

/* Headings: hierarchy by size and weight only. Space above is 2.5x space below, in halves of the line box. */
.rd h1,.rd h2,.rd h3,.rd h4{font-family:inherit;font-weight:var(--marxy-weight-heading);color:var(--fg-strong);text-wrap:balance;hyphens:manual;margin:0}
.rd>h1{font-size:calc(var(--marxy-size-body) * 1.75);line-height:calc(var(--u) * 3);letter-spacing:-.012em;margin-bottom:calc(var(--u) * 2)}
.rd>h2{font-size:calc(var(--marxy-size-body) * 1.28);line-height:calc(var(--u) * 2);margin-top:calc(var(--u) * 5);margin-bottom:calc(var(--u) * 2)}
.rd>h3,.rd>h4{font-size:calc(var(--marxy-size-body) * 1.06);line-height:calc(var(--u) * 2);margin-top:calc(var(--u) * 3);margin-bottom:var(--u)}
.rd>h1:first-child{margin-top:0}

/* Lists: bullets and boxes hang in the margin, so the text keeps the column's edge. */
.rd ul,.rd ol{list-style:none;padding:0}
.rd ol{counter-reset:n}
.rd li{position:relative}
.rd li>ul,.rd li>ol{padding-left:1.5em}
.rd ul>li::before{content:"";position:absolute;left:-1.05em;top:calc(var(--marxy-line-box) / 2 - .13em);width:.26em;height:.26em;border-radius:50%;background:var(--fg-muted)}
.rd ol>li{counter-increment:n}
.rd ol>li::before{content:counter(n) ".";position:absolute;left:-2.5em;width:2em;text-align:right;font-variant-numeric:tabular-nums;color:var(--fg-muted)}
.rd li.task::before{content:"";left:-1.5em;top:calc((var(--marxy-line-box) - .8em) / 2);width:.8em;height:.8em;border-radius:3px;background:none;border:1.5px solid var(--edge)}
.rd li.task.done::before{background:var(--fg-muted);border-color:var(--fg-muted)}
.rd li.task.done::after{content:"";position:absolute;left:calc(-1.5em + .27em);top:calc((var(--marxy-line-box) - .8em) / 2 + .1em);width:.26em;height:.46em;border:solid var(--marxy-color-bg,var(--doc));border-width:0 2px 2px 0;transform:rotate(40deg)}
.rd li.task.done{color:var(--fg-muted)}

/* Code */
.rd code{font-family:var(--marxy-face-mono);font-size:calc(var(--marxy-code-scale) * 1em);font-weight:400;font-feature-settings:"liga" 0,"calt" 0;background:var(--inset);padding:0 .3em;border-radius:3px;hyphens:none;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.rd pre.code{background:var(--inset);border-radius:var(--r-sm);padding:var(--u) calc(var(--u) * 1.5);overflow-x:auto;font-family:var(--marxy-face-mono);font-size:calc(var(--marxy-code-scale) * 1em);line-height:var(--marxy-line-box);font-weight:400;font-feature-settings:"liga" 0,"calt" 0;white-space:pre;tab-size:4;scrollbar-width:thin}
.rd pre.code code{background:none;padding:0;font-size:1em;border-radius:0}
.tk-c{color:var(--tk-comment)}.tk-k{color:var(--tk-keyword)}.tk-s{color:var(--tk-string)}.tk-n{color:var(--tk-constant)}.tk-t{color:var(--tk-type)}.tk-f{color:var(--tk-def)}.tk-p{color:var(--tk-punct)}.tk-m{color:var(--tk-marker)}.tk-h{color:var(--tk-heading);font-weight:700}.tk-l{color:var(--tk-link)}

/* Tables: tabular figures, numbers right-aligned, header by weight, no stripes, no rules but one under the header. */
.rd .tw{overflow-x:auto;scrollbar-width:thin}
.rd table{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-feature-settings:"tnum";text-align:left}
.rd th,.rd td{padding:0 calc(var(--u) * 2) 0 0;line-height:var(--marxy-line-box);white-space:nowrap;vertical-align:baseline;font-weight:inherit}
.rd th{font-weight:600;color:var(--fg-strong)}
.rd thead th{box-shadow:inset 0 -1px 0 var(--line-strong)}
.rd .num{text-align:right}
.rd tr>*:last-child{padding-right:0}
.rd blockquote{margin-left:1.5em;color:var(--fg-muted)}

/* A zero-width character is shown, never hidden (commitment 4). */
.zw{display:inline-block;width:.42em;height:.85em;vertical-align:-.1em;margin:0 .04em;border-left:1px dotted var(--fg-faint);border-right:1px dotted var(--fg-faint);opacity:.9}
.esc::before{content:"\241B";color:var(--tk-comment)}
@keyframes jf{from{background:var(--accent-wash-strong)}to{background:transparent}}
.jump{animation:jf 1.1s ease-out}
.chg{background:var(--add-wash);border-radius:3px;box-shadow:-.5em 0 0 var(--add-wash),.5em 0 0 var(--add-wash)}

/* ---- Source: the exact bytes, same column position ---- */
.rd.src{font-family:var(--marxy-face-mono);font-size:15px;line-height:24px;font-weight:400;font-feature-settings:"liga" 0,"calt" 0}
.rd.src .ln{position:relative;white-space:pre-wrap;overflow-wrap:anywhere;padding-left:2ch;text-indent:-2ch;min-height:24px;tab-size:4}
.rd.src .no{position:absolute;right:calc(100% + 1.4ch);top:0;text-indent:0;white-space:nowrap;font-size:12px;color:var(--fg-faint);opacity:.7;user-select:none;-webkit-user-select:none;font-variant-numeric:tabular-nums}
.rd.src>*+*{margin-top:0}

/* ---- log ---- */
.rd .lines>*{margin:0}
.rd .ll{white-space:pre-wrap;overflow-wrap:anywhere;padding-left:2ch;text-indent:-2ch;min-height:var(--marxy-line-box);font-feature-settings:"liga" 0,"calt" 0}
.rd .ll .ts{color:var(--tk-comment)}
.rd .ll .lv{font-weight:700;color:var(--fg-strong)}
.rd.lens{font-family:var(--marxy-face-sans)}

/* ---- transcript (derived view) ---- */
.rd.trv .turn{position:relative}
.rd.trv .turn+.turn{margin-top:calc(var(--u) * 2)}
.rd.trv .turn.tool{margin-top:var(--u)}
.rd.trv .turn.tool+.turn.tool{margin-top:0}
.rd.trv .turn.tool+.turn:not(.tool){margin-top:calc(var(--u) * 2)}
.rd.trv .turn p+p{margin-top:var(--u)}
.rd.trv .turn.you p{color:var(--fg-strong)}
.rd.trv .who{position:absolute;right:calc(100% + 1.3em);top:0;font-size:.8em;line-height:var(--marxy-line-box);font-variant-caps:all-small-caps;font-synthesis:small-caps;letter-spacing:.08em;font-weight:500;color:var(--fg-muted);white-space:nowrap}
.rd .tb{display:block;width:100%;text-align:left;background:none;border:0;padding:0;margin:0;font-family:var(--marxy-face-mono);font-size:.86em;line-height:var(--marxy-line-box);color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-feature-settings:"liga" 0,"calt" 0}
.rd .tb .ch{display:inline-block;width:1.6ch;color:var(--fg-muted)}
.rd .tb .nm{color:var(--fg-muted)}
.rd .tb .meta{color:var(--fg-faint)}
.rd .tool-out{background:var(--inset);border-radius:var(--r-sm);padding:var(--u) calc(var(--u) * 1.5);margin-top:calc(var(--u) / 2);font-family:var(--marxy-face-mono);font-size:.82em;line-height:var(--marxy-line-box);white-space:pre-wrap;overflow-wrap:anywhere;font-feature-settings:"liga" 0,"calt" 0;color:var(--fg)}
.rd .tool-out .om{display:block;color:var(--fg-muted);font-style:italic;font-family:var(--marxy-face-sans)}
.rd .tool-out[hidden]{display:none}

/* ---- contents: a folder read as a page ---- */
.rd.ct>h1{margin-bottom:0}
.rd.ct .path{color:var(--fg-muted);font-size:.8em;line-height:var(--marxy-line-box);margin-top:0}
.rd.ct .lede{margin-top:calc(var(--u) * 2)}
.rd.ct .sect{margin-top:calc(var(--u) * 5);font-size:.8em;line-height:var(--marxy-line-box);font-variant-caps:all-small-caps;font-synthesis:small-caps;letter-spacing:.09em;color:var(--fg-muted);font-weight:500}
.rd.ct .ent{position:relative;display:block;margin:var(--u) -.6em 0;padding:0 .6em;border-radius:6px;color:inherit;text-decoration:none}
.rd.ct .sect+.ent{margin-top:calc(var(--u) / 2)}
.rd.ct .ent.dir{margin-top:calc(var(--u) * 3)}
.rd.ct .ent.dir .nm{font-weight:var(--marxy-weight-heading)}
.rd.ct .nm{display:block;color:var(--fg-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd.ct .dk{display:block;color:var(--fg-muted);font-size:.84em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd.ct .age{position:absolute;left:calc(100% - .6em + 1.8em);top:0;white-space:nowrap;color:var(--fg-muted);font-size:.84em;font-variant-numeric:oldstyle-nums proportional-nums;font-feature-settings:"onum","pnum"}
.rd.ct .ent[data-open]{cursor:pointer}
.rd.ct .ent.cur{background:var(--accent-wash)}

/* ---- preview pages (riffle, palette) ---- */
.rd.pv{width:600px;margin:0;pointer-events:none;user-select:none;-webkit-user-select:none}

/* ================= Summoned surfaces: chrome ================= */
.card{pointer-events:auto;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow);color:var(--fg)}
#studio{position:fixed;inset:0;z-index:30;pointer-events:none;font:var(--chrome-size)/1.4 var(--face-chrome);animation:rise .14s var(--ease)}
#studio[hidden]{display:none}
@keyframes rise{from{opacity:0;transform:translateY(4px)}}
#studio .col-l,#studio .col-r{position:fixed;top:24px;max-height:calc(100vh - 48px);display:flex;flex-direction:column;gap:10px;pointer-events:none}
#studio .col-l{left:24px;width:var(--lw,320px)}
#studio .col-r{right:24px;width:var(--rw,320px)}
#studio.narrow{inset:12px 12px auto auto;width:min(380px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
#studio.narrow .col-l,#studio.narrow .col-r{position:static;width:auto;max-height:none}
#studio .col-r:empty,#studio .col-l:empty{display:none}
.rooms{display:flex;flex-wrap:wrap;gap:2px;padding:4px}
.rooms button{display:inline-flex;gap:5px;align-items:baseline;border:0;background:none;border-radius:6px;padding:5px 9px;color:var(--fg-muted)}
.rooms button i{font-style:normal;font-size:10px;color:var(--fg-faint)}
.rooms button:hover{background:var(--hover)}
.rooms button.on{background:var(--accent-wash-strong);color:var(--fg-strong)}
.sum{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:var(--r-md);cursor:pointer;line-height:1.45}
.sum span{flex:1}
.sum kbd{flex:none}
.det{padding:12px 14px;display:grid;gap:14px;overflow:auto;scrollbar-width:thin;min-height:0}
.det h4{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--fg-muted)}
.kv{display:grid;grid-template-columns:92px minmax(0,1fr);gap:7px 12px;margin:0}
.kv dt{color:var(--fg-muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.mono{font-family:var(--marxy-face-mono);font-size:12px;font-feature-settings:"liga" 0,"calt" 0}
.muted{color:var(--fg-muted)}
.faint{color:var(--fg-faint)}
.q{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 40%,transparent);text-underline-offset:2px}
.q:hover{text-decoration-color:currentColor}
.toml{margin:6px 0 0;padding:8px 10px;background:var(--inset);border-radius:6px;font:12px/1.5 var(--marxy-face-mono);white-space:pre;color:var(--fg)}
.ol{display:grid;gap:1px}
.ol button{display:block;width:100%;text-align:left;border:0;background:none;padding:3px 6px;border-radius:5px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ol button:hover{background:var(--hover)}
.diff{font:12px/1.55 var(--marxy-face-mono);white-space:pre-wrap;overflow-wrap:anywhere;margin:0;font-feature-settings:"liga" 0,"calt" 0}
.diff div{padding:0 6px;border-radius:2px}
.diff .add{background:var(--add-wash)}
.diff .del{background:var(--del-wash)}
.diff .hh{color:var(--fg-muted);padding-top:4px}

/* Operations */
.ops{display:grid;gap:4px}
.op{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:7px;padding:7px 9px}
.op:hover,.op:focus-visible{background:var(--hover)}
.op .t{display:flex;justify-content:space-between;gap:8px}
.op .t b{font-weight:550}
.op .d{color:var(--fg-muted);font-size:12px}
.op[aria-disabled="true"]{opacity:.6}
.op .pv2{display:none;margin-top:7px;gap:6px}
.op:hover .pv2,.op:focus .pv2{display:grid}
.op .pv2 pre{margin:2px 0 0;padding:6px 8px;background:var(--inset);border-radius:5px;font:11.5px/1.5 var(--marxy-face-mono);white-space:pre-wrap;overflow-wrap:anywhere;max-height:118px;overflow:hidden;color:var(--fg)}
.op .pv2 small{color:var(--fg-muted);font-size:11px}

/* Look */
.cssf{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.cssf header{padding:9px 12px;color:var(--fg-muted);border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cssf .code{overflow:auto;padding:8px 0;font:12px/19px var(--marxy-face-mono);font-feature-settings:"liga" 0,"calt" 0;white-space:pre;tab-size:2;min-height:0;scrollbar-width:thin;max-height:calc(100vh - 220px)}
.cl{display:flex;padding-right:12px;min-width:max-content}
.cl .no{width:36px;flex:none;text-align:right;padding-right:11px;color:var(--fg-faint);opacity:.7;user-select:none;-webkit-user-select:none}
.cl.flash{animation:jf .9s ease-out}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-.5px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.45)}
.look{padding:12px 14px;display:grid;gap:16px;overflow:auto;scrollbar-width:thin;min-height:0}
.look h4{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--fg-muted)}
.lrow{display:grid;grid-template-columns:56px minmax(0,1fr) 84px;align-items:center;gap:8px;min-height:26px}
.lrow label{color:var(--fg-muted)}
.lrow output{font-variant-numeric:tabular-nums;text-align:right;color:var(--fg)}
.lrow[data-off]{opacity:.45}
.note{color:var(--fg-muted);font-size:12px;margin-top:6px;min-height:0}
.note:empty{display:none}
select{background:var(--inset);border:1px solid var(--edge);border-radius:6px;padding:4px 6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--line-strong)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5.5px;border-radius:50%;background:var(--fg);border:2px solid var(--raised)}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--line-strong)}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--fg);border:2px solid var(--raised)}
input[type=range]:disabled{opacity:.5}
.crow{display:grid;grid-template-columns:82px 26px minmax(0,1fr);align-items:center;gap:8px;min-height:30px}
.crow label.swb{position:relative;width:24px;height:24px;border-radius:6px;border:1px solid var(--edge);display:block;cursor:pointer;overflow:hidden}
.crow label.swb input{position:absolute;inset:-6px;width:40px;height:40px;opacity:0;cursor:pointer}
.crow .hex{width:100%;background:var(--inset);border:1px solid var(--line-strong);border-radius:6px;padding:3px 7px;font:12px var(--marxy-face-mono);color:var(--fg)}
.warnl{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-top:6px;padding:7px 9px;border-radius:6px;background:var(--warn-wash);color:var(--fg);font-size:12px}
.warnl:empty{display:none}
.colo{border-top:1px solid var(--line);padding-top:10px;color:var(--fg-muted);font-size:12px;line-height:1.5}

/* ---- palette ---- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.2);display:flex;justify-content:center;align-items:flex-start;padding-top:11vh;animation:fd .12s}
.scrim[hidden]{display:none}
@keyframes fd{from{opacity:0}}
.palette{width:min(900px,calc(100vw - 32px));max-height:72vh;background:var(--raised);border:1px solid var(--line-strong);border-radius:var(--r-lg);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;font:var(--chrome-size)/1.4 var(--face-chrome);color:var(--fg)}
.pal-in{display:flex;align-items:center;height:50px;padding:0 16px;border-bottom:1px solid var(--line)}
.pal-in input{flex:1;border:0;background:none;outline:none;font-size:15px;color:var(--fg-strong)}
.pal-in input::placeholder{color:var(--fg-faint)}
.pal-body{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0;flex:1}
.pal-list{overflow:auto;padding:6px;max-height:420px;min-height:380px;scrollbar-width:thin}
.pal-g{font-size:11px;font-weight:600;color:var(--fg-faint);padding:9px 10px 4px}
.pal-i{display:flex;gap:10px;align-items:baseline;justify-content:space-between;padding:6px 10px;border-radius:7px;cursor:pointer}
.pal-i .a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pal-i .a small{color:var(--fg-faint);margin-left:8px;font-size:12px}
.pal-i .b{color:var(--fg-faint);font-size:11.5px;white-space:nowrap}
.pal-i mark{background:none;color:var(--accent);font-weight:700}
.pal-i.hot{background:var(--accent-wash-strong)}
.pal-pv{position:relative;border-left:1px solid var(--line);background:var(--doc);overflow:hidden;min-height:380px}
.pvbox{position:absolute;inset:0;padding:18px;overflow:hidden;background:var(--doc);color:var(--fg);-webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}
.pvs{transform-origin:0 0}
.pvd{padding:20px;color:var(--fg-muted);line-height:1.5}
.pal-empty{padding:24px;color:var(--fg-faint);text-align:center}

/* ---- riffle ---- */
#riffle{position:fixed;inset:0;z-index:50;display:none}
#riffle.on{display:block}
.rc{position:absolute;left:50%;top:46%;width:calc(720px * var(--rs));height:calc(980px * var(--rs));margin:calc(-490px * var(--rs)) 0 0 calc(-360px * var(--rs));border-radius:6px;background:var(--doc);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;opacity:0;transform:scale(.6);transition:transform .2s var(--ease),opacity .16s,filter .2s;will-change:transform}
.rc.on{opacity:1}
.rc .pvp{width:720px;padding:46px 60px;transform:scale(var(--rs));transform-origin:0 0;color:var(--fg)}
.rcap{position:absolute;left:0;right:0;text-align:center;font:var(--chrome-size)/1.4 var(--face-chrome);color:var(--fg-muted);transition:opacity .16s}
#riffle .rcap{color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.8)}

/* ---- key sheet and first-load hint ---- */
.keys{width:min(440px,calc(100vw - 32px));padding:16px 18px;background:var(--raised);border:1px solid var(--line-strong);border-radius:var(--r-lg);box-shadow:var(--shadow);font:var(--chrome-size)/1.4 var(--face-chrome);color:var(--fg);align-self:flex-start;margin-top:-2vh}
.keys h3{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--fg-muted)}
.keys .kr{display:grid;grid-template-columns:132px 1fr;gap:6px 12px;align-items:center}
.keys .kr>span{color:var(--fg-muted)}
.keys .kr>b{font-weight:400;display:flex;gap:4px;flex-wrap:wrap;align-items:center}


/* ---- pfx, hot, pointer affordances ---- */
.rd.ct .pfx{color:var(--fg-muted)}
.rd.ct .ent.root .nm{font-weight:var(--marxy-weight-heading)}
.zw{cursor:pointer}
.kv .hot{background:var(--accent-wash-strong);border-radius:3px;padding:0 3px;margin:0 -3px}
.rc{cursor:pointer}
.rooms button,.sum{cursor:pointer}

/* ---- the top edge: text on the page ground, summoned by the pointer alone ---- */
#edge{position:fixed;top:0;left:0;right:0;height:40px;z-index:35;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 clamp(20px,3vw,40px);
  font:var(--chrome-size)/1 var(--face-chrome);color:var(--fg-muted);border-bottom:1px solid var(--line);
  opacity:0;visibility:hidden;transition:opacity .15s var(--ease),visibility 0s .15s}
#edge.on{opacity:1;visibility:visible;transition:opacity .15s var(--ease)}
#edge button{background:none;border:0;padding:4px 0;margin:0;color:inherit;font:inherit}
#edge .path{flex:1;display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden}
#edge .seg{color:var(--fg-muted)}
#edge .seg:hover,#edge .tg:hover{color:var(--fg)}
#edge .cur{color:var(--fg)}
#edge .sep{color:var(--fg-faint)}
#edge .tgs{display:flex;align-items:center;gap:9px;white-space:nowrap}
#edge .tg{color:var(--fg-faint)}
#edge .tg.on{color:var(--fg)}
#studio .col-l,#studio .col-r{top:52px;max-height:calc(100vh - 76px)}
#studio.narrow{inset:52px 12px auto auto;max-height:calc(100vh - 64px)}

/* ---- PROTOTYPE PANEL: scaffolding, deliberately unlike the product chrome ---- */
#proto-btn{position:fixed;left:14px;bottom:14px;z-index:90;width:28px;height:28px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;background:none;border:1px dashed var(--fg-faint);color:var(--fg-faint);font:14px/1 ui-monospace,Menlo,monospace}
#proto-btn:hover{color:var(--fg)}
#proto{position:fixed;left:14px;bottom:52px;z-index:90;width:300px;max-height:calc(100vh - 76px);overflow:auto;background:var(--inset);border:1px dashed var(--edge);color:var(--fg);font:12px/1.4 ui-monospace,Menlo,"JetBrains Mono",monospace;padding:10px;scrollbar-width:thin}
#proto[hidden]{display:none}
#proto .ph{font-weight:700;margin-bottom:8px;letter-spacing:.02em}
#proto .pg{margin-top:8px}
#proto .pl{color:var(--fg-muted);margin-bottom:3px}
#proto .pb{display:flex;flex-wrap:wrap;gap:4px}
#proto button{background:none;border:1px solid var(--edge);border-radius:0;padding:2px 6px;font:inherit;color:var(--fg)}
#proto button:hover{background:var(--hover)}
#proto button[aria-pressed="true"]{background:var(--fg);color:var(--doc);border-color:var(--fg)}

@media (max-width:960px){
  .rd.trv .who{position:static;display:block;text-align:left}
  .rd.ct .age{left:auto;right:.6em;top:0}
  .rd.ct .nm{padding-right:5em}
  .pal-body{grid-template-columns:minmax(0,1fr)}
  .pal-pv{display:none}
}
@media (max-width:560px){#edge .tgs>.sep:nth-last-of-type(1),#edge .tgs>.tg:last-child{display:none}}
@media (max-width:700px){
  #page{padding-inline:36px}

<script type="text/plain" id="doc-plan"># Cache the harmonic constituents

Working plan for tidemark 0.5. It follows the Brisbane drift investigation and builds on the fix for it.

## Context

Every run of `tidemark` re-reads the constituent file for the station and rebuilds the phase table
from scratch. For one station and one day that costs about 40 ms. The year view repeats it 365
times, and it dominates the run. The constituent speeds never change, and the phases depend only
on the station and the start date, so both can be computed once and kept.

The work touches three files: `src/harmonics.rs` for the table, `src/cache.rs` for the on-disk
format, and `src/main.rs` for the flag that turns the cache off.

## Plan

- [x] Keep constituent speeds as `f64` at full precision
- [x] Add a drift test that compares 30 days against the published table
- [x] Define the cache key: station id, epoch, and a hash of the constituent file
- [x] Write the cache read path in `src/cache.rs`
- [x] Fall back to a full rebuild when the key does not match
- [ ] Write the cache write path, atomically, next to the station file
- [ ] Share one `src/har{ZWSP}monics.rs` table across days instead of building one per day
- [ ] Add `--no-cache` and `TIDEMARK_CACHE_DIR`
- [ ] Measure the year view before and after, and record it in `docs/design.md`

The key is the only thing the read path trusts:

```rust
pub struct CacheKey {
    pub station: StationId,
    pub epoch: i32,
    pub source_hash: u64,
}

impl CacheKey {
    // A mismatch is never an error: the caller rebuilds.
    pub fn matches(&self, stored: &CacheKey) -> bool {
        self.station == stored.station
            && self.epoch == stored.epoch
            && self.source_hash == stored.source_hash
    }
}
```

Expected timings once the cache is warm:

| Case | Before | Target |
| --- | ---: | ---: |
| One station, one day | 41 ms | 4 ms |
| One station, year view | 14.9 s | 0.3 s |
| Ten stations, one week | 2.8 s | 0.2 s |

## Risks

A stale cache gives wrong tides without warning. The key therefore includes a hash of the constituent file, and a mismatch is always a rebuild, never an error.

Two processes may write the same cache file at once. Writing to a temporary file and renaming it keeps either result valid.

## Open questions

- Should the cache live next to the station file or under the user's cache directory?
- Is a 64-bit hash enough, or should the key carry the file length as well?
- Do we keep the full table, or only the phases for the dates asked for?
</script>
<script type="text/plain" id="doc-readme"># tidemark

A tide-table generator for the terminal. It reads NOAA harmonic constants for a station, works out the high and low waters, and writes them as plain text.

## Install

```sh
cargo install tidemark
```

## Usage

Print today's tides for a station:

```sh
tidemark --station AU-0041
```

Print a week, or a whole year:

```sh
tidemark --station AU-0041 --days 7
tidemark --station AU-0041 --year 2026
```

Times are in the station's own zone unless you pass `--utc`. Heights are in metres above chart datum.

## Options

| Flag | Meaning | Default |
| --- | --- | --- |
| `--station ID` | Station to predict | none |
| `--days N` | Number of days to print | 1 |
| `--year YYYY` | Print every day of a year | off |
| `--utc` | Print times in UTC | off |
| `--no-cache` | Rebuild the phase table on every run | off |

## Licence

MIT. See `LICENSE`.
</script>
<script type="text/plain" id="doc-design"># How tidemark predicts a tide

A tide is a sum of cosines. Each term has an amplitude and a phase that belong to the place, and a speed that belongs to the sky: the moon's orbit, the sun's, and the slow wobble of both. tidemark carries thirty-seven of them for most stations and adds them up at whatever times you ask for.

The only subtle part is time. The phases are given at an epoch, the start of a year, and the speeds are in degrees per hour, so an error in a speed is multiplied by every hour since the epoch. That is why a speed rounded to four decimals looks harmless in a single day and by the third week has moved a high water by minutes.

Everything else follows from keeping that arithmetic exact and doing it once.
</script>

<script type="text/plain" id="doc-essay"># What a tide table promises

A tide table is a promise about water that nobody can quite keep. It says that at 6:42 the sea at the Bar will stand at its highest, and then it is a few minutes early, or late, or a hand's breadth higher than printed, because the wind has been in the east for three days. The promise is still worth making. It is built from the one part of the sea that does keep its appointments.

## Sums of waves

The method is older than any machine. Someone stands at a pier with a gauge and a clock and writes down the height every hour for a year. Then comes the patient arithmetic: the record is taken apart into a few dozen regular waves, each with its own period, and each period traced to something in the sky. One follows the moon from rising to rising. One follows the sun. One is the moon's orbit stretching and shrinking over a month, and one is the slow turning of its path over eighteen years.

Put back together, the waves make the tide. Take away the weather and the harbour's own quirks and what is left is almost embarrassingly regular, a clock made of water.

## What the table leaves out

None of this is the sea as you meet it. The table has no wind in it and no pressure, and it knows nothing of the river that is in flood upstream. A surge can lift a harbour half a metre above the table and hold it there for a day. Nobody blames the table for this. It never said what the sea would do, only what the sky would ask of it.

That is a good thing to be able to say about a page of numbers, and it is why a plain, careful table still earns a place beside the instruments.

  if((m=/^(#{1,4})\s+(.*)$/.exec(ln))){out.push({t:'h',n:m[1].length,text:m[2],l0:i+1,l1:i+1});i++;continue}

   var j2=i;while(j2<L.length&&/^\|/.test(L[j2]))j2++;

  }

   var j4=i;while(j4<L.length&&/^>\s?/.test(L[j4]))j4++;

 if(key==='`'&&!e.altKey&&!mod){e.preventDefault();togglePanel();return}
 if(e.altKey||mod)return;
 if(key==='?'){e.preventDefault();openKeys();return}
 if(k==='e'){toggleSource();return}
 if(k==='i'){toggleStudio();return}
 if(k==='u'){climb();return}
 if(k==='p'){e.preventDefault();openPal('');return}
 if(k==='t'){cycleTheme();return}
 if(k==='l'){toggleLens();return}
 if(k==='r'){if(!e.repeat){e.preventDefault();openRiffle('r')}return}
 if(S.studio.open&&/^[1-5]$/.test(key)){setRoom(+key-1);return}
 if(isCt()&&S.mode==='read'&&(key==='ArrowDown'||k==='j')){e.preventDefault();moveCursor(1);return}
 if(isCt()&&S.mode==='read'&&(key==='ArrowUp'||k==='k')){e.preventDefault();moveCursor(-1);return}
 if(key==='Enter'&&(!ae||ae===document.body)){
  if(S.studio.open){if(!S.studio.unfolded){S.studio.unfolded=true;renderStudio()}return}
  if(isCt()&&S.mode==='read'){var en2=ents()[S.cursor];if(en2){e.preventDefault();openEnt(en2)}}
 }
});
window.addEventListener('keyup',function(e){
 if(!rf)return;
 if(rf.via==='ctrl'&&e.key==='Control'){closeRiffle(true);return}
 if(rf.via==='r'&&e.key.toLowerCase()==='r'){
  if(!rf.sticky&&performance.now()-rf.t0<230)rf.sticky=true;else if(!rf.sticky)closeRiffle(true);
 }
});
window.addEventListener('resize',function(){
 if(S.studio.open)layoutStudio();
 if(rf){var g=riffleGeom();$('#riffle').style.setProperty('--rs',g.rs);layoutRiffle()}
 if(palOpen)palPreview();
 scheduleMeasure();
});


/* ====================================================================
   The top edge: a path and three words, only while the pointer rests at the top of the window.
   No keyboard trigger, no persistence.
   ==================================================================== */
var edgeEl=$('#edge'),edgeT=0;
function crumbs(){
 var d=curDoc(),segs=[{t:'Collection',go:'collection'}];
 if(d.id==='collection')return segs;
 var rid=d.kind==='contents'?d.root:homeRoot(),r=ROOTBY[rid];
 segs.push({t:r.name,go:'root:'+rid});
 if(d.kind==='contents')return segs;
 var parts=(S.ctx&&S.ctx.root===rid?S.ctx.rel:relOf(d)).split('/');
 parts.forEach(function(p,i){segs.push(i<parts.length-1?{t:p,go:'dir:'+rid+':'+p}:{t:p})});
 return segs;
}
function renderEdge(){
 var segs=crumbs(),st=S.studio.open?'studio':S.mode;
 var h='<nav class="path" aria-label="Where you are">'+segs.map(function(s,i){
  var last=i===segs.length-1;
  return (i?'<span class="sep">/</span>':'')+(last?'<span class="cur">'+esc(s.t)+'</span>':'<button class="seg" data-go="'+esc(s.go)+'">'+esc(s.t)+'</button>');
 }).join('')+'</nav><div class="tgs">'+
 [['read','Read'],['source','Source'],['studio','Studio']].map(function(x){return '<button class="tg'+(st===x[0]?' on':'')+'" data-go="mode:'+x[0]+'">'+x[1]+'</button>'}).join('<span class="sep">·</span>')+
 '<span class="sep">·</span><button class="tg" data-go="pal">⌘P</button></div>';
 edgeEl.innerHTML=h;
}
function showEdge(){if(edgeOn||palOpen||keysOpen||rf)return;edgeOn=true;renderEdge();edgeEl.classList.add('on')}
function hideEdge(){clearTimeout(edgeT);edgeT=0;if(!edgeOn)return;edgeOn=false;edgeEl.classList.remove('on')}
document.addEventListener('mousemove',function(e){
 if(e.clientY<=12){if(!edgeOn&&!edgeT)edgeT=setTimeout(function(){edgeT=0;showEdge()},150)}
 else{if(edgeT){clearTimeout(edgeT);edgeT=0}if(edgeOn&&e.clientY>64)hideEdge()}
});
document.documentElement.addEventListener('mouseleave',hideEdge);
edgeEl.addEventListener('click',function(e){
 var b=e.target.closest('[data-go]');if(!b)return;
 var g=b.dataset.go.split(':');
 if(g[0]==='collection')openCollection();
 else if(g[0]==='root')openDoc(ROOTBY[g[1]].cid);
 else if(g[0]==='dir'){
  openDoc(ROOTBY[g[1]].cid);
  var el=$$('.ent.dir',rd).filter(function(x){return x.textContent.indexOf(g[2]+'/')===0})[0];
  if(el){el.scrollIntoView({block:'center'});el.classList.remove('jump');void el.offsetWidth;el.classList.add('jump')}
 }
 else if(g[0]==='mode'){
  if(g[1]==='studio')toggleStudio();
  else{if(S.studio.open)closeStudio();setMode(g[1])}
 }
 else if(g[0]==='pal'){hideEdge();openPal('')}
 if(edgeOn)renderEdge();
});

/* riffle by pointer: click a page to bring it forward, click the front page to open it, click outside to cancel */
$('#riffle').addEventListener('click',function(e){
 if(!rf)return;
 var c=e.target.closest('.rc');
 if(!c){closeRiffle(false);return}
 var k=+c.dataset.k;
 if(k===rf.i)closeRiffle(true);else{rf.i=k;layoutRiffle()}
});

/* ====================================================================
   PROTOTYPE PANEL: scaffolding for reviewing the mock. Deliberately NOT styled like the product.
   ==================================================================== */
var protoEl=$('#proto'),protoBtn=$('#proto-btn');
function protoRoom(i){if(!S.studio.open){S.studio.open=true;S.studio.room=i;S.studio.unfolded=false;renderStudio()}else setRoom(i)}
function protoRiffle(){if(rf){closeRiffle(false);return}openRiffle('panel');if(rf)rf.sticky=true}
var PROTO=[
 ['Depth',[['Read','depth:read',function(){if(S.studio.open)closeStudio();setMode('read')}],['Source','depth:source',function(){if(S.studio.open)closeStudio();setMode('source')}],['Studio','depth:studio',toggleStudio]]],
 ['Studio rooms',ROOMS.map(function(r,i){return [(i+1)+' '+r,'room:'+i,function(){protoRoom(i)}]})],
 ['Go',[['Collection','go:collection',openCollection],['Contents','go:contents',openContents],['Riffle','go:riffle',protoRiffle],['Palette','go:palette',function(){openPal('')}]]],
 ['Documents',DOCS.map(function(d){return [d.path,'doc:'+d.id,function(){openDoc(d.id)}]})],
 ['Theme',THEMES.map(function(t){return [t.name,'theme:'+t.id,function(){setTheme(t.id)}]})],
 ['Table lens',[['Table lens','lens',toggleLens]]],
 ['Keys',[['Keys sheet','keys',openKeys]]]
];
var protoActs={};
function buildProto(){
 var h='<div class="ph">PROTOTYPE CONTROLS · not part of the design</div>';
 PROTO.forEach(function(g){
  h+='<div class="pg"><div class="pl">'+g[0]+'</div><div class="pb">'+g[1].map(function(b){protoActs[b[1]]=b[2];return '<button data-p="'+esc(b[1])+'">'+esc(b[0])+'</button>'}).join('')+'</div></div>';
 });
 protoEl.innerHTML=h;
}
function protoSync(){
 if(!protoEl)return;
 var st=S.studio;
 $$('button[data-p]',protoEl).forEach(function(b){
  var p=b.dataset.p,on=false;
  if(p==='depth:read')on=!st.open&&S.mode==='read';
  else if(p==='depth:source')on=!st.open&&S.mode==='source';
  else if(p==='depth:studio')on=st.open;
  else if(p.indexOf('room:')===0)on=st.open&&st.room===+p.slice(5);
  else if(p.indexOf('doc:')===0)on=S.cur===p.slice(4);
  else if(p.indexOf('theme:')===0)on=S.theme===p.slice(6);
  else if(p==='lens')on=S.lens;
  else if(p==='go:collection')on=S.cur==='collection';
  else if(p==='go:contents')on=isCt()&&S.cur!=='collection';
  else if(p==='go:riffle')on=!!rf;
  b.setAttribute('aria-pressed',String(on));
 });
}
function togglePanel(force){
 var open=force!=null?force:protoEl.hidden;
 protoEl.hidden=!open;protoBtn.setAttribute('aria-expanded',String(open));
 try{localStorage.setItem('mx-proto-open',open?'1':'0')}catch(err){}
}
protoBtn.addEventListener('click',function(){togglePanel();protoBtn.blur()});
protoEl.addEventListener('click',function(e){
 var b=e.target.closest('button[data-p]');if(!b)return;
 var fn=protoActs[b.dataset.p];if(fn)fn();
 protoSync();
 setTimeout(function(){if(document.activeElement===b)b.blur()},0);
});

/* ---------------- boot ---------------- */
buildProto();
var wasOpen=false;try{wasOpen=localStorage.getItem('mx-proto-open')==='1'}catch(err){}
togglePanel(wasOpen);
render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){updateAvg();scheduleMeasure()});
})();
</script>
</body>
