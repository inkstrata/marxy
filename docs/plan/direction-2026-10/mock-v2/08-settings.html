<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marxy Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&family=Atkinson+Hyperlegible+Mono:ital,wght@0,200..800;1,200..800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/app.css">
<link rel="stylesheet" href="shared/lang-colors.css">
<style>
  html { --row-h: 44px; --row-pad: 8px; --sside-w: 236px; }
  html[data-density="compact"] { --row-h: 36px; --row-pad: 5px; }
  html[data-density="comfortable"] { --row-h: 52px; --row-pad: 11px; }
  html[data-motion="reduce"] *, html[data-motion="reduce"] *::before, html[data-motion="reduce"] *::after { animation: none !important; transition: none !important; }
  html[data-focus-always="true"] :focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  html[data-toolbar="icon"] .tbl-txt { display: none; }
  html[data-toolbar="text"] .toolbar .tb-btn > svg { display: none; }
  ::highlight(sq) { background-color: var(--mark); color: inherit; }

  /* Settings window: its own titlebar and category sidebar, System Settings style */
  .swin { height: 100vh; display: grid; grid-template-columns: var(--sside-w) minmax(0, 1fr); background: var(--win); }
  .sside { margin: 8px 0 8px 8px; border-radius: var(--r-lg); background: var(--side); border: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  html[data-sidebar="glass"] .sside { background: var(--glass); -webkit-backdrop-filter: blur(30px) saturate(1.5); backdrop-filter: blur(30px) saturate(1.5); }
  .sside .lights { padding-bottom: 10px; }
  .ssearch { position: relative; margin: 0 10px 8px; }
  .ssearch > svg { position: absolute; left: 8px; top: 7px; color: var(--fg-faint); width: 14px; height: 14px; pointer-events: none; }
  .ssearch input { width: 100%; height: 28px; padding: 0 28px 0 28px; border-radius: 7px; border: 1px solid var(--edge); background: var(--doc); color: var(--fg); }
  .ssearch input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .ssearch input::-webkit-search-cancel-button { display: none; }
  .ssearch .clr { position: absolute; right: 3px; top: 3px; width: 22px; height: 22px; border: 0; background: none; border-radius: 5px; color: var(--fg-muted); display: grid; place-items: center; }
  .ssearch .clr:hover { background: var(--hover); }
  .snav { flex: 1; overflow: auto; padding: 0 8px 10px; }
  .snav hr { border: 0; border-top: 1px solid var(--line); margin: 6px 8px; }
  .snav .nav-item { min-height: 30px; height: auto; padding: 3px 8px; }
  .snav .nav-item.dim { color: var(--fg-faint); }
  .snav .nav-item .count { min-width: 18px; text-align: right; }
  .snav .chg { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
  /* Icon tiles: always the accent, the icon in --accent on --accent-wash. The tone classes stay on the markup but no longer pick a colour. */
  .tile { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--accent-wash); flex: none; }
  .tile svg.lucide { width: 14px; height: 14px; color: var(--accent) !important; }
  .sfoot { border-top: 1px solid var(--line); padding: 8px 12px; font-size: 11.5px; color: var(--fg-muted); display: flex; gap: 8px; align-items: center; }
  .sfoot a { color: var(--fg-muted); text-decoration: none; }
  .sfoot a:hover { color: var(--fg); text-decoration: underline; }

  .smain { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--doc); }
  .toolbar .tb-title h1 { font-size: 13px; font-weight: 650; margin: 0; color: var(--fg-strong); white-space: nowrap; }
  .spane { flex: 1; overflow: auto; padding: 20px 28px 120px; scroll-padding-top: 12px; }
  .spane:focus { outline: none; }
  .sbody { max-width: 800px; margin: 0 auto; }
  .sintro { color: var(--fg-muted); font-size: 12.5px; margin: 0 0 10px; line-height: 1.5; max-width: 74ch; }
  .rel { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
  .rel a { display: inline-flex; gap: 5px; align-items: center; height: 24px; padding: 0 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg); text-decoration: none; font-size: 12px; background: var(--raised); }
  .rel a:hover { background: var(--hover); }
  .rel a svg { width: 13px; height: 13px; color: var(--fg-muted); }
  .lnk { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; font: inherit; cursor: pointer; }
  .desc a, .why a, .note a, .gdesc a, .sintro a { color: var(--accent); text-underline-offset: 2px; }

  .grp { margin: 0 0 22px; }
  .grp > h2 { font-size: 12px; font-weight: 650; color: var(--fg-muted); margin: 0 0 6px 2px; display: flex; gap: 8px; align-items: baseline; }
  .grp > h2 a { color: inherit; text-decoration: none; }
  .grp > h2 a:hover { text-decoration: underline; }
  .gdesc { font-size: 11.5px; color: var(--fg-muted); margin: -2px 0 8px 2px; line-height: 1.45; }
  .box { background: var(--raised); border: 1px solid var(--line); border-radius: 10px; container-type: inline-size; }
  /* In a narrow box (the Reading column, small windows) wide controls drop under their label. */
  @container (max-width: 600px) {
    .srow:is([data-type="range"], [data-type="autorange"], [data-type="seg"], [data-type="actions"], [data-type="tokens"], [data-type="chips"], [data-type="custom"], [data-type="hotkey"]) { grid-template-columns: minmax(0, 1fr); }
    .srow:is([data-type="range"], [data-type="autorange"], [data-type="seg"], [data-type="actions"], [data-type="tokens"], [data-type="chips"], [data-type="custom"], [data-type="hotkey"]) > .ctl { justify-self: start; justify-content: flex-start; margin-top: 6px; }
    .rng input[type="range"] { width: 150px; }
  }
  .srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 18px; align-items: center; padding: var(--row-pad) 14px var(--row-pad) 16px; min-height: var(--row-h); position: relative; border-radius: 9px; }
  .srow + .srow { border-top: 1px solid var(--line); border-top-left-radius: 0; border-top-right-radius: 0; }
  .srow.block { grid-template-columns: minmax(0, 1fr); }
  .srow.block > .ctl { justify-self: stretch; justify-content: flex-start; margin-top: 8px; }
  .srow.flash { animation: flash 1.6s var(--ease); }
  .sl { min-width: 0; }
  .lline { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .lline .tile { margin-right: 2px; }
  .lbl { color: var(--fg); font-size: 13px; }
  .desc { color: var(--fg-muted); font-size: 11.5px; line-height: 1.45; margin-top: 2px; max-width: 64ch; }
  .why { display: flex; gap: 6px; align-items: flex-start; color: var(--fg-muted); font-size: 11.5px; margin-top: 4px; line-height: 1.45; max-width: 64ch; }
  .why svg.lucide { width: 13px; height: 13px; margin-top: 1px; color: var(--info); }
  .ctl { display: flex; align-items: center; gap: 8px; justify-self: end; flex-wrap: wrap; justify-content: flex-end; }
  .srow:not(.block) > .ctl { max-width: min(62cqw, 480px); }
  .srow.off > .sl .lbl { color: var(--fg-muted); }
  .srow.off > .ctl { opacity: .62; }
  .note { grid-column: 1 / -1; display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; padding: 7px 10px; border-radius: 7px; font-size: 12px; line-height: 1.45; color: var(--fg); }
  .note.warn { background: var(--warn-wash); }
  .note.warn > svg { color: var(--warn); }
  .note.info { background: var(--inset); border: 1px solid var(--line); }
  .note.info > svg { color: var(--info); }
  .note.err { background: var(--err-wash); }
  .note.err > svg { color: var(--err); }
  .note > svg.lucide { width: 14px; height: 14px; margin-top: 2px; }
  .mod { position: absolute; left: 5px; top: calc(var(--row-pad) + 6px); width: 7px; height: 7px; padding: 0; border: 0; border-radius: 50%; background: var(--accent); }
  .mod:hover { box-shadow: 0 0 0 3px var(--accent-wash-strong); }
  .tier { font-size: 10.5px; height: 17px; padding: 0 6px; }
  .kwhit { font-size: 11px; color: var(--fg-faint); margin-top: 3px; }
  .kwhit code { font: 11px var(--face-code); }

  .seg[role="radiogroup"] button[aria-checked="true"], .seg[role="group"] button[aria-pressed="true"] { background: var(--raised); color: var(--fg-strong); box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 0.5px var(--line-strong); }
  .seg button[disabled] { opacity: .55; }
  .seg button[aria-disabled="true"] { opacity: .55; text-decoration: line-through; text-decoration-color: var(--fg-faint); }
  .seg button svg.lucide { width: 14px; height: 14px; }
  .rng { display: flex; align-items: center; gap: 10px; }
  .rng input[type="range"] { width: 170px; }
  .rng output { min-width: 92px; font-variant-numeric: tabular-nums; color: var(--fg); font-size: 12px; text-align: right; }
  .numf { display: flex; align-items: center; gap: 6px; }
  .numf input { width: 84px; text-align: right; font-variant-numeric: tabular-nums; }
  .unit { color: var(--fg-muted); font-size: 12px; }
  .field.w-wide { width: 320px; }
  .field.w-mid { width: 220px; }
  select.field { max-width: 300px; }
  .btn.danger { background: var(--err); border-color: var(--err); color: var(--doc); font-weight: 600; }
  .btn[disabled] { opacity: .55; }
  .toks { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-height: 30px; padding: 3px; border: 1px solid var(--edge); border-radius: 7px; background: var(--doc); max-width: 420px; }
  .toks:focus-within { outline: 2px solid var(--accent); outline-offset: -1px; }
  .tok { display: inline-flex; align-items: center; gap: 2px; height: 22px; padding: 0 2px 0 8px; border-radius: 5px; background: var(--hover); border: 1px solid var(--line); font-size: 12px; }
  .tok.mono { font-family: var(--face-code); font-size: 11.5px; }
  .tok button { width: 18px; height: 18px; border: 0; background: none; border-radius: 4px; color: var(--fg-muted); display: grid; place-items: center; }
  .tok button:hover { background: var(--press); color: var(--fg); }
  .tok button svg.lucide { width: 12px; height: 12px; }
  .tokin { border: 0; background: none; outline: none; min-width: 90px; flex: 1; height: 22px; padding: 0 4px; color: var(--fg); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
  .chips button { height: 24px; padding: 0 9px; border-radius: 999px; border: 1px solid var(--line-strong); background: none; color: var(--fg-muted); font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
  .chips button[aria-pressed="true"] { background: var(--accent-wash-strong); color: var(--fg-strong); border-color: var(--accent); }
  .chips button svg.lucide { width: 12px; height: 12px; }
  .chips.mono button { font-family: var(--face-code); font-size: 11.5px; }

  .keycap { font: 500 12px var(--face-chrome); min-width: 70px; height: 26px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--edge); border-bottom-width: 2px; background: var(--doc); color: var(--fg); white-space: nowrap; letter-spacing: 0.04em; }
  .keycap:hover { background: var(--hover); }
  .keycap.none { color: var(--fg-faint); letter-spacing: 0; }
  .keycap.rec { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash-strong); color: var(--fg-strong); letter-spacing: 0; }
  .keycap.locked { border-style: dashed; color: var(--fg-muted); }
  .hk { display: flex; align-items: center; gap: 4px; }
  .hk .tb-btn { height: 26px; min-width: 26px; padding: 0; border-radius: 6px; }
  .rec-msg { grid-column: 1 / -1; font-size: 12px; margin-top: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .rec-msg.err { color: var(--err); }

  /* Theme tiles render inside their own data-theme, so each shows its real palette */
  .th-line { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; width: 100%; font-size: 12.5px; }
  .th-line b { font-weight: 600; color: var(--fg-strong); }
  .th-line .btn { margin-left: auto; text-decoration: none; }
  .ts-list { display: flex; flex-direction: column; gap: 2px; width: 100%; }
  .ts { display: grid; grid-template-columns: 138px minmax(0, 1fr) 18px; gap: 12px; align-items: center; border: 1px solid transparent; background: none; text-align: left; padding: 6px 8px; border-radius: 8px; color: var(--fg); }
  .ts:hover { background: var(--hover); }
  .ts[aria-checked="true"] { background: var(--accent-wash); border-color: var(--accent-wash-strong); }
  .ts-s { display: flex; gap: 10px; align-items: baseline; color: var(--fg-strong); white-space: nowrap; overflow: hidden; }
  .ts-s b { font: 500 20px/1 var(--face-book); }
  .ts-s span { font: 500 16px/1 var(--face-sans); }
  .ts-s code { font: 13px/1 var(--face-code); color: var(--fg-muted); }
  .ts-n { font-size: 12.5px; min-width: 0; }
  .ts-n small { display: block; color: var(--fg-muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ts .ck { color: var(--accent); }

  /* Reading: settings and a live, measured preview side by side */
  .sbody.rd { max-width: 1440px; display: grid; grid-template-columns: minmax(380px, 440px) minmax(0, 1fr); gap: 24px; align-items: start; }
  .rd-prev { position: sticky; top: 0; height: calc(100vh - var(--tb-h) - 40px); min-height: 420px; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; background: var(--raised); overflow: hidden; }
  .pv-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; font-size: 12px; }
  .pv-head label { color: var(--fg-muted); }
  .pv-head select { height: 26px; }
  .pv-scroll { flex: 1; overflow: auto; background: var(--doc); min-height: 0; }
  .pv-frame { margin: 0 auto; position: relative; width: 100%; }
  .pv-frame.split { width: 50%; margin: 0; border-right: 1px dashed var(--line-strong); min-height: 100%; }
  .pv-frame .doc { padding: 1.4em 1.4em 3em; position: relative; }
  #rp.ul-off a { text-decoration-line: none; }
  #rp.ul-off a:hover { text-decoration-line: underline; }
  #rp.ul-on a { text-decoration-line: underline; }
  #rp.no-hyph p { hyphens: manual !important; -webkit-hyphens: manual !important; }
  /* Spec rule 6: spacing never reaches code, tables, maths or verse */
  #rp :is(pre, code, table, .cb, .tbl, math, .verse) { letter-spacing: 0; word-spacing: 0; }
  #rp.fn-margin .footnotes { display: none; }
  #rp .mnote { position: absolute; font: 400 12px/1.45 var(--face-chrome); color: var(--fg-muted); border-left: 2px solid var(--line-strong); padding-left: 8px; }
  #rp .mnote b { color: var(--accent); margin-right: 4px; }
  #rp .fnref a { cursor: pointer; }
  #rp.wcag-test, #rp.wcag-test * { line-height: 1.5 !important; letter-spacing: 0.12em !important; word-spacing: 0.16em !important; }
  #rp.wcag-test p { margin-bottom: 2em !important; }
  .pv-colo { border-top: 1px solid var(--line); padding: 8px 12px; font-size: 12px; color: var(--fg-muted); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
  .pv-colo b { color: var(--fg-strong); font-weight: 650; }
  .pv-colo .chips-row { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; }
  .pv-wcag { border-top: 1px solid var(--line); padding: 8px 12px; font-size: 12px; display: flex; gap: 8px; align-items: center; }
  .scripts { width: 100%; border-collapse: collapse; font-size: 12px; }
  .scripts th, .scripts td { text-align: left; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .scripts th { color: var(--fg-muted); font-weight: 600; }
  .scripts td.n { font-variant-numeric: tabular-nums; }

  /* Content types */
  .kpanel { grid-column: 1 / -1; margin-top: 10px; padding: 12px; background: var(--inset); border: 1px solid var(--line); border-radius: 9px; }
  .kgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 12px; }
  .kgrid .kf { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: var(--fg-muted); min-width: 0; }
  .kgrid .field { width: 100%; height: 26px; }
  .kgrid .kf.off { opacity: .6; }
  .kpanel h3 { font-size: 11.5px; font-weight: 650; color: var(--fg-muted); margin: 14px 0 6px; }
  .ktools { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 12px; }
  .ktools li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 6px; align-items: center; font-size: 12.5px; padding: 2px 4px; border-radius: 6px; }
  .ktools li:hover { background: var(--hover); }
  .ktools label { display: flex; gap: 6px; align-items: center; min-width: 0; }
  .ktools label svg { color: var(--fg-muted); width: 14px; height: 14px; }
  .ktools .mv { display: flex; gap: 1px; }
  .ktools .mv button { width: 22px; height: 22px; border: 0; background: none; border-radius: 5px; color: var(--fg-muted); display: grid; place-items: center; padding: 0; }
  .ktools .mv button:hover:not([disabled]) { background: var(--press); color: var(--fg); }
  .ktools .mv button[disabled] { opacity: .35; }
  .ktools .mv svg { width: 13px; height: 13px; }
  .kstrip { display: flex; gap: 2px; flex-wrap: wrap; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--doc); margin-top: 8px; }
  .kstrip .qbtn { pointer-events: none; }
  .kfoot { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
  .ksum { font-size: 11.5px; color: var(--fg-faint); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .rules { display: flex; flex-direction: column; gap: 4px; width: 100%; }
  .rule { display: grid; grid-template-columns: 22px minmax(0, 1fr) 16px 150px auto; gap: 8px; align-items: center; }
  .rule .n { color: var(--fg-faint); font-size: 11.5px; text-align: right; font-variant-numeric: tabular-nums; }
  .rule .field { height: 26px; }
  .rule input.field { font-family: var(--face-code); font-size: 12px; }
  .rule .acts { display: flex; gap: 1px; }
  .rule .acts .tb-btn, .icbtn { height: 26px; min-width: 26px; padding: 0; border-radius: 6px; }
  .rtest { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; font-size: 12px; width: 100%; }
  .rtest .field { font-family: var(--face-code); font-size: 12px; flex: 1; min-width: 220px; }
  .rtest output { color: var(--fg-muted); width: 100%; }

  /* Lint rules, collections, permissions, storage: dense inner lists */
  .ilist { width: 100%; display: flex; flex-direction: column; }
  .irow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 0; font-size: 12.5px; }
  .irow + .irow { border-top: 1px solid var(--line); }
  .irow .t { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .irow .t > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .irow .t svg { color: var(--fg-muted); }
  .irow .s { font-size: 11.5px; color: var(--fg-muted); }
  .irow .r { display: flex; gap: 8px; align-items: center; }
  .irow select.field { height: 26px; }
  .mono-path { font-family: var(--face-code); font-size: 11.5px; color: var(--fg-muted); }

  /* Shortcuts */
  .sc-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; width: 100%; }
  .sc-bar input.field { flex: 1; min-width: 200px; }
  .sc-list { width: 100%; }
  .sc-g { font-size: 11px; font-weight: 650; color: var(--fg-faint); padding: 10px 4px 4px; }
  .sc-row { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto 26px; gap: 10px; align-items: center; padding: 3px 4px; border-radius: 6px; min-height: 32px; }
  .sc-row:hover { background: var(--hover); }
  .sc-row > svg { color: var(--fg-muted); width: 14px; height: 14px; }
  .sc-name { font-size: 12.5px; min-width: 0; overflow-wrap: anywhere; }
  .sc-name .chip { white-space: normal; height: auto; min-height: 18px; }
  .sc-name .chip { margin-left: 6px; }
  .sc-row .icbtn[hidden] { display: none; }
  .sc-msg { grid-column: 2 / -1; font-size: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 2px 0 6px; }
  .sc-msg.err { color: var(--err); }
  .pfx { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 12px; width: 100%; }
  .pfx label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-muted); }
  .pfx input { width: 36px; text-align: center; font-family: var(--face-code); height: 26px; padding: 0; }

  let recorder = null;
  function stopRecording(commit) { if (recorder) { const r = recorder; recorder = null; r.cleanup(); if (!commit) r.cancel(); } }
  // Captures keys in the capture phase so app shortcuts (⌘K, ⌘0 …) do not fire while recording.
  function record(btn, { scope, onCommit, onError }) {
    stopRecording();
    const prev = btn.innerHTML, prevCls = btn.className;
    btn.className = 'keycap rec'; btn.textContent = 'Type shortcut'; btn.setAttribute('aria-pressed', 'true');
    announce('Recording a shortcut. Press the keys, Escape to cancel, Delete to clear.');
    const onKey = (e) => {
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
      const pure = ['Shift', 'Control', 'Alt', 'Meta', 'OS'].includes(e.key);
      if (e.type === 'keyup') { if (pure) btn.textContent = modStr(e) || 'Type shortcut'; return; }
      if (pure) { btn.textContent = modStr(e) + ' …'; return; }
      if (e.key === 'Escape' && !modStr(e)) return stopRecording(false);
      if ((e.key === 'Backspace' || e.key === 'Delete') && !modStr(e)) { stopRecording(true); return onCommit(''); }

      if (err) { btn.textContent = combo; onError && onError(err); announce(err); return; }
      stopRecording(true); onCommit(combo);
    };
    const outside = (e) => { if (e.target !== btn) stopRecording(false); };
    window.addEventListener('keydown', onKey, true); window.addEventListener('keyup', onKey, true);
    setTimeout(() => document.addEventListener('mousedown', outside, true), 0);

      try { o = JSON.parse(body.querySelector('textarea').value); } catch (e) { out.hidden = false; out.innerHTML = ic('circle-x') + '<span>Not valid JSON: ' + esc(e.message) + '</span>'; G.icons(out); return false; }
      const before = clone(G.prefs), known = Object.keys(o).filter((k) => k in DEF), unknown = Object.keys(o).filter((k) => !(k in DEF) && k !== 'version');
      known.forEach((k) => { if (typeof o[k] === typeof DEF[k] || DEF[k] === 'auto' || (typeof DEF[k] === 'object')) setp(k, o[k]); });
      G.toast(`${known.length} settings imported${unknown.length ? `, ${unknown.length} unknown ignored` : ''}`, { icon: 'upload', action: { label: 'Undo', run: () => Object.keys(DEF).forEach((k) => setp(k, before[k])) } });
    } }] });
  }
  function exportKeymap() {
    const km = P('keymap') || {}; const txt = JSON.stringify({ format: 'marxy-keymap/1', bindings: km }, null, 2);
    sheet({ title: 'Export keymap', icon: 'download', body: `<p>${Object.keys(km).length ? Object.keys(km).length + ' changed shortcuts.' : 'No shortcuts are changed; the file would be empty.'} Defaults are not included, so new commands keep their own shortcuts.</p><pre>${esc(txt)}</pre>`, actions: [{ label: 'Copy', icon: 'copy', run: () => { G.copy(txt, { as: 'keymap', clean: false }); return false; } }, { label: 'Save as File…', primary: true, run: () => G.toast('Save panel: Marxy Keymap.json', { icon: 'download' }) }] });
  }
  function importKeymap() {
    const body = G.el(`<div><p>Paste a Marxy keymap. Conflicts with your current shortcuts are listed before anything changes.</p><textarea class="field" aria-label="Keymap JSON" spellcheck="false">${esc(JSON.stringify({ format: 'marxy-keymap/1', bindings: { 'go-themes': '⌃⌘P', 'reindex': '⌥⇧⌘R' } }, null, 2))}</textarea><div class="why" data-r hidden></div></div>`);
    sheet({ title: 'Import keymap', icon: 'upload', body, focusEl: 'textarea', actions: [{ label: 'Cancel' }, { label: 'Import', primary: true, run: () => {
      const out = body.querySelector('[data-r]'); let o;
      try { o = JSON.parse(body.querySelector('textarea').value); if (!o.bindings) throw new Error('No "bindings" object'); } catch (e) { out.hidden = false; out.innerHTML = ic('circle-x') + '<span>' + esc(e.message) + '</span>'; G.icons(out); return false; }
      const ids = new Set(scItems().map((x) => x.id)); const old = clone(P('keymap')); const km = clone(old); let n = 0, skip = 0;
      Object.entries(o.bindings).forEach(([id, v]) => { if (ids.has(id) && (!v || !validateCombo(v, 'app'))) { km[id] = norm(v); n++; } else skip++; });
      setp('keymap', km); G.toast(`${n} shortcuts imported${skip ? `, ${skip} skipped` : ''}`, { icon: 'upload', action: { label: 'Undo', run: () => setp('keymap', old) } });
    } }] });
  }
  function speak() {
    if (!window.speechSynthesis) return G.toast('Read aloud uses macOS speech in the app', { icon: 'audio-lines' });
    speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance('Ragged right lets each line end where it ends, so every space keeps its designed width.'); u.rate = P('speakRate'); speechSynthesis.speak(u);
    G.toast('Speaking at ' + P('speakRate').toFixed(2) + '×', { icon: 'audio-lines' });
  }

  /* ---------- Navigation, search and rendering ---------- */

  const pane = $('#pane');
  function renderNav() {
    $('#snav').innerHTML = SECTIONS.map((s, i) => `${i && NAV_BREAKS.has(SECTIONS[i - 1].id) ? '<hr>' : ''}<a class="nav-item" href="#${s.id}" data-sec="${s.id}"><span class="tile tone-${s.tone}">${ic(s.icon)}</span><span class="lbl">${esc(s.name)}</span><span class="count" hidden></span><span class="chg" hidden></span></a>`).join('');
  }
  function paintNav(hits) {
    $$('#snav .nav-item').forEach((a) => {
      const s = SEC[a.dataset.sec], cur = !S.q && s.id === S.section; a.classList.toggle('active', cur); if (cur) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
      const c = a.querySelector('.count'), g = a.querySelector('.chg');
      if (S.q) { const n = (hits && hits[s.id]) || 0; c.hidden = false; c.textContent = n || ''; a.classList.toggle('dim', !n); g.hidden = true; a.setAttribute('aria-label', `${s.name}, ${n} result${n === 1 ? '' : 's'}`); }
      else { c.hidden = true; a.classList.remove('dim'); const ch = changedKeys(secKeys(s)).length; g.hidden = !ch; g.title = ch + ' changed'; a.setAttribute('aria-label', s.name + (ch ? `, ${ch} changed` : '')); }
    });
    const total = changedKeys(Object.keys(DEF)).length; $('#chgtotal').textContent = total ? total + ' changed' : '';
  }
  function header() {
    if (S.q) { $('#sec-title').textContent = 'Search'; $('#sec-sub').textContent = 'Results from every section'; $('#chgchip').hidden = true; $('#reset-sec').disabled = true; return; }
    const s = SEC[S.section], ch = changedKeys(secKeys(s)).length;
    $('#sec-title').textContent = s.name; $('#sec-sub').textContent = 'Changes apply immediately';
    $('#chgchip').hidden = !ch; $('#chgchip').textContent = ch + ' changed';
    $('#reset-sec').disabled = !ch; $('#reset-sec').title = ch ? `Restore the ${ch} changed setting${ch === 1 ? '' : 's'} in ${s.name}` : 'Everything here is at its default';
    document.title = s.name + ' · Marxy Settings';
  }
  function groupEl(title, desc, rowsDefs, ctx, link) {
    const id = 'g' + ++uid;
    const g = G.el(`<section class="grp" aria-labelledby="${id}"><h2 id="${id}">${link ? `<a href="${link}">${esc(title)}</a>` : esc(title)}</h2>${desc ? `<div class="gdesc">${desc}</div>` : ''}<div class="box"></div></section>`);
    const box = g.querySelector('.box');
    rowsDefs.forEach((d) => { const r = mkRow(d, Object.assign({}, ctx, { kwhit: ctx.kwhits && ctx.kwhits.get(d) })); S.rows.push(r); box.appendChild(r.el); });
    return g;
  }
  function renderSection(id, rowId) {
    stopRecording(); $$('.fn-pop').forEach((x) => x.remove());
    S.section = SEC[id] ? id : 'general'; S.q = ''; S.rows = []; edPrev = null;
    const s = SEC[S.section]; $('#q').value = ''; $('#qclr').hidden = true;
    pane.innerHTML = '';
    const body = G.el(`<div class="sbody${s.layout === 'reading' ? ' rd' : ''}"></div>`), col = s.layout === 'reading' ? G.el('<div class="rd-rows"></div>') : body;
    col.appendChild(G.el(`<p class="sintro">${s.desc}</p>`));
    if (s.links) col.appendChild(G.el(`<div class="rel">${s.links.map(([href, label, icon, internal]) => `<a href="${internal ? '#' + href : /^https?:/.test(href) ? href : G.page(href)}"${/^https?:/.test(href) ? ' target="_blank" rel="noreferrer"' : ''}>${ic(icon)}${esc(label)}${internal ? '' : ic('arrow-up-right')}</a>`).join('')}</div>`));
    s.groups.forEach((g) => col.appendChild(groupEl(g.title, g.desc, g.rows, { sec: s })));
    if (s.layout === 'reading') { body.appendChild(col); body.appendChild(readingPreview()); }
    pane.appendChild(body); pane.scrollTop = 0;
    G.icons(pane); refresh(true); header(); paintNav();
    if (S.wcag && s.layout === 'reading') toggleWcag(true);
    if (rowId) reveal(rowId);
    if (document.fonts) document.fonts.ready.then(() => schedule());
  }
  function reveal(rowId) {
    const el = $(`#row-${CSS.escape(S.section)}-${CSS.escape(rowId)}`) || $(`[data-row="${CSS.escape(rowId)}"]`); if (!el) return;
    el.hidden = false; el.scrollIntoView({ block: 'center' });
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    const r = S.rows.find((x) => x.el === el); if (r && r.ctl && r.ctl.focus) setTimeout(() => { try { r.ctl.focus(); } catch (e) { /* custom rows may have nothing focusable */ } }, 250);
  }
  const strip = (h) => String(h || '').replace(/<[^>]+>/g, ' ');
  function searchRows(q) {
    const toks = q.toLowerCase().split(/\s+/).filter(Boolean); const out = [];
    ALL_ROWS.forEach((d) => {
      if (d.mirror) return;
      const vis = strip(d.label + ' ' + (typeof d.desc === 'function' ? d.desc() : d.desc || '')).toLowerCase();
      const hidden = [d.kw || '', keysOf(d).join(' '), d.group.title, d.sec.name].join(' ').toLowerCase();
      if (!toks.every((t) => vis.includes(t) || hidden.includes(t))) return;
      const score = toks.reduce((s, t) => s + (d.label.toLowerCase().includes(t) ? 10 : vis.includes(t) ? 4 : 1), 0);
      const viaKey = toks.filter((t) => !vis.includes(t));
      const kh = viaKey.length ? 'Matches ' + viaKey.map((t) => { const k = keysOf(d).find((x) => x.toLowerCase().includes(t)); return k ? `<code>${esc(k)}</code>` : '"' + esc(t) + '"'; }).join(', ') + (viaKey.some((t) => keysOf(d).some((x) => x.toLowerCase().includes(t))) ? '' : ' in related words') : '';
      out.push({ d, score, kh });
    });
    return { toks, rows: out };
  }
  function renderSearch(q) {
    stopRecording(); S.q = q; S.rows = []; edPrev = null;
    const { toks, rows } = searchRows(q);
    const sc = scItems().filter((it) => toks.every((t) => it.name.toLowerCase().includes(t) || it.group.toLowerCase().includes(t)) || norm(q.trim()) === norm(kbdOf(it)));
    pane.innerHTML = '';
    const body = G.el('<div class="sbody"></div>');
    const hits = {}; rows.forEach((r) => (hits[r.d.sec.id] = (hits[r.d.sec.id] || 0) + 1)); if (sc.length) hits.shortcuts = (hits.shortcuts || 0) + sc.length;
    body.appendChild(G.el(`<p class="sintro" role="status">${rows.length + sc.length ? `${rows.length} setting${rows.length === 1 ? '' : 's'}${sc.length ? ` and ${sc.length} shortcut${sc.length === 1 ? '' : 's'}` : ''} match “${esc(q)}”.` : ''}</p>`));
    if (!rows.length && !sc.length) body.appendChild(G.el(`<div class="empty-s"><b>No settings match “${esc(q)}”</b>Try a broader word, like “font”, “dark”, “copy” or “index”.</div>`));
    SECTIONS.forEach((s) => s.groups.forEach((g) => {
      const rs = rows.filter((r) => r.d.group === g).sort((a, b) => b.score - a.score); if (!rs.length) return;
      const kwhits = new Map(rs.map((r) => [r.d, r.kh]));
      body.appendChild(groupEl(s.name + ' › ' + g.title, null, rs.map((r) => r.d), { sec: s, search: true, kwhits }, '#' + s.id));
    }));
    if (sc.length) {
      const g = G.el(`<section class="grp"><h2><a href="#shortcuts">Palette and shortcuts › Keyboard shortcuts</a></h2><div class="box" style="padding:4px 8px"><div class="sc-list"></div></div></section>`);
      const list = g.querySelector('.sc-list'); const cmap = conflictsOf();
      const draw = () => { list.innerHTML = sc.slice(0, 10).map((it) => scRow(it, conflictsOf())).join('') + (sc.length > 10 ? `<div class="sc-g"><a href="#shortcuts" data-scq="${esc(q)}">Show all ${sc.length} in Palette and shortcuts</a></div>` : ''); G.icons(list); highlightIn(g, toks); };
      wireScList(list, draw); draw(); body.appendChild(g);
      g.addEventListener('click', (e) => { const a = e.target.closest('[data-scq]'); if (a) S.sc.q = a.dataset.scq; });
    }
    pane.appendChild(body); pane.scrollTop = 0;
    G.icons(pane); refresh(true); header(); paintNav(hits); highlightIn(pane, toks);
    document.title = 'Search: ' + q + ' · Marxy Settings';
  }
  function highlightIn(root, toks) {
    const ranges = [];
    $$('.lbl, .desc, .grp > h2 a, .sc-name', root).forEach((el) => {
      const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let n;
      while ((n = w.nextNode())) { const t = n.nodeValue.toLowerCase(); toks.forEach((tok) => { let i = 0; while ((i = t.indexOf(tok, i)) >= 0) { const r = new Range(); r.setStart(n, i); r.setEnd(n, i + tok.length); ranges.push(r); i += tok.length; } }); }
    });
    if (window.CSS && CSS.highlights && window.Highlight) { const prev = CSS.highlights.get('sq'); const all = (root === pane || !prev) ? ranges : Array.from(prev).filter((r) => pane.contains(r.startContainer) && !root.contains(r.startContainer)).concat(ranges); CSS.highlights.set('sq', new Highlight(...all)); }
    else ranges.reverse().forEach((r) => { try { r.surroundContents(document.createElement('mark')); } catch (e) { /* range crosses an element; skip */ } });
  }
  function clearHighlights() { if (window.CSS && CSS.highlights) CSS.highlights.delete('sq'); }

  let raf = 0;
  // A microtask, not rAF: coalesces bursts (a section reset sets many prefs) and still runs in hidden windows.
  const schedule = () => { if (!raf) { raf = 1; queueMicrotask(() => { raf = 0; refresh(); }); } };
  function applyLocal() {
    const h = document.documentElement.dataset;
    h.density = P('density'); h.toolbar = P('toolbarStyle'); h.focusAlways = String(P('focusRingAlways'));
    h.sidebar = P('sidebarStyle') === 'glass' && !transparencyReduced() ? 'glass' : 'solid';
    if (P('reduceMotion') === 'on') h.motion = 'reduce'; else delete h.motion;
  }
  function refresh(initial) {
    applyLocal();
    if (S.section === 'reading' && !S.q) updatePreview();
    S.rows.forEach(updRow);
    if (S.q && !initial) { const { toks } = searchRows(S.q); highlightIn(pane, toks); }
    if (document.querySelector('i[data-lucide]')) G.icons();
    header(); if (!S.q) paintNav();
  }

  function route() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (h.startsWith('q=')) { const q = h.slice(2); $('#q').value = q; $('#qclr').hidden = !q; return q ? renderSearch(q) : renderSection(S.section); }
    clearHighlights();
    const [sec, row] = h.split('/');
    renderSection(SEC[sec] ? sec : 'general', row);
  }
  window.addEventListener('hashchange', route);

  const qIn = $('#q');
  let qT = 0;
  qIn.addEventListener('input', () => {
    clearTimeout(qT); $('#qclr').hidden = !qIn.value;
    qT = setTimeout(() => { const q = qIn.value.trim(); if (q) { history.replaceState(null, '', '#q=' + encodeURIComponent(q)); renderSearch(q); } else { history.replaceState(null, '', '#' + S.section); clearHighlights(); renderSection(S.section); } }, 90);
  });
  qIn.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && qIn.value) { e.preventDefault(); qIn.value = ''; qIn.dispatchEvent(new Event('input')); }
    else if (e.key === 'Enter' && S.q) { e.preventDefault(); const r = S.rows[0]; if (r) location.hash = r.def.sec.id + '/' + r.def.rid; }
    else if (e.key === 'ArrowDown' && S.q) { const r = S.rows[0]; if (r && r.ctl && r.ctl.focus) { e.preventDefault(); r.ctl.focus(); } }
  });
  $('#qclr').onclick = () => { qIn.value = ''; qIn.dispatchEvent(new Event('input')); qIn.focus(); };
  $('#back').onclick = () => history.back();
  $('#fwd').onclick = () => history.forward();
  $('#reset-sec').onclick = () => resetSection();
  $('#snav').addEventListener('click', (e) => { const a = e.target.closest('.nav-item'); if (a && S.q && location.hash === '#' + a.dataset.sec) { e.preventDefault(); route(); } });
  $('#snav').addEventListener('keydown', (e) => {
    const st = { ArrowDown: 1, ArrowUp: -1 }[e.key]; if (!st) return; const as = $$('#snav .nav-item'); const i = as.indexOf(document.activeElement); if (i < 0) return;
    e.preventDefault(); as[(i + st + as.length) % as.length].focus();
  });
  pane.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'scale100') { setp('scale', 1); announce('Text size 100%'); }
    if (b.dataset.act === 'export-settings') exportSheet();
  });

  function resetSection() {
    const s = SEC[S.section]; const ks = changedKeys(secKeys(s)); if (!ks.length) return;
    const before = Object.fromEntries(ks.map((k) => [k, clone(P(k))]));
    ks.forEach((k) => setp(k, DEF[k]));
    G.toast(`${esc(s.name)} reset · ${ks.length} setting${ks.length === 1 ? '' : 's'}`, { icon: 'rotate-ccw', ms: 5000, action: { label: 'Undo', run: () => Object.entries(before).forEach(([k, v]) => setp(k, v)) } });
    announce(s.name + ' reset to defaults');
  }

  document.addEventListener('keydown', (e) => {
    if (recorder) return;
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === 'f' && !e.shiftKey) { e.preventDefault(); qIn.focus(); qIn.select(); }
    else if (mod && e.key === '[') { e.preventDefault(); history.back(); }
    else if (mod && e.key === ']') { e.preventDefault(); history.forward(); }
  });

  /* ---------- Commands ---------- */

  SECTIONS.forEach((s) => G.command({ id: 'settings-' + s.id, name: 'Settings: ' + s.name, icon: s.icon, group: 'Settings', run: () => (location.hash = s.id) }));
  // No kbd: ⌘F is Edit › Find, which in the Settings window means this search.
  G.command({ id: 'settings-search', name: 'Search settings', icon: 'search', group: 'Settings', run: () => { qIn.focus(); qIn.select(); } });
  G.command({ id: 'settings-reset-section', name: 'Reset this settings section', icon: 'rotate-ccw', group: 'Settings', run: resetSection });
  G.command({ id: 'settings-reset-all', name: 'Reset all settings…', icon: 'rotate-ccw', group: 'Settings', run: confirmResetAll });
  G.command({ id: 'settings-export', name: 'Export settings…', icon: 'download', group: 'Settings', run: exportSheet });
  G.command({ id: 'settings-import', name: 'Import settings…', icon: 'upload', group: 'Settings', run: importSheet });
  G.command({ id: 'settings-json', name: 'Show settings.json', icon: 'file-json', group: 'Settings', run: () => (location.hash = 'advanced/settingsFile') });
  G.command({ id: 'settings-wcag', name: 'Test WCAG 1.4.12 text spacing', icon: 'ruler', group: 'Settings', run: () => { if (S.section !== 'reading' || S.q) location.hash = 'reading'; setTimeout(() => toggleWcag(true), 80); } });
  G.command({ id: 'settings-spacing-wcag', name: 'Apply WCAG 1.4.12 spacing', icon: 'ruler', group: 'Settings', run: () => preset('wcag') });

  /* ---------- Boot ---------- */

  G.on('pref', schedule);
  G.on('theme', () => setTimeout(schedule, 60));
  ['(prefers-reduced-motion: reduce)', '(prefers-color-scheme: dark)', '(prefers-contrast: more)', '(prefers-reduced-transparency: reduce)'].forEach((q) => { try { window.matchMedia(q).addEventListener('change', schedule); } catch (e) { /* older engines */ } });
  // Exposed so other pages (palette, workspace) can search and link to settings.
  G.settingsSchema = SECTIONS; G.settingsDefaults = DEF; G.settingsKindDefaults = KD;
  renderNav();
  // Per-language token colours and brand tints that 07-themes compiled (langCss); lang-colors.css is the baseline.
  try { const lc = G.store.get('langCss', ''); if (lc) { const st = document.createElement('style'); st.id = 'lang-live'; st.textContent = lc; document.head.appendChild(st); } } catch (e) { /* storage unavailable */ }
  G.boot({});
  route();
})();
</script>
</body>
