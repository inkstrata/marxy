<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marxy Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&family=Atkinson+Hyperlegible+Mono:ital,wght@0,200..800;1,200..800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/app.css">
<link rel="stylesheet" href="shared/lang-colors.css">
<style>
  /* Menus opened from inside a sheet must sit above it (shared .menu is z 50, sheets 70). */
  .menu { z-index: 85; }

  /* ----- Collection header ----- */
  .lib-head { flex: none; padding: 12px 16px 10px; border-bottom: 1px solid var(--line); background: var(--doc); position: relative; container-type: inline-size; container-name: head; }
  .lh-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .lh-row .lh-name { flex: 0 1 auto; min-width: 7em; }
  @container head (max-width: 780px) { .lh-acts .bl { display: none; } .lh-acts .btn.sm { padding: 0 7px; } }
  @container head (max-width: 620px) { .lh-row .wchip span { display: none; } }
  .lh-ic { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-wash); color: var(--accent); flex: none; }
  .lh-ic svg.lucide { width: 18px; height: 18px; }
  .lh-name { font-size: 17px; font-weight: 650; color: var(--fg-strong); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .lh-acts { display: flex; gap: 6px; margin-left: auto; flex: none; align-items: center; }
  .lh-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin-top: 6px; font-size: 12px; color: var(--fg-muted); padding-left: 42px; }
  .lh-meta .m { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .lh-meta svg.lucide { width: 13px; height: 13px; }
  .lh-meta button.m { border: 0; background: none; padding: 0 4px; height: 22px; border-radius: 5px; color: inherit; }
  .lh-meta button.m:hover { background: var(--hover); color: var(--fg); }
  .lh-path { font: 11.5px var(--face-code); color: var(--fg); background: var(--inset); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
  .wchip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--raised); color: var(--fg); font-size: 12px; white-space: nowrap; }
  .wchip:hover { background: var(--hover); }
  .wchip.paused { color: var(--warn); }
  .wchip .chev { width: 12px; height: 12px; color: var(--fg-faint); }
  .lh-prog { position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: var(--line); }
  .lh-prog i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .rulechip { display: inline-flex; align-items: center; gap: 5px; font: 11.5px var(--face-code); color: var(--fg); background: var(--accent-wash); border: 1px solid var(--accent-wash-strong); border-radius: 5px; padding: 1px 6px; }

  /* ----- Filter bar ----- */
  .fbar { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--doc); flex-wrap: wrap; }
  .q-wrap { position: relative; flex: 1 1 300px; min-width: 240px; max-width: 540px; display: flex; align-items: center; }
  .q-wrap > svg.lucide { position: absolute; left: 9px; color: var(--fg-faint); pointer-events: none; }
  .q-input { width: 100%; padding-left: 30px; padding-right: 60px; font-family: var(--face-code); font-size: 12.5px; }
  .q-input::placeholder { font-family: var(--face-chrome); color: var(--fg-faint); }
  .q-k { position: absolute; right: 34px; pointer-events: none; }
  .q-help { position: absolute; right: 3px; height: 22px; min-width: 24px; padding: 0 5px; border-radius: 5px; }
  .fbtn { height: 28px; padding: 0 9px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--raised); display: inline-flex; align-items: center; gap: 5px; color: var(--fg); white-space: nowrap; }
  .fbtn:hover { background: var(--hover); }
  .fbtn.on { background: var(--accent-wash-strong); border-color: transparent; color: var(--fg-strong); }
  .fbtn .n { font-size: 11px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
  .fbtn svg.chev { width: 12px; height: 12px; color: var(--fg-faint); }
  .fbar .seg button { height: 24px; padding: 0 7px; }
  .sugg { position: absolute; top: calc(100% + 4px); left: 0; width: min(460px, 100%); background: var(--raised); border: 1px solid var(--line-strong); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 4px; z-index: 30; max-height: 320px; overflow: auto; }
  .sg { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 16px; min-height: 28px; padding: 5px 10px; border-radius: 5px; font-size: 12.5px; line-height: 1.3; color: var(--fg); }
  .sg code { font-family: var(--face-code); font-size: 12px; }
  .sg .d { color: var(--fg-faint); font-size: 11.5px; }
  .sg.hot { background: var(--accent); color: var(--accent-fg); }
  .sg.hot .d { color: inherit; }
  .sg-h { font-size: 11px; font-weight: 650; color: var(--fg-faint); padding: 6px 10px 3px; line-height: 1.3; }
  .qchips { flex: none; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--doc); font-size: 12px; color: var(--fg-muted); }
  .qchip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 2px 0 8px; border-radius: 999px; background: var(--accent-wash); border: 1px solid var(--accent-wash-strong); color: var(--fg-strong); font: 11.5px var(--face-code); }
  .qchip .k { color: var(--fg-muted); }
  .qchip.neg { background: var(--err-wash); border-color: transparent; }
  .qchip.bad { background: var(--warn-wash); border-color: var(--warn); }
  .qchip.or { background: none; border: 0; font-family: var(--face-chrome); font-weight: 650; color: var(--fg-muted); padding: 0 2px; }
  .qchip button { width: 18px; height: 18px; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; color: var(--fg-muted); padding: 0; }
  .qchip button:hover { background: var(--press); color: var(--fg); }

  /* ----- Results list ----- */
  .lib-body { flex: 1; display: flex; min-height: 0; min-width: 0; }
  .results { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; container-type: inline-size; container-name: results; }
  .lhd { flex: none; display: grid; grid-template-columns: var(--cols); gap: 0 10px; align-items: center; height: 28px; padding: 0 14px 0 12px; border-bottom: 1px solid var(--line); font-size: 11.5px; color: var(--fg-muted); background: var(--doc); }
  .lhd button { border: 0; background: none; padding: 0 3px; color: inherit; font: inherit; display: inline-flex; gap: 3px; align-items: center; height: 22px; border-radius: 4px; max-width: 100%; }
  .lhd button:hover { color: var(--fg); background: var(--hover); }
  .lhd button.on { color: var(--fg-strong); font-weight: 650; }
  .lhd .num, .r .num { justify-self: end; text-align: right; }
  .lhd input { margin: 0; }
  .lscroll { flex: 1; overflow: auto; min-height: 0; padding: 4px 6px 96px; outline: none; background: var(--doc); }
  .r { display: grid; grid-template-columns: var(--cols); gap: 0 10px; align-items: center; min-height: var(--rh, 30px); padding: 0 8px 0 6px; border-radius: 6px; color: var(--fg); position: relative; user-select: none; }
  .r:hover { background: var(--hover); }
  .r.sel { background: var(--accent-wash-strong); }
  .lscroll.kbd .r.act, .lscroll:focus-visible .r.act { outline: 2px solid var(--accent); outline-offset: -2px; }
  .r.dim { opacity: .62; }
  .r > * { min-width: 0; }
  .r input[type="checkbox"] { margin: 0; }
  .r .c-ic svg { color: var(--fg-muted); display: block; }
  .c-title { display: flex; flex-direction: column; justify-content: center; }
  .c-title .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg-strong); }
  .r.unread .tt { font-weight: 650; }
  .c-title .tp { font: 11px var(--face-code); color: var(--fg-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
  .c-path { font: 11.5px var(--face-code); color: var(--fg-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .c-txt { font-size: 12px; color: var(--fg-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .c-txt.mono { font: 11.5px var(--face-code); }
  .kb { max-width: 100%; overflow: hidden; }
  .marks { display: flex; gap: 2px; align-items: center; }
  .mk { width: 16px; height: 18px; display: grid; place-items: center; border-radius: 4px; flex: none; }
  .mk svg.lucide { width: 13px; height: 13px; }
  .mk.changed { color: var(--info); } .mk.dup { color: var(--warn); } .mk.broken { color: var(--err); } .mk.pin { color: var(--fg-muted); } .mk.err { color: var(--warn); } .mk.arch { color: var(--fg-muted); }
  .r .ra { opacity: 0; height: 22px; min-width: 24px; padding: 0 4px; border-radius: 5px; }
  .r:hover .ra, .r.act .ra, .r.sel .ra, .r .ra:focus-visible { opacity: 1; }
  .ra-wrap { display: flex; gap: 4px; justify-content: flex-end; }
  .ra-wrap .btn.sm { height: 22px; padding: 0 7px; font-size: 11.5px; }
  .tt mark, .c-path mark, .snip mark, .tp mark { background: var(--mark); color: inherit; border-radius: 2px; box-shadow: 0 1px 0 var(--mark-edge); }
  .subs { grid-column: 3 / -1; padding: 0 0 6px; display: flex; flex-direction: column; gap: 1px; }
  .snip { display: grid; grid-template-columns: 3.6em minmax(0, 1fr); gap: 8px; font: 11.5px/1.55 var(--face-code); color: var(--fg-muted); border: 0; background: none; text-align: left; padding: 1px 6px; border-radius: 4px; width: 100%; }
  .snip:hover { background: var(--hover); color: var(--fg); }
  .snip .ln { color: var(--fg-faint); text-align: right; }
  .snip .tx { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .snip-more { font-size: 11.5px; color: var(--fg-faint); padding: 0 6px 0 calc(3.6em + 14px); }
  .bp { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-muted); padding: 2px 6px; border-radius: 5px; flex-wrap: wrap; }
  .bp:hover { background: var(--hover); }
  .bp code { font: 11.5px var(--face-code); color: var(--err); text-decoration: underline wavy var(--err); text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .bp svg.lucide { width: 13px; height: 13px; color: var(--err); }
  .bp .grow + .btn { margin-left: 0; }
  .grp { margin-top: 4px; }
  .gh { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 8px; font-size: 12px; color: var(--fg-muted); position: sticky; top: -4px; background: var(--doc); z-index: 2; border-bottom: 1px solid var(--line); }
  .gh b { color: var(--fg-strong); font-weight: 650; }
  .gh .tw { border: 0; background: none; width: 20px; height: 20px; border-radius: 4px; display: grid; place-items: center; color: var(--fg-muted); padding: 0; }
  .gh .tw:hover { background: var(--hover); color: var(--fg); }
  .gh .tw svg { transition: transform .15s; }
  .grp.closed .gh .tw svg { transform: rotate(-90deg); }
  .grp.closed > .r { display: none; }
  .gh .btn.sm { height: 22px; font-size: 11.5px; padding: 0 7px; }
  .sim { font: 600 11px var(--face-chrome); font-variant-numeric: tabular-nums; }
  .list-foot { padding: 14px 10px 0; font-size: 11.5px; color: var(--fg-faint); }
  .banner { display: flex; align-items: center; gap: 8px; padding: 7px 12px; font-size: 12px; border-bottom: 1px solid var(--line); background: var(--accent-wash); color: var(--fg); flex: none; }
  .banner.warn { background: var(--warn-wash); }
  .banner svg.lucide { color: var(--accent); }
  .banner.warn svg.lucide { color: var(--warn); }
  .banner input[type="range"] { width: 120px; }

  /* ----- States ----- */
  .state { padding: 56px 24px; text-align: center; color: var(--fg-muted); }
  .state .si { width: 46px; height: 46px; border-radius: 12px; background: var(--inset); border: 1px solid var(--line); display: grid; place-items: center; margin: 0 auto 12px; color: var(--fg-muted); }
  .state .si.err { color: var(--err); background: var(--err-wash); border-color: transparent; }
  .state h3 { margin: 0 0 6px; font-size: 15px; color: var(--fg-strong); font-weight: 650; }
  .state p { margin: 0 auto 14px; max-width: 52ch; line-height: 1.5; font-size: 12.5px; }
  .state .acts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .state code { font-family: var(--face-code); font-size: 12px; background: var(--inset); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--fg); }
  .idx-prog { max-width: 420px; margin: 0 auto 16px; }
  .idx-prog .progress { height: 6px; }
  .idx-prog .progress i { background: var(--accent); transition: width .2s; }
  .idx-prog .faint { font: 11.5px var(--face-code); margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .skel { height: 30px; border-radius: 6px; margin: 2px 0; background: linear-gradient(90deg, var(--hover), var(--press), var(--hover)); background-size: 300% 100%; animation: shimmer 1.4s infinite linear; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -200% 0; } }

  /* ----- Bulk action bar ----- */
  .bulk { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 1px; padding: 4px; background: var(--raised); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow); max-width: calc(100% - 24px); z-index: 4; animation: pop .14s var(--ease); }
  .bulk .cnt { padding: 0 8px 0 10px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--fg-strong); }
  .bulk .bb { height: 30px; padding: 0 9px; border: 0; background: none; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; color: var(--fg); white-space: nowrap; font-size: 12.5px; }
  .bulk .bb:hover:not(:disabled) { background: var(--hover); }
  .bulk .bb:disabled { color: var(--fg-faint); }
  .bulk .bb svg.chev { width: 12px; height: 12px; color: var(--fg-faint); margin-left: -3px; }
  .bulk .sep { width: 1px; height: 18px; background: var(--line); margin: 0 3px; flex: none; }
  @container results (max-width: 1020px) { .bulk .bl { display: none; } .bulk .bb { padding: 0 8px; } }

  /* ----- Preview pane ----- */
  .pv { width: 380px; flex: none; border-left: 1px solid var(--line); background: var(--side); display: flex; flex-direction: column; min-height: 0; }
  .pv-h { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); flex: none; }
  .pv-title { font-size: 14px; font-weight: 650; color: var(--fg-strong); line-height: 1.3; display: flex; gap: 8px; align-items: flex-start; }
  .pv-title svg.lucide { margin-top: 1px; color: var(--fg-muted); }
  .pv-path { font: 11px var(--face-code); color: var(--fg-muted); margin-top: 4px; overflow-wrap: anywhere; }
  .pv-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .pv-acts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .pv-acts .btn { height: 26px; padding: 0 9px; font-size: 12px; }
  .pv .insp-tabs { flex: none; }
  .pv-body { flex: 1; overflow: auto; min-height: 0; }
  .pv-body .doc { padding: 16px 18px 48px; background: var(--doc); min-height: 100%; }
  .pv-body .doc .blk-handle { display: none; }
  .pv-body .doc[data-kind="code"], .pv-body .doc[data-kind="data"] { padding: 0; }
  .pv-pad { padding: 12px 14px 20px; }
  .reason { font-size: 11.5px; color: var(--fg-muted); display: flex; gap: 6px; align-items: center; padding: 2px 0; }
  .reason svg.lucide { width: 13px; height: 13px; flex: none; }
  .orow { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; padding: 3px 8px; border-radius: 5px; font-size: 12.5px; color: var(--fg); border: 0; background: none; width: 100%; text-align: left; }
  .orow:hover { background: var(--hover); }
  .orow .meta { font-size: 11px; color: var(--fg-faint); font-variant-numeric: tabular-nums; }
  .orow.l3 { padding-left: 22px; } .orow.l4 { padding-left: 36px; }
  .orow > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .blk-flash { animation: flash 1.1s var(--ease); }

  /* ----- Sheets ----- */
  .sheet-scrim { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.22); display: flex; justify-content: center; align-items: flex-start; padding-top: 5vh; }
  .sheet { width: min(980px, calc(100vw - 40px)); max-height: 88vh; background: var(--raised); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; animation: pop .14s var(--ease); outline: none; }
  .sheet-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex: none; }
  .sheet-h b { font-size: 14px; color: var(--fg-strong); }
  .sheet-b { flex: 1; min-height: 0; overflow: auto; }
  .sheet-b.split { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); overflow: hidden; }
  .sheet-b.split > div { overflow: auto; padding: 14px 16px 18px; min-height: 0; }
  .sheet-b.split > div + div { border-left: 1px solid var(--line); background: var(--side); }
  .sheet-b.pad { padding: 14px 16px 18px; }
  .sheet-f { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); flex: none; }
  .btn.danger { color: var(--err); }
  .form { display: grid; grid-template-columns: 136px minmax(0, 1fr); gap: 10px 14px; align-items: start; font-size: 12.5px; }
  .form > .fl { padding-top: 5px; color: var(--fg-muted); text-align: right; }
  .form .ctl { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .form .ctl > .row { flex-wrap: wrap; }
  .form .hint { font-size: 11.5px; color: var(--fg-faint); line-height: 1.45; }
  .form h6 { grid-column: 1 / -1; margin: 6px 0 0; font-size: 11px; font-weight: 650; color: var(--fg-faint); border-top: 1px solid var(--line); padding-top: 12px; }
  .form textarea.field { font: 12px/1.5 var(--face-code); min-height: 54px; resize: vertical; }
  .form .field.mono { font: 12px var(--face-code); }
  .src-types { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .src-type { border: 1px solid var(--line-strong); border-radius: 9px; padding: 8px 4px; background: var(--doc); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11.5px; text-align: center; color: var(--fg); }
  .src-type:hover { background: var(--hover); }
  .src-type[aria-checked="true"] { border-color: var(--accent); background: var(--accent-wash); color: var(--fg-strong); box-shadow: 0 0 0 1px var(--accent); }
  .src-type svg.lucide { width: 18px; height: 18px; color: var(--fg-muted); }
  .src-type[aria-checked="true"] svg.lucide { color: var(--accent); }
  label.ck { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .swr { display: flex; align-items: center; gap: 10px; }
  .dry-sum { font-size: 14px; color: var(--fg-strong); font-weight: 600; line-height: 1.4; }
  .dry-bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--line); margin: 10px 0 4px; }
  .dry-bar i { display: block; height: 100%; }
  .dry-bar i + i { border-left: 1px solid var(--raised); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--fg-muted); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  .sec-h { font-size: 11px; font-weight: 650; color: var(--fg-faint); margin: 16px 0 6px; display: flex; align-items: center; gap: 6px; }
  .dl-row { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto auto; gap: 8px; font-size: 12px; padding: 3px 4px; align-items: center; border-radius: 5px; }
  .dl-row:hover { background: var(--hover); }
  .dl-row .p { font: 11.5px var(--face-code); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dl-row svg.lucide { width: 14px; height: 14px; color: var(--fg-muted); }
  .dl-row .btn.sm { height: 22px; font-size: 11.5px; padding: 0 7px; }
  .note { font-size: 12px; line-height: 1.5; padding: 8px 10px; border-radius: 8px; background: var(--inset); border: 1px solid var(--line); color: var(--fg-muted); }

  const collPath = (c) => (G.collections.find((x) => x.id === c) || { path: '' }).path.replace(/ \(.*\)$/, '');
  const ROWS = [];
  function normalise(base, extra) {

  /* ===== Page state ===== */
  const UI = Object.assign({ sort: 'modified', dir: 'desc', group: 'none', density: 'compact', preview: true, pvTab: 'preview',

  const saveUI = () => G.store.set('lib.ui', UI);
  const S = { scope: null, q: '', sel: new Set(), anchor: null, active: null, checkMode: false, flat: [], rows: [], closed: new Set(),
    state: null, sheet: null, reindex: null, dupMin: 85, ignored: new Set(), autoRel: true, scopeSort: null };

  const kindIcon = (k) => (G.kinds[k] || {}).icon || 'file-text';

  const kindName = (k) => (G.kinds[k] || {}).name || k;

  const collName = (id) => (collOf(id) || { name: id }).name;
  const fmtSize = (b) => (b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : b >= 1024 ? Math.round(b / 1024) + ' KB' : b + ' B');

  const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  /* ===== Path verification: what a document mentions, checked against a path base ===== */
  const baseOf = (r) => r.base || (CST[r.collection] || {}).base || '~';
  function pathsOf(r) {
    if (r._paths && r._pathsSrc === r.src) return r._paths;
    let out = [];
    if (!r.src) out = (r.declared || []).map(([p, line]) => ({ p, line }));

      const seen = new Set();

      else { const A = a.src.split('\n').map((l) => l.trim()).filter(Boolean), B = b.src.split('\n').map((l) => l.trim()).filter(Boolean); simCache[k] = (2 * lcsLen(A, B)) / (A.length + B.length); }
    }

  /* ===== Query language ===== */

      d = lineDiff(a.src, b.src); const adds = d.filter((x) => x[0] === '+').length, dels = d.filter((x) => x[0] === '-').length;
      const keep = new Set(); d.forEach((x, k) => { if (x[0] !== ' ') for (let c = k - 2; c <= k + 2; c++) keep.add(c); });
      let html = `<div class="banner" style="position:sticky;top:0;z-index:2">${ic('git-compare')}<span class="mono">${esc(a.rel)}</span><span class="faint">${esc(a.modified)}</span>${ic('arrow-right', 'ic-sm')}<span class="mono">${esc(b.rel)}</span><span class="faint">${esc(b.modified)}</span><span class="grow"></span><span class="chip ok">+${adds}</span><span class="chip err">−${dels}</span><span class="chip">${Math.round(similarity(a, b) * 100)}% similar</span></div>`;
      if (mode === 'unified') {
        let gap = false; html += '<div class="diffview" style="padding-bottom:20px">';
        d.forEach((x, k) => { if (!keep.has(k)) { if (!gap) { html += `<div class="hunk">${ic('fold-vertical', 'ic-sm')}unchanged lines</div>`; gap = true; } return; } gap = false; html += `<div class="dl ${x[0] === '+' ? 'add' : x[0] === '-' ? 'del' : ''}"><span>${x[2] || ''}</span><span>${x[3] || ''}</span><span>${x[0] === ' ' ? '' : x[0] === '-' ? '−' : '+'}</span><span>${esc(x[1]) || ' '}</span></div>`; });
        html += '</div>';
      } else {
        const pairs = []; let i = 0;
        while (i < d.length) { if (d[i][0] === ' ') { pairs.push([d[i], d[i]]); i++; continue; } const ds = [], as = []; while (i < d.length && d[i][0] === '-') ds.push(d[i++]); while (i < d.length && d[i][0] === '+') as.push(d[i++]); for (let k = 0; k < Math.max(ds.length, as.length); k++) pairs.push([ds[k] || null, as[k] || null]); }
        const ch = pairs.map((p) => !(p[0] && p[1] && p[0][0] === ' ')); const kp = new Set(); ch.forEach((c, k) => { if (c) for (let z = k - 2; z <= k + 2; z++) kp.add(z); });
        let gap = false; html += `<div class="sbs" style="padding-bottom:20px">`;
        pairs.forEach((p, k) => { if (!kp.has(k)) { if (!gap) { html += `<div class="hunk" style="grid-column:1/-1;display:flex">${ic('fold-vertical', 'ic-sm')}unchanged lines</div>`; gap = true; } return; } gap = false; const [l, r] = p; html += `<div class="${!l ? 'gap' : l[0] === '-' ? 'del' : ''}"><span>${l ? l[2] : ''}</span><span>${l ? esc(l[1]) || ' ' : ''}</span></div><div class="${!r ? 'gap' : r[0] === '+' ? 'add' : ''}"><span>${r ? r[3] : ''}</span><span>${r ? esc(r[1]) || ' ' : ''}</span></div>`; });
        html += '</div>';
      }
      api.$('#cmp').innerHTML = html; G.icons(api.$('#cmp'));
    };
    api.el.addEventListener('click', (e) => {
      const m = e.target.closest('[data-cm]'); if (m) { mode = m.dataset.cm; api.$$('[data-cm]').forEach((x) => x.setAttribute('aria-pressed', String(x === m))); return draw(); }
      if (e.target.closest('#cm-swap')) { [a, b] = [b, a]; return draw(); }
      if (e.target.closest('#cm-copy')) return G.copy(`--- ${a.rel}\n+++ ${b.rel}\n` + d.filter((x) => x[0] !== ' ').map((x) => x[0] + x[1]).join('\n'), { as: 'diff', clean: false });
      if (e.target.closest('#cm-merge')) { api.close(true); return mergeSheet([b.id, a.id]); }
      const ka = e.target.closest('#cm-keepA'), kb = e.target.closest('#cm-keepB');
      if (ka || kb) { const lose = ka ? b : a; api.close(); withUndo([lose.id], `Kept ${esc((ka ? a : b).rel)}; archived ${esc(lose.rel)}`, 'archive', () => (lose.status.archived = true)); }
    });
    draw();
  }

  /* ===== Routing: hash routes the shared sidebar links to ===== */
  function makeScope(type, id) {
    if (type === 'c') { const c = collOf(id); return c ? { type, id, key: 'c:' + id, name: c.name, icon: c.icon, desc: c.path } : null; }
    if (type === 'view') { const v = VIEWS[id]; return v ? { type, id, key: id, name: v.name, icon: v.icon, desc: v.desc, sort: v.sort } : null; }
    if (type === 'smart') { const s = SMART[id]; return s ? { type, id, key: 's:' + id, name: s.name, icon: s.icon, desc: s.desc, mode: s.mode } : null; }
    return null;
  }
  const scopeHash = (sc) => (sc ? (sc.type === 'c' ? 'c=' : sc.type === 'view' ? 'view=' : 'smart=') + sc.id : 'c=plans');
  function route() {
    const h = location.hash.slice(1); const p = new URLSearchParams(h);
    let sc = p.has('c') ? makeScope('c', p.get('c')) : p.has('view') ? makeScope('view', p.get('view')) : p.has('smart') ? makeScope('smart', p.get('smart')) : null;
    const wantAdd = h === 'add', wantHealth = h === 'health';
    if (!sc) sc = S.scope || makeScope('c', 'plans');
    if (S.sheet && !wantAdd && !wantHealth) S.sheet.close(true);
    if (!S.scope || S.scope.type !== sc.type || S.scope.id !== sc.id) {
      S.scope = sc; S.q = p.get('q') || ''; Q.value = S.q; S.sel.clear(); S.active = null; S.checkMode = false; S.state = null; S.closed.clear();
      S.scopeSort = sc.sort || null; S.autoRel = true; clearInterval(S.idxTimer);
      $$('.sidebar .nav-item').forEach((a) => { const on = a.dataset.nav === sc.key; a.classList.toggle('active', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
      document.title = sc.name + ' · Marxy';
      renderAll(); L.scrollTop = 0;
    }
    if (wantAdd) openAdd(); else if (wantHealth && !S.sheet) openHealth();
  }
  function renderAll() { compute(); renderHead(); renderBanner(); renderList(); }
  window.addEventListener('hashchange', route);

  /* ===== Commands (appear in the ⌘K palette) and page shortcuts ===== */
  const cmd = (id, name, icon, kbd, run) => G.command({ id, name, icon, kbd, group: 'Library', run });
  cmd('add-folder', 'Add source to library…', 'folder-plus', '⌥⌘O', () => openAdd());
  cmd('lib-reindex', 'Re-index this collection', 'refresh-cw', '', () => (S.scope.type === 'c' ? reindex() : G.toast('Open a collection to re-index it, or rebuild everything from Index health', { icon: 'info' })));
  cmd('lib-watch', 'Pause or resume watching', 'pause', '', () => (S.scope.type === 'c' && S.scope.id !== 'inbox' ? toggleWatch() : G.toast('Open a collection first', { icon: 'info' })));
  cmd('lib-settings', 'Collection settings…', 'settings-2', '', () => openSettings());
  cmd('lib-health', 'Index health…', 'activity', '', openHealth);
  cmd('lib-smart', 'New smart collection…', 'list-plus', '', () => openSmart(null, {}));
  cmd('lib-preview', 'Toggle preview pane', 'panel-right', '⌥⌘I', togglePreview);
  cmd('lib-search', 'Filter this view', 'search', '⌘F', focusSearch);
  cmd('lib-select-all', 'Select all files in view', 'check-check', '⌘A', selectAll);
  cmd('lib-clear', 'Clear selection', 'x', 'Esc', clearSel);
  cmd('lib-compare', 'Compare the two selected files', 'git-compare', '', () => { const s = selIds(); s.length === 2 ? compareSheet(s[0], s[1]) : G.toast('Select exactly two files', { icon: 'info' }); });
  cmd('lib-merge', 'Merge selected files…', 'git-merge', '', () => mergeSheet(selIds()));
  cmd('lib-archive', 'Archive selected', 'archive', '⌘⌫', () => archiveRows(selOrActive()));
  cmd('lib-read', 'Mark selected read or unread', 'mail-open', '⇧⌘U', () => toggleRead(selOrActive()));
  cmd('lib-dupes', 'Show near-duplicates', 'copy', '', () => (location.hash = 'smart=dupes'));
  cmd('lib-broken', 'Show broken paths or links', 'unlink', '', () => (location.hash = 'smart=broken'));
  cmd('lib-inbox', 'Go to Inbox', 'inbox', '', () => (location.hash = 'view=inbox'));
  cmd('lib-all', 'Show all files', 'files', '', () => (location.hash = 'view=all'));
  Object.entries(GROUPS).forEach(([k, l]) => cmd('lib-group-' + k, k === 'none' ? 'Ungroup' : 'Group by ' + l.toLowerCase(), 'group', '', () => { UI.group = k; saveUI(); renderList(); }));
  Object.entries(SORTS).filter(([k]) => k !== 'relevance').forEach(([k, l]) => cmd('lib-sort-' + k, 'Sort by ' + l.toLowerCase(), 'arrow-down-wide-narrow', '', () => pickSort(k)));
  cmd('lib-compact', 'Compact rows', 'rows-4', '', () => { UI.density = 'compact'; saveUI(); renderList(); });
  cmd('lib-comfortable', 'Comfortable rows', 'rows-2', '', () => { UI.density = 'comfortable'; saveUI(); renderList(); });

  document.addEventListener('keydown', (e) => {
    if (S.sheet || G.palette.el || $('.menu')) return;
    const mod = e.metaKey || e.ctrlKey; const k = e.key.toLowerCase(); const ae = document.activeElement;
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) || ae.isContentEditable;
    if ((mod && k === 'f' && !e.shiftKey) || (k === '/' && !typing && !mod)) { e.preventDefault(); focusSearch(); }
    else if (mod && e.altKey && e.code === 'KeyI') { e.preventDefault(); togglePreview(); }
    else if (mod && e.altKey && e.code === 'KeyO') { e.preventDefault(); openAdd(); }
    else if (mod && e.shiftKey && e.code === 'KeyU') { e.preventDefault(); toggleRead(selOrActive()); }
    else if (mod && e.code === 'BracketLeft') { e.preventDefault(); history.back(); }
    else if (mod && e.code === 'BracketRight') { e.preventDefault(); history.forward(); }
    else if (!typing && ae !== L && mod && k === 'a') { e.preventDefault(); selectAll(); }
    else if (!typing && ae !== L && k === 'escape' && S.sel.size) clearSel();
    else if (!typing && ae === document.body && ['arrowdown', 'arrowup', 'j', 'k'].includes(k)) { e.preventDefault(); L.focus(); }
  });

  /* ===== Boot ===== */
  const initial = (() => { const p = new URLSearchParams(location.hash.slice(1)); return p.has('c') ? 'c:' + p.get('c') : p.has('view') ? p.get('view') : p.has('smart') ? 's:' + p.get('smart') : 'c:plans'; })();
  G.boot({ active: initial, tree: false });
  Object.keys(SMART).filter((k) => !SMART[k].builtin).forEach(addSmartNav);
  route();
  let lastCols = '';
  const fit = () => { const ids = effCols().map((c) => c.id).join(); if (ids !== lastCols) { lastCols = ids; renderList(); } };
  const ro = new ResizeObserver(fit); ro.observe($('#results'));
  window.addEventListener('resize', fit);
  G.on('pref:sidebar', () => setTimeout(fit, 0));
  G.on('theme', () => { $('#pv').dataset.key = ''; renderStatus(); renderPreview(); });
  G.on('pref', ({ key }) => { if (/^(measures|measuresMode|tokenizer|kindMeasures)$/.test(key)) { renderList(); $('#pv').dataset.key = ''; renderPreview(); } if (['checkPaths', 'scale', 'typeset'].includes(key)) { $('#pv').dataset.key = ''; renderPreview(); } });
})();
</script>
