<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marxy Clipboard Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&family=Atkinson+Hyperlegible+Mono:ital,wght@0,200..800;1,200..800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/app.css">
<link rel="stylesheet" href="shared/lang-colors.css">
<style>
  /* ---------- Studio layout: history | workbench | side panel ---------- */
  .studio { flex: 1; min-height: 0; display: grid; grid-template-columns: 290px minmax(0, 1fr) 312px; position: relative; }
  .studio.no-right { grid-template-columns: 290px minmax(0, 1fr); }
  .studio.no-right .rpanel { display: none; }
  .col { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .hist { background: var(--side); border-right: 1px solid var(--line); }
  .bench { background: var(--doc); }
  .rpanel { background: var(--side); border-left: 1px solid var(--line); }
  .phead { height: 34px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 12px; border-bottom: 1px solid var(--line); font-size: 11.5px; color: var(--fg-muted); white-space: nowrap; min-width: 0; background: var(--doc); }
  .hist .phead, .rpanel .phead { background: var(--side); }
  .phead > b { color: var(--fg-strong); font-size: 12px; font-weight: 650; }
  .phead .tb-btn { height: 24px; min-width: 26px; padding: 0 6px; border-radius: 6px; }
  .phead .tb-btn.lbl-btn { padding: 0 8px; font-size: 12px; }
  .phead .seg button { height: 22px; padding: 0 8px; font-size: 12px; }
  .ministats { font-size: 11px; color: var(--fg-faint); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .ibtn { width: 22px; height: 22px; border: 0; background: none; border-radius: 5px; color: var(--fg-muted); display: inline-grid; place-items: center; padding: 0; flex: none; }
  .ibtn:hover { background: var(--press); color: var(--fg); }
  .ibtn[aria-pressed="true"] { color: var(--accent); background: var(--accent-wash); }
  .ibtn:disabled { opacity: 0.35; pointer-events: none; }
  .ibtn svg.lucide { width: 14px; height: 14px; }
  .btn:disabled { opacity: 0.45; pointer-events: none; }
  .btn .chev { width: 12px; height: 12px; color: var(--fg-faint); margin-left: -2px; }
  .linkish { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; font: inherit; }
  .switch.sm { width: 28px; height: 16px; }
  .switch.sm i::after { width: 12px; height: 12px; }
  .switch.sm input:checked + i::after { transform: translateX(12px); }
  .seg.sm button { height: 22px; padding: 0 8px; font-size: 11.5px; }
  .empty-sm { padding: 18px 14px; color: var(--fg-faint); font-size: 12px; line-height: 1.5; }
  .flash-sec { animation: flash 1.4s var(--ease); }
  #stackcount { font-size: 11.5px; }

  /* ---------- History ---------- */
  .h-top { flex: none; padding: 9px 10px 8px; display: flex; flex-direction: column; gap: 7px; border-bottom: 1px solid var(--line); }
  .h-search { position: relative; display: flex; }
  .h-search > svg { position: absolute; left: 8px; top: 6px; color: var(--fg-faint); pointer-events: none; }
  .h-search .field { width: 100%; padding-left: 28px; padding-right: 28px; background: var(--raised); }
  .h-search .ibtn { position: absolute; right: 3px; top: 3px; }
  .fchips { display: flex; flex-wrap: wrap; gap: 4px; }
  .fchip { height: 22px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); background: none; font-size: 11.5px; color: var(--fg-muted); display: inline-flex; gap: 5px; align-items: center; }
  .fchip:hover { background: var(--hover); }
  .fchip[aria-pressed="true"] { background: var(--accent-wash-strong); color: var(--fg-strong); border-color: transparent; }
  .fchip .n { font-size: 10.5px; color: var(--fg-faint); font-variant-numeric: tabular-nums; }
  .from-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--fg-faint); }
  .hlist { flex: 1; overflow: auto; padding: 0 6px 8px; outline: none; min-height: 0; }
  .hg { font-size: 11px; font-weight: 650; color: var(--fg-faint); padding: 9px 6px 3px; display: flex; gap: 6px; align-items: center; }
  .crow { display: grid; grid-template-columns: 14px 16px minmax(0, 1fr); gap: 7px; align-items: center; padding: 5px 6px; border-radius: 6px; min-height: 42px; position: relative; }
  .crow:hover, .crow.hot { background: var(--hover); }
  .hlist:focus-visible .crow.hot, .hlist:focus .crow.hot { box-shadow: inset 0 0 0 2px var(--accent); }
  .crow.sel { background: var(--accent-wash-strong); }
  .crow .ck { margin: 0; width: 13px; height: 13px; opacity: 0; }
  .crow:hover .ck, .crow.sel .ck, .hlist.multi .crow .ck, .crow .ck:focus-visible { opacity: 1; }
  .crow .tico { color: var(--fg-muted); display: grid; }
  .crow .mid { min-width: 0; }
  .crow .t { font-size: 12.5px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crow .s { font-size: 11px; color: var(--fg-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .crow .s .pinned { color: var(--accent); font-weight: 600; }
  .crow .s .flag { color: var(--fg-muted); }
  .crow mark, .hud mark { background: var(--mark); color: inherit; border-radius: 2px; box-shadow: 0 1px 0 var(--mark-edge); }
  .crow .acts { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); display: flex; gap: 1px; padding: 1px; border-radius: 7px; background: var(--raised); border: 1px solid var(--line); box-shadow: 0 1px 3px rgba(0,0,0,.08); opacity: 0; pointer-events: none; }
  .crow:hover .acts, .hlist:focus .crow.hot .acts { opacity: 1; pointer-events: auto; }
  .crow.skip { min-height: 30px; }
  .crow.skip .t { color: var(--fg-faint); font-style: italic; font-size: 12px; }
  .crow.skip .tico { color: var(--fg-faint); }
  .hempty { padding: 24px 12px; text-align: center; color: var(--fg-faint); font-size: 12px; line-height: 1.6; }
  .hprev { flex: none; height: 210px; display: flex; flex-direction: column; border-top: 1px solid var(--line); background: var(--doc); min-height: 0; }
  .hprev .pv-meta { flex: none; padding: 6px 10px 6px 12px; display: flex; flex-wrap: wrap; gap: 3px 10px; align-items: center; font-size: 11px; color: var(--fg-muted); border-bottom: 1px solid var(--line); }
  .hprev .pv-meta > span { display: inline-flex; gap: 4px; align-items: center; }
  .hprev .uti { font-family: var(--face-code); font-size: 10.5px; color: var(--fg-faint); }
  .hprev pre { flex: 1; margin: 0; padding: 8px 12px; overflow: auto; font: 11.5px/1.55 var(--face-code); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg); min-height: 0; }
  .pv-note { flex: none; display: flex; gap: 6px; align-items: center; padding: 3px 6px 3px 12px; font-size: 11.5px; color: var(--fg); background: var(--accent-wash); border-bottom: 1px solid var(--line); }
  .pv-note .grow { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pv-note svg { color: var(--accent); }
  .imgph { margin: 10px 12px 6px; height: 74px; border: 1px dashed var(--edge); border-radius: 6px; display: flex; gap: 8px; align-items: center; justify-content: center; color: var(--fg-muted); font-size: 11.5px; background: var(--inset); }
  .pv-ocr { padding: 0 12px 8px; font-size: 12px; overflow: auto; }
  .pv-ocr div { font-family: var(--face-code); font-size: 11.5px; color: var(--fg); margin-top: 4px; }
  .pv-empty { padding: 20px; color: var(--fg-faint); text-align: center; font-size: 12px; }
  .hpol { flex: none; display: flex; gap: 8px; align-items: flex-start; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 11px; line-height: 1.45; color: var(--fg-muted); }
  .hpol > svg { color: var(--ok); margin-top: 1px; }
  .hpol code { font-family: var(--face-code); font-size: 10.5px; }
  .hselbar { flex: none; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 7px 8px; border-top: 1px solid var(--line); background: var(--accent-wash); }
  .hselbar b { font-size: 12px; margin-right: auto; padding-left: 4px; color: var(--fg-strong); }
  .hselbar .btn.sm { padding: 0 7px; }

  /* ---------- Workbench ---------- */
  .in-wrap { flex: none; display: flex; flex-direction: column; height: var(--in-h, 236px); min-height: 110px; }
  .bench[data-mode="compare"] .in-wrap, .bench[data-mode="compare"] .hsplit { display: none; }
  #edhost { flex: 1; display: flex; min-height: 0; min-width: 0; }
  #edhost .ed-hl, #edhost .ed-ta { padding-bottom: 28px; }
  .srcchip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 7px 0 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--raised); color: var(--fg); font-size: 11.5px; max-width: 250px; min-width: 0; }
  .srcchip span { overflow: hidden; text-overflow: ellipsis; }
  .srcchip svg.lucide { width: 13px; height: 13px; color: var(--fg-muted); }
  .srcchip .chev { width: 11px; height: 11px; color: var(--fg-faint); }
  .srcchip:hover { background: var(--hover); }
  .hsplit { flex: none; height: 7px; cursor: row-resize; background: var(--win); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); position: relative; }
  .hsplit::after { content: ""; position: absolute; left: 50%; top: 2px; width: 30px; margin-left: -15px; height: 1px; background: var(--edge); box-shadow: 0 2px 0 var(--edge); opacity: 0.6; }
  .hsplit:hover, .hsplit:focus-visible { background: var(--accent-wash-strong); outline: none; }
  .mode { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .pipe { flex: none; display: flex; flex-direction: column; max-height: 46%; border-bottom: 1px solid var(--line); }
  .pname { font-size: 12px; color: var(--fg); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .pname em { font-style: normal; color: var(--warn); font-size: 11px; margin-left: 4px; }
  .steps { overflow: auto; padding: 4px 8px 6px; min-height: 0; }
  .step { display: grid; grid-template-columns: 14px 16px 16px minmax(0, 1fr) auto auto auto; gap: 7px; align-items: center; min-height: 34px; padding: 3px 6px; border-radius: 7px; position: relative; }
  .step:hover { background: var(--hover); }
  .step:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .step.pv { background: var(--accent-wash-strong); }
  .step.off .sname, .step.off .sico, .step.off .no { opacity: 0.55; }
  .step.off .sname .t { text-decoration: line-through; text-decoration-color: var(--fg-faint); }
  .step .grip { color: var(--fg-faint); cursor: grab; display: grid; }
  .step .no { font: 600 11px var(--face-chrome); color: var(--fg-faint); text-align: right; font-variant-numeric: tabular-nums; }
  .step .sico { color: var(--fg-muted); display: grid; }
  .step .sname { min-width: 0; display: flex; align-items: baseline; gap: 8px; overflow: hidden; }
  .step .sname .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; color: var(--fg); }
  .step .sname .g { font-size: 11px; color: var(--fg-faint); white-space: nowrap; }
  .step .sname .g.warnc { color: var(--warn); }
  .step .sacts { display: flex; gap: 1px; }
  .delta { font: 500 11px var(--face-chrome); font-variant-numeric: tabular-nums; color: var(--fg-faint); min-width: 52px; text-align: right; white-space: nowrap; }
  .delta.minus { color: var(--ok); }
  .delta.plus { color: var(--fg-muted); }
  .delta.err { color: var(--err); font-weight: 650; }
  .step.drop-before::before, .step.drop-after::after { content: ""; position: absolute; left: 6px; right: 6px; height: 2px; background: var(--accent); border-radius: 2px; }
  .step.drop-before::before { top: -1px; }
  .step.drop-after::after { bottom: -1px; }
  .step.dragging { opacity: 0.4; }
  .addstep { display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; margin-top: 2px; padding: 0 8px 0 28px; border: 1px dashed var(--line-strong); border-radius: 7px; background: none; color: var(--fg-muted); font-size: 12px; }
  .addstep:hover { background: var(--hover); color: var(--fg); border-color: var(--edge); }
  .addstep .kbd { margin-left: auto; }
  .pipe-empty { padding: 8px 6px 4px; font-size: 12px; color: var(--fg-muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; line-height: 1.5; }
  .out { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .ostats { flex: none; display: flex; flex-wrap: wrap; gap: 3px 12px; align-items: center; padding: 5px 12px; font-size: 11.5px; color: var(--fg-muted); border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .ostats b { color: var(--fg-strong); font-weight: 600; }
  .ostats .save { color: var(--ok); font-weight: 600; }
  .pv-banner { flex: none; display: flex; gap: 8px; align-items: center; padding: 4px 8px 4px 12px; background: var(--accent-wash); border-bottom: 1px solid var(--line); font-size: 12px; }
  .pv-banner svg { color: var(--accent); }
  .out-body { flex: 1; overflow: auto; min-height: 0; outline: none; }
  .out-body pre.txt { margin: 0; padding: 10px 14px 24px; font: calc(12.5px * var(--user-scale))/1.6 var(--face-code); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg); tab-size: 4; }
  .out-body .doc { padding: 14px 20px 30px; font-size: calc(15px * var(--user-scale)); }
  .out-body .doc > * { max-width: 72ch; margin-left: 0; }
  .ofoot { flex: none; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 7px 10px; border-top: 1px solid var(--line); background: var(--win); }
  .udiff { font: 12px/1.6 var(--face-code); padding-bottom: 24px; }
  .udiff .dl { display: grid; grid-template-columns: 3em 3em 1.4em minmax(0, 1fr); white-space: pre-wrap; overflow-wrap: anywhere; }
  .udiff .dl > span:nth-child(-n+2) { color: var(--fg-faint); text-align: right; padding-right: 8px; user-select: none; }
  .udiff .dl.add { background: var(--add-wash); }
  .udiff .dl.del { background: var(--del-wash); }
  .udiff .dl.add > span:nth-child(3) { color: var(--ok); font-weight: 700; }
  .udiff .dl.del > span:nth-child(3) { color: var(--err); font-weight: 700; }
  .hunk { color: var(--fg-muted); background: var(--inset); padding: 3px 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font: 11.5px var(--face-chrome); display: flex; gap: 6px; align-items: center; }

  /* Compare */
  .cmp-ctl { flex: none; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12px; }
  .cmp-ctl label { display: inline-flex; gap: 6px; align-items: center; }
  .cmp-ctl select.field { height: 26px; max-width: 230px; font-size: 12px; }
  .cmp-heads { display: grid; grid-template-columns: 1fr 1fr; position: sticky; top: 0; z-index: 1; background: var(--doc); border-bottom: 1px solid var(--line); font-size: 11.5px; color: var(--fg-muted); }
  .cmp-heads > div { padding: 5px 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmp-heads > div + div { border-left: 1px solid var(--line); }
  .sbs { display: grid; grid-template-columns: 2.8em minmax(0, 1fr) 2.8em minmax(0, 1fr); font: 12px/1.55 var(--face-code); padding-bottom: 24px; }
  .sbs > span { padding: 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1.55em; }
  .sbs > .ln { color: var(--fg-faint); text-align: right; padding: 0 6px 0 0; user-select: none; }
  .sbs > .ln.r { border-left: 1px solid var(--line); }
  .sbs .del { background: var(--del-wash); }
  .sbs .add { background: var(--add-wash); }
  .sbs .gap { background: var(--inset); }
  .sbs del { text-decoration: none; background: color-mix(in srgb, var(--err) 26%, transparent); border-radius: 2px; }
  .sbs ins { text-decoration: none; background: color-mix(in srgb, var(--ok) 26%, transparent); border-radius: 2px; }
  .sbs .fold { grid-column: 1 / -1; padding: 3px 12px; font: 11.5px var(--face-chrome); color: var(--fg-muted); background: var(--inset); border: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: left; display: flex; gap: 6px; align-items: center; }
  .sbs .fold:hover { color: var(--fg); background: var(--hover); }

  /* ---------- Side panel ---------- */
  .rpanel .insp-tabs { padding: 6px 6px 0; gap: 0; }
  .rpanel .insp-tabs button { padding: 6px 8px 8px; font-size: 12px; flex: 1; justify-content: center; white-space: nowrap; }
  .rpanel .insp-tabs .n { font-size: 10.5px; color: var(--fg-faint); font-variant-numeric: tabular-nums; }
  .rp-intro { font-size: 11.5px; color: var(--fg-muted); line-height: 1.45; margin: 0 0 8px; }
  .ctl-row { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 6px; }
  .ctl-row > .lbl { color: var(--fg-muted); min-width: 70px; }
  .ctl-row select.field, .ctl-row input.field { height: 24px; font-size: 12px; flex: 1; }
  .ct { padding: 8px 2px 9px; border-top: 1px solid var(--line); }
  .ct-h { display: flex; align-items: center; gap: 7px; }
  .ct-h > svg { color: var(--fg-muted); }
  .ct-h .nm { flex: 1; min-width: 0; }
  .ct-h .nm b { font-weight: 600; font-size: 12.5px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); }
  .ct-h .nm small { display: block; font-size: 11px; color: var(--fg-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ct .cpv { margin: 6px 0 0; padding: 5px 8px; max-height: 5.2em; overflow: hidden; background: var(--inset); border: 1px solid var(--line); border-radius: 6px; font: 11px/1.5 var(--face-code); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg-muted); cursor: default; }
  .ct.open .cpv { max-height: 18em; overflow: auto; color: var(--fg); }
  .ct .cpv.rich { font: 12px/1.45 var(--face-sans); white-space: normal; color: var(--fg); }
  .ct .cpv.rich :is(h1, h2, h3, h4) { font-size: 12.5px; margin: 4px 0 2px; }
  .ct .cpv.rich :is(p, ul, ol, table, pre) { margin: 2px 0; }
  .ct .cpv.rich ul, .ct .cpv.rich ol { padding-left: 16px; }
  .ct .cpv.rich :is(.blk-handle, .cb-head) { display: none; }
  .ct .uti { margin-top: 4px; font: 10.5px var(--face-code); color: var(--fg-faint); }
  .pl, .sn { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 4px 6px 8px; border-radius: 7px; }
  .pl:hover, .sn:hover { background: var(--hover); }
  .pl.sel, .sn.sel { background: var(--accent-wash-strong); }
  .pl:focus-visible, .sn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .pl > svg, .sn > svg { color: var(--fg-muted); }
  .pl .mid, .sn .mid { min-width: 0; }
  .pl .t, .sn .t { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; color: var(--fg); }
  .pl .flow, .sn .flow { font-size: 11px; color: var(--fg-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .pl .r, .sn .r { display: flex; gap: 2px; align-items: center; }
  .pl .r .kbd { margin-right: 2px; }
  .detail { margin: 4px 0 10px; padding: 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--doc); display: flex; flex-direction: column; gap: 9px; font-size: 12px; }
  .detail .field { height: 26px; font-size: 12.5px; }
  .detail select.field { height: 24px; font-size: 12px; max-width: 170px; }
  .detail textarea.field { width: 100%; min-height: 104px; font: 12px/1.5 var(--face-code); resize: vertical; }
  .opt { display: flex; align-items: center; gap: 10px; }
  .detail .row { flex-wrap: wrap; gap: 6px; }
  .opt > .grow { min-width: 0; }
  .opt small { display: block; color: var(--fg-faint); font-size: 11px; line-height: 1.35; }
  .keyrec { min-width: 96px; justify-content: center; font-variant-numeric: tabular-nums; }
  .keyrec.rec { border-color: var(--accent); background: var(--accent-wash); color: var(--accent); }
  .mini-steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; }
  .mini-steps li { display: flex; gap: 7px; align-items: center; font-size: 12px; }
  .mini-steps li .n { width: 14px; text-align: right; color: var(--fg-faint); font-size: 11px; font-variant-numeric: tabular-nums; }
  .mini-steps li svg { color: var(--fg-muted); }

  .collect { display: flex; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 8px; background: var(--hover); font-size: 12px; margin-bottom: 8px; }

  .srow { display: grid; grid-template-columns: 14px 16px minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 4px 4px 4px 6px; border-radius: 6px; min-height: 34px; position: relative; }
  .srow:hover { background: var(--hover); }

  .srow.drop-after::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: -1px; height: 2px; background: var(--accent); }

  /* ---------- Step picker ---------- */
  .picker { position: fixed; z-index: 55; width: 640px; max-width: calc(100vw - 24px); background: var(--raised); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; animation: pop .12s var(--ease); }

  .pk-prev { border-left: 1px solid var(--line); padding: 10px 12px; overflow: hidden; background: var(--doc); font-size: 12px; display: flex; flex-direction: column; gap: 6px; min-height: 0; }

  /* ---------- Sheets ---------- */
  .sheet-scrim { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.22); display: flex; justify-content: center; align-items: flex-start; padding-top: 5vh; animation: fade .12s; }

  .sheet.wide { width: min(940px, calc(100vw - 40px)); }
  .sheet-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }

  .frow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .frow small { display: block; color: var(--fg-faint); font-size: 11.5px; line-height: 1.45; margin-top: 2px; }

  .chiplist .chip { height: 22px; }

  .eg { font: 11.5px/1.5 var(--face-code); background: var(--inset); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; overflow-wrap: anywhere; color: var(--fg-muted); width: 100%; }
  .eg b { color: var(--fg); font-weight: 500; }
  .keys { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; padding-top: 4px; }
  .keys h3 { margin-top: 14px; }
  .krow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .krow > span:last-child { display: inline-flex; gap: 3px; align-items: center; color: var(--fg-faint); white-space: nowrap; }

  /* ---------- Clipboard ring HUD (mock over another app) ---------- */
  .hud-scrim { position: fixed; inset: 0; z-index: 72; background: rgba(0,0,0,.34); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; animation: fade .12s; outline: none; }
  .hud-cap { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--fg); background: var(--raised); border: 1px solid var(--line-strong); border-radius: 999px; padding: 4px 6px 4px 14px; box-shadow: var(--shadow); max-width: calc(100vw - 40px); }

  .fa-bar { height: 40px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--win); font-size: 12.5px; }
  .fa-bar .lights { padding: 0; }
  .fa-bar b { color: var(--fg-strong); }
  .fa-msgs { flex: 1; padding: 16px 20px; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; overflow: auto; font-size: 13px; }
  .fa-msg { display: grid; grid-template-columns: 32px 1fr; gap: 10px; }
  .fa-av { width: 32px; height: 32px; border-radius: 7px; background: var(--accent-wash-strong); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
  .fa-msg b { font-size: 12.5px; color: var(--fg-strong); }

  .hud-in { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-bottom: 1px solid var(--line); }
  .hud-in > svg { color: var(--fg-faint); }
  .hud-in input { flex: 1; border: 0; background: none; outline: none; font-size: 15px; color: var(--fg-strong); }
  .hud-scope { display: flex; gap: 4px; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  .hud-scope button { border: 1px solid var(--line); background: none; border-radius: 999px; height: 22px; padding: 0 9px; font-size: 11.5px; color: var(--fg-muted); display: inline-flex; gap: 5px; align-items: center; }
  .hud-scope button[aria-pressed="true"] { background: var(--accent-wash-strong); color: var(--fg-strong); border-color: transparent; }
  .hud-list { max-height: 296px; overflow: auto; padding: 4px; }
  .hrow { display: grid; grid-template-columns: 22px 16px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 7px; font-size: 12.5px; color: var(--fg); }
  .hrow .kbd { min-width: 18px; height: 17px; font-size: 10.5px; }
  .hrow > svg { color: var(--fg-muted); }
  .hrow .t { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .hrow .s { font-size: 11px; color: var(--fg-faint); white-space: nowrap; }
  .hrow.hot { background: var(--accent); color: var(--accent-fg); }
  .hrow.hot .s, .hrow.hot > svg { color: inherit; }
  .hrow.hot .kbd { background: transparent; color: inherit; border-color: currentColor; }
  .hrow.hot mark { background: transparent; color: inherit; text-decoration: underline; box-shadow: none; }
  .hud-prev { border-top: 1px solid var(--line); padding: 7px 12px; font: 11px/1.5 var(--face-code); color: var(--fg-muted); max-height: 82px; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }
  .hud-foot { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 6px 12px; border-top: 1px solid var(--line); font-size: 11px; color: var(--fg-muted); }
  .hud-foot span { display: inline-flex; gap: 4px; align-items: center; }
  .hud-foot .kbd { height: 16px; min-width: 16px; font-size: 10px; }

  @media (max-width: 1240px) { .studio { grid-template-columns: 270px minmax(0, 1fr) 296px; } }
  @media (max-width: 1100px) {
    .toolbar .tlbl, .toolbar .tb-title { display: none; }
    .studio, .studio.no-right { grid-template-columns: 260px minmax(0, 1fr); }
    .rpanel { position: absolute; right: 0; top: 0; bottom: 0; width: 320px; z-index: 20; box-shadow: var(--shadow); }
  }
  .later-note { flex: none; display: flex; align-items: center; gap: 8px; margin: 6px 14px 0; padding: 5px 10px; background: var(--inset); border: 1px solid var(--line); border-radius: 6px; color: var(--fg-muted); font-size: 12px; }
  .later-note svg { width: 14px; height: 14px; flex: none; }
</style>

<body>
<div class="win">
  <aside class="sidebar" data-slot="sidebar"></aside>
  <div class="main">
    <div class="later-note" role="note"><i data-lucide="info"></i><span><b>Descoped for now.</b> Good ideas, too much scope; copying lives in the reading and source views instead. This page is kept for reference.</span></div>
    <header class="toolbar" role="toolbar" aria-label="Clipboard studio toolbar">
      <div class="tb-title"><b>Clipboard studio</b><small id="t-sub">Transform and copy anywhere</small></div>
      <div class="seg" role="group" aria-label="Workbench mode" id="modeseg">
        <button data-mode="pipeline" title="Build a transform pipeline (⌥⌘1)"><i data-lucide="workflow"></i>Pipeline</button>
        <button data-mode="compare" title="Compare two texts (⌥⌘2)"><i data-lucide="git-compare"></i>Compare</button>
      </div>
      <div class="tb-space"></div>
      <div class="tb-group">
        <button class="tb-btn lbl-btn" id="b-paste" title="Load the current clipboard into the workbench input"><i data-lucide="clipboard-paste"></i><span class="tlbl">Paste in</span></button>
        <button class="tb-btn" id="b-runclip" title="Run the pipeline on the clipboard and copy the result (⌘R)" aria-label="Run pipeline on clipboard"><i data-lucide="play"></i></button>
        <button class="tb-btn" id="b-hist" title="History: pause, ignore next copy, clear" aria-label="History options"><i data-lucide="history"></i><i data-lucide="chevron-down" class="chev"></i></button>
      </div>
      <div class="tb-group">
        <button class="tb-btn" id="b-stack" title="Collect mode: copies stack up (⌥⌘K)" aria-label="Collect mode"><i data-lucide="layers"></i><span id="stackcount" class="num" hidden>0</span></button>
        <button class="tb-btn" id="b-hud" title="Clipboard ring, the floating panel (⌥⌘V)" aria-label="Clipboard ring"><i data-lucide="picture-in-picture-2"></i></button>
        <button class="tb-btn" id="b-rules" title="Clipboard rules (⌥⌘R)" aria-label="Clipboard rules"><i data-lucide="shield-check"></i></button>
        <button class="tb-btn" id="b-keys" title="Keyboard map (⌘?)" aria-label="Keyboard map"><i data-lucide="keyboard"></i></button>
        <button class="tb-btn" id="b-right" title="Copy formats, pipelines, stack and snippets (⌥⌘I)" aria-label="Side panel"><i data-lucide="panel-right"></i></button>
      </div>
    </header>

    <div class="studio" id="studio">
      <!-- Clipboard history -->
      <section class="hist col" aria-label="Clipboard history">
        <div class="phead"><b>History</b><span class="ministats" id="h-count"></span><span class="grow"></span>
          <button class="tb-btn" id="h-multi" title="Select several clips (or ⌘-click, ⇧-click)" aria-label="Select several" aria-pressed="false"><i data-lucide="list-checks"></i></button>
          <button class="tb-btn" id="h-prevbtn" title="Preview pane (Space)" aria-label="Preview pane" aria-pressed="true"><i data-lucide="panel-bottom"></i></button>
          <button class="tb-btn" id="h-menu" title="History options" aria-label="History options"><i data-lucide="ellipsis"></i></button>
        </div>
        <div class="h-top">
          <div class="h-search"><i data-lucide="search" class="ic-sm"></i><input class="field" id="h-q" placeholder="Search clips   app:  type:  is:pinned" aria-label="Search clipboard history" spellcheck="false" autocomplete="off"><button class="ibtn" id="h-qx" title="Clear search (esc)" aria-label="Clear search" hidden><i data-lucide="x"></i></button></div>
          <div class="fchips" id="fchips" role="group" aria-label="Filter by type"></div>
          <div class="from-row"><span>From</span><div class="seg sm" role="group" aria-label="Filter by source" id="fromseg">
            <button data-from="any">Any app</button><button data-from="marxy">Marxy</button><button data-from="other">Other apps</button>
          </div></div>
        </div>
        <div class="hlist" id="hlist" role="listbox" aria-label="Clips, newest first" aria-multiselectable="true" tabindex="0"></div>
        <div class="hselbar" id="hselbar" hidden></div>
        <div class="hprev" id="hprev" aria-label="Clip preview" role="region"></div>
        <div class="hpol" id="hpol"></div>
      </section>

      <!-- Workbench -->
      <section class="bench col" id="bench" data-mode="pipeline" aria-label="Workbench">
        <div class="in-wrap" id="in-wrap">
          <div class="phead">
            <b>Input</b>
            <button class="srcchip" id="in-src" title="Where the input came from. Click to load something else." aria-haspopup="menu"></button>
            <span class="grow"></span>
            <span class="ministats" id="in-stats"></span>
            <button class="tb-btn" id="in-paste" title="Replace the input with the clipboard" aria-label="Paste the clipboard in"><i data-lucide="clipboard-paste"></i></button>
            <button class="tb-btn" id="in-undo" title="Undo (⌘Z)" aria-label="Undo"><i data-lucide="undo-2"></i></button>
            <button class="tb-btn on" id="in-wrap-btn" title="Soft wrap" aria-label="Soft wrap" aria-pressed="true"><i data-lucide="wrap-text"></i></button>
            <button class="tb-btn" id="in-clear" title="Clear the input" aria-label="Clear the input"><i data-lucide="eraser"></i></button>
          </div>
          <div id="edhost"></div>
        </div>
        <div class="hsplit" id="hsplit" role="separator" aria-orientation="horizontal" aria-label="Resize the input" tabindex="0"></div>

        <!-- Pipeline mode -->
        <div class="mode" id="m-pipe">
          <div class="pipe">
            <div class="phead">
              <b>Pipeline</b><span class="pname" id="pname"></span><span class="grow"></span>
              <button class="tb-btn lbl-btn" id="add-step" title="Add a step (⇧⌘A)"><i data-lucide="plus"></i>Add step</button>

              <button class="tb-btn" id="p-saveas" title="Save as a new pipeline (⇧⌘S)" aria-label="Save as new pipeline"><i data-lucide="files"></i></button>
              <button class="tb-btn" id="p-clear" title="Remove every step" aria-label="Remove every step"><i data-lucide="eraser"></i></button>
            </div>
            <div class="steps" id="steps" role="list" aria-label="Pipeline steps, in order"></div>
          </div>
          <div class="out">
            <div class="phead">
              <b>Output</b>
              <div class="seg" role="group" aria-label="Output view (⌘D cycles)" id="viewseg">
                <button data-v="before" title="The text going in">Before</button>
                <button data-v="after" title="The result">After</button>
                <button data-v="diff" title="Line diff, before to after">Diff</button>
                <button data-v="rendered" title="The result rendered as Markdown">Rendered</button>
              </div>
              <span class="grow"></span>
            </div>
            <div id="pv-banner"></div>
            <div class="ostats" id="ostats"></div>
            <div class="out-body" id="out-body" tabindex="0" aria-label="Pipeline output"></div>
            <div class="ofoot">
              <button class="btn sm primary" id="o-copy" title="Copy the output (⌘↵)"><i data-lucide="copy"></i>Copy</button>
              <button class="btn sm" id="o-copyas" title="Copy in another format" aria-haspopup="menu">Copy as<i data-lucide="chevron-down" class="chev"></i></button>
              <button class="btn sm" id="o-replace" title="Put the output on the clipboard in place of the newest history item (⌥⌘↵)"><i data-lucide="clipboard-check"></i>Replace clipboard</button>
              <span class="grow"></span>
              <button class="btn sm ghost" id="o-use" title="Use the output as the new input (⌘U)"><i data-lucide="corner-left-up"></i>As input</button>
              <button class="btn sm" id="o-send" title="New document, Inbox, write back, stack, snippet, share" aria-haspopup="menu"><i data-lucide="send"></i>Send to<i data-lucide="chevron-down" class="chev"></i></button>
            </div>
          </div>
        </div>

        <!-- Compare mode -->
        <div class="mode" id="m-cmp" hidden>
          <div class="phead"><b>Compare</b><span class="ministats" id="cmp-stats"></span><span class="grow"></span>
            <button class="tb-btn lbl-btn" id="cmp-swap" title="Swap left and right"><i data-lucide="arrow-left-right"></i>Swap</button>
            <button class="tb-btn lbl-btn" id="cmp-copy" title="Copy as a unified diff"><i data-lucide="copy"></i>Copy diff</button>
            <button class="tb-btn lbl-btn" id="cmp-use" title="Load the right side into the workbench input"><i data-lucide="corner-left-up"></i>Right as input</button>
          </div>
          <div class="cmp-ctl">
            <label>Left <select class="field" id="cmp-a" aria-label="Left text"></select></label>
            <label>Right <select class="field" id="cmp-b" aria-label="Right text"></select></label>
            <label><input type="checkbox" id="cmp-ws">Ignore whitespace</label>
            <label><input type="checkbox" id="cmp-ic">Ignore case</label>
          </div>
          <div class="out-body" id="cmp-body" tabindex="0" aria-label="Side-by-side diff"></div>
        </div>
      </section>

      <!-- Side panel -->
      <aside class="rpanel col" id="rpanel" aria-label="Copy formats, pipelines, stack and snippets">
        <div class="insp-tabs" role="tablist" id="rtabs">
          <button role="tab" data-rt="copy" id="rt-copy" aria-controls="rp-copy">Copy as</button>
          <button role="tab" data-rt="pipelines" id="rt-pipelines" aria-controls="pipelines">Pipelines</button>
          <button role="tab" data-rt="stack" id="rt-stack" aria-controls="rp-stack">Stack <span class="n" id="rt-stack-n"></span></button>
          <button role="tab" data-rt="snippets" id="rt-snippets" aria-controls="rp-snippets">Snippets</button>
        </div>
        <div class="insp-body" id="rp-copy" role="tabpanel" aria-labelledby="rt-copy"></div>
        <div class="insp-body" id="pipelines" role="tabpanel" aria-labelledby="rt-pipelines" hidden></div>
        <div class="insp-body" id="rp-stack" role="tabpanel" aria-labelledby="rt-stack" hidden></div>
        <div class="insp-body" id="rp-snippets" role="tabpanel" aria-labelledby="rt-snippets" hidden></div>
      </aside>
    </div>
    <footer class="statusbar" id="status"></footer>
  </div>
</div>

(function () {

  function renderSteps() {

        <button class="btn sm" data-quick="strip-bold">${ic('bold')}Remove bold</button>

    }

        : `<span class="delta ${d < 0 ? 'minus' : d > 0 ? 'plus' : ''}" title="${fmt((prev.out || '').length)} → ${fmt((r.out || '').length)} chars · ${(r.ms || 0).toFixed(2)} ms">${d === 0 ? '±0' : (d > 0 ? '+' : '−') + fmt(Math.abs(d))}</span>`;
      const note = r.err ? '' : st.on && r.out === '' ? '<span class="g warnc">empty result</span>' : st.on && d === 0 && !r.skipped ? '<span class="g">no change</span>' : '';
      return `<div class="step${st.on ? '' : ' off'}${S.stepPreview === k ? ' pv' : ''}" role="listitem" tabindex="0" draggable="true" data-k="${k}" aria-label="Step ${k + 1}: ${esc(t.name)}${st.on ? '' : ', skipped'}">
        <span class="grip" aria-hidden="true" title="Drag to reorder">${ic('grip-vertical', 'ic-sm')}</span>

        <span class="sname"><span class="t" title="${esc(t.desc || t.name)}">${esc(t.name)}</span><span class="g">${esc(t.group)}</span>${note}</span>
        ${delta}
        <label class="switch sm" title="Run or skip this step (⌘E)"><input type="checkbox" data-sa="on" ${st.on ? 'checked' : ''} aria-label="Run ${esc(t.name)}"><i></i></label>
        <span class="sacts">
          <button class="ibtn" data-sa="peek" aria-pressed="${S.stepPreview === k}" title="Show the output after this step (↵)" aria-label="Preview after step ${k + 1}">${ic('eye')}</button>
          <button class="ibtn" data-sa="up" ${k === 0 ? 'disabled' : ''} title="Move up (⌥↑)" aria-label="Move up">${ic('chevron-up')}</button>
          <button class="ibtn" data-sa="down" ${k === steps.length - 1 ? 'disabled' : ''} title="Move down (⌥↓)" aria-label="Move down">${ic('chevron-down')}</button>
          <button class="ibtn" data-sa="rm" title="Remove (⌫)" aria-label="Remove step">${ic('x')}</button>

    }).join('') + `<button class="addstep" data-add>${ic('plus', 'ic-sm')}Add a step…<span class="kbd">⇧⌘A</span></button>`;
    G.icons(box);
  }
  const focusStep = (k) => { const r = $(`#steps .step[data-k="${k}"]`); if (r) r.focus(); };
  function addStep(tid, at) {
    const k = at == null ? S.pipe.steps.length : at;

    const a = e.target.closest('button[data-sa]'); if (!a) return;
    const act = a.dataset.sa;
    if (act === 'peek') { S.stepPreview = S.stepPreview === k ? null : k; recompute(); const again = $(`#steps .step[data-k="${k}"] [data-sa="peek"]`); if (again) again.focus(); }
    else if (act === 'up') moveStep(k, k - 1);

  function savePipe() {

  /* Step picker: searchable, grouped, with a live preview of the step applied to the current output */
  let picker = null;
  function closePicker() { if (picker) { picker.remove(); picker = null; } }
  function openPicker(anchor) {
    closePicker(); G.closeMenu();
    if (S.mode !== 'pipeline') setMode('pipeline');
    const box = G.el(`<div class="picker" role="dialog" aria-label="Add a transform step">
      <div class="pk-in">${ic('search')}<input placeholder="Search ${G.transforms.length} transforms" aria-label="Search transforms" aria-controls="pk-list" spellcheck="false" autocomplete="off"><span class="kbd">esc</span></div>
      <div class="pk-body"><div class="pk-list" id="pk-list" role="listbox" aria-label="Transforms"></div><div class="pk-prev" aria-live="polite"></div></div>
      <div class="pk-foot"><span><span class="kbd">↑</span><span class="kbd">↓</span> move</span><span><span class="kbd">↵</span> add at the end</span><span><span class="kbd">⌥</span><span class="kbd">↵</span> add and keep open</span><span>Esc closes</span></div>
    </div>`);
    document.body.appendChild(box); picker = box; G.icons(box);

    const w = box.offsetWidth, h = box.offsetHeight;
    box.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left)) + 'px';
    box.style.top = (r.bottom + h + 8 < innerHeight ? r.bottom + 6 : Math.max(8, r.top - h - 6)) + 'px';
    const input = $('input', box), list = $('.pk-list', box), prev = $('.pk-prev', box);
    let hot = 0, flat = [];
    const base = finalOut();
    const render = () => {
      const q = input.value.trim(); flat = []; let html = '';
      ['Clean', 'Convert', 'Lines', 'Case', 'Extract'].forEach((g) => {
        let items = G.transforms.filter((t) => t.group === g);
        if (q) items = items.map((t) => ({ t, m: G.fuzzy(q, t.name + ' ' + (t.desc || '')) })).filter((x) => x.m).sort((a, b) => b.m.score - a.m.score).map((x) => x.t);
        if (!items.length) return;
        html += `<div class="pk-g" role="presentation">${g}</div>` + items.map((t) => { const i = flat.push(t) - 1; const used = S.pipe.steps.some((s) => s.tid === t.id); return `<div class="pk-i" role="option" id="pk-${i}" data-i="${i}">${ic(t.icon, 'ic-sm')}<span class="t">${esc(t.name)}</span>${used ? '<span class="faint">in use</span>' : ''}</div>`; }).join('');
      });
      list.innerHTML = html || '<div class="empty-sm">No transform matches. Try "slack", "table" or "clean".</div>';
      hot = Math.min(hot, Math.max(0, flat.length - 1)); G.icons(list); mark();
    };
    const mark = () => {
      $$('.pk-i', list).forEach((n) => { const on = +n.dataset.i === hot; n.classList.toggle('hot', on); n.setAttribute('aria-selected', String(on)); });
      const h2 = $('.pk-i.hot', list); if (h2) { h2.scrollIntoView({ block: 'nearest' }); input.setAttribute('aria-activedescendant', h2.id); }
      const t = flat[hot]; if (!t) { prev.innerHTML = ''; return; }
      let out = ''; try { out = t.fn(base, ctx()); } catch (err) { out = 'Error: ' + err.message; }
      const d = out.length - base.length;
      prev.innerHTML = `<div class="row">${ic(t.icon)}<b>${esc(t.name)}</b><span class="grow"></span><span class="chip">${esc(t.group)}</span></div>${t.desc ? `<div class="muted">${esc(t.desc)}</div>` : ''}<div class="faint">Applied after step ${S.pipe.steps.length}: ${fmt(base.length)} → ${fmt(out.length)} chars (${d <= 0 ? '−' : '+'}${fmt(Math.abs(d))})</div><pre>${esc(out.slice(0, 2400)) || '<span class="faint">(empty result)</span>'}</pre>`;
      G.icons(prev);
    };
    const choose = (keep) => { const t = flat[hot]; if (!t) return; addStep(t.id); if (!keep) { closePicker(); focusStep(S.pipe.steps.length - 1); } else { G.toast(`Added "${esc(t.name)}"`, { icon: 'plus', ms: 1200 }); } };

  }
  document.addEventListener('mousedown', (e) => { if (picker && !picker.contains(e.target)) closePicker(); });

  /* ===================== Output ===================== */

  function renderOutput() {
    const [before, after] = shownPair(); const v = UI.view;
    $$('#viewseg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
    const k = S.stepPreview;
    $('#pv-banner').innerHTML = k != null ? `<div class="pv-banner">${ic('eye', 'ic-sm')}<span class="grow">Step ${k + 1} of ${S.pipe.steps.length}: <b>${esc((T(S.pipe.steps[k].tid) || {}).name || '')}</b>. Before is its input, After its output.</span><button class="btn sm" id="pv-x">Show the final output</button></div>` : '';
    const a = G.stats(before), b = G.stats(after), saved = a.chars - b.chars, pct = a.chars ? Math.round((100 * (a.chars - b.chars)) / a.chars) : 0;
    const ms = (k != null ? (S.res[k + 1] || {}).ms || 0 : S.res.reduce((s, r) => s + (r.ms || 0), 0)).toFixed(1);
    $('#ostats').innerHTML = `<span>${fmt(a.chars)} → <b>${fmt(b.chars)}</b> chars</span>${saved > 0 ? `<span class="save">saves ${fmt(saved)} chars (${pct}%)</span>` : saved < 0 ? `<span>adds ${fmt(-saved)} chars</span>` : '<span>same size</span>'}<span>${fmt(a.lines)} → ${fmt(b.lines)} lines</span><span class="faint">${ms} ms</span>`;
    const body = $('#out-body');
    if (v === 'before') body.innerHTML = `<pre class="txt">${esc(before)}</pre>`;
    else if (v === 'diff') body.innerHTML = unifiedHtml(before, after);
    else if (v === 'rendered') body.innerHTML = `<article class="doc" data-kind="report">${G.md.render(after, { bare: true }).html}</article>`;
    else body.innerHTML = after ? `<pre class="txt">${esc(after)}</pre>` : '<div class="empty-sm">The pipeline produced no text. A step that extracts something (code, tasks, tables) finds nothing in this input; preview each step with the eye button to see where it went empty.</div>';
    G.icons($('#pv-banner')); G.icons(body);
    const x = $('#pv-x'); if (x) x.onclick = () => { S.stepPreview = null; recompute(); };
  }
  $('#viewseg').addEventListener('click', (e) => { const b = e.target.closest('[data-v]'); if (!b) return; UI.view = b.dataset.v; saveUI(); renderOutput(); });

          <div class="fa-bar"><span class="lights"><span></span><span></span><span></span></span><b>#eng-db</b><span class="faint">team chat</span></div>
          <div class="fa-msgs">
            <div class="fa-msg"><span class="fa-av">PN</span><div><b>Priya N.<small>09:52</small></b><p>Is the pg16 rehearsal still Thursday? Can someone drop the cutover plan in here?</p></div></div>
            <div class="fa-msg"><span class="fa-av">SO</span><div><b>Sam O.<small>09:54</small></b><p>I have it open, one sec.</p></div></div>
          </div>
          <div class="fa-compose"><span class="ph">Message #eng-db</span></div>
        </div>
        <div class="hud" role="combobox" aria-expanded="true" aria-owns="hud-list" aria-haspopup="listbox">
          <div class="hud-in">${ic('search')}<input id="hud-q" placeholder="Type to filter" aria-label="Filter the clipboard ring" aria-controls="hud-list" autocomplete="off" spellcheck="false"><span class="kbd">${esc(RING_KEY)}</span></div>
          <div class="hud-scope" role="group" aria-label="Scope"></div>
          <div class="hud-list" id="hud-list" role="listbox" aria-label="Clips"></div>
          <div class="hud-prev" aria-live="polite"></div>
          <div class="hud-foot"></div>
        </div>
      </div></div>`);
    document.body.appendChild(sc); G.icons(sc); HUD.scrim = sc; HUD.el = $('.hud', sc); HUD.q = ''; HUD.hot = 0;
    const close = () => { sc.remove(); HUD.scrim = null; HUD.el = null; $('#b-hud').focus(); };
    sc.addEventListener('mousedown', (e) => { if (e.target === sc) close(); });
    $('[data-hx]', sc).onclick = close;
    sc.addEventListener('keydown', (e) => {
      const mod = e.metaKey || e.ctrlKey;
      if (mod && e.altKey && e.code === 'KeyV') { e.preventDefault(); e.stopPropagation(); if (HUD.el.hidden) openHud(); else { HUD.el.hidden = true; sc.focus(); } return; }
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); if (!HUD.el.hidden && HUD.q) { HUD.q = ''; $('#hud-q').value = ''; renderHud(); } else close(); return; }
      if (HUD.el.hidden) return;
      const q = $('#hud-q');
      if (document.activeElement !== q && e.key.length === 1 && !mod && !e.altKey) { q.focus(); return; }
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); HUD.hot = Math.max(0, Math.min(HUD.items.length - 1, HUD.hot + (e.key === 'ArrowDown' ? 1 : -1))); renderHud(); }
      else if (e.key === 'Enter') { e.preventDefault(); hudPaste(HUD.hot, { alt: e.altKey, meta: mod }); }
      else if (mod && /^Digit[1-9]$/.test(e.code)) { e.preventDefault(); hudPaste(+e.code.slice(5) - 1, { alt: e.altKey }); }
      else if (e.key === 'Tab') { e.preventDefault(); const i = HSCOPES.findIndex(([id]) => id === HUD.scope); HUD.scope = HSCOPES[(i + (e.shiftKey ? -1 : 1) + HSCOPES.length) % HSCOPES.length][0]; HUD.hot = 0; renderHud(); }
      else if (e.altKey && e.code === 'KeyP') { e.preventDefault(); const it = HUD.items[HUD.hot]; if (it && it.kind === 'clip') { pin(it.c); renderHud(); } }
      else if (e.altKey && e.key === 'Backspace') { e.preventDefault(); const it = HUD.items[HUD.hot]; if (it && it.kind === 'clip') { del(it.c); renderHud(); } }
    });
    $('#hud-q').addEventListener('input', (e) => { HUD.q = e.target.value; HUD.hot = 0; renderHud(); });
    $('.hud-list', sc).addEventListener('click', (e) => { const r = e.target.closest('.hrow'); if (r) hudPaste(+r.dataset.i, { alt: e.altKey, meta: e.metaKey || e.ctrlKey }); });
    $('.hud-list', sc).addEventListener('mousemove', (e) => { const r = e.target.closest('.hrow'); if (r && +r.dataset.i !== HUD.hot) { HUD.hot = +r.dataset.i; $$('.hrow', sc).forEach((x) => x.classList.toggle('hot', x === r)); } });
    $('.hud-scope', sc).addEventListener('click', (e) => { const b = e.target.closest('[data-hs]'); if (b) { HUD.scope = b.dataset.hs; HUD.hot = 0; renderHud(); $('#hud-q').focus(); } });
    renderHud(); $('#hud-q').focus();
  }

  /* ===================== Status bar ===================== */

  function renderStatus() {
    const pinned = G.clips.items.filter((c) => c.pinned).length, on = S.pipe.steps.filter((s) => s.on).length, out = finalOut();
    const paused = !G.prefs.clipHistory;
    $('#status').innerHTML = G.ui.statusbar([
      { cmd: 'cs-pause', html: paused ? `${ic('circle-pause')}${R.pausedUntil > Date.now() ? 'Paused until ' + clockOf(R.pausedUntil) : R.pausedUntil === -1 ? 'Paused' : 'History off'}` : '<span class="dot" aria-hidden="true"></span>Recording', title: paused ? 'Resume recording' : 'Pause recording' },
      { html: `${fmt(G.clips.items.length)} clips · ${pinned} pinned` },
      { cmd: 'cs-rules', icon: 'shield-check', html: `${SKIPPED.length} not recorded today`, title: 'Clipboard rules (⌥⌘R)' },
      { icon: 'workflow', html: `${esc(S.pipe.name)} · ${on} of ${S.pipe.steps.length} steps` },
      { html: '<span class="grow"></span>' },
      { cmd: 'collect', icon: 'layers', html: `Stack ${G.stack.items.length}${G.stack.on ? ' · collecting' : ''}`, title: 'Collect mode (⌥⌘K)' },
      { cmd: 'cs-hud', icon: 'picture-in-picture-2', html: esc(RING_KEY), title: 'Clipboard ring' },
      { cmd: 'theme-menu', icon: 'palette', html: G.themes.find((t) => t.id === G.resolvedTheme()).name },
      { cmd: 'scale-reset', html: Math.round(G.prefs.scale * 100) + '%', title: 'Text size (⌘0 resets)' }
    ]).replace('<span class="sb-item"><span class="grow"></span></span>', '<span class="grow"></span>');
    G.icons($('#status'));
  }

  /* ===================== Commands and keys ===================== */

  const focusPanel = (n) => {
    if (n === 1) { $('#hlist').focus(); setHot(S.hot); }
    else if (n === 2) { if (S.mode === 'compare') setMode('pipeline'); editor.ta.focus(); }
    else if (n === 3) { setMode('pipeline'); const s = $('#steps .step'); (s || $('#add-step')).focus(); }
    else if (n === 4) { setMode('pipeline'); $('#out-body').focus(); }
  };
  const focusSearch = () => { const q = $('#h-q'); q.focus(); q.select(); };
  [
    ['cs-search', 'Search clipboard history', 'search', '⌘F', focusSearch],
    ['cs-focus-history', 'Focus the history', 'clipboard-list', '⌘1', () => focusPanel(1)],
    ['cs-focus-input', 'Focus the workbench input', 'text-cursor-input', '⌘2', () => focusPanel(2)],
    ['cs-focus-pipeline', 'Focus the pipeline', 'workflow', '⌘3', () => focusPanel(3)],
    ['cs-focus-output', 'Focus the output', 'file-output', '⌘4', () => focusPanel(4)],
    ['cs-mode-pipeline', 'Workbench: Pipeline', 'workflow', '⌥⌘1', () => setMode('pipeline')],
    ['cs-mode-compare', 'Workbench: Compare two texts', 'git-compare', '⌥⌘2', () => setMode('compare')],
    ['cs-add-step', 'Add a pipeline step…', 'plus', '⇧⌘A', () => openPicker($('#add-step'))],
    ['cs-save-pipe', 'Save the pipeline', 'save', '⌘S', savePipe],
    ['cs-save-pipe-as', 'Save the pipeline as…', 'files', '⇧⌘S', () => saveAs($('#p-saveas'))],
    ['cs-run-clip', 'Run the pipeline on the clipboard', 'play', '⌘R', () => runOnClipboard()],
    ['cs-copy-out', 'Copy the output', 'copy', '⌘↵', copyOut],
    ['cs-replace-clip', 'Replace the clipboard with the output', 'clipboard-check', '⌥⌘↵', replaceClipboard],
    ['cs-use-out', 'Use the output as input', 'corner-left-up', '⌘U', useAsInput],
    ['cs-new-doc', 'Open the output as a new document', 'file-plus-2', '⌥⌘N', newDoc],
    ['cs-inbox', 'Send the output to the Inbox', 'inbox', '', toInbox],
    ['cs-cycle-view', 'Output view: Before, After, Diff, Rendered', 'columns-2', '⌘D', cycleView],
    ['cs-pipelines', 'Saved pipelines', 'workflow', '', () => showPipelines(true)],
    ['cs-copy-formats', 'Copy formats', 'copy', '', () => showRight('copy')],
    ['cs-stack', 'Show the collect stack', 'layers', '', () => showRight('stack')],
    ['cs-snippets', 'Snippets', 'text-quote', '', () => showRight('snippets')],
    ['cs-new-snippet', 'New snippet from the output', 'plus', '', () => newSnippet(finalOut(), 'From ' + S.pipe.name)],
    ['cs-rules', 'Clipboard rules…', 'shield-check', '⌥⌘R', openRules],
    ['cs-hud', 'Clipboard ring', 'picture-in-picture-2', RING_KEY, openHud],
    ['cs-keys', 'Clipboard studio keyboard map', 'keyboard', '⌘?', openKeys],
    ['cs-pause', 'Pause or resume clipboard recording', 'circle-pause', '', () => (G.prefs.clipHistory ? pauseRecording(5 * MIN) : resumeRecording())],
    ['cs-ignore-next', 'Ignore the next copy', 'eye-off', '', () => { S.ignoreNext = Date.now(); G.toast('The next copy will not be recorded', { icon: 'eye-off' }); }],
    ['cs-clear-unpinned', 'Clear unpinned clipboard history', 'trash-2', '', () => clearHistory(false)],
    ['cs-right', 'Toggle the studio side panel', 'panel-right', '⌥⌘I', toggleRight],
    ['cs-paste-in', 'Paste the clipboard into the workbench', 'clipboard-paste', '', pasteIn],
    ['cs-sample', 'Load sample: Markdown with formatting', 'file-text', '', () => setInput(SAMPLE_MD, { kind: 'sample', label: 'Sample Markdown', icon: 'file-text' })]
  ].forEach(([id, name, icon, kbd, run]) => G.command({ id, name, icon, kbd, group: 'Clipboard studio', run }));
  registerPipeCommands();

  document.addEventListener('keydown', (e) => {
    if (e.defaultPrevented || $('.sheet-scrim') || HUD.scrim || picker || G.palette.el || S.recording) return;
    const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
    const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (mod && e.altKey && e.code === 'KeyV') { e.preventDefault(); openHud(); }
    else if (mod && e.altKey && e.code === 'KeyR') { e.preventDefault(); openRules(); }
    else if (mod && e.altKey && e.code === 'KeyI') { e.preventDefault(); toggleRight(); }
    else if (mod && e.altKey && /^Digit[12]$/.test(e.code)) { e.preventDefault(); setMode(MODES[+e.code.slice(5) - 1]); }
    else if (mod && e.altKey && e.code === 'KeyN') { e.preventDefault(); newDoc(); }
    else if (mod && e.altKey && e.key === 'Enter') { e.preventDefault(); replaceClipboard(); }
    else if (mod && !e.altKey && e.key === 'Enter') { e.preventDefault(); copyOut(); }
    else if (mod && !e.altKey && !e.shiftKey && /^Digit[1-4]$/.test(e.code)) { e.preventDefault(); focusPanel(+e.code.slice(5)); }
    else if (mod && !e.altKey && !e.shiftKey && k === 'f') { e.preventDefault(); focusSearch(); }
    else if (mod && e.shiftKey && k === 'a') { e.preventDefault(); openPicker($('#add-step')); }
    else if (mod && !e.altKey && k === 's') { e.preventDefault(); e.shiftKey ? saveAs($('#p-saveas')) : savePipe(); }
    else if (mod && !e.shiftKey && !e.altKey && k === 'r') { e.preventDefault(); runOnClipboard(); }
    else if (mod && !e.shiftKey && !e.altKey && k === 'd') { e.preventDefault(); cycleView(); }
    else if (mod && !e.shiftKey && !e.altKey && k === 'u') { e.preventDefault(); useAsInput(); }
    else if ((mod && (e.key === '?' || (e.shiftKey && e.code === 'Slash'))) || (!inField && !mod && e.key === '?')) { e.preventDefault(); openKeys(); }
  });

  /* ===================== Toolbar ===================== */

  $('#b-paste').onclick = pasteIn;
  $('#b-runclip').onclick = () => runOnClipboard();
  $('#b-hist').onclick = (e) => historyMenu(e.currentTarget);
  $('#b-stack').onclick = () => G.stack.toggle();
  $('#b-hud').onclick = openHud;
  $('#b-rules').onclick = openRules;
  $('#b-keys').onclick = openKeys;
  $('#in-src').onclick = (e) => loadMenu(e.currentTarget);
  $('#in-paste').onclick = pasteIn;
  $('#in-undo').onclick = () => editor.undo();
  $('#in-clear').onclick = () => { const old = inputText(), src = S.input; setInput('', { kind: 'paste', label: 'Empty', icon: 'type' }); editor.ta.focus(); G.toast('Input cleared', { icon: 'eraser', action: { label: 'Undo', run: () => setInput(old, Object.assign({}, src, { keepCurrent: true })) } }); };
  $('#in-wrap-btn').onclick = (e) => { const b = e.currentTarget, on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', String(on)); b.classList.toggle('on', on); editor.setWrap(on); };

  /* ===================== Integration with the palette and other pages ===================== */

  G.openDoc = (id) => { const d = G.doc(id); if (!d) return G.toast('Indexed metadata only in this prototype', { icon: 'info' }); fromDoc(d); if (S.mode === 'compare') setMode('pipeline'); G.toast(`Loaded ${esc(d.title)} into the workbench`, { icon: 'file-text', action: { label: 'Open in Workspace', run: () => (location.href = G.page('workspace') + '#doc=' + id) } }); };
  G.replaceText = (out, sel) => { if (sel && editor.hasSelection()) editor.replaceSelection(out); else setInput(out, Object.assign({}, S.input, { keepCurrent: true })); };
  G.insertText = (t) => insertAtCursor(t);
  G.undo = () => editor.undo();

  G.on('clips', () => {
    if (S.ignoreNext && G.clips.items[0] && G.clips.items[0].at >= S.ignoreNext) { S.ignoreNext = 0; G.clips.items.shift(); G.clips.save(); G.toast('Not recorded: "Ignore the next copy" was on', { icon: 'eye-off' }); }
    renderHistory(); renderPreview(); renderStatus();
    if (HUD.el && !HUD.el.hidden) renderHud();
    if (S.mode === 'compare') renderCompare();
  });
  G.on('stack', () => { renderStack(); renderStatus(); });
  G.on('pref', ({ key }) => {
    if (['copyDefault'].includes(key)) renderCopy();
    if (['servicesMenu', 'menubarExtra'].includes(key)) renderPipes();
    if (['clipHistory', 'clipIgnoreApps'].includes(key)) { renderPolicy(); renderStatus(); }
  });
  G.on('theme', () => renderStatus());
  window.addEventListener('hashchange', routeHash);
  function routeHash() {
    const h = location.hash.replace(/^#/, '');
    if (!h) return;
    if (h.startsWith('pipelines')) showPipelines(true);
    else if (h === 'copy' || h === 'stack' || h === 'snippets') showRight(h);
    else if (MODES.includes(h)) setMode(h);
    else if (h === 'rules') openRules();
    else if (h === 'hud' || h === 'ring') openHud();
    else if (h === 'keys') openKeys();
  }

  /* ===================== Boot ===================== */

  G.boot({});
  if (R.pausedUntil > 0 && R.pausedUntil < Date.now() && !G.prefs.clipHistory) { R.pausedUntil = 0; saveRules(); G.setPref('clipHistory', true); }
  if (!G.stack.items.length) {
    const d = G.doc('pg16-plan').src;
    G.stack.items.push({ text: d.match(/## TL;DR\n\n([\s\S]*?)\n\n## /)[1] }, { text: d.match(/\| Step \| Owner[\s\S]*?\n\n/)[0].trim() }, { text: d.match(/## Next steps\n\n([\s\S]*?)\n\n/)[1] });
  }
  buildEditor('');
  inWrap.style.setProperty('--in-h', UI.inH + 'px');
  // In a narrow window the side panel overlays the workbench, so start with it closed (not saved).
  if (innerWidth < 1100) UI.rightOpen = false;
  $('#studio').classList.toggle('no-right', !UI.rightOpen); $('#b-right').classList.toggle('on', UI.rightOpen);
  loadPipe(S.pipes.find((p) => p.id === 'p-slack') || S.pipes[0] || { id: null, name: 'Untitled pipeline', steps: [] });
  fromDoc(G.doc('pg16-plan'));
  setMode('pipeline');
  renderHistory(); renderPreview(); renderStack();
  if (UI.rightOpen) showRight(UI.right);
  routeHash();
})();
</script>
</body>
