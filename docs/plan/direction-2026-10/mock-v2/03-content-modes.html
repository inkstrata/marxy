<style>
  /* Left to right: the type list, its typography, then the sample document, the widest region. */
  .cm { flex: 1; display: grid; grid-template-columns: 228px 308px minmax(0, 1fr); min-height: 0; }
  .cm.no-spec { grid-template-columns: 228px 0 minmax(0, 1fr); }
  .cm.no-spec .spec { display: none; }
  .kinds { border-right: 1px solid var(--line); background: var(--win); overflow: auto; padding: 8px; }
  .kinds h3 { font-size: 11px; color: var(--fg-faint); font-weight: 650; margin: 8px 8px 6px; }
  .krow { display: grid; grid-template-columns: 18px 1fr; gap: 2px 10px; padding: 7px 9px; border-radius: 7px; border: 0; background: none; width: 100%; text-align: left; color: var(--fg); }
  .krow:hover { background: var(--hover); }

  .krow svg { color: var(--fg-muted); margin-top: 1px; }
  .krow b { font-weight: 600; font-size: 13px; }
  .krow span { grid-column: 2; font-size: 11.5px; color: var(--fg-muted); line-height: 1.35; }
  .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--doc); }
  .stage-body { flex: 1; display: flex; min-height: 0; position: relative; container-type: inline-size; }
  @container (max-width: 1080px) { .stage-body:has(.rail.right) > .rail:not(.right) { display: none; } }
  @container (max-width: 780px) { .rail { display: none; } }
  .stage-scroll { flex: 1; overflow: auto; min-width: 0; position: relative; }
  .rail { width: 210px; flex: none; border-right: 1px solid var(--line); overflow: auto; padding: 14px 10px; font-size: 12.5px; background: var(--doc); }
  .rail.right { border-right: 0; border-left: 1px solid var(--line); }
  .rail h4 { font-size: 11px; font-weight: 650; color: var(--fg-faint); margin: 0 0 6px 6px; display: flex; gap: 6px; align-items: center; }
  .rail a, .rail button.rl { display: block; padding: 4px 8px; border-radius: 5px; color: var(--fg); text-decoration: none; border: 0; background: none; width: 100%; text-align: left; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rail a:hover, .rail button.rl:hover { background: var(--hover); }
  .rail a.on { color: var(--accent); background: var(--accent-wash); }
  .rail .l3 { padding-left: 20px; } .rail .l4 { padding-left: 32px; }
  .rail section + section { margin-top: 16px; }
  .rail .item { display: flex; gap: 6px; align-items: baseline; padding: 3px 6px; font-size: 12px; color: var(--fg-muted); }
  .rail .item svg { flex: none; transform: translateY(2px); }
  .spec { border-right: 1px solid var(--line); background: var(--side); overflow: auto; padding: 12px 14px 30px; }
  .spec h3 { margin: 4px 0 2px; font-size: 14px; display: flex; gap: 8px; align-items: center; }
  .spec .lede { font-size: 12px; color: var(--fg-muted); line-height: 1.5; margin: 4px 0 12px; }
  .spec h4 { font-size: 11px; font-weight: 650; color: var(--fg-faint); margin: 16px 0 6px; display: flex; gap: 6px; align-items: center; }
  .spec table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .spec td { padding: 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .spec td:first-child { color: var(--fg-muted); width: 92px; padding-right: 8px; }
  .spec td b { font-weight: 600; }
  .spec .live { color: var(--accent); font-variant-numeric: tabular-nums; }
  .spec ul { margin: 0; padding-left: 16px; font-size: 12px; line-height: 1.5; }
  .spec li + li { margin-top: 2px; }
  .ctl { display: grid; grid-template-columns: 76px 1fr 44px; gap: 8px; align-items: center; font-size: 12px; margin: 6px 0; }
  .ctl input[type=range] { width: 100%; }
  .ctl output { font-variant-numeric: tabular-nums; text-align: right; color: var(--fg-muted); }
  .rule { font-size: 11.5px; line-height: 1.45; padding: 7px 9px; border-radius: 7px; background: var(--warn-wash); color: var(--fg); margin: 8px 0; display: flex; gap: 7px; }
  .rule svg { color: var(--warn); flex: none; margin-top: 1px; }
  .rule.ok { background: var(--ok-wash); } .rule.ok svg { color: var(--ok); }
  .src-link { font-size: 11.5px; color: var(--accent); }

  .report-panel .item b { color: var(--fg); font-weight: 600; }

  .readbar i { display: block; height: 100%; width: 0; background: var(--accent); }
  .doc[data-kind="article"] .sidenote { float: right; clear: right; width: 13em; margin-right: -15.5em; margin-top: 0.3em; font: 400 0.74em/1.45 var(--face-sans); color: var(--fg-muted); text-indent: 0; }
  .doc[data-kind="article"] .sidenote b { color: var(--accent); margin-right: 4px; }
  .doc[data-kind="article"].with-sidenotes { padding-right: 17em; }
  .doc[data-kind="article"].with-sidenotes .footnotes { display: none; }
  /* Book frame: CSS columns as pages */
  .book-view { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--doc); }
  .book-pages { flex: 1; overflow: hidden; position: relative; min-height: 0; width: 100%; }
  .book-pages .doc.paged { height: 100%; column-width: var(--measure); column-gap: 5em; column-fill: auto; padding: 2.2em 3em 2.4em; overflow: visible; box-sizing: border-box; }
  .book-pages .doc.paged > * { max-width: none; break-inside: avoid-column; }
  .book-pages .doc.paged > p { break-inside: auto; orphans: 2; widows: 2; }
  .book-pages .doc.paged h1 { break-after: avoid; }
  .book-foot { height: 40px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--fg-muted); }
  .book-foot .progress { flex: 1; max-width: 360px; }

  .repo-head { border-bottom: 1px solid var(--line); padding: 18px 26px 14px; display: grid; grid-template-columns: 1fr auto; gap: 8px 20px; background: var(--win); }
  .repo-head h2 { margin: 0; font: 650 20px var(--face-readme); color: var(--fg-strong); display: flex; gap: 8px; align-items: center; }
  .repo-head p { margin: 0; color: var(--fg-muted); font-size: 13.5px; }
  .facts { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--fg-muted); grid-column: 1 / -1; }
  .facts span { display: inline-flex; gap: 5px; align-items: center; }
  .install { display: flex; align-items: center; gap: 0; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; background: var(--inset); align-self: start; }
  .install code { font: 12.5px var(--face-code); padding: 6px 10px; color: var(--fg-strong); }
  .install button { border: 0; border-left: 1px solid var(--line-strong); background: var(--raised); height: 30px; padding: 0 10px; display: inline-flex; gap: 5px; align-items: center; color: var(--fg); }
  .install select { border: 0; background: none; font-size: 12px; color: var(--fg-muted); padding: 0 6px; height: 30px; border-right: 1px solid var(--line-strong); }
  .tocchips { display: flex; gap: 6px; padding: 10px 26px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tocchips a { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg); text-decoration: none; }
  .tocchips a:hover { background: var(--hover); }
  /* Docs frame */
  .crumbs { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--fg-muted); padding: 14px 2.4em 0; max-width: calc(var(--measure, 40em) + 4.8em); }
  .docnav-foot { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 3em auto 0; }
  .docnav-foot a { border: 1px solid var(--line); border-radius: 9px; padding: 10px 14px; text-decoration: none; color: var(--fg); font: 13px var(--face-chrome); }
  .docnav-foot a small { display: block; color: var(--fg-faint); font-size: 11px; }
  .docnav-foot a:last-child { text-align: right; }
  /* Code frame */
  .code-crumbs { display: flex; gap: 6px; align-items: center; font: 12px var(--face-code); color: var(--fg-muted); padding: 6px 14px; border-bottom: 1px solid var(--line); background: var(--doc); }
  .code-crumbs .seg { margin-left: 4px; font-family: var(--face-chrome); }
  .code-crumbs .seg button { height: 22px; padding: 0 8px; font-size: 11.5px; }
  .lang-name { display: inline-flex; gap: 6px; align-items: center; color: var(--fg); font-family: var(--face-chrome); font-size: 11.5px; }
  .lang-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--lang, var(--fg-muted)); flex: none; }
  .sym { display: flex; gap: 6px; align-items: center; padding: 3px 6px; border-radius: 5px; font: 12px var(--face-code); color: var(--fg); border: 0; background: none; width: 100%; text-align: left; }
  .sym:hover { background: var(--hover); }
  .sym i.k { font: 600 10px var(--face-chrome); color: var(--fg-faint); width: 34px; font-style: normal; }
  /* Transcript frame */
  .tfilter { display: flex; gap: 4px; padding: 6px 6px 10px; flex-wrap: wrap; }
  .tprompt { display: block; padding: 6px 8px; border-radius: 6px; border: 0; background: none; text-align: left; width: 100%; color: var(--fg); font-size: 12px; line-height: 1.4; }
  .tprompt:hover { background: var(--hover); }
  .tprompt small { color: var(--fg-faint); display: block; font-size: 10.5px; }
  /* Log and terminal frames: mono, size only. Tokens only; level and role are carried by weight and value, not hue. */
  .doc[data-kind="log"], .doc[data-kind="terminal"] { --k-face: var(--face-code); --k-size: 0.8125rem; --k-leading: 1.55; --k-measure: 200; padding: 0; font-feature-settings: var(--code-liga); }
  .doc.doc[data-kind="log"] > *, .doc.doc[data-kind="terminal"] > * { max-width: none; margin: 0; }
  .col { position: relative; flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .logbar { display: flex; gap: 10px; align-items: center; padding: 7px 16px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--fg-muted); background: var(--doc); flex-wrap: wrap; }
  .logbar b { color: var(--fg-strong); font-weight: 600; font-family: var(--face-code); font-size: 12px; }
  .txtseg { display: inline-flex; gap: 2px; align-items: center; }
  .txtseg button { border: 0; background: none; padding: 2px 8px; border-radius: 5px; font: 500 12px var(--face-chrome); color: var(--fg-muted); height: 24px; }
  .txtseg button:hover { background: var(--hover); color: var(--fg); }
  .txtseg button[aria-pressed="true"] { color: var(--fg-strong); font-weight: 700; text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1.5px; }
  .logview { padding: 10px 0 40vh; min-width: max-content; }
  .logview.wrap { min-width: 0; }
  .ll { display: grid; grid-template-columns: 4.2em minmax(0, 1fr); }
  .ll .n { text-align: right; padding-right: 1em; color: var(--fg-faint); user-select: none; border-right: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .ll .lt { white-space: pre; padding: 0 1.4em 0 1em; }
  .logview.wrap .lt { white-space: pre-wrap; overflow-wrap: anywhere; padding-left: calc(1em + 4ch); text-indent: -4ch; }
  .ll .ts { color: var(--tk-comment); }
  .ll .lv { font-weight: 700; color: var(--fg-strong); }
  .ll.cont .lt { padding-left: calc(1em + 2ch); color: var(--fg-muted); }
  .logview.wrap .ll.cont .lt { padding-left: calc(1em + 6ch); }
  .ll[data-lv="debug"] .msg { color: var(--fg-muted); }
  .ll[data-lv="error"] { box-shadow: inset 3px 0 0 var(--fg-strong); background: var(--hover); }
  .ll[data-lv="error"] .msg, .ll[data-lv="error"].cont .lt { color: var(--fg-strong); }
  .ll.hot { background: var(--accent-wash-strong); }
  .logview[data-min="1"] .ll[data-rank="0"], .logview[data-min="2"] .ll:is([data-rank="0"], [data-rank="1"]), .logview[data-min="3"] .ll:not([data-rank="3"]) { display: none; }
  .esc { color: var(--tk-comment); }
  .follow-pill { position: absolute; right: 18px; bottom: 14px; display: inline-flex; gap: 6px; align-items: center; padding: 4px 10px; border-radius: 999px; background: var(--raised); border: 1px solid var(--line-strong); box-shadow: var(--shadow); font-size: 11.5px; color: var(--fg); }
  .term { padding: 14px 0 40vh; min-width: max-content; }
  .term.wrap { min-width: 0; }
  .tg + .tg { margin-top: calc(var(--k-leading) * 0.5em); }
  .term .tc, .term .to { padding: 0 1.6em; white-space: pre; }
  .term.wrap :is(.tc, .to) { white-space: pre-wrap; overflow-wrap: anywhere; }
  .term .pr { color: var(--tk-punct); }
  .term .tcmd { color: var(--fg-strong); font-weight: 600; }
  .term .to { color: var(--fg); }
  /* Page-local dropdown */
  .pmenu { position: fixed; z-index: 60; min-width: 210px; padding: 4px; background: var(--raised); border: 1px solid var(--line-strong); border-radius: 9px; box-shadow: var(--shadow); font: 13px var(--face-chrome); }
  .pmenu button { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 28px; padding: 5px 10px; border: 0; border-radius: 6px; background: none; color: var(--fg); text-align: left; font: inherit; }
  .pmenu button:hover, .pmenu button:focus-visible { background: var(--accent); color: var(--accent-fg); outline: none; }
  .pmenu button svg { color: var(--fg-muted); flex: none; }
  .pmenu button:is(:hover, :focus-visible) svg, .pmenu button:is(:hover, :focus-visible) .k { color: inherit; }
  .pmenu .k { margin-left: auto; color: var(--fg-faint); font-size: 11.5px; padding-left: 16px; }
  .pmenu .ck { width: 16px; display: inline-grid; place-items: center; flex: none; }
  .pmenu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  /* Data frame */
  .databar { display: flex; gap: 8px; align-items: center; padding: 8px 18px; border-bottom: 1px solid var(--line); font-size: 12px; }
  .databar .field { height: 26px; }
</style>

<div class="win no-side">

</div>

  const OVERFLOW = new Set(['copy-install', 'copy-fenced', 'copy-cmds']);
  function modebar() {
    const all = (G.kindTools[S.kind] || []).concat(EXTRA[S.kind] || []); const tools = all.filter(([id]) => !OVERFLOW.has(id)); const more = all.filter(([id]) => OVERFLOW.has(id));
    $('#modebar').innerHTML = `<span class="mb-label">${G.kinds[S.kind].name.toUpperCase()} TOOLS</span>` + tools.map(([id, label, icon, k]) => `<button class="qbtn${S.tool[id] || (id === 'paged' && !S.tool.scroll && S.kind === 'book') || (id === 'level-menu' && S.tool.lvl && S.tool.lvl !== 'all') ? ' on' : ''}" data-tool="${id}" title="${esc(label)}${k ? ' (' + k + ')' : ''}">${ic(icon)}${esc(label)}</button>`).join('') + `<span class="grow"></span>${more.length ? `<button class="qbtn" data-tool="overflow" title="More tools for this kind" aria-haspopup="menu" aria-label="More tools">${ic('ellipsis')}</button>` : ''}<button class="qbtn" data-tool="open" title="Open in Workspace">${ic('app-window')}Open in Workspace</button>`;
    G.icons($('#modebar'));
  }
  $('#modebar').addEventListener('click', (e) => { const b = e.target.closest('[data-tool]'); if (b) runTool(b.dataset.tool, b); });
  function runTool(id, b) {
    const src = doc().src;
    if (id === 'overflow') return G.menu(b, (G.kindTools[S.kind] || []).filter(([x]) => OVERFLOW.has(x)).map(([x, label, icon]) => ({ label, icon, run: () => runTool(x, b) })), { width: 240, align: 'end' });
    const flip = (k) => { S.tool[k] = !S.tool[k]; frame(); modebar(); };
    const msg = {
      highlight: 'Select text, then Highlight in the selection bar. Highlights are stored beside the file, never written into it.',
      'notes-margin': 'Margin notes are on: footnotes sit beside their reference on wide windows and behind a tap when narrow.',
      speak: 'Read aloud with word highlighting, using the macOS voice set in Settings › Accessibility.',
      contents: 'Contents drawer: 12 chapters with your position and highlights per chapter.',
      bookmark: 'Bookmarked page 41. Bookmarks sync with the file path, not the file contents.',
      badges: 'Badges are drawn locally from the shields.io URL; no network request is made.',
      outline: 'Outline opens in the inspector, as in the Workspace.',
      'x-config': 'Configuration table copied as CSV.',
      'open-repo': 'Opens the repository folder in Finder, or its remote in the browser.',
      'on-page': 'The "On this page" rail tracks your position as you scroll.',
      'copy-anchor': 'Link to the nearest heading copied.',
      examples: 'Shows only the code examples, each with its heading.',
      docset: 'Searches the 14 pages of this docs set, ranked by heading match first.',
      'prev-next': 'Previous and next follow the docs set order.',
      symbols: 'The symbol rail on the right lists functions, types and tests.',
      'goto-line': 'Go to line (⌃G) opens the palette in line mode.',
      'col-stats': 'Column statistics are in the table footer: min, max, mean.',
      filter: 'Type in the filter box above the table.',
      transpose: 'Transposed view swaps rows and columns without changing the file.',
      chart: 'A quick bar chart of the selected numeric column.',
      backlinks: 'Backlinks list documents that link here.',
      daily: 'Daily navigation moves between dated notes.',
      versions: 'Each version is a section; click to jump.',
      tasks: 'Tasks are listed in the inspector and can be sent to Reminders.',
      diff: 'Version comparison is shown in the Workspace prototype.',
      'split-h2': 'Split by H2 writes one file per section into a new folder.',
      verify: 'Verify paths checks every path the report mentions against the collection’s base folder.',
      'append-clip': 'Appends the clipboard to today’s note under a timestamp.',
      'copy-release': 'The release under the cursor is copied as release notes.',
      'export-doc': 'Export as document keeps the assistant’s answers and drops the conversation.'
    };
    if ((S.kind === 'log' || S.kind === 'terminal') && id !== 'open' && monoTool(id, b)) return;
    switch (id) {
      case 'open': return (location.href = G.page('workspace') + '#doc=' + doc().id);
      case 'copy-as': case 'copy-as-table': return G.copyMenu(b, () => (S.kind === 'data' ? G.transform('tsv-to-table', src) : src));
      case 'extract': return G.extractMenu(b, src);
      case 'quote-link': return G.copyAs('quote', 'Ragged right is not a compromise. It is the setting that lets every space be the same width.');
      case 'focus': case 'justify': case 'wrap': case 'literate': case 'scroll': case 'endnotes': case 'expandTools': case 'dropcap':
        if (id === 'justify' && !S.tool.justify) { const c = G.colophon(docEl); if (c.cpl && c.cpl < 45) return G.toast(`Justification needs at least 45 characters per line; this column has ${c.cpl}. Staying ragged right.`, { icon: 'align-left', ms: 4500 }); }
        if (id === 'literate' && S.lang !== 'rust') return G.toast('Literate view sets doc comments as prose. The prototype reads Rust ///, so switch the language back to Rust to try it.', { icon: 'book-text', ms: 4500 });
        if (id === 'dropcap') { S.tool.dropcap = !S.tool.dropcap; docEl.classList.toggle('dropcap', S.tool.dropcap); return modebar(); }
        return flip(id);
      case 'paged': S.tool.scroll = false; frame(); return modebar();
      case 'collapse-tools': S.tool.expandTools = false; S.tool.tf = 'All'; return frame();
      case 'only-prompts': S.tool.tf = 'Prompts'; return frame();
      case 'only-answers': S.tool.tf = 'Answers'; return frame();
      case 'x-final': return G.copy('Warm run: **1.6 s**. Cold run is unchanged at 41 s, which is expected, since the cache starts empty.', { as: 'final answer' });
      case 'copy-install': return G.copy('brew install tidemark', { as: 'Code' });
      case 'x-commands': return G.copy(G.transform('x-commands', src), { as: 'script' });
      case 'copy-section': return G.copy(G.sectionOf(src, res.headings[1].line), { as: 'Markdown section' });
      case 'copy-fenced': return G.copy('```' + (LANGS.find((x) => x.id === S.lang) || LANGS[0]).id + '\n' + src.replace(/\n$/, '') + '\n```', { as: 'Markdown' });
      default: if (msg[id]) G.toast(msg[id], { icon: 'info', ms: 4200 });
    }
  }

  /* ---------- Typography spec panel with live controls ---------- */
  function spec() {
    const s = SPEC[S.kind]; const c = docEl ? G.colophon(docEl) : {};
    const prose = !['code', 'data', 'log', 'terminal'].includes(S.kind);
    const why = s.detect ? s.detect(doc()) : null;
    const ts = G.typesets.find((t) => t.id === G.prefs.typeset);
    const curSize = S.over['--k-size'] ? parseFloat(S.over['--k-size']) * 16 : s.size;
    const curLead = S.over['--k-leading'] ? +S.over['--k-leading'] : s.leading;
    const curMeasure = S.over['--k-measure'] ? +S.over['--k-measure'] : s.measure;
    const ls = +(S.over['letter-spacing'] || '0').replace('em', '');
    $('#spec').innerHTML = `<h3>${ic(G.kinds[S.kind].icon)}${G.kinds[S.kind].name} typography</h3><p class="lede">${esc(s.why)}</p>
      <table><tbody>
        <tr><td>Face</td><td><b>${esc(c.face || '–')}</b><br><span class="faint">${esc(s.role)} role in the ${esc(ts.name)} type set</span></td></tr>
        <tr><td>Size</td><td>${s.size} px default <span class="live">· ${c.size ? c.size.toFixed(1) + ' px now' : ''}</span></td></tr>
        <tr><td>Leading</td><td>${s.leading} <span class="live">· ${c.leading || ''} now</span></td></tr>
        <tr><td>Measure</td><td>${s.measure ? s.measure + ' average characters' : 'n/a (no reflow)'} ${c.cpl && prose ? `<span class="live">· ${c.cpl} measured</span>` : ''}${c.avg && prose ? `<br><span class="faint">avg advance ${c.avg.toFixed(3)} em, measured from the face</span>` : ''}</td></tr>
        <tr><td>Paragraphs</td><td>${esc(s.para)}</td></tr>
        <tr><td>Alignment</td><td>${esc(s.align)}</td></tr>
        <tr><td>Headings</td><td>${esc(s.heads)}</td></tr>
        <tr><td>Code</td><td>${esc(s.code)}</td></tr>
        <tr><td>Page model</td><td>${esc(s.page)}</td></tr>
        <tr><td>Spacing controls</td><td>${esc(s.spacing)}</td></tr>
        ${why ? `<tr><td>Detected by</td><td>${why.map((x) => esc(x)).join('<br>')}</td></tr>` : ''}
      </tbody></table>
      <h4>${ic('sliders-horizontal', 'ic-sm')}TRY IT (THIS VIEW ONLY)</h4>
      <div class="ctl"><label for="c-size">Size</label><input id="c-size" type="range" min="12" max="${prose ? 28 : 20}" step="0.5" value="${curSize}"><output>${curSize}px</output></div>
      ${prose ? `<div class="ctl"><label for="c-lead">Leading</label><input id="c-lead" type="range" min="1.3" max="2" step="0.05" value="${curLead}"><output>${curLead}</output></div>
      <div class="ctl"><label for="c-meas">Measure</label><input id="c-meas" type="range" min="40" max="90" step="1" value="${curMeasure}"><output>${curMeasure}</output></div>
      <div class="ctl"><label for="c-ls">Letter sp.</label><input id="c-ls" type="range" min="0" max="0.12" step="0.01" value="${ls}"><output>${ls}em</output></div>` : `<div class="rule ok">${ic('lock')}<span>Size and face only: spacing would change what ${G.kinds[S.kind].name.toLowerCase()} says.</span></div>`}
      ${prose && c.cpl && c.cpl < 45 ? `<div class="rule">${ic('align-left')}<span>${c.cpl} characters per line, under 45: justification is off (rule 2).</span></div>` : ''}
      ${prose && ls > 0 ? `<div class="rule ok">${ic('link-2')}<span>Word spacing rose with letter spacing (+${ls} em) (rule 3).</span></div>` : ''}
      ${prose && /ink|dusk|night|fjord|hc-dark/.test(G.resolvedTheme()) ? `<div class="rule ok">${ic('moon')}<span>Dark theme: text weight lightened to ${getComputedStyle(document.documentElement).getPropertyValue('--text-wght').trim()}.</span></div>` : ''}
      <div class="row" style="margin-top:6px"><button class="btn sm" id="c-reset">${ic('rotate-ccw')}Reset</button><button class="btn sm" id="c-save">${ic('save')}Save for ${esc(G.kinds[S.kind].name)}</button></div>
      <h4>${ic('lock', 'ic-sm')}MUST PRESERVE</h4><ul>${s.preserve.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
      <h4>${ic('sliders-horizontal', 'ic-sm')}READER MAY ADAPT</h4><ul>${s.adapt.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
      <h4>${ic('book-open', 'ic-sm')}SOURCES</h4><div style="font-size:11.5px;line-height:1.6"><a class="src-link" href="../docs/site/10-spec.html">Reader Typography Spec</a> · <a class="src-link" href="../docs/site/07-content-types.html">Typography by Content Type</a>${S.kind === 'code' ? ' · <a class="src-link" href="../docs/site/06-code.html">Code and Syntax Highlighting</a>' : ''} · <a class="src-link" href="TYPOGRAPHY.md">TYPOGRAPHY.md</a></div>`;
    G.icons($('#spec'));
    const bind = (id, fn) => { const el = $('#' + id); if (el) el.oninput = () => { fn(+el.value); el.nextElementSibling.textContent = id === 'c-size' ? el.value + 'px' : id === 'c-ls' ? el.value + 'em' : el.value; G.measureDoc(docEl); clearTimeout(bind.t); bind.t = setTimeout(spec, 250); status(); }; };
    bind('c-size', (v) => setVar('--k-size', (v / 16) + 'rem'));
    bind('c-lead', (v) => setVar('--k-leading', v));
    bind('c-meas', (v) => setVar('--k-measure', v));
    bind('c-ls', (v) => { setVar('letter-spacing', v + 'em'); setVar('word-spacing', v + 'em'); });
    $('#c-reset').onclick = () => { S.over = {}; frame(); };
    $('#c-save').onclick = () => G.toast(`Saved as the ${G.kinds[S.kind].name} default. Other types keep theirs.`, { icon: 'save' });
  }
  function setVar(k, v) { S.over[k] = v; docEl.style.setProperty(k, v); }

  function status() {
    const c = docEl ? G.colophon(docEl) : {}; const st = G.stats(doc().src);
    $('#status').innerHTML = G.ui.statusbar([
      { icon: G.kinds[S.kind].icon, html: G.kinds[S.kind].name },
      { icon: 'type', html: esc(c.face || '') },
      { html: `${c.size ? c.size.toFixed(1) : ''} px / ${c.leading || ''}` },
      { icon: 'ruler', html: c.cpl ? c.cpl + ' chars per line' : 'no reflow' },
      { icon: 'book-open-text', html: `${fmt(st.words)} words · ${st.readMin} min` },
      { cmd: 'theme-menu', icon: 'palette', html: G.themes.find((t) => t.id === G.resolvedTheme()).name + ' · ' + G.typesets.find((t) => t.id === G.prefs.typeset).name }
    ]);
    G.icons($('#status'));
  }

  $('#b-open').onclick = () => (location.href = G.page('workspace') + '#doc=' + doc().id);
  $('#b-spec').onclick = () => { $('#cm').classList.toggle('no-spec'); $('#b-spec').classList.toggle('on'); };
  $$('#widthseg button').forEach((b) => b.addEventListener('click', () => { $$('#widthseg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); $('.stage').style.maxWidth = b.dataset.w === 'narrow' ? '720px' : ''; setTimeout(() => { if (S.kind === 'book') frame(); G.measureDoc(docEl); spec(); status(); }, 30); }));
  G.on('theme', () => setTimeout(() => { frame(); }, 60));
  G.on('measured', () => { if (docEl) { spec(); status(); } });
  G.on('reading-prefs', () => frame());
  ORDER.forEach((k) => G.command({ id: 'mode-' + k, name: 'Show ' + G.kinds[k].name + ' mode', icon: G.kinds[k].icon, group: 'Content modes', run: () => show(k) }));
  document.addEventListener('keydown', (e) => { if (e.target.closest('input, textarea, select')) return; if (e.altKey && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { const i = ORDER.indexOf(S.kind); show(ORDER[(i + (e.key === 'ArrowDown' ? 1 : ORDER.length - 1)) % ORDER.length]); e.preventDefault(); } });

  window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (ORDER.includes(k) && k !== S.kind) show(k); });
  G.boot({});
  show(ORDER.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'report');
  if (document.fonts) document.fonts.ready.then(() => { G.measureAll(); spec(); status(); });
})();
</script>
</body>
</html>
