<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marxy Themes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&family=Atkinson+Hyperlegible+Mono:ital,wght@0,200..800;1,200..800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/app.css">
<link rel="stylesheet" href="shared/lang-colors.css">
<style>
  /* Layout: gallery (hero) beside one detail panel for the selected theme */
  /* Left to right: app sidebar, theme list, its detail panel, then the canvas (the page preview) */
  .tw { flex: 1; min-height: 0; display: grid; grid-template-columns: 224px 360px minmax(0, 1fr); position: relative; }
  .tw.no-insp { grid-template-columns: 224px minmax(0, 1fr); }
  .tw.no-insp > .detail { display: none; }
  @media (max-width: 1180px) {
    .tw, .tw.no-insp { grid-template-columns: 224px minmax(0, 1fr); }
    .detail { position: absolute; left: 224px; top: 0; bottom: 0; width: 360px; z-index: 5; box-shadow: var(--shadow); }
  }
  .tcol { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--win); border-right: 1px solid var(--line); position: relative; }
  .tc-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 12px; border-bottom: 1px solid var(--line); min-height: 41px; }
  .tc-head h2 { margin: 0; font-size: 11px; font-weight: 650; color: var(--fg-faint); flex: 1; }
  .tc-scroll { flex: 1; overflow: auto; padding: 0 6px 16px; }
  /* The theme list: each section (Dark, Light) is the theme used in that appearance. Three states: hover (background), selected (wash and bar, being shown), in use (check). */
  .tsec { margin-top: 16px; }
  .tsec:first-child { margin-top: 8px; }
  .tsec-h { display: flex; align-items: baseline; gap: 8px; padding: 0 10px; margin: 0; font-size: 11px; font-weight: 650; color: var(--fg-faint); }
  .tsec-now { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 600; color: var(--fg-muted); }
  .tsec-now::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  .tsec-sub { padding: 0 10px; margin: 2px 0 8px; font-size: 11px; color: var(--fg-faint); line-height: 1.3; }
  .trow { position: relative; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; column-gap: 10px; align-items: center; height: 32px; padding: 0 8px 0 10px; border-radius: 6px; color: var(--fg); font-size: 12.5px; cursor: default; }
  .trow:not([aria-selected="true"]):hover { background: var(--hover); }
  .trow[aria-selected="true"] { background: var(--accent-wash); color: var(--fg-strong); }
  .trow[aria-selected="true"]::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 2px; border-radius: 1px; background: var(--accent); }
  .trow[aria-selected="true"] .tn { color: var(--fg-strong); }
  .trow:focus { outline: none; }
  .trow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .trow .tn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tr-r { display: inline-flex; align-items: center; justify-content: flex-end; min-width: 28px; }
  .tchk { display: inline-flex; color: var(--accent); }
  .tchk svg { width: 14px; height: 14px; }
  .tuse { display: none; border: 0; background: none; padding: 0 2px; font: inherit; font-size: 11.5px; color: var(--accent); cursor: pointer; }
  .tuse:hover { text-decoration: underline; text-underline-offset: 2px; }
  .trow:hover .tuse, .trow:focus-within .tuse { display: inline; }
  /* Mini swatch: a tiny page in the theme's own ground, "Aa" in its text colour, a 2px accent bar */
  .msw { width: 28px; height: 20px; border-radius: 4px; background: var(--doc); border: 1px solid var(--line-strong); position: relative; overflow: hidden; display: block; flex: none; }
  .msw b { position: absolute; left: 4px; top: 1px; font: 700 10px/1 var(--face-chrome); color: var(--fg); }
  .msw i { position: absolute; left: 4px; bottom: 3px; width: 11px; height: 2px; border-radius: 1px; background: var(--accent); }
  .kseg.compact button[aria-selected="false"] .kl { display: none; }
  .kseg button[aria-selected="true"] { background: var(--raised); color: var(--fg-strong); box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 0.5px var(--line-strong); }
  .pop { position: absolute; left: 8px; top: 44px; z-index: 20; width: 300px; padding: 12px; background: var(--raised); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow); }
  .pop[hidden] { display: none; }
  .detail { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--side); border-right: 1px solid var(--line); }
  .dhead { flex: none; padding: 12px 16px 10px; display: grid; gap: 10px; }
  .dh-id { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.primary:disabled { background: var(--accent-wash-strong); color: var(--fg-strong); border-color: var(--accent); filter: none; }
  .dh-id b { font-size: 13px; color: var(--fg-strong); display: block; }
  .dh-id .faint { font-size: 11.5px; }
  .dh-act { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .detail .insp-tabs { padding: 0 8px; overflow-x: auto; scrollbar-width: none; }
  .detail .insp-tabs button { padding: 6px 7px 8px; white-space: nowrap; }
  .detail .insp-body { padding: 16px; }
  .pk-h { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 11px; font-weight: 650; color: var(--fg-faint); }
  .pk-field { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; align-items: center; font-size: 12px; margin-top: 8px; }
  .pk-field > label { color: var(--fg-muted); display: inline-flex; gap: 6px; align-items: center; }
  .pk-field .field { height: 26px; width: 100%; font-size: 12px; }
  .pk-note { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0 0; font-size: 11.5px; line-height: 1.45; color: var(--fg-muted); }
  .pk-note svg { width: 14px; height: 14px; margin-top: 1px; color: var(--fg-faint); flex: none; }
  .pk-note b { color: var(--fg); font-weight: 600; }
  .sizerow { display: flex; gap: 8px; align-items: center; }
  .sizerow input[type="range"] { flex: 1; min-width: 0; }
  .sizerow output { font-size: 12px; min-width: 3em; text-align: right; font-variant-numeric: tabular-nums; }
  .pk-seg { display: flex; margin-bottom: 16px; }
  .pk-seg .seg { width: 100%; }
  .pk-seg .seg button { flex: 1; }

  /* Theme and type set rows: listbox options */
  .tsrow { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 9px; align-items: center; padding: 5px 8px; border-radius: 8px; color: var(--fg); outline-offset: -2px; }
  .tr-main { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .tr-name { display: flex; align-items: center; gap: 5px; font-weight: 600; color: var(--fg-strong); white-space: nowrap; min-width: 0; }
  .tr-name .t { overflow: hidden; text-overflow: ellipsis; }
  .ck { color: var(--accent); display: inline-flex; }
  .ck svg { width: 14px; height: 14px; }
  .ts-ag { width: 44px; height: 32px; display: grid; place-items: center; border-radius: 6px; background: var(--raised); border: 1px solid var(--line); font-family: var(--face-book); font-size: 19px; color: var(--fg-strong); }
  .ts-line { display: flex; gap: 8px; font-size: 12px; color: var(--fg-muted); white-space: nowrap; overflow: hidden; }

  /* Theme swatch: a tiny page drawn in the theme's own tokens */
  .tsw { width: 44px; height: 30px; border-radius: 6px; background: var(--doc); border: 1px solid var(--line-strong); position: relative; overflow: hidden; display: block; flex: none; }
  .tsw i { position: absolute; display: block; border-radius: 2px; }
  .tsw .s1 { left: 0; top: 0; bottom: 0; width: 9px; background: var(--side); border-right: 1px solid var(--line); border-radius: 0; }
  .tsw .l1 { left: 14px; top: 6px; width: 20px; height: 3px; background: var(--fg); }
  .tsw .l2 { left: 14px; top: 12px; width: 13px; height: 3px; background: var(--fg-muted); }
  .tsw .a { right: 5px; top: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .tsw .k1 { left: 14px; bottom: 6px; width: 6px; height: 3px; background: var(--tk-keyword); }
  .tsw .k2 { left: 22px; bottom: 6px; width: 9px; height: 3px; background: var(--tk-string); }
  .tsw .k3 { left: 33px; bottom: 6px; width: 6px; height: 3px; background: var(--tk-comment); }

  /* Contrast badge: shown only when a pair fails (words and an icon, never colour alone) */
  .ctr { display: inline-flex; align-items: center; gap: 3px; height: 18px; padding: 0 5px; border-radius: 4px; font: 600 10.5px/1 var(--face-chrome); font-variant-numeric: tabular-nums; border: 1px solid var(--line-strong); color: var(--fg-muted); background: var(--raised); white-space: nowrap; }
  .ctr b { font-weight: 750; color: var(--fg-strong); letter-spacing: .02em; }
  .ctr.fail { color: var(--err); border-color: var(--err); background: var(--err-wash); }
  .ctr.fail b { color: var(--err); }
  .ctr svg { width: 11px; height: 11px; }

  /* Preview pane */
  .stagepane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--doc); }
  .pvbar { flex: none; display: flex; align-items: center; gap: 8px; padding: 5px 10px; min-height: 38px; background: var(--win); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--fg-muted); flex-wrap: wrap; }
  .pvbar b { color: var(--fg-strong); font-weight: 600; }
  .pvbar .seg button { height: 22px; padding: 0 8px; font-size: 12px; }
  .pvbar .tb-btn { height: 24px; min-width: 26px; }
  .colo { flex: none; display: flex; flex-wrap: wrap; gap: 3px 14px; padding: 6px 12px; font-size: 11.5px; color: var(--fg-muted); background: var(--win); border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .colo b { color: var(--fg-strong); font-weight: 600; }
  .colo > span { display: inline-flex; gap: 4px; align-items: center; }
  .pv { flex: 1; min-height: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
  .pvcol { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--doc); color: var(--fg); }
  .pvscroll { flex: 1; overflow: auto; min-height: 0; position: relative; }
  .pvscroll:focus-visible { outline-offset: -2px; }
  .pvsizer { position: relative; margin: 0 auto; }
  .pvstage { background: var(--doc); }
  .pvstage.scaled { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .pvstage > .doc { padding-bottom: 3em; }

  /* Inspector */
  .tinsp { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--side); border-left: 1px solid var(--line); }
  .tinsp .insp-tabs button { padding: 6px 7px 8px; }
  .tinsp .insp-sec h4 { font-size: 11.5px; }
  .ihead { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; margin-bottom: 10px; }
  .ihead b { font-size: 13px; color: var(--fg-strong); }
  .ihead .faint { font-size: 11.5px; line-height: 1.35; }
  .sumline { display: flex; gap: 7px; align-items: flex-start; font-size: 12px; color: var(--fg-muted); margin: 0 0 8px; line-height: 1.45; }
  .sumline > svg { color: var(--ok); margin-top: 1px; }
  .sumline.bad > svg { color: var(--err); }
  .sumline b { color: var(--fg-strong); }
  .hint { font-size: 11.5px; color: var(--fg-muted); line-height: 1.45; margin: 6px 0 0; }
  .tkgrp-h { font-size: 11px; font-weight: 650; color: var(--fg-faint); margin: 12px 0 3px; display: flex; gap: 5px; flex-wrap: wrap; }
  .tkgrp-h span { font-weight: 400; }
  .tkrow { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 6px; width: 100%; border: 0; background: none; text-align: left; color: var(--fg); }
  .tkrow:hover { background: var(--hover); }
  .tkrow .nm, .optrow .nm { font-size: 12px; line-height: 1.3; min-width: 0; }
  .tkrow .nm small, .optrow .nm small { display: block; font-size: 11px; color: var(--fg-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tkrow .nm small.mono { font-family: var(--face-code); font-size: 10.5px; }
  .tkrow .rt { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .sw { width: 24px; height: 24px; border-radius: 5px; border: 1px solid var(--line-strong); display: grid; place-items: center; position: relative; overflow: hidden; flex: none; }
  .sw > i { position: absolute; inset: 0; }
  .sw > b { position: relative; font: 650 10px var(--face-chrome); color: var(--fg); }
  .aurow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto 64px; gap: 6px; font-size: 11px; padding: 3px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .aurow.bad { color: var(--err); }
  .aurow span:last-child { display: inline-flex; gap: 3px; align-items: center; justify-content: flex-end; }
  .aurow svg { width: 12px; height: 12px; }
  .kv2 { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 6px 8px; align-items: center; font-size: 12px; }
  .kv2 > span { color: var(--fg-muted); }
  .accs { display: flex; flex-wrap: wrap; gap: 7px; }
  .acc { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--raised); box-shadow: 0 0 0 1px var(--line-strong); position: relative; padding: 0; }
  .acc[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--fg-strong); }
  .acc.bad::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(to top right, transparent 44%, var(--raised) 44%, var(--raised) 56%, transparent 56%); }
  .refuse, .accept { display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--err); background: var(--err-wash); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.45; margin: 8px 0 0; color: var(--fg); }
  .refuse > svg { color: var(--err); flex: none; margin-top: 2px; }
  .accept { border-color: var(--ok); background: var(--ok-wash); }
  .accept > svg { color: var(--ok); flex: none; margin-top: 2px; }
  .slider { display: flex; gap: 8px; align-items: center; font-size: 11.5px; margin-top: 6px; }
  .slider input[type="range"] { flex: 1; min-width: 0; }
  .slider output { font-variant-numeric: tabular-nums; min-width: 2.5em; text-align: right; font-size: 12px; color: var(--fg); }
  .optrow { display: grid; grid-template-columns: 16px auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 6px; width: 100%; border: 0; background: none; color: var(--fg); text-align: left; }
  .optrow:hover { background: var(--hover); }
  .optrow[aria-checked="true"] { background: var(--accent-wash-strong); }
  .optrow[aria-disabled="true"] .nm { color: var(--fg-muted); }
  .rdot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--edge); display: grid; place-items: center; background: var(--raised); }
  .optrow[aria-checked="true"] .rdot::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .dots { display: inline-flex; gap: 3px; padding: 4px 5px; border-radius: 5px; background: var(--inset); border: 1px solid var(--line); }
  .dots i { width: 8px; height: 8px; border-radius: 50%; display: block; }
  .ssw { width: 34px; height: 22px; border-radius: 4px; border: 1px solid var(--line-strong); background: var(--doc); display: grid; place-items: center; position: relative; overflow: hidden; }
  .ssw > i { position: absolute; inset: 3px 4px; border-radius: 2px; }
  .ssw > b { position: relative; font: 600 11px var(--face-chrome); color: var(--fg); }
  .ktable { width: 100%; border-collapse: collapse; font-size: 12px; }
  .ktable th, .ktable td { padding: 3px 3px; border-bottom: 1px solid var(--line); text-align: left; font-weight: 400; }
  .ktable thead th { font-size: 11px; color: var(--fg-faint); font-weight: 650; }
  .ktable tbody th { white-space: nowrap; color: var(--fg); }
  .ktable tbody th svg { width: 13px; height: 13px; vertical-align: -2px; color: var(--fg-muted); }
  .ktable .field { height: 24px; font-size: 11.5px; width: 100%; padding: 0 4px; }
  .prec { margin: 0; padding-left: 1.3em; font-size: 12px; line-height: 1.45; color: var(--fg); }
  .prec li + li { margin-top: 4px; }
  .arow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line); font-size: 12px; }
  .arow:first-of-type { border-top: 0; }
  .arow b { font-weight: 600; color: var(--fg-strong); }
  .arow .field { height: 24px; font-size: 12px; }
  .ev { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; font-size: 12px; line-height: 1.45; padding: 6px 0; border-top: 1px solid var(--line); }
  .grade { width: 20px; height: 20px; border-radius: 4px; display: grid; place-items: center; font: 750 11px var(--face-chrome); }
  .grade.A { background: var(--fg-strong); color: var(--doc); }
  .grade.B { background: var(--accent-wash-strong); color: var(--fg-strong); border: 1px solid var(--accent); }
  .grade.C { border: 1px solid var(--edge); color: var(--fg-strong); }
  .grade.D { border: 1px dashed var(--edge); color: var(--fg-muted); }
  .spec-frame { border-radius: 9px; margin-top: 8px; }
  .spec-frame .cb { font-size: 12px; }
  .spec-frame pre { white-space: pre; }
  .tkleg { display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 11px; color: var(--fg-muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .tkleg b { color: var(--fg-strong); font-weight: 600; }

  /* Code highlighting modes, app-wide (handbook ch. 6) */
  html.hl-minimal :is(.tk-k, .tk-t, .tk-p) { color: inherit; }
  html.hl-off :is(.tk-c, .tk-k, .tk-s, .tk-n, .tk-d, .tk-t, .tk-p, .tk-m, .tk-h, .tk-l) { color: inherit; }
  html.cm-upright .tk-c { font-style: normal; }
  html.defs-plain .tk-d { font-weight: inherit; }
  html.reduce-motion *, html.reduce-motion *::before, html.reduce-motion *::after { animation: none !important; transition: none !important; }

  /* Forced-colours preview: system colours replace the palette, as the OS would */
  [data-theme].sim-forced {
    --win: Canvas; --side: Canvas; --doc: Canvas; --raised: Canvas; --inset: Canvas; --hover: transparent; --press: transparent;
    --line: GrayText; --line-strong: CanvasText; --edge: ButtonBorder; --fg: CanvasText; --fg-strong: CanvasText; --fg-muted: CanvasText; --fg-faint: GrayText;
    --accent: LinkText; --accent-strong: LinkText; --accent-fg: Canvas; --accent-wash: transparent; --accent-wash-strong: transparent; --sel: Highlight; --mark: Mark; --mark-edge: CanvasText;
    --ok: CanvasText; --warn: CanvasText; --err: CanvasText; --info: CanvasText; --ok-wash: transparent; --warn-wash: transparent; --err-wash: transparent;
    --tk-comment: CanvasText; --tk-keyword: CanvasText; --tk-string: CanvasText; --tk-constant: CanvasText; --tk-def: CanvasText; --tk-type: CanvasText; --tk-punct: CanvasText; --tk-marker: CanvasText; --tk-heading: CanvasText; --tk-link: LinkText;
    --add-wash: transparent; --del-wash: transparent; --glass: Canvas; --shadow: none;
  }
  [data-theme].sim-forced .adm { border-left-color: CanvasText; }

  /* App chrome miniature */
  .mini { padding: 18px; display: flex; flex-direction: column; gap: 18px; font-family: var(--face-chrome); font-size: 12px; }
  .mini-desk { border-radius: 14px; padding: 16px; border: 1px solid var(--line); background: radial-gradient(circle at 12% 18%, var(--accent-wash-strong), transparent 42%), radial-gradient(circle at 85% 80%, var(--ok-wash), transparent 48%), radial-gradient(circle at 55% 8%, var(--warn-wash), transparent 40%), var(--win); }
  .mini-win { display: grid; grid-template-columns: 150px minmax(0, 1fr); height: 330px; border-radius: 11px; overflow: hidden; border: 1px solid var(--line-strong); box-shadow: var(--shadow); }
  .mini-side { background: var(--glass); backdrop-filter: blur(16px) saturate(1.5); -webkit-backdrop-filter: blur(16px) saturate(1.5); border-right: 1px solid var(--line); padding: 0 6px 8px; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  html.solid .mini-side { background: var(--side); backdrop-filter: none; -webkit-backdrop-filter: none; }
  .mini-side .lights { padding: 10px 6px 4px; gap: 6px; }
  .mini-side .lights span { width: 9px; height: 9px; }
  .mini-side .side-search { margin: 4px 2px 4px; height: 22px; font-size: 11px; }
  .mini-side .side-h { padding: 8px 6px 3px; font-size: 10px; }
  .mini-side .nav-item { height: 22px; font-size: 11.5px; padding: 0 6px; gap: 6px; }
  .mini-side .nav-item svg { width: 13px; height: 13px; }

<script type="text/plain" data-spec="rust" data-file="cache.rs">
//! A small cache for rendered pages, keyed by content hash.

use std::collections::HashMap;
use std::time::{Duration, Instant};

/// How long an entry may be served before it is rebuilt.
const MAX_AGE: Duration = Duration::from_secs(300);

#[derive(Debug, Clone, PartialEq)]
pub enum Source {
    Disk(String),
    Memory,
}

/// One cached page: the HTML, where it came from, and when it was made.
pub struct Entry {
    html: String,
    source: Source,
    made: Instant,
}

pub struct Cache {
    entries: HashMap<u64, Entry>,
    limit: usize,
}

impl Cache {
    pub fn new(limit: usize) -> Self {
        Cache { entries: HashMap::new(), limit }
    }

    /// Insert a page, evicting the oldest entry when the cache is full.
    pub fn insert(&mut self, hash: u64, html: &str) -> Option<String> {
        if self.entries.len() >= self.limit {
            self.evict();
        }
        let entry = Entry { html: html.to_string(), source: Source::Memory, made: Instant::now() };
        self.entries.insert(hash, entry).map(|old| old.html)
    }

    pub fn get(&self, hash: u64) -> Result<&str, String> {
        match self.entries.get(&hash) {
            Some(e) if e.made.elapsed() < MAX_AGE => Ok(&e.html),
            Some(_) => Err(format!("entry {hash:#x} is stale")), // rebuild it
            None => Err("not cached".into()),
        }
    }
}
</script>
<script type="text/plain" data-spec="typescript" data-file="cache.ts">
// A small cache for rendered pages, keyed by content hash.

type Source = "disk" | "memory";

/** One cached page: the HTML, where it came from, and when it was made. */
interface Entry {
  html: string;
  source: Source;
  made: number;
}

const MAX_AGE = 5 * 60 * 1000; // five minutes

export class Cache {
  private entries = new Map<number, Entry>();

  constructor(private readonly limit: number = 64) {}

  /** Insert a page, evicting the oldest entry when the cache is full. */
  insert(hash: number, html: string): string | undefined {
    if (this.entries.size >= this.limit) {
      this.evict();
    }
    const old = this.entries.get(hash);
    this.entries.set(hash, { html, source: "memory", made: Date.now() });
    return old?.html;
  }

  get(hash: number): string {
    const entry = this.entries.get(hash);
    if (!entry) throw new Error(`entry ${hash} is not cached`);
    if (Date.now() - entry.made > MAX_AGE) {
      this.entries.delete(hash);
      throw new Error("stale");
    }
    return entry.html;
  }

  private evict(): void {
    const [oldest] = this.entries.keys();
    this.entries.delete(oldest);
  }
}
</script>
<script type="text/plain" data-spec="javascript" data-file="cache.js">
// A small cache for rendered pages, keyed by content hash.

const MAX_AGE = 5 * 60 * 1000; // five minutes

/**
 * One cached page: the HTML, where it came from, and when it was made.
 * @typedef {{ html: string, source: "disk" | "memory", made: number }} Entry
 */

export class Cache {
  #entries = new Map();

  constructor(limit = 64) {
    this.limit = limit;
  }

  /** Insert a page, evicting the oldest entry when the cache is full. */
  insert(hash, html) {
    if (this.#entries.size >= this.limit) {
      this.#evict();
    }
    const old = this.#entries.get(hash);
    this.#entries.set(hash, { html, source: "memory", made: Date.now() });
    return old ? old.html : undefined;
  }

  get(hash) {
    const entry = this.#entries.get(hash);
    if (!entry) throw new Error(`entry ${hash} is not cached`);
    if (Date.now() - entry.made > MAX_AGE) {
      this.#entries.delete(hash);
      return null;
    }
    return entry.html;
  }

  #evict() {
    const [oldest] = this.#entries.keys();
    this.#entries.delete(oldest);
  }

"""A small cache for rendered pages, keyed by content hash."""

import time
from dataclasses import dataclass, field

MAX_AGE = 5 * 60  # seconds


@dataclass
class Entry:
    """One cached page: the HTML, where it came from, and when it was made."""

    html: str
    source: str = "memory"
    made: float = field(default_factory=time.monotonic)


class Cache:
    def __init__(self, limit: int = 64) -> None:
        self.limit = limit
        self._entries: dict[int, Entry] = {}

    def insert(self, key: int, html: str) -> str | None:
        """Insert a page, evicting the oldest entry when the cache is full."""
        if len(self._entries) >= self.limit:
            self._evict()
        old = self._entries.get(key)
        self._entries[key] = Entry(html)
        return old.html if old else None

    def get(self, key: int) -> str:
        entry = self._entries.get(key)
        if entry is None:
            raise KeyError(f"entry {key} is not cached")
        if time.monotonic() - entry.made > MAX_AGE:
            del self._entries[key]
            raise TimeoutError("stale")
        return entry.html

    def _evict(self) -> None:
        oldest = next(iter(self._entries))
        del self._entries[oldest]

// Package cache holds rendered pages, keyed by content hash.
package cache

import (
	"errors"
	"sync"
	"time"
)

// MaxAge is how long an entry may be served before it is rebuilt.
const MaxAge = 5 * time.Minute

var ErrStale = errors.New("cache: entry is stale")

// Entry is one cached page: the HTML and when it was made.
type Entry struct {
	HTML string
	Made time.Time
}

// Cache is safe for concurrent use.
type Cache struct {
	mu      sync.Mutex
	entries map[uint64]Entry
	limit   int
}

func New(limit int) *Cache {
	return &Cache{entries: make(map[uint64]Entry), limit: limit}
}

// Insert stores a page, evicting an entry when the cache is full.
func (c *Cache) Insert(hash uint64, html string) {
	c.mu.Lock()
	defer c.mu.Unlock()
	if len(c.entries) >= c.limit {
		for k := range c.entries {
			delete(c.entries, k)
			break
		}
	}
	c.entries[hash] = Entry{HTML: html, Made: time.Now()}
}

# Roll a build out to staging, then check it answers.
set -euo pipefail

readonly HOST="staging.example.org"
readonly RELEASE="${1:-latest}"

log() {
  printf '%s %s\n' "$(date +%H:%M:%S)" "$*"
}

build() {
  log "building $RELEASE"
  cargo build --release --locked
}

ship() {
  local target="/srv/app/releases/$RELEASE"
  rsync -az --delete ./target/release/ "deploy@$HOST:$target/"
  ssh "deploy@$HOST" ln -sfn "$target" /srv/app/current
}

check() {
  for attempt in 1 2 3; do
    if curl --silent --fail "https://$HOST/health" > /dev/null; then
      log "healthy after $attempt tries"
      return 0
    fi
    sleep 2
  done
  return 1
}

build && ship && check || { log "rollout failed"; exit 1; }

<script type="text/plain" data-spec="markdown" data-file="README.md">
# Tidemark

A reader for source of any kind: **Markdown**, code, logs and data.
It opens anything at once and shows exactly what a file contains.

## Install

```bash
brew install tidemark
tidemark ~/Work/plans
```

## Why another reader?

- Reads first; the editor is there when you need it.
- Nothing leaves the machine without your say-so.
- Every link shows its real target, see [the privacy notes](docs/privacy.md).

> [!NOTE]
> Tidemark keeps its own state in plain files, apart from your documents.

### Options

| Flag        | Default | Meaning                  |
| ----------- | ------- | ------------------------ |
| `--watch`   | on      | Re-render on disk change |
| `--theme`   | system  | A theme name or `auto`   |

1. Open a folder.
2. Press `⌘K` and type a few letters.
3. [ ] Read something good.

<script type="text/plain" data-spec="swift" data-file="Cache.swift">
// A small cache for rendered pages, keyed by content hash.
import Foundation

/// How long an entry may be served before it is rebuilt.
let maxAge: TimeInterval = 5 * 60

struct Entry {
    let html: String
    let made: Date
}

enum CacheError: Error {
    case missing(UInt64)
    case stale
}

final class Cache {
    private var entries: [UInt64: Entry] = [:]
    private let limit: Int

    init(limit: Int = 64) {
        self.limit = limit
    }

    /// Insert a page, evicting the oldest entry when the cache is full.
    @discardableResult
    func insert(_ hash: UInt64, html: String) -> String? {
        if entries.count >= limit, let oldest = entries.min(by: { $0.value.made < $1.value.made }) {
            entries.removeValue(forKey: oldest.key)
        }
        let old = entries[hash]?.html
        entries[hash] = Entry(html: html, made: Date())
        return old
    }

    func get(_ hash: UInt64) throws -> String {
        guard let entry = entries[hash] else { throw CacheError.missing(hash) }
        if Date().timeIntervalSince(entry.made) > maxAge { throw CacheError.stale }
        return entry.html
    }
}

/* A small cache for rendered pages, keyed by content hash. */
#include <stdint.h>
#include <stdlib.h>
#include <string.h>
#include <time.h>

#define MAX_AGE 300 /* seconds */

typedef struct {
    uint64_t hash;
    char *html;
    time_t made;
} Entry;

typedef struct {
    Entry *entries;
    size_t len;
    size_t limit;
} Cache;

Cache *cache_new(size_t limit) {
    Cache *c = malloc(sizeof *c);
    if (c == NULL) return NULL;
    c->entries = calloc(limit, sizeof(Entry));
    c->len = 0;
    c->limit = limit;
    return c;
}

/* Insert a page; returns 0 on success, -1 when the cache is full. */
static int cache_insert(Cache *c, uint64_t hash, const char *html) {
    if (c->len >= c->limit) return -1;
    Entry *e = &c->entries[c->len++];
    e->hash = hash;
    e->html = strdup(html);
    e->made = time(NULL);
    return 0;
}

// A small cache for rendered pages, keyed by content hash.
#include <chrono>
#include <optional>
#include <string>
#include <unordered_map>

using Clock = std::chrono::steady_clock;
constexpr auto kMaxAge = std::chrono::minutes(5);

struct Entry {
    std::string html;
    Clock::time_point made;
};

class Cache {
public:
    explicit Cache(std::size_t limit = 64) : limit_(limit) {}

    // Insert a page, evicting an entry when the cache is full.
    bool insert(std::uint64_t hash, std::string html) {
        if (entries_.size() >= limit_) {
            entries_.erase(entries_.begin());
        }
        return entries_.emplace(hash, Entry{std::move(html), Clock::now()}).second;
    }

    std::optional<std::string> get(std::uint64_t hash) const {
        auto it = entries_.find(hash);
        if (it == entries_.end()) return std::nullopt;
        if (Clock::now() - it->second.made > kMaxAge) return std::nullopt;
        return it->second.html;
    }

private:
    std::unordered_map<std::uint64_t, Entry> entries_;
    std::size_t limit_;
};

package org.example.cache;

import java.time.Duration;
import java.time.Instant;
import java.util.LinkedHashMap;
import java.util.Map;
import java.util.Optional;

/** A small cache for rendered pages, keyed by content hash. */
public final class Cache {
    private static final Duration MAX_AGE = Duration.ofMinutes(5);

    /** One cached page: the HTML and when it was made. */
    private record Entry(String html, Instant made) {}

    private final Map<Long, Entry> entries = new LinkedHashMap<>();
    private final int limit;

    public Cache(int limit) {
        this.limit = limit;
    }

    /** Insert a page, evicting the oldest entry when the cache is full. */
    public synchronized boolean insert(long hash, String html) {
        if (entries.size() >= limit) {
            Long oldest = entries.keySet().iterator().next();
            entries.remove(oldest);
        }
        return entries.put(hash, new Entry(html, Instant.now())) == null;
    }

    public synchronized Optional<String> get(long hash) {
        Entry entry = entries.get(hash);
        if (entry == null || Duration.between(entry.made(), Instant.now()).compareTo(MAX_AGE) > 0) {
            return Optional.empty();
        }
        return Optional.of(entry.html());
    }
}

# A small cache for rendered pages, keyed by content hash.
module Tidemark
  MAX_AGE = 5 * 60 # seconds

  class Cache
    Entry = Struct.new(:html, :made)

    # Build a cache that holds at most +limit+ pages.
    def initialize(limit: 64)
      @limit = limit
      @entries = {}
    end

    # Insert a page, evicting the oldest entry when the cache is full.
    def insert(hash, html)
      evict if @entries.size >= @limit
      old = @entries[hash]
      @entries[hash] = Entry.new(html, Time.now)
      old&.html
    end

    def get(hash)
      entry = @entries.fetch(hash) { raise KeyError, "entry #{hash} is not cached" }
      return nil if Time.now - entry.made > MAX_AGE

      entry.html
    end

    private

    def evict
      oldest = @entries.keys.first
      @entries.delete(oldest)
    end
  end
end

  const EXT = { rs: 'rust', ts: 'typescript', tsx: 'typescript', js: 'javascript', mjs: 'javascript', py: 'python', go: 'go', sh: 'shell', bash: 'shell', zsh: 'shell', json: 'json', yaml: 'yaml', yml: 'yaml', toml: 'toml', md: 'markdown', markdown: 'markdown', css: 'css', html: 'html', sql: 'sql', swift: 'swift', c: 'c', h: 'c', cpp: 'cpp', java: 'java', rb: 'ruby' };

  // The tint takes the brand hue, lets lightness (never hue) move until every code pair passes 4.5:1 on this theme's

  function langTint(t, brand, strength) {

  // @scope with a donut limit: the nearest [data-theme] ancestor wins, so a column in another theme is tinted for its own theme.

    if (syntaxOn()) { const ids = LANGS.map((l) => l.id); const i = ids.indexOf(S.syLang); const j = e.key === 'ArrowRight' ? Math.min(ids.length - 1, i + 1) : e.key === 'ArrowLeft' ? Math.max(0, i - 1) : null; if (j != null) { e.preventDefault(); setSyLang(ids[j]); const n = $(`#kt-${ids[j]}`); n && n.focus(); } return; }
    const TABS = kindList(); const i = TABS.indexOf(S.kind); let j = null;
    if (e.key === 'ArrowRight') j = (i + 1) % TABS.length; else if (e.key === 'ArrowLeft') j = (i - 1 + TABS.length) % TABS.length; else if (e.key === 'Home') j = 0; else if (e.key === 'End') j = TABS.length - 1;
    if (j != null) { e.preventDefault(); setKind(TABS[j]); $(`#kt-${TABS[j]}`).focus(); }
  });
  $('#pvbar').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.closest('#fitseg')) { S.fit = b.dataset.v === 'fit'; renderPvbar(); return afterLayout(); }
    if (b.id === 'pv-rule') { S.ignoreRule = !S.ignoreRule; return refresh(); }
    if (b.id === 'pv-open') { location.href = G.page('workspace') + '#doc=' + DOCS[S.kind]; return; }
    if (b.id === 'pv-typo') { location.href = G.page('kinds') + '#' + S.kind; }
  });
  function toggleInsp() { const off = $('#tw').classList.toggle('no-insp'); $('#b-insp').classList.toggle('on', !off); $('#b-insp').setAttribute('aria-pressed', String(!off)); afterLayout(); }
  $('#b-insp').addEventListener('click', toggleInsp);

  $('#itabs').addEventListener('click', (e) => { const b = e.target.closest('[data-it]'); if (b) { S.itab = b.dataset.it; tabChanged(); } });
  $('#itabs').addEventListener('keydown', (e) => {
    const tabs = $$('#itabs [data-it]'); const i = tabs.findIndex((t) => t.dataset.it === S.itab); let j = null;
    if (e.key === 'ArrowRight') j = (i + 1) % tabs.length; else if (e.key === 'ArrowLeft') j = (i - 1 + tabs.length) % tabs.length;
    if (j != null) { e.preventDefault(); S.itab = tabs[j].dataset.it; tabChanged(); tabs[j].focus(); }
  });
  $('#ibody').addEventListener('keydown', (e) => { if (e.target.closest('#tslist')) listKeys(e, '.tsrow', (r) => G.setPref('typeset', r.dataset.ts)); else synKeys(e); });
  $('#ibody').addEventListener('mouseover', (e) => { if (S.itab !== 'syntax') return; const r = e.target.closest('.role'); setRoleHover(r ? r.dataset.role : null); });
  $('#ibody').addEventListener('mouseleave', () => setRoleHover(null));
  $('#ibody').addEventListener('focusin', (e) => { if (S.itab !== 'syntax') return; const r = e.target.closest('.role'); if (r) setRoleHover(r.dataset.role); });
  // Canvas linkage: click any token in the specimen to select its role and open its picker.
  $('#pv').addEventListener('click', (e) => { if (!syntaxOn()) return; const t = e.target.closest('[data-role]'); if (t) openRole(t.dataset.role, true); });
  $('#ibody').addEventListener('click', (e) => {
    const tr = e.target.closest('.tsrow'); if (tr) return G.setPref('typeset', tr.dataset.ts);
    if (synClick(e)) return;
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    if (b.closest('#cseg')) { S.ctab = b.dataset.v; return renderInspector(); }
    if (b.dataset.copy) return G.copy(b.dataset.copy, { as: 'colour', clean: false });
    if (b.closest('#tkf')) { S.tkFilter = b.dataset.v; return renderInspector(); }
    if (b.dataset.acc) return tryAccent(b.dataset.acc);
    if (b.id === 'acc-apply') return tryAccent($('#acc-hex').value.trim());
    if (b.id === 'acc-use') return tryAccent(b.dataset.hex);
    if (b.id === 'acc-dismiss') { S.accentMsg = null; return renderInspector(); }
    if (b.id === 'acc-reset') { S.accentMsg = null; return setTweak(S.focus, { accent: null }); }
    if (b.closest('#wt-seg')) return setTweak(S.focus, { weight: b.dataset.v === 'auto' ? null : +BASE[S.focus]['text-wght'] });
    if (b.dataset.sel) return trySel(b.dataset.sel);
    if (b.id === 'k-preset') { S.kind = 'book'; setObj('kindThemes', { book: 'sepia', code: 'night' }); return G.toast('Books open in Sepia, code in Night', { icon: 'swatch-book' }); }
    if (b.id === 'k-clear') { G.setPref('kindTypesets', {}); return G.setPref('kindThemes', {}); }
    if (b.id === 'a-simhc') { S.simContrast = !S.simContrast; return G.applyTheme(); }
    if (b.id === 'a-forced') { S.simForced = !S.simForced; return refresh(); }
    if (b.closest('#a-boost')) return G.setPref('darkSizeBoost', +b.dataset.v);
  });
  $('#ibody').addEventListener('change', (e) => {
    const x = e.target;
    if (synChange(x)) return;
    if (x.id === 'a-hc') return G.setPref('followSystemContrast', x.checked);
    if (x.id === 'a-rt') return G.setPref('reduceTransparency', x.value);
    if (x.id === 'a-rm') return G.setPref('reduceMotion', x.value);
    if (x.id === 'acc-pick') return tryAccent(x.value);
    if (x.id === 'acc-hex') return tryAccent(x.value.trim());
    if (x.dataset.kt) { const o = Object.assign({}, G.prefs.kindThemes); if (x.value) o[x.dataset.kt] = x.value; else delete o[x.dataset.kt]; S.kind = x.dataset.kt; return G.setPref('kindThemes', o); }
    if (x.dataset.ks) { const o = Object.assign({}, G.prefs.kindTypesets); if (x.value) o[x.dataset.ks] = x.value; else delete o[x.dataset.ks]; S.kind = x.dataset.ks; return G.setPref('kindTypesets', o); }
    if (x.id === 'wt' || x.id === 'warm') { S.skipInsp = false; renderInspector(); }
  });
  $('#ibody').addEventListener('input', (e) => {
    const x = e.target;
    if (x.id === 'scale') { S.skipInsp = true; G.setPref('scale', +x.value / 100); S.skipInsp = false; $('#scale-out').textContent = x.value + '%'; return; }
    if (synInput(x)) return;
    if (x.id === 'acc-pick') { $('#acc-hex').value = x.value; return; }
    if (x.id === 'wt') { $('#wt-out').textContent = x.value; S.skipInsp = true; setTweak(S.focus, { weight: +x.value }); S.skipInsp = false; return; }
    if (x.id === 'warm') {
      const w = +x.value; const e2 = effective(S.focus, { warmth: w }); const f = audit(e2).filter((r) => !r.pass);
      $('#warm-out').textContent = (w > 0 ? '+' : '') + w;
      if (f.length) { $('#warm-note').textContent = `Refused: ${LABEL[f[0].f]} on ${SL[f[0].s] || f[0].s} would fall to ${f[0].r.toFixed(2)}:1.`; return; }
      $('#warm-note').textContent = '';
      S.skipInsp = true; setTweak(S.focus, { warmth: w }); S.skipInsp = false;
    }
  });

  /* ---------- Syntax tab events ---------- */
  function synClick(e) {
    if (!e.target.closest('.syn')) return false;
    const cr = e.target.closest('[data-cr="all"]'); if (cr) { S.syLevel = 1; S.syRole = null; PK.tk = null; renderInspector(); setRoleHover(null); return true; }
    const row = e.target.closest('.lrow2'); if (row) { S.syLang = row.dataset.sylang; S.syLevel = 2; S.syRole = null; PK.tk = null; syncCanvas(); renderInspector(); return true; }
    const b = e.target.closest('button'); if (!b || b.disabled) return true;
    if (b.closest('#hl-seg')) { setSyn(S.focus, { hl: b.dataset.v }); renderInspector(); renderStatus(); return true; }
    if (b.closest('#src-seg')) { chooseSrc(shownFocus(), synLang(), b.dataset.v); return true; }
    if (b.classList.contains('role')) { openRole(b.dataset.role); return true; }
    if (b.id === 'pk-reset') { setLov(shownFocus(), synLang().id, PK.tk, null); writeLangCss(); PK.tk = null; renderInspector(); return true; }
    if (b.id === 'ly-reset') { resetLang(shownFocus(), synLang()); return true; }
    return true;
  }
  function synChange(x) {
    if (!x.closest('.syn')) return false;
    if (x.id === 'cm-it') { G.setPref('codeComments', x.checked ? 'italic' : 'upright'); return true; }
    if (x.id === 'defs-b') { G.setPref('codeDefsBold', x.checked); return true; }
    if (x.id === 'br-on') { setSyn(S.focus, { brand: x.checked ? null : false }); renderInspector(); return true; }
    if (x.id === 'pk-hex') { const v = x.value.trim(); if (/^#?[0-9a-f]{6}$/i.test(v)) setPickerFromHex(v[0] === '#' ? v : '#' + v, PK.alt); else paintPicker(); return true; }
    return true;
  }
  function synInput(x) {
    if (!x.closest('.syn')) return false;
    if (x.id === 'tone') {
      const R0 = themeCommentRatio(shownFocus()); let r = toneRange[0] + (+x.value / 100) * (toneRange[1] - toneRange[0]); if (Math.abs(r - R0) < 0.15) r = R0;
      $('#tone-o').textContent = r.toFixed(1) + ':1'; x.setAttribute('aria-valuetext', r.toFixed(1) + ' to 1');
      S.skipInsp = true; G.setPref('codeCommentContrast', r === R0 ? null : +r.toFixed(2)); S.skipInsp = false; return true;
    }
    if (x.id === 'br-s') { $('#br-o').textContent = x.value + '%'; setSyn(S.focus, { strength: +x.value === 60 ? null : +x.value }); const l = $('#sy-list'); if (l) l.innerHTML = langRows(shownFocus()); return true; }
    if (x.id === 'sy-q') { S.syQ = x.value; const l = $('#sy-list'); if (l) l.innerHTML = langRows(shownFocus()); return true; }
    if (x.dataset.pk) { const v = +x.value; if (x.dataset.pk === 'L') PK.L = v / 1000; else if (x.dataset.pk === 'C') PK.C = v / 1000; else PK.H = v; commitPicker(x.dataset.pk); return true; }
    return true;
  }
  function synKeys(e) {
    if (S.itab !== 'syntax') return;
    const row = e.target.closest && e.target.closest('.lrow2');
    if (row) {
      const rows = $$('.lrow2', $('#sy-list')); const i = rows.indexOf(row); let j = null;
      if (e.key === 'ArrowDown') j = Math.min(rows.length - 1, i + 1); else if (e.key === 'ArrowUp') j = Math.max(0, i - 1); else if (e.key === 'Home') j = 0; else if (e.key === 'End') j = rows.length - 1;
      else if (e.key === 'Enter') { e.preventDefault(); S.syLang = row.dataset.sylang; S.syLevel = 2; S.syRole = null; PK.tk = null; syncCanvas(); renderInspector(); return; }
      if (j != null) { e.preventDefault(); const id = rows[j].dataset.sylang; S.syLang = id; syncCanvas(); const l = $('#sy-list'); l.innerHTML = langRows(shownFocus()); const n = $(`.lrow2[data-sylang="${id}"]`, l); n && n.focus(); }
      return;
    }
    if (S.syLevel === 2 && e.key === 'Escape' && !e.target.matches('input')) { e.stopPropagation(); S.syLevel = 1; S.syRole = null; PK.tk = null; renderInspector(); setRoleHover(null); }
  }

  /* ---------- Commands and keys ---------- */

  const setHl = (m) => { setSyn(S.focus, { hl: m }); refresh(); };
  const cycleHl = () => setHl({ full: 'minimal', minimal: 'off', off: 'full' }[hlOf(S.focus)]);
  [
    ['themes-duplicate', 'Duplicate and edit theme…', 'copy-plus', '⌘D', () => openEditor(S.focus)],
    ['themes-import', 'Import theme…', 'file-input', '⌘O', () => openImport()],
    ['themes-import-vscode', 'Import VS Code theme…', 'file-input', '', () => openImport('vscode')],
    ['themes-import-base16', 'Import Base16 scheme…', 'file-input', '', () => openImport('base16')],
    ['themes-export-copy', 'Copy theme as JSON', 'copy', '⌥⌘E', () => G.copy(themeJSON(S.focus, effective(S.focus)), { as: 'Theme JSON', clean: false })],
    ['themes-export-download', 'Download theme JSON…', 'download', '', () => download(S.focus, themeJSON(S.focus, effective(S.focus)))],
    ['themes-audit', 'Show contrast audit', 'shield-check', '', () => showInsp('access')],
    ['code-hl-full', 'Code highlighting: full', 'code', '', () => setHl('full')],
    ['code-hl-minimal', 'Code highlighting: minimal', 'code', '', () => setHl('minimal')],
    ['code-hl-off', 'Code highlighting: off', 'code', '', () => setHl('off')],
    ['code-hl-cycle', 'Cycle code highlighting', 'code', '⌥⌘H', cycleHl],
    ['themes-reset-tweaks', 'Reset theme adjustments', 'rotate-ccw', '', () => setTweak(S.focus, null)],
    ['themes-kind-preset', 'Per type: books in Sepia, code in Night', 'swatch-book', '', () => setObj('kindThemes', { book: 'sepia', code: 'night' })],
    ['themes-follow-system', 'Switch themes with macOS', 'monitor', '', () => setSchedMode('system')],
    ['themes-sim-contrast', 'Simulate Increase contrast', 'contrast', '', () => { S.simContrast = !S.simContrast; G.applyTheme(); }],
    ['themes-insp', 'Toggle theme inspector', 'panel-right', '⌥⌘I', toggleInsp]
  ].forEach(([id, name, icon, kbd, run]) => G.command({ id, name, icon, kbd, group: 'Theme', run }));

  document.addEventListener('keydown', (e) => {
    const mod = e.metaKey || e.ctrlKey; const k = e.key.toLowerCase();
    const typing = e.target.matches('input, select, textarea');
    if (e.key === 'Escape') { if (sheetEl) return closeSheet(); if (document.querySelector('.menu')) return; if (TE.on) return closeEditor(); if (S.winPrev) return previewWindow(false); return; }
    if (TE.on) {
      if (mod && k === 's') { e.preventDefault(); saveTheme(); }
      else if (mod && k === 'z' && !typing) { e.preventDefault(); $('#te-undo').click(); }
      return;
    }
    if (mod && !e.shiftKey && !e.altKey && k === 'd') { e.preventDefault(); G.run('themes-duplicate'); }
    else if (mod && !e.shiftKey && !e.altKey && k === 'o') { e.preventDefault(); G.run('themes-import'); }
    else if (mod && e.altKey && e.code === 'KeyE') { e.preventDefault(); G.run('themes-export-copy'); }
    else if (mod && e.altKey && e.code === 'KeyI') { e.preventDefault(); toggleInsp(); }
    else if (mod && e.altKey && e.code === 'KeyH') { e.preventDefault(); cycleHl(); }
    else if (e.ctrlKey && (e.metaKey || e.altKey) && e.code === 'KeyT') { e.preventDefault(); G.run('theme-next'); }
    else if (mod && !e.altKey && !e.shiftKey && /^[1-9]$/.test(e.key) && !typing) { e.preventDefault(); setKind(kindList()[+e.key - 1] || S.kind); }
  });

  /* ---------- Engine events and boot ---------- */

  const MINE = /^(themeTweaks|codeHighlight|codeComments|codeCommentContrast|codeDefsBold|codePalette|kindThemes|kindTypesets|themeSchedule|themeScheduleCity|themeScheduleDark|themeScheduleLight|reduceTransparency|reduceMotion|darkSizeBoost|customThemeActive|followSystemContrast)$/;
  G.on('pref', ({ key }) => { if (MINE.test(key)) { writeStyle(); G.applyTheme(); } });
  G.on('theme', () => {
    if (S.fontEmit) return;
    applyLocal();
    if (!themeOf(S.focus)) S.focus = appliedBase();
    refresh();
  });
  [mqDark, mqContrast, mqMotion, mqTrans, mqForced].forEach((m) => m.addEventListener('change', () => G.applyTheme()));

  G.boot({});
  writeStyle(); applyLocal(); S.focus = appliedBase();
  const hp = new URLSearchParams(location.hash.slice(1));
  if (TABS.includes(hp.get('kind'))) S.kind = hp.get('kind');
  const tabQ = { tokens: 'colours', adjust: 'colours', code: 'syntax', languages: 'syntax' }[hp.get('tab')] || hp.get('tab');
  if (['type', 'colours', 'syntax', 'kinds', 'access'].includes(tabQ)) S.itab = tabQ;
  if (LANGS.some((l) => l.id === hp.get('lang'))) { S.syLang = hp.get('lang'); S.syLevel = 2; }
  if (hp.get('tab') === 'tokens') S.ctab = 'tokens';
  if (innerWidth <= 1180 && !hp.get('tab')) { $('#tw').classList.add('no-insp'); $('#b-insp').classList.remove('on'); $('#b-insp').setAttribute('aria-pressed', 'false'); }
  refresh();
  if (hp.get('edit') && themeOf(hp.get('edit'))) openEditor(hp.get('edit'));
  else if (['vscode', 'base16', 'json'].includes(hp.get('import'))) openImport(hp.get('import'));

  // Exposed for the prototype index and for debugging; not an API.
  G.themesPage = { S, langCss, langTint, audit, effective, live, fixTo, ratio: (a, b) => ratio(pc(a), pc(b)), openEditor, openImport, refresh };
})();
</script>
</body>
</html>
