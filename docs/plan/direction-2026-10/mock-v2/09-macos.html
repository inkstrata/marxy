<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marxy macOS Integration</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&family=Atkinson+Hyperlegible+Mono:ital,wght@0,200..800;1,200..800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/app.css">
<link rel="stylesheet" href="shared/lang-colors.css">
<style>
  /* ---------- Page frame: surface list down the side, one surface at a time ---------- */
  .mx-body { flex: 1; display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 0; }
  .mx-nav { border-right: 1px solid var(--line); background: var(--win); overflow: auto; padding: 6px 8px 16px; }
  .mx-nav h3 { font-size: 11px; font-weight: 650; color: var(--fg-faint); margin: 12px 8px 4px; }
  .mxn { display: grid; grid-template-columns: 18px 18px minmax(0, 1fr) auto; gap: 7px; align-items: center; width: 100%; min-height: 30px; padding: 0 8px; border: 0; background: none; border-radius: 6px; color: var(--fg); text-align: left; }
  .mxn:hover { background: var(--hover); }
  .mxn[aria-selected="true"] { background: var(--accent-wash-strong); color: var(--fg-strong); }
  .mxn[aria-selected="true"] svg { color: var(--accent); }
  .mxn svg { color: var(--fg-muted); }
  .mxn .n { font-size: 11px; color: var(--fg-faint); font-variant-numeric: tabular-nums; text-align: right; }
  .mxn .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mxn .st { font-size: 10.5px; color: var(--fg-faint); white-space: nowrap; }
  .mxn .st.on { color: var(--ok); }
  .mx-stage { overflow: auto; min-height: 0; background: var(--doc); position: relative; }
  .mx-panel { padding: 18px 24px 56px; display: flex; flex-direction: column; gap: 14px; max-width: 1320px; }
  .mx-head { display: flex; gap: 14px; align-items: flex-start; }
  .mx-head .ico { width: 38px; height: 38px; border-radius: 10px; background: var(--accent-wash); display: grid; place-items: center; color: var(--accent); flex: none; }
  .mx-head .ico svg { width: 20px; height: 20px; }
  .mx-head h2 { margin: 0; font-size: 17px; font-weight: 650; color: var(--fg-strong); }
  .mx-head p { margin: 3px 0 0; color: var(--fg-muted); max-width: 92ch; line-height: 1.5; }
  .mx-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
  .mx-prefs { display: flex; flex-wrap: wrap; gap: 8px; }
  .mx-pref { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); }
  .mx-pbody { display: flex; flex-direction: column; gap: 14px; }
  .mx-cols { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
  .mx-side { display: flex; flex-direction: column; gap: 12px; }
  .mx-h { font-size: 11px; font-weight: 650; color: var(--fg-faint); margin: 4px 0 0; display: flex; gap: 8px; align-items: center; }
  .mx-note { font-size: 12px; color: var(--fg-muted); line-height: 1.5; margin: 0; }
  .mx-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .box { border: 1px solid var(--line); border-radius: 10px; background: var(--raised); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }

  /* Dense reference tables */
  .ref { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--raised); }
  .ref .rr { display: grid; gap: 10px; align-items: center; padding: 4px 10px; border-top: 1px solid var(--line); font-size: 12.5px; min-height: 30px; }
  .ref .rr:first-child { border-top: 0; }
  .ref .rr.hd { font-size: 11px; font-weight: 650; color: var(--fg-faint); background: var(--inset); min-height: 26px; position: sticky; top: 0; z-index: 1; }
  .ref .rr.gh { font-size: 11px; font-weight: 650; color: var(--fg-muted); background: var(--inset); min-height: 24px; }
  .ref .rr:not(.hd):not(.gh):hover { background: var(--hover); }
  .ref .rr > * { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .ref .rr .wrap { white-space: normal; line-height: 1.4; }
  .ref .rr .nw { white-space: nowrap; }
  .ref.scroll { max-height: 520px; overflow: auto; }
  .ref code, .idc { font: 500 11.5px var(--face-code); color: var(--fg-muted); }
  .kc { font: 500 12px var(--face-chrome); letter-spacing: 0.06em; color: var(--fg); white-space: nowrap; }
  .src-tag { font-size: 10.5px; padding: 1px 6px; border-radius: 4px; background: var(--hover); color: var(--fg-muted); white-space: nowrap; }
  .src-tag.marxy { background: var(--accent-wash); color: var(--accent); }
  .src-tag.system { background: var(--warn-wash); color: var(--warn); }

  /* ---------- macOS desktop backdrop and system chrome replicas ---------- */
  .desk { position: relative; border: 1px solid var(--line-strong); border-radius: 12px; overflow: hidden; min-height: 540px; isolation: isolate;
    background: radial-gradient(110% 80% at 8% 0%, var(--accent-wash-strong), transparent 62%), radial-gradient(80% 70% at 100% 100%, var(--warn-wash), transparent 60%), radial-gradient(60% 60% at 72% 18%, var(--ok-wash), transparent 70%), var(--inset); }
  .desk.dim::after { content: ""; position: absolute; inset: 28px 0 0; background: var(--hover); z-index: 4; pointer-events: none; }
  .mbar { position: relative; z-index: 8; height: 28px; display: flex; align-items: center; gap: 1px; padding: 0 8px; background: var(--glass); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border-bottom: 1px solid var(--line); font: 13px var(--face-chrome); color: var(--fg-strong); }
  .mbar .mt { height: 22px; padding: 0 9px; border: 0; background: none; border-radius: 6px; color: inherit; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .mbar .mt.app { font-weight: 700; }
  .mbar .mt:hover, .mbar .mt[aria-expanded="true"] { background: var(--press); }
  .mbar .mt.apple svg { width: 15px; height: 15px; }
  .mbar .sp { flex: 1; }
  .mbar .si { height: 22px; min-width: 26px; padding: 0 6px; border: 0; background: none; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; color: inherit; font-size: 12.5px; white-space: nowrap; }
  .mbar .si:hover, .mbar .si[aria-expanded="true"] { background: var(--press); }
  .mbar .si svg { width: 15px; height: 15px; }
  .mbar .si.marxy { color: var(--fg-strong); }
  .mbar .si.paused svg { opacity: .45; }
  .mbar .clock { font-variant-numeric: tabular-nums; }

  .mwin { position: absolute; background: var(--win); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; z-index: 2; }
  .mwin.flow { position: relative; }
  .mwin-t { height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--win); font-size: 13px; font-weight: 600; color: var(--fg-strong); flex: none; }
  .mwin-t .lights { padding: 0; gap: 8px; }
  .mwin-t .ttl { flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mwin-t .ttl small { font-weight: 400; color: var(--fg-faint); margin-left: 6px; }
  .mwin-b { flex: 1; min-height: 0; background: var(--doc); position: relative; }

  /* macOS 26 menus: rounded, translucent, icons in a column, shortcut glyphs aligned on the key */
  .mm { position: fixed; z-index: 75; min-width: 230px; max-width: 420px; max-height: calc(100vh - 16px); overflow: auto; padding: 5px; border-radius: 12px; background: color-mix(in srgb, var(--glass), var(--raised) 55%); backdrop-filter: blur(28px) saturate(1.6); -webkit-backdrop-filter: blur(28px) saturate(1.6); border: 1px solid var(--line-strong); box-shadow: var(--shadow); font: 13px/1 var(--face-chrome); color: var(--fg); outline: none; animation: pop .1s var(--ease); scrollbar-width: none; }
  .mm .mmi { display: grid; grid-template-columns: 14px 18px minmax(0, 1fr) auto 12px; align-items: center; gap: 5px; width: 100%; height: 24px; padding: 0 6px 0 5px; border: 0; background: none; border-radius: 6px; color: var(--fg); text-align: left; white-space: nowrap; }
  .mm .mmi .mlb { overflow: hidden; text-overflow: ellipsis; }
  .mm .mmi .mlb .mpath { color: var(--fg-faint); margin-right: 4px; }
  .mm .mmi svg { width: 14px; height: 14px; color: var(--fg-muted); }
  .mm .mmi .mck svg { width: 13px; height: 13px; color: var(--fg); }
  .mm .mmi .mmk { color: var(--fg-faint); display: inline-flex; padding-left: 22px; letter-spacing: 0.05em; font-variant-numeric: tabular-nums; }
  .mm .mmi .mmk .mkey { min-width: 1.35em; text-align: left; padding-left: 1px; }
  .mm .mmi.hot:not([aria-disabled="true"]) { background: var(--accent); color: var(--accent-fg); }
  .mm .mmi.hot:not([aria-disabled="true"]) svg, .mm .mmi.hot:not([aria-disabled="true"]) .mmk, .mm .mmi.hot .mpath { color: inherit; }
  .mm .mmi.open { background: var(--press); }
  .mm .mmi[aria-disabled="true"] { color: var(--fg-faint); }
  .mm .mmi[aria-disabled="true"] svg { opacity: .55; }
  .mm .mmi .dot { width: 7px; height: 7px; }
  .mm .mmh { font-size: 11px; font-weight: 650; color: var(--fg-faint); padding: 7px 8px 3px 24px; }
  .mm hr { border: 0; border-top: 1px solid var(--line); margin: 5px 8px; }
  .mm .mm-search { display: flex; align-items: center; gap: 6px; padding: 3px 4px 5px; }
  .mm .mm-search input { flex: 1; height: 24px; border-radius: 6px; border: 1px solid var(--edge); background: var(--doc); padding: 0 8px; font-size: 12.5px; outline: none; }
  .mm .mm-search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .mm .mm-note { font-size: 11.5px; color: var(--fg-faint); padding: 3px 10px 5px 24px; white-space: normal; line-height: 1.4; max-width: 340px; }

  .mm-detail { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; font-size: 12.5px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); min-height: 92px; align-content: start; }
  .mm-detail dt { color: var(--fg-muted); }
  .mm-detail dd { margin: 0; }

  /* ---------- Window toolbar replica and NSToolbar customisation sheet ---------- */
  .tbx .toolbar { position: relative; gap: 8px; }
  .tbx .toolbar.small { height: 40px; }
  .tbx .toolbar.small .tb-btn { height: 24px; min-width: 26px; }
  .tbx .toolbar.small .seg button, .tbx .toolbar.small .kind-chip { height: 22px; }
  .tbx .toolbar.tall { height: 68px; align-items: center; }
  .tbx .tbit { display: flex; flex-direction: column; align-items: center; gap: 3px; border-radius: 8px; }
  .tbx .tbit .tbl { font-size: 11px; color: var(--fg-muted); white-space: nowrap; }
  .tbx .tbit.flex { flex: 1; min-width: 12px; align-self: stretch; }
  .tbx .tbit.space { width: 14px; align-self: stretch; }
  .tbx .tb-sp { width: 6px; }
  .tbx .tb-flex { flex: 1; min-width: 8px; align-self: stretch; }
  .tbx .tb-ttl { min-width: 0; display: flex; flex-direction: column; line-height: 1.2; margin-right: 4px; max-width: 200px; }
  .tbx .tb-ttl b { font-weight: 650; color: var(--fg-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
  .tbx .tb-ttl small { color: var(--fg-faint); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tbx.text .tb-btn svg:not(.chev) { display: none; }
  .tbx.cust .toolbar [data-idx] { outline: 1px dashed var(--line-strong); outline-offset: 1px; border-radius: 8px; cursor: grab; }
  .tbx.cust .toolbar [data-idx]:focus-visible { outline: 2px solid var(--accent); }
  .tbx.cust .toolbar .tb-sp[data-idx], .tbx.cust .toolbar .tb-flex[data-idx] { background: var(--hover); height: 26px; align-self: center; border-radius: 6px; min-width: 14px; }
  .tbx.cust .toolbar .tb-flex[data-idx]::before { content: "flexible"; font-size: 10px; color: var(--fg-faint); display: block; text-align: center; line-height: 26px; }
  .tbx .toolbar { overflow: hidden; }
  .tbx.cust .toolbar { overflow-x: auto; scrollbar-width: thin; }
  .tbx .ins { position: absolute; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--accent); pointer-events: none; z-index: 3; }
  .tbx .toolbar.drop-on { background: var(--accent-wash); }
  .tbx .tb-btn.tb-txt { padding: 0 10px; font-size: 12.5px; }
  .rep-body { height: 250px; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; position: relative; border-top: 0; }
  .rep-body[data-view="render"] { grid-template-columns: 1fr; } .rep-body[data-view="render"] .rep-src { display: none; }
  .rep-body[data-view="source"] { grid-template-columns: 1fr; } .rep-body[data-view="source"] .rep-doc { display: none; }
  .rep-body.with-insp { grid-template-columns: 1fr 1fr 190px; }
  .rep-body[data-view="render"].with-insp, .rep-body[data-view="source"].with-insp { grid-template-columns: 1fr 190px; }
  .rep-doc { overflow: hidden; position: relative; }
  .rep-doc .doc { font-size: 14px; padding: 18px 26px; }
  .rep-src { overflow: hidden; border-left: 1px solid var(--line); font: 12px/1.6 var(--face-code); padding: 12px 14px; white-space: pre; color: var(--fg); background: var(--doc); }
  .rep-insp { border-left: 1px solid var(--line); background: var(--side); padding: 10px 12px; font-size: 12px; overflow: hidden; }
  .rep-insp div { padding: 3px 0; color: var(--fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rep-fade { position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: linear-gradient(transparent, var(--doc)); pointer-events: none; }
  .tabs-mini { height: 30px; display: flex; border-bottom: 1px solid var(--line); background: var(--win); font-size: 12px; }
  .tabs-mini > span { display: flex; align-items: center; gap: 6px; padding: 0 12px; border-right: 1px solid var(--line); color: var(--fg-muted); white-space: nowrap; }
  .tabs-mini > span.on { background: var(--doc); color: var(--fg-strong); box-shadow: inset 0 2px 0 var(--accent); }
  .cust-sheet { position: absolute; left: 28px; right: 28px; top: 0; z-index: 6; background: var(--raised); border: 1px solid var(--line-strong); border-top: 0; border-radius: 0 0 12px 12px; box-shadow: var(--shadow); padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 10px; animation: sheet .18s var(--ease); max-height: 520px; overflow: auto; }
  @keyframes sheet { from { transform: translateY(-14px); opacity: 0; } }
  .cust-sheet h4 { margin: 0; font-size: 12.5px; font-weight: 600; color: var(--fg); }
  .cpal { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 4px; }
  .cpi { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 4px 7px; border-radius: 8px; border: 1px solid transparent; background: none; color: var(--fg); font-size: 11.5px; text-align: center; cursor: grab; position: relative; line-height: 1.25; }
  .cpi:hover { background: var(--hover); }
  .cpi .cv { height: 30px; min-width: 38px; display: inline-flex; gap: 2px; align-items: center; justify-content: center; border-radius: 999px; background: var(--doc); border: 1px solid var(--line); padding: 0 8px; color: var(--fg); }
  .cpi .cv.wide { min-width: 76px; }
  .cpi .cv.blank { background: var(--hover); border-style: dashed; min-width: 44px; }
  .cpi .cv.flexv { min-width: 76px; background: var(--hover); border-style: dashed; }
  .cpi.inbar .cv { border-color: var(--accent-wash-strong); }
  .cpi.inbar::after { content: ""; position: absolute; top: 6px; right: 12px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .cpi .ty { font-size: 10px; color: var(--accent); }
  .cust-default { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border: 1px dashed var(--line-strong); border-radius: 10px; cursor: grab; overflow: hidden; background: var(--win); }
  .cust-default .mini { display: inline-flex; align-items: center; justify-content: center; height: 22px; min-width: 24px; padding: 0 5px; border-radius: 999px; border: 1px solid var(--line); background: var(--raised); color: var(--fg-muted); }
  .cust-default .mini svg { width: 13px; height: 13px; }
  .cust-default .gap { flex: 1; min-width: 10px; }
  .cust-foot { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding-top: 10px; flex-wrap: wrap; }
  .dghost { position: fixed; z-index: 95; pointer-events: none; padding: 5px 10px; border-radius: 999px; background: var(--raised); border: 1px solid var(--accent); box-shadow: var(--shadow); display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--fg); transform: translate(-50%, -50%); }
  .dghost.out { border-color: var(--err); opacity: .8; }
  .dghost.out::after { content: "remove"; font-size: 10.5px; color: var(--err); }
  .flash { animation: flash 1.1s var(--ease); }

  /* ---------- Popovers, HUDs, panels drawn by Marxy over other apps ---------- */
  /* Translucent, but opaque enough to read over busy content; high-contrast themes stay near solid. */
  .glass { background: color-mix(in srgb, var(--glass), var(--raised) 62%); backdrop-filter: blur(30px) saturate(1.6); -webkit-backdrop-filter: blur(30px) saturate(1.6); border: 1px solid var(--line-strong); box-shadow: var(--shadow); }
  .pop { position: absolute; z-index: 9; width: 372px; border-radius: 14px; overflow: hidden; font-size: 12.5px; display: flex; flex-direction: column; animation: pop .14s var(--ease); }
  .pop-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px; }
  .pop-h b { font-size: 13px; }
  .pop-s { padding: 0 12px 8px; }
  .pop-s .field { width: 100%; height: 26px; background: var(--doc); }
  .pop-sec { padding: 4px 6px; border-top: 1px solid var(--line); }
  .pop-sec h5 { margin: 4px 8px 3px; font-size: 11px; font-weight: 650; color: var(--fg-faint); display: flex; gap: 6px; align-items: center; }
  .prow { display: grid; grid-template-columns: 20px 18px minmax(0, 2fr) minmax(0, 1fr); gap: 7px; align-items: center; width: 100%; min-height: 28px; padding: 2px 8px; border: 0; background: none; border-radius: 7px; color: var(--fg); text-align: left; }
  .prow:hover, .prow.hot { background: var(--accent); color: var(--accent-fg); }
  .prow:hover svg, .prow.hot svg, .prow:hover .s, .prow.hot .s, .prow:hover .nk, .prow.hot .nk { color: inherit; border-color: currentColor; }
  .prow .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prow .s { color: var(--fg-faint); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
  .prow svg { color: var(--fg-muted); }
  .nk { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 5px; border: 1px solid var(--line-strong); font: 600 10.5px var(--face-chrome); color: var(--fg-muted); }
  .pop-f { display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--fg-faint); }

  .appwin .appta { width: 100%; height: 100%; border: 0; resize: none; padding: 16px 20px; font: 14px/1.6 var(--face-chrome); background: var(--doc); color: var(--fg); outline: none; display: block; }
  .appwin .apptb { height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border-bottom: 1px solid var(--line); background: var(--win); font-size: 12px; color: var(--fg-muted); }
  .appwin .appbody { padding: 16px 22px; font: 14px/1.6 var(--face-chrome); color: var(--fg); overflow: auto; height: 100%; }
  .appwin .appbody p { margin: 0 0 10px; }
  .fsel { background: var(--sel); box-shadow: 0 0 0 1px var(--sel); border-radius: 2px; color: inherit; }
  .fsel.changed { background: var(--ok-wash); box-shadow: 0 0 0 1px var(--ok); }
  .mailhdr { display: grid; grid-template-columns: 64px 1fr; gap: 4px 8px; padding: 8px 20px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--fg-muted); }
  .mailhdr b { font-weight: 400; color: var(--fg); }

  .hud { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); width: 680px; max-width: calc(100% - 40px); border-radius: 16px; z-index: 9; display: flex; flex-direction: column; overflow: hidden; animation: pop .14s var(--ease); }
  .hud-in { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 46px; border-bottom: 1px solid var(--line); }
  .hud-in input { flex: 1; border: 0; background: none; outline: none; font-size: 16px; color: var(--fg-strong); }
  .hud-body { display: grid; grid-template-columns: minmax(0, 1fr) 240px; min-height: 0; height: 320px; }
  .hud-list { overflow: auto; padding: 6px; }
  .hud-prev { border-left: 1px solid var(--line); padding: 10px 12px; overflow: auto; font-size: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--hover); }

  .grp { font-size: 11px; font-weight: 650; color: var(--fg-faint); padding: 8px 10px 3px; }

  .gp { position: absolute; left: 50%; top: 58px; transform: translateX(-50%); width: 720px; max-width: calc(100% - 40px); border-radius: 22px; z-index: 9; overflow: hidden; display: flex; flex-direction: column; animation: pop .14s var(--ease); }
  .gp-in { display: flex; align-items: center; gap: 12px; padding: 0 18px; height: 54px; }

  .fnd-list { overflow: auto; padding: 4px 6px; outline: none; }

  .fnd-prev { border-left: 1px solid var(--line); padding: 12px; overflow: auto; display: flex; flex-direction: column; gap: 10px; align-items: stretch; background: var(--win); }

  .fnd-prev dt { color: var(--fg-faint); text-align: right; } .fnd-prev dd { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qa { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; padding-top: 6px; border-top: 1px solid var(--line); }
  .qab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10.5px; border: 0; background: none; color: var(--fg); width: 58px; text-align: center; line-height: 1.2; }

  .thumb { width: 100%; aspect-ratio: 0.78; overflow: hidden; border-radius: 4px; border: 1px solid var(--line-strong); background: var(--doc); position: relative; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .thumb .doc { position: absolute; top: 0; left: 0; width: 520px; transform-origin: 0 0; padding: 26px 30px; pointer-events: none; font-size: 16px; }

  .fgrid { display: grid; grid-template-columns: repeat(auto-fill, 112px); gap: 14px 10px; padding: 14px; align-content: start; }
  .fgi { display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; background: none; color: var(--fg); padding: 6px; border-radius: 8px; font-size: 11.5px; text-align: center; }

  /* Quick Look */
  .ql { position: absolute; left: 8%; right: 8%; top: 44px; bottom: 18px; z-index: 9; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; background: var(--doc); border: 1px solid var(--line-strong); box-shadow: var(--shadow); animation: pop .16s var(--ease); }

  .ql-t .ttl { flex: 1; text-align: center; font-weight: 600; color: var(--fg-strong); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .ql-f { height: 28px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--fg-faint); flex: none; }

  /* Share sheet and extension */
  .brw-bar { height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-bottom: 1px solid var(--line); background: var(--win); }
  .brw-bar .url { flex: 1; height: 26px; border-radius: 8px; background: var(--hover); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: var(--fg-muted); }
  .brw-page { padding: 22px 40px; font: 15px/1.6 var(--face-article); color: var(--fg); overflow: auto; height: 100%; }
  .brw-page h1 { font-size: 24px; margin: 0 0 12px; color: var(--fg-strong); }

  .shx { position: absolute; left: 50%; top: 38px; transform: translateX(-50%); width: 500px; z-index: 9; border-radius: 0 0 14px 14px; background: var(--raised); border: 1px solid var(--line-strong); border-top: 0; box-shadow: var(--shadow); display: flex; flex-direction: column; animation: sheet .18s var(--ease); }
  .shx-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }

  .shx-card { border: 1px solid var(--line); border-radius: 10px; background: var(--doc); padding: 10px 12px; display: grid; grid-template-columns: 1fr; gap: 6px; }
  .shx-card pre { margin: 0; font: 11.5px/1.5 var(--face-code); white-space: pre-wrap; max-height: 130px; overflow: auto; color: var(--fg); }
  .frm { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px 10px; align-items: center; font-size: 12.5px; }
  .frm > label:first-child, .frm .lab { color: var(--fg-muted); text-align: right; }
  .frm .field { height: 26px; }
  .chk { display: flex; gap: 8px; align-items: center; font-size: 12.5px; }

  /* Shortcuts editor */
  .sc-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .sc-canvas { border: 1px solid var(--line); border-radius: 12px; background: var(--inset); padding: 14px; display: flex; flex-direction: column; gap: 0; min-height: 300px; }
  .sc-act { position: relative; border-radius: 12px; background: var(--raised); border: 1px solid var(--line); padding: 9px 12px; display: flex; gap: 6px 8px; align-items: center; flex-wrap: wrap; box-shadow: 0 1px 2px rgba(0,0,0,.06); font-size: 13px; }
  .sc-act .aic { width: 24px; height: 24px; border-radius: 7px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; flex: none; }
  .sc-act .aic svg { width: 14px; height: 14px; }
  .sc-act .x { margin-left: auto; }
  .sc-act.run { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash-strong); }
  .sc-act.done { border-color: var(--ok); }
  .sc-link { width: 2px; height: 14px; background: var(--line-strong); margin: 0 auto; }
  .tok { display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; border-radius: 6px; background: var(--accent-wash); color: var(--accent); font-weight: 600; border: 0; font-size: 12.5px; }
  select.tok { appearance: none; -webkit-appearance: none; padding-right: 6px; }
  .tok.var { background: var(--ok-wash); color: var(--ok); }
  .sc-out { font: 11px/1.45 var(--face-code); color: var(--fg-muted); white-space: pre-wrap; max-height: 74px; overflow: auto; width: 100%; border-top: 1px dashed var(--line); padding-top: 5px; margin-top: 2px; }

  /* Dock */
  .dock { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 8px; padding: 7px 9px 9px; border-radius: 22px; z-index: 5; align-items: flex-end; }
  .dk { width: 52px; height: 52px; border-radius: 13px; display: grid; place-items: center; position: relative; border: 1px solid var(--line); background: var(--raised); color: var(--fg); }
  .dk svg { width: 26px; height: 26px; }
  .dk.marxy { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .dk.c2 { background: var(--ok-wash); color: var(--ok); } .dk.c3 { background: var(--warn-wash); color: var(--warn); } .dk.c4 { background: var(--err-wash); color: var(--err); }
  .dk .run { position: absolute; bottom: -6px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--fg-muted); }
  .dk .bdg { position: absolute; top: -6px; right: -7px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--err); color: var(--doc); font: 700 11.5px/20px var(--face-chrome); text-align: center; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .dk .prog { position: absolute; left: 6px; right: 6px; bottom: 6px; height: 5px; border-radius: 3px; background: var(--hover); overflow: hidden; }
  .dk .prog i { display: block; height: 100%; background: var(--accent-fg); }
  .dk-sep { width: 1px; height: 46px; background: var(--line-strong); margin: 0 2px; align-self: center; }

  /* Spotlight */
  .spot { position: absolute; left: 50%; top: 60px; transform: translateX(-50%); width: 760px; max-width: calc(100% - 40px); z-index: 9; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; }
  .spot-in { display: flex; align-items: center; gap: 12px; padding: 0 18px; height: 54px; }
  .spot-in input { flex: 1; border: 0; background: none; outline: none; font-size: 21px; color: var(--fg-strong); }
  .spot-cats { display: flex; gap: 6px; padding: 0 16px 10px; }
  .spot-cats span { display: inline-flex; gap: 5px; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; color: var(--fg-muted); }
  .spot-body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; border-top: 1px solid var(--line); height: 340px; }
  .spot-list { overflow: auto; padding: 6px; }
  .spot-prev { border-left: 1px solid var(--line); padding: 14px; overflow: auto; display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; background: var(--hover); }
  .spot-prev .big { width: 54px; height: 54px; border-radius: 12px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; }
  .spot-prev .big svg { width: 28px; height: 28px; }

  /* Notifications */
  .ntf-col { position: absolute; right: 12px; top: 40px; width: 370px; z-index: 9; display: flex; flex-direction: column; gap: 8px; }
  .ntf { border-radius: 18px; padding: 11px 13px; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 4px 10px; animation: slidein .32s var(--ease); position: relative; }
  @keyframes slidein { from { transform: translateX(40px); opacity: 0; } }
  .ntf .appic { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; grid-row: span 3; align-self: start; }
  .ntf .hd, .ntf .tt { grid-column: 2 / 4; }
  .ntf .hd { display: flex; gap: 6px; font-size: 11.5px; color: var(--fg-faint); align-items: center; }
  .ntf .tt { font-weight: 650; color: var(--fg-strong); font-size: 13px; }
  .ntf .bd { grid-column: 2 / 4; font-size: 12.5px; color: var(--fg); line-height: 1.4; }
  .ntf .acts { grid-column: 1 / 4; display: none; gap: 6px; margin-top: 6px; }
  .ntf:hover .acts, .ntf.open .acts, .ntf:focus-within .acts { display: flex; }
  .ntf .acts button { flex: 1; height: 28px; border-radius: 9px; border: 1px solid var(--line); background: var(--raised); color: var(--fg); font-size: 12px; }
  .ntf .acts button:hover { background: var(--accent); color: var(--accent-fg); }
  .ntf .x { position: absolute; left: -6px; top: -6px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--raised); display: none; place-items: center; padding: 0; color: var(--fg-muted); }
  .ntf:hover .x { display: grid; }
  .ntf .x svg { width: 11px; height: 11px; }

  /* Result sheet */
  .rs-scrim { position: fixed; inset: 0; z-index: 85; background: rgba(0,0,0,.22); display: flex; justify-content: center; align-items: flex-start; padding-top: 7vh; }
  .rs { width: min(940px, calc(100vw - 40px)); max-height: 80vh; background: var(--raised); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; animation: pop .14s var(--ease); }
  .rs-h { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
  .rs-cols { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; flex: 1; }
  .rs-cols > div { overflow: auto; padding: 10px 14px; min-height: 0; }
  .rs-cols > div + div { border-left: 1px solid var(--line); }
  .rs-cols h5 { margin: 0 0 6px; font-size: 11px; color: var(--fg-faint); font-weight: 650; }
  .rs-cols pre { margin: 0; font: 12px/1.55 var(--face-code); white-space: pre-wrap; color: var(--fg); }
  .rs-f { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }

  .rec { min-width: 120px; justify-content: center; font-variant-numeric: tabular-nums; letter-spacing: .05em; }
  .rec.on { outline: 2px solid var(--accent); outline-offset: 1px; color: var(--accent); }
  @media (max-width: 1180px) { .mx-cols, .sc-wrap { grid-template-columns: 1fr; } .fnd { grid-template-columns: 0 minmax(0, 1fr) 220px; } .fnd-side { display: none; } }
  @media (max-width: 900px) { .mx-body { grid-template-columns: 1fr; } .mx-nav { display: none; } }
  .later-note { flex: none; display: flex; align-items: center; gap: 8px; margin: 6px 14px 0; padding: 5px 10px; background: var(--inset); border: 1px solid var(--line); border-radius: 6px; color: var(--fg-muted); font-size: 12px; }
  .later-note svg { width: 14px; height: 14px; flex: none; }
</style>

<body>
<div class="win">
  <aside class="sidebar" data-slot="sidebar"></aside>
  <div class="main">
    <div class="later-note" role="note"><i data-lucide="info"></i><span>Later, not in this direction: this page is kept for reference and is not part of Marxy mock v2.</span></div>
    <header class="toolbar" role="toolbar" aria-label="Page toolbar">
      <div class="tb-group">
        <button class="tb-btn" id="pv-prev" title="Previous surface (⌥↑)" aria-label="Previous surface"><i data-lucide="chevron-up"></i></button>
        <button class="tb-btn" id="pv-next" title="Next surface (⌥↓)" aria-label="Next surface"><i data-lucide="chevron-down"></i></button>
      </div>
      <div class="tb-title"><b id="pg-title">macOS integration</b><small id="pg-sub">Every system surface Marxy uses, as working replicas</small></div>
      <div class="tb-space"></div>
      <div class="tb-group">
        <button class="tb-btn lbl-btn" id="pg-ring" title="Clipboard ring (global ⌥⌘V)"><i data-lucide="clipboard-list"></i>Ring</button>
        <button class="tb-btn lbl-btn" id="pg-gpal" title="Global palette (global ⌃⌥Space)"><i data-lucide="command"></i>Palette</button>
      </div>
      <div class="tb-group">
        <button class="tb-btn" id="pg-reset" title="Reset every demo on this page"><i data-lucide="rotate-ccw"></i></button>
        <button class="tb-btn" data-cmd="palette" title="Command palette (⌘K)"><i data-lucide="search"></i></button>
      </div>
    </header>
    <div class="mx-body">
      <nav class="mx-nav" id="mxnav" role="tablist" aria-orientation="vertical" aria-label="macOS surfaces"></nav>
      <main class="mx-stage" id="stage"></main>
    </div>
    <footer class="statusbar" id="status"></footer>
  </div>
</div>

<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="shared/corpus.js"></script>
<script src="shared/app.js"></script>
<script src="shared/render.js"></script>
<script>
/* ===== Core: surface registry, macOS menu engine, result sheet, shortcut recorder ===== */
(function () {
  const G = Marxy, { $, $$, esc, ic, fmt } = G;
  const MX = (window.MX = { panels: [], cur: null });
  // Global shortcut defaults, page-local (the shared engine no longer carries them); Settings › macOS rebinds them.
  [['globalClipRing', '⌥⌘V'], ['globalPalette', '⌃⌥Space'], ['globalCapture', '⌃⌥⌘N']].forEach(([k, v]) => { if (G.prefs[k] === undefined) G.prefs[k] = v; });
  const DOC = G.doc('pg16-plan');
  MX.doc = DOC;
  G.current = { id: DOC.id, title: DOC.title, path: DOC.path, src: DOC.src, collection: DOC.collection, kind: DOC.kind, headings: [] };
  MX.store = { get: (k, d) => G.store.get('macos.' + k, d), set: (k, v) => G.store.set('macos.' + k, v) };
  // 08-settings keeps these sub-lists in prefs under the same names; fall back to its defaults.
  MX.listPref = (key, def) => Object.assign({}, def, G.prefs[key] || {});

  MX.k = (s) => (s ? `<span class="kc">${esc(s)}</span>` : '<span class="faint">–</span>');
  MX.chip = (icon, text, cls = '') => `<span class="chip ${cls}">${icon ? ic(icon) : ''}${esc(text)}</span>`;
  MX.sw = (key, label) => `<label class="mx-pref"><span class="switch"><input type="checkbox" role="switch" data-pref="${key}"${G.prefs[key] ? ' checked' : ''}><i></i></span><span>${label}</span></label>`;
  MX.win = (title, body, o = {}) => `<div class="mwin${o.flow ? ' flow' : ''} ${o.cls || ''}" style="${o.style || ''}"${o.id ? ` id="${o.id}"` : ''}><div class="mwin-t"><div class="lights" aria-hidden="true"><span></span><span></span><span></span></div><div class="ttl">${title}</div>${o.right || '<span style="width:52px"></span>'}</div><div class="mwin-b">${body}</div></div>`;
  MX.now = () => new Date().toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).replace(',', '');
  MX.mbar = (titles, right = '') => `<div class="mbar" role="menubar" aria-label="Menu bar"><button class="mt apple" role="menuitem" aria-label="Apple menu" data-mt="apple">${ic('apple')}</button>${titles.map((t, i) => `<button class="mt${i === 0 ? ' app' : ''}" role="menuitem" aria-haspopup="menu" aria-expanded="false" data-mt="${esc(t)}">${esc(t)}</button>`).join('')}<span class="sp"></span>${right}<button class="si" aria-label="Wi-Fi" tabindex="-1">${ic('wifi')}</button><button class="si" aria-label="Spotlight" tabindex="-1">${ic('search')}</button><button class="si" aria-label="Control Centre" tabindex="-1">${ic('sliders-horizontal')}</button><span class="si clock">${MX.now()}</span></div>`;

  /* ----- Pref switches anywhere on the page ----- */
  document.addEventListener('change', (e) => {
    const t = e.target.closest('input[data-pref]'); if (!t) return;
    G.setPref(t.dataset.pref, t.checked);
    G.toast(`${esc(t.closest('label').textContent.trim())}: ${t.checked ? 'on' : 'off'}`, { icon: t.checked ? 'toggle-right' : 'toggle-left' });
  });
  G.on('pref', ({ key }) => {
    $$(`input[data-pref="${key}"]`).forEach((i) => (i.checked = !!G.prefs[key]));
    MX.panels.forEach((p) => p.built && p.onPref && p.onPref(key));
    renderNav(); renderStatus();
  });

  /* ----- Shortcut recorder for global hotkeys ----- */
  MX.sysKeys = {
    '⌘Space': 'Spotlight', '⌥⌘Space': 'Finder search window', '⌃Space': 'Input Sources: previous source', '⌃⌥Space': 'Input Sources: next source in the Input menu',
    '⌃⌘Space': 'Emoji & Symbols', '⌥⌘V': 'Finder: Move Item Here (paste a cut file)', '⇧⌘3': 'Screenshot', '⇧⌘4': 'Screenshot selection', '⇧⌘5': 'Screenshot toolbar',
    '⌘Tab': 'App switcher', '⌃⌘Q': 'Lock Screen', '⌥⌘D': 'Show or hide the Dock', '⌥⌘Esc': 'Force Quit', '⌃↑': 'Mission Control', '⌃↓': 'App windows', '⌘`': 'Move focus to next window',
    '⌘H': 'Hide app', '⌘Q': 'Quit app', '⌘W': 'Close window', '⌘V': 'Paste', '⌘C': 'Copy', '⌘X': 'Cut', '⌘Z': 'Undo'
  };
  const ORDER = ['⌃', '⌥', '⇧', '⌘'];
  MX.norm = (k) => { const m = String(k).match(/^((?:fn\s?)?[⌃⌥⇧⌘]*)(.*)$/); return (m[1].startsWith('fn') ? 'fn ' : '') + ORDER.filter((c) => m[1].includes(c)).join('') + m[2].trim(); };
  MX.rec = (key) => `<button class="btn sm rec" data-rec="${key}" title="Click, then press the new shortcut. Esc cancels, Delete clears.">${esc(G.prefs[key] || 'None')}</button>`;
  MX.recNote = (key) => { const v = G.prefs[key]; const c = v && MX.sysKeys[MX.norm(v)]; return c ? `<span class="chip warn">${ic('triangle-alert')}Also used by macOS: ${esc(c)}</span>` : v ? `<span class="chip ok">${ic('check')}No known system clash</span>` : `<span class="chip">${ic('circle-slash')}Off</span>`; };
  let recording = null;
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-rec]'); if (!b) return;
    if (recording) recording.classList.remove('on');
    recording = b; b.classList.add('on'); b.textContent = 'Type shortcut…';
  });
  document.addEventListener('keydown', (e) => {
    if (!recording) return;
    e.preventDefault(); e.stopPropagation();
    const b = recording; const key = b.dataset.rec;
    if (e.key === 'Escape') { recording = null; b.classList.remove('on'); b.textContent = G.prefs[key] || 'None'; return; }
    if (e.key === 'Backspace' || e.key === 'Delete') { recording = null; b.classList.remove('on'); G.setPref(key, ''); b.textContent = 'None'; return; }
    if (['Control', 'Alt', 'Shift', 'Meta'].includes(e.key)) return;
    const mods = (e.ctrlKey ? '⌃' : '') + (e.altKey ? '⌥' : '') + (e.shiftKey ? '⇧' : '') + (e.metaKey ? '⌘' : '');
    if (!mods) { b.textContent = 'Add a modifier…'; return; }
    const name = e.code === 'Space' ? 'Space' : /^Key[A-Z]$/.test(e.code) ? e.code.slice(3) : /^Digit\d$/.test(e.code) ? e.code.slice(5) : e.key.length === 1 ? e.key.toUpperCase() : e.key.replace('Arrow', '');
    recording = null; b.classList.remove('on');
    G.setPref(key, mods + name); b.textContent = mods + name;
  }, true);

  /* ----- macOS menu engine: hover-open submenus, Option alternates, type-ahead, keyboard ----- */
  const MM = (MX.mm = { stack: [], alt: false });
  const parseK = (k) => { const m = String(k).match(/^((?:fn\s?)?[⌃⌥⇧⌘]*)(.*)$/); return { mods: m[1], key: m[2] }; };
  const val = (v) => (typeof v === 'function' ? v() : v);
  function rowHtml(it, i) {
    if (it.sep) return '<hr>';
    if (it.header) return `<div class="mmh">${esc(it.header)}</div>`;
    if (it.note) return `<div class="mm-note">${esc(it.note)}</div>`;
    if (it.html) return it.html;
    const v = MM.alt && it.alt ? Object.assign({}, it, it.alt) : it;
    const kk = v.kbd ? parseK(v.kbd) : null;
    const dis = val(v.disabled), chk = val(it.checked), label = val(v.label);
    return `<button class="mmi" role="${chk != null ? 'menuitemcheckbox' : 'menuitem'}"${chk != null ? ` aria-checked="${!!chk}"` : ''} data-i="${i}"${dis ? ' aria-disabled="true"' : ''}${it.sub ? ' aria-haspopup="menu"' : ''} tabindex="-1"><span class="mck">${chk ? ic(it.radio ? 'dot' : 'check') : ''}</span><span class="mic">${v.icon ? ic(v.icon) : ''}</span><span class="mlb">${v.path ? `<span class="mpath">${esc(v.path)} ›</span>` : ''}${esc(label)}</span><span class="mmk">${kk ? `<span class="md">${esc(kk.mods)}</span><span class="mkey">${esc(kk.key)}</span>` : ''}</span><span class="mch">${it.sub ? ic('chevron-right') : ''}</span></button>`;
  }
  MM.closeAll = () => { while (MM.stack.length) { const l = MM.stack.pop(); l.el.remove(); if (l.level === 0 && l.opts.onClose) l.opts.onClose(); } MM.alt = false; };
  MM.open = (anchor, items, opts = {}) => { MM.closeAll(); return open(anchor, items, opts, 0); };
  function open(anchor, items, opts, level) {
    while (MM.stack.length > level) MM.stack.pop().el.remove();
    const el = G.el(`<div class="mm" role="menu" tabindex="-1"${opts.label ? ` aria-label="${esc(opts.label)}"` : ''}></div>`);
    if (opts.width) el.style.minWidth = opts.width + 'px';
    el.innerHTML = items.map(rowHtml).join('');
    document.body.appendChild(el); G.icons(el);
    const L = { el, items, opts, level, hot: -1, timer: null, btns: $$('.mmi', el) };
    MM.stack.push(L);
    // Position: under a menu-bar title, at a point, above a Dock icon, or beside the parent item.
    const r = anchor && anchor.getBoundingClientRect ? anchor.getBoundingClientRect() : anchor;
    const w = el.offsetWidth, h = el.offsetHeight;
    let x, y;
    if (level > 0) { x = r.right - 3; y = r.top - 6; if (x + w > innerWidth - 6) x = r.left - w + 3; }
    else if (opts.above) { x = r.left + r.width / 2 - w / 2; y = r.top - h - 8; }
    else { x = opts.alignEnd ? r.right - w : r.left; y = (opts.at ? r.top : r.bottom) + (opts.gap != null ? opts.gap : 4); }
    x = Math.max(6, Math.min(x, innerWidth - w - 6));
    // A top-level menu never covers its menu bar: it scrolls instead, as AppKit menus do.
    if (level === 0 && !opts.above && !opts.at && y + h > innerHeight - 6 && innerHeight - y > 220) el.style.maxHeight = (innerHeight - y - 6) + 'px';
    else if (y + h > innerHeight - 6) y = Math.max(6, innerHeight - h - 6);
    y = Math.max(6, y);
    el.style.left = x + 'px'; el.style.top = y + 'px';
    L.btns.forEach((b) => {
      const it = items[+b.dataset.i];
      b.addEventListener('mouseenter', () => { setHot(L, L.btns.indexOf(b)); clearTimeout(L.timer); L.timer = setTimeout(() => { if (it.sub) openSub(L, b, it, false); else { while (MM.stack.length > level + 1) MM.stack.pop().el.remove(); L.btns.forEach((x) => x.classList.remove('open')); } }, it.sub ? 90 : 180); });
      b.addEventListener('click', (e) => { e.stopPropagation(); activate(L, b); });
    });
    el.addEventListener('keydown', (e) => key(L, e));
    const search = $('.mm-search input', el);
    if (opts.search && search) { search.addEventListener('input', () => opts.search(search.value, L)); setTimeout(() => { search.focus(); const n = search.value.length; search.setSelectionRange(n, n); }, 0); }
    else el.focus({ preventScroll: true });
    if (opts.startHot != null) setHot(L, opts.startHot);
    return L;
  }
  // Rebuild a level in place (used by the Help menu search field).
  MM.rebuild = (L, items) => {
    const r = L.el.getBoundingClientRect(); const lvl = L.level; const opts = Object.assign({}, L.opts, { at: true, gap: 0, startHot: null });
    MM.stack.splice(lvl).forEach((x) => x.el.remove());
    return open({ left: r.left, right: r.right, top: r.top, bottom: r.top, width: r.width }, items, opts, lvl);
  };
  function setHot(L, i) {
    L.btns.forEach((b) => b.classList.remove('hot')); L.hot = i;
    const b = L.btns[i]; if (!b) return;
    b.classList.add('hot'); b.scrollIntoView({ block: 'nearest' });
    L.opts.onHot && L.opts.onHot(L.items[+b.dataset.i], b);
  }
  function openSub(L, b, it, focus) {
    if (MM.stack[L.level + 1] && MM.stack[L.level + 1].from === b) { if (focus) { const S = MM.stack[L.level + 1]; setHot(S, 0); S.el.focus(); } return; }
    L.btns.forEach((x) => x.classList.remove('open')); b.classList.add('open');
    const sub = val(it.sub);
    const S = open(b, sub, { onHot: L.opts.onHot, onRight: L.opts.onRight || (MM.stack[0] && MM.stack[0].opts.onRight), width: it.subWidth }, L.level + 1);
    S.from = b; if (focus) { setHot(S, 0); S.el.focus(); } else L.el.focus({ preventScroll: true });
  }
  function activate(L, b) {
    const it = L.items[+b.dataset.i]; if (!it) return;
    const v = MM.alt && it.alt ? Object.assign({}, it, it.alt) : it;
    if (val(v.disabled)) return;
    if (it.sub) return openSub(L, b, it, true);
    const run = v.run; MM.closeAll(); run && run();
  }
  function key(L, e) {
    if (e.target.matches('input') && !['ArrowDown', 'ArrowUp', 'Escape', 'Enter'].includes(e.key)) return;
    const n = L.btns.length;
    const step = (d) => { let i = L.hot; for (let c = 0; c < n; c++) { i = (i + d + n) % n; if (L.btns[i].getAttribute('aria-disabled') !== 'true') return setHot(L, i); } };
    if (e.key === 'ArrowDown') { e.preventDefault(); if (e.target.matches('input')) L.el.focus(); step(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); step(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); const b = L.btns[L.hot]; const it = b && L.items[+b.dataset.i]; if (it && it.sub) openSub(L, b, it, true); else if (MM.stack[0].opts.onRight) MM.stack[0].opts.onRight(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); if (L.level > 0) { MM.stack.splice(L.level).forEach((x) => x.el.remove()); const P = MM.stack[L.level - 1]; P.btns.forEach((x) => x.classList.remove('open')); P.el.focus(); } else if (L.opts.onLeft) L.opts.onLeft(); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); const b = L.btns[L.hot]; if (b) activate(L, b); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); if (L.level > 0) { MM.stack.splice(L.level).forEach((x) => x.el.remove()); MM.stack[L.level - 1].el.focus(); } else { const f = L.opts.returnFocus; MM.closeAll(); if (f) f.focus(); } }
    else if (e.key.length === 1 && /\w/.test(e.key) && !e.metaKey && !e.ctrlKey) {
      const ch = e.key.toLowerCase(); const start = L.hot + 1;
      for (let c = 0; c < n; c++) { const i = (start + c) % n; const it = L.items[+L.btns[i].dataset.i]; const lb = String(val(it.label) || ''); if (lb.toLowerCase().startsWith(ch)) { setHot(L, i); break; } }
    }
  }
  // Holding Option swaps items that have an alternate, as AppKit does.
  const altSwap = (on) => { if (!MM.stack.length || MM.alt === on) return; MM.alt = on; MM.stack.forEach((L) => L.btns.forEach((b) => { const it = L.items[+b.dataset.i]; if (it.alt) { const nb = G.el(rowHtml(it, +b.dataset.i)); b.innerHTML = nb.innerHTML; G.icons(b); } })); };
  document.addEventListener('keydown', (e) => { if (e.key === 'Alt') altSwap(true); });
  document.addEventListener('keyup', (e) => { if (e.key === 'Alt') altSwap(false); });
  document.addEventListener('mousedown', (e) => { if (MM.stack.length && !e.target.closest('.mm') && !e.target.closest('[data-keep-menu]')) MM.closeAll(); }, true);
  window.addEventListener('blur', () => MM.closeAll());

  /* ----- Result sheet: before and after, copy ----- */
  MX.result = (title, before, after, o = {}) => {
    MM.closeAll(); G.closeMenu();
    const sc = G.el(`<div class="rs-scrim" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="rs">
      <div class="rs-h">${ic(o.icon || 'wand-sparkles')}<b>${esc(title)}</b>${o.via ? `<span class="chip">${esc(o.via)}</span>` : ''}<span class="grow"></span><span class="faint">${fmt(before.length)} → ${fmt(after.length)} chars</span><button class="tb-btn" data-x title="Close (Esc)" aria-label="Close">${ic('x')}</button></div>
      <div class="rs-cols"><div><h5>${esc(o.beforeLabel || 'BEFORE')}</h5><pre>${esc(before.slice(0, 8000))}</pre></div><div><h5>${esc(o.afterLabel || 'AFTER')}</h5><pre>${esc(after)}</pre></div></div>
      <div class="rs-f">${o.note ? `<span class="faint" style="font-size:12px">${esc(o.note)}</span>` : ''}<span class="grow"></span><button class="btn" data-a="close">Close</button><button class="btn primary" data-a="copy">${ic('copy')}Copy result</button></div></div></div>`);
    document.body.appendChild(sc); G.icons(sc);
    const close = () => { sc.remove(); if (o.returnFocus) o.returnFocus.focus(); };
    sc.addEventListener('mousedown', (e) => { if (e.target === sc) close(); });
    sc.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.stopPropagation(); close(); } });
    sc.addEventListener('click', (e) => { const a = e.target.closest('[data-a],[data-x]'); if (!a) return; if (a.dataset.a === 'copy') G.copy(after, { as: title, clean: false }); close(); });
    $('[data-a="copy"]', sc).focus();
  };
  MX.xf = (id, text, via) => { const src = text == null ? DOC.src : text; const t = G.transforms.find((x) => x.id === id); if (!t) return G.toast('That transform is not part of this page', { icon: 'info' }); MX.result(t.name, src, t.fn(src, { path: DOC.path }), { via }); };
  MX.newFromClip = () => { if (!G.clips.items[0]) return G.toast('The clipboard is empty', { icon: 'clipboard' }); G.toast('Saved the clipboard to the Inbox as a new document', { icon: 'clipboard-paste', action: { label: 'Open Inbox', run: () => (location.href = G.page('collections') + '#c=inbox') } }); };

  /* ----- Surfaces ----- */
  MX.panel = (p) => MX.panels.push(p);
  const stage = $('#stage'), nav = $('#mxnav');
  const groups = { toolbar: 'In Marxy’s window', extra: 'Anywhere, while Marxy runs', finder: 'In Finder and other apps', dock: 'System chrome', perms: 'Reference' };
  function navState(p) {
    if (!p.state) return '';
    const s = p.state(); if (s == null) return '';
    return `<span class="st${s.on ? ' on' : ''}">${esc(s.text)}</span>`;
  }
  function renderNav() {
    nav.innerHTML = MX.panels.map((p, i) => `${groups[p.id] ? `<h3>${groups[p.id]}</h3>` : ''}<button class="mxn" role="tab" id="n-${p.id}" data-p="${p.id}" aria-controls="p-${p.id}" aria-selected="${MX.cur === p}" tabindex="${MX.cur === p ? 0 : -1}"><span class="n">${i + 1}</span>${ic(p.icon)}<span class="t">${esc(p.title)}</span>${navState(p)}</button>`).join('');
    G.icons(nav);
  }
  nav.addEventListener('click', (e) => { const b = e.target.closest('[data-p]'); if (b) MX.show(b.dataset.p); });
  nav.addEventListener('keydown', (e) => {
    const i = MX.panels.indexOf(MX.cur);
    const go = (j) => { e.preventDefault(); MX.show(MX.panels[(j + MX.panels.length) % MX.panels.length].id); $(`#n-${MX.cur.id}`).focus(); };
    if (e.key === 'ArrowDown') go(i + 1); else if (e.key === 'ArrowUp') go(i - 1); else if (e.key === 'Home') go(0); else if (e.key === 'End') go(MX.panels.length - 1);
  });
  MX.show = (id) => {
    const p = MX.panels.find((x) => x.id === id) || MX.panels[0];
    if (MX.cur && MX.cur !== p) { MM.closeAll(); G.closeMenu(); if (MX.cur.onHide) MX.cur.onHide(); }
    MX.cur = p;
    $$('.mx-panel', stage).forEach((s) => (s.hidden = s.dataset.p !== p.id));
    const sec = $(`#p-${p.id}`);
    if (!p.built) {
      p.built = true;
      try { p.build($('.mx-pbody', sec), sec); } catch (err) { console.error(err); $('.mx-pbody', sec).insertAdjacentHTML('beforeend', `<div class="chip err">${ic('circle-x')}This replica failed to build: ${esc(err.message)}</div>`); }
      G.icons(sec);
    }
    if (location.hash !== '#' + p.id) history.replaceState(null, '', '#' + p.id);
    stage.scrollTop = 0; renderNav(); renderStatus();
    if (p.onShow) p.onShow();
  };
  MX.boot = () => {
    stage.innerHTML = MX.panels.map((p) => `<section class="mx-panel" id="p-${p.id}" data-p="${p.id}" role="tabpanel" aria-labelledby="n-${p.id}" hidden>
      <div class="mx-head"><div class="ico">${ic(p.icon)}</div><div style="min-width:0;flex:1"><h2>${esc(p.title)}</h2><p>${p.desc}</p>
      ${p.meta ? `<div class="mx-meta">${p.meta.map(([i, t, c]) => MX.chip(i, t, c || '')).join('')}</div>` : ''}</div>
      ${p.prefs ? `<div class="mx-prefs">${p.prefs()}</div>` : ''}</div>
      <div class="mx-pbody"></div></section>`).join('');
    MX.panels.forEach((p) => G.command({ id: 'macos-' + p.id, name: 'macOS: ' + p.title, icon: p.icon, group: 'macOS', run: () => MX.show(p.id) }));
    const want = location.hash.slice(1);
    MX.show(MX.panels.some((p) => p.id === want) ? want : MX.panels[0].id);
  };
  $('#pv-prev').onclick = () => { const i = MX.panels.indexOf(MX.cur); MX.show(MX.panels[(i - 1 + MX.panels.length) % MX.panels.length].id); };
  $('#pv-next').onclick = () => { const i = MX.panels.indexOf(MX.cur); MX.show(MX.panels[(i + 1) % MX.panels.length].id); };
  document.addEventListener('keydown', (e) => {
    if (e.altKey && !e.metaKey && !e.ctrlKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown') && !e.target.closest('input, textarea, .mm, .hud, .gp, .spot, .fnd-list')) { e.preventDefault(); (e.key === 'ArrowUp' ? $('#pv-prev') : $('#pv-next')).click(); }
  });

  /* ----- Status bar ----- */
  function renderStatus() {
    const P = G.prefs;
    $('#status').innerHTML = G.ui.statusbar([
      { icon: 'command', html: `${MX.panels.length} surfaces` },
      { icon: MX.cur ? MX.cur.icon : 'monitor', html: MX.cur ? esc(MX.cur.title) : '' },
      { html: '<span class="grow"></span>' },
      { icon: 'panel-top', html: 'Menu bar extra ' + (P.menubarExtra ? 'on' : 'off') },
      { icon: 'keyboard', html: `Palette ${esc(P.globalPalette || 'off')} · Ring ${esc(P.globalClipRing || 'off')}` },
      { cmd: 'theme-menu', icon: 'palette', html: G.themes.find((t) => t.id === G.resolvedTheme()).name }
    ]).replace('<span class="sb-item"><span class="grow"></span></span>', '<span class="grow"></span>');
    G.icons($('#status'));
  }
  MX.renderStatus = renderStatus; MX.renderNav = renderNav;
  G.on('theme', renderStatus);
})();
</script>

<script>
/* ===== 3. Menu bar extra (status item) and 4. floating clipboard ring ===== */
(function () {

  const pipeMenu = (getText, via) => PIPES.map(([n, steps]) => ({ label: n, icon: 'workflow', run: () => MX.runPipe(n, getText(), via), d: steps.join(' → ') }));

    },
    onPref(k) { if (['menubarExtra', 'clipHistory', 'globalClipRing', 'globalPalette'].includes(k)) renderExtra(); },
    onShow() { X.open = true; renderExtra(); }
  });

  /* ---------- Clipboard ring HUD over another app ---------- */
  let rd = null; const R = { q: '', hot: 0, sel: [0, 0], open: false };
  MX.ringMode = MX.store.get('ringPaste', 'paste');
  function ringItems() { return G.clips.items.map((c, i) => ({ c, i, m: R.q ? G.fuzzy(R.q, c.text) : { score: 0 } })).filter((x) => x.m).sort((a, b) => (R.q ? b.m.score - a.m.score : (b.c.pinned - a.c.pinned) || 0)); }

        <div class="hud-prev">${cur ? `<div class="row">${MX.chip(clipIcon(cur.c), cur.c.as)}<span class="faint">${esc(cur.c.app)}</span></div><pre>${esc(cur.c.text.slice(0, 900))}</pre>${cur.c.source ? `<div class="faint">From ${esc(cur.c.source.title)}${cur.c.source.line ? ', line ' + cur.c.source.line : ''}</div>` : ''}<div class="faint">${fmt(cur.c.text.length)} chars</div>` : ''}</div></div>

  MX.panel({

<script>
/* ===== 5. Global palette over another app ===== */
(function () {

  let gd = null;
  const input = () => (P.useClip ? (G.clips.items[0] || { text: '' }).text : P.sel);
  function results() {
    const raw = P.q; const tOnly = raw.startsWith('/'); const q = (tOnly ? raw.slice(1) : raw).trim();
    const groups = [];

      const files = (q ? G.library.map((d) => ({ d, m: G.fuzzy(q, d.title + ' ' + d.path) })).filter((x) => x.m).sort((a, b) => b.m.score - a.m.score).map((x) => x.d) : G.library.filter((d) => d.hasSrc)).slice(0, q ? 6 : 4);
      groups.push({ g: 'Open from the Library', items: files.map((d) => ({ type: 'file', icon: G.kinds[d.kind].icon, title: d.title, sub: d.path.replace(/^~\//, ''), d })) });
      const cmds = [['Clipboard ring', 'clipboard-list', () => { MX.show('ring'); setTimeout(() => MX.openRing(), 40); }], ['New document from clipboard', 'clipboard-paste', () => MX.newFromClip()], ['Open Marxy', 'app-window', () => G.toast('Marxy comes to the front', { icon: 'app-window' })]].filter(([n]) => !q || G.fuzzy(q, n));

  function preview(it) {

    if (it.type === 'file') { const d = it.d; const full = G.doc(d.id); return `<b>${esc(d.title)}</b><span class="faint">${esc(d.path)}</span><div class="row" style="flex-wrap:wrap;gap:4px">${MX.chip(G.kinds[d.kind].icon, G.kinds[d.kind].name)}</div>${full ? `<pre>${esc(G.transform('strip-frontmatter', full.src).trim().slice(0, 500))}</pre>` : '<span class="faint">Indexed metadata only in this prototype</span>'}<span class="faint">↩ opens in Marxy · ⌘↩ copies the path</span>`; }

      <div class="gp-in">${ic('command')}<input id="gp-q" placeholder="Transform the selection, open a file, run a command" aria-label="Global palette" autocomplete="off" value="${esc(P.q)}"><span class="kbd">esc</span></div>

      <div class="gp-body"><div class="gp-list" role="listbox">${gs.map((g) => `<div class="grp">${esc(g.g)}</div>` + g.items.map((it) => { const i = P.flat.push(it) - 1; return `<div class="prow${i === P.hot ? ' hot' : ''}" role="option" aria-selected="${i === P.hot}" data-gi="${i}"><span></span>${ic(it.icon)}<span class="t">${esc(it.title)}</span><span class="s">${esc(it.sub)}</span></div>`; }).join('')).join('')}</div><div class="gp-prev">${preview(P.flat[P.hot])}</div></div></div>`);
    const box = $('#gp', gd); G.icons(box);

    meta: [['keyboard', 'tauri-plugin-global-shortcut'], ['accessibility', 'Accessibility: read and replace the selection', 'warn'], ['app-window', 'Non-activating panel (native)']],
    prefs: () => `<span class="mx-pref">Shortcut ${MX.rec('globalPalette')}</span>`,

          <div class="mwin appwin" style="left:50px;top:52px;right:50px;bottom:24px"><div class="mwin-t"><div class="lights" aria-hidden="true"><span></span><span></span><span></span></div><div class="ttl">Re: Postgres 16 upgrade</div><span style="width:52px"></span></div>
          <div class="mwin-b"><div class="mailhdr"><span>To:</span><b>platform-team@example.com</b><span>Subject:</span><b>Re: Postgres 16 upgrade</b></div><div class="appbody"><p>Hi all,</p><p>Pasting the upgrade status below.</p><p><span class="fsel" id="gp-sel" style="white-space:pre-wrap"></span></p><p>Thanks,<br>Ian</p></div></div></div></div>
        <div class="mx-row"><button class="btn primary" id="gp-open">${ic('command')}Summon the palette</button><button class="btn" id="gp-reset">${ic('rotate-ccw')}Restore the original selection</button><span id="gp-note">${MX.recNote('globalPalette')}</span></div>

      gd = $('#gd', b); paintMail(false);

    { n: 'search-relevance-plan.md', doc: { id: 'search-plan', title: 'Plan: search relevance tuning', src: stub('Plan: search relevance tuning', '## Approach\n\n- Boost headings 2x over body text.\n- Add a recency decay with a 14-day half-life.\n- Measure with 40 labelled queries before shipping.\n\n## Steps\n\n1. Label 40 queries from the search log.\n2. Try BM25 field weights 1, 2 and 3 for headings.\n3. Add the decay and compare nDCG@10.\n\n- [ ] Export the query log\n- [ ] Write the labelling sheet'), kind: 'report', path: '~/Work/plans/plans/search-relevance-plan.md', collection: 'plans', status: {} }, mod: '3 days ago', size: '12 KB' },
