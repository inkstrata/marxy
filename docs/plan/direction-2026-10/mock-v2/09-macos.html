    id: 'services', title: 'Services menu', icon: 'list-plus',
    desc: 'Marxy’s text services, available in every app that supports the Services menu: under the app menu › Services, and in the text context menu. Pick a passage in the TextEdit window (click it), then open TextEdit › Services or right-click the highlighted text. Convert to Markdown Table and Run Pipeline write their result back into the document.',
    meta: [['file-code', 'NSServices in Info.plist'], ['code', 'Services provider object (native shim)'], ['keyboard', 'Shortcuts assigned by the user in System Settings']],
    prefs: () => MX.sw('servicesMenu', 'Marxy services'),
    state: () => ({ text: G.prefs.servicesMenu ? marxyServices().length + ' on' : 'Off', on: G.prefs.servicesMenu }),
    build(b) {
      b.innerHTML = `<div class="desk" id="sd" style="min-height:500px" data-keep-menu>${MX.mbar(['TextEdit', 'File', 'Edit', 'Format', 'View', 'Window', 'Help'])}
        <div class="mwin appwin" style="left:50px;top:52px;right:50px;bottom:22px"><div class="mwin-t"><div class="lights" aria-hidden="true"><span></span><span></span><span></span></div><div class="ttl">Review notes.rtf</div><span style="width:52px"></span></div><div class="mwin-b"><div class="appbody" id="sv-body" tabindex="0" aria-label="TextEdit document (mock). Shift-F10 opens the context menu."></div></div></div></div>
        <div class="mx-row"><button class="btn" id="sv-app">${ic('menu')}Open TextEdit › Services</button><button class="btn" id="sv-ctx">${ic('mouse-pointer-click')}Right-click the selection</button><button class="btn" id="sv-reset">${ic('rotate-ccw')}Reset text</button><span class="mx-note">Marxy items are listed under Text. With four or fewer enabled, macOS also shows them directly in the context menu.</span></div>
        <div class="ref" id="sv-ref"></div>
        <p class="mx-note">Apps cannot remove their own services at runtime. Turning a service off here unticks it for Marxy’s handler and points to System Settings › Keyboard › Keyboard Shortcuts › Services, where the user hides it from every menu and can give it a shortcut.</p>`;
      sd = $('#sd', b); paint(false);
      $('#sv-body', sd).addEventListener('click', (e) => { const p = e.target.closest('[data-sv]'); if (p && +p.dataset.sv !== SV.pick) { SV.pick = +p.dataset.sv; paint(false); } });
      $('#sv-body', sd).addEventListener('contextmenu', (e) => { e.preventDefault(); const p = e.target.closest('[data-sv]'); if (p) { SV.pick = +p.dataset.sv; paint(false); } ctxMenu({ left: e.clientX, right: e.clientX, top: e.clientY, bottom: e.clientY }); });
      $('#sv-body', sd).addEventListener('keydown', (e) => { if (e.key === 'ContextMenu' || (e.shiftKey && e.key === 'F10')) { e.preventDefault(); const r = $('.fsel', sd).getBoundingClientRect(); ctxMenu({ left: r.left + 20, right: r.left + 20, top: r.bottom, bottom: r.bottom }); } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); SV.pick = (SV.pick + (e.key === 'ArrowDown' ? 1 : 2)) % 3; paint(false); } });
      $('.mbar [data-mt="TextEdit"]', sd).onclick = (e) => appMenu(e.currentTarget);
      $('#sv-app', b).onclick = () => { const btn = $('.mbar [data-mt="TextEdit"]', sd); appMenu(btn); setTimeout(() => { const L = MX.mm.stack[0]; const i = L && L.btns.findIndex((x) => /Services/.test(x.textContent)); if (L && i >= 0) L.btns[i].dispatchEvent(new MouseEvent('mouseenter')); }, 30); };
      $('#sv-ctx', b).onclick = () => { const r = $('.fsel', sd).getBoundingClientRect(); ctxMenu({ left: r.left + 30, right: r.left + 30, top: r.top + 20, bottom: r.top + 20 }); };
      $('#sv-reset', b).onclick = () => { SV.texts = SAMPLES.map((s) => s[1]); paint(false); };
      renderSvcRef();
    },
    onPref(k) { if (['servicesMenu', 'servicesList'].includes(k)) renderSvcRef(); }
  });

  /* ---------- Share extension ---------- */
  let shd = null; const SH = { open: false, mode: 'sel', fmt: 'quote' };
  const PAGE = { title: 'Versioning policy', url: 'https://www.postgresql.org/support/versioning/', paras: ['Each major version receives fixes for five years after its first release. After that it is unsupported: no security fixes, no bug fixes.', 'Minor releases contain only fixes, never new features, and upgrading within a major version needs no dump and restore.', 'Major upgrades change the on-disk format and need pg_upgrade or a dump and restore.'] };
  function captured() {
    const sel = window.getSelection().toString().trim() || SH.lastSel || PAGE.paras[0];
    if (SH.mode === 'link') return `[${PAGE.title}](${PAGE.url})`;
    if (SH.mode === 'page') return `# ${PAGE.title}\n\nSource: <${PAGE.url}>\n\n` + PAGE.paras.join('\n\n');
    return SH.fmt === 'quote' ? sel.split('\n').map((l) => '> ' + l).join('\n') + `\n>\n> — [${PAGE.title}](${PAGE.url})` : sel;
  }
  function renderShare() {
    $$('.shx', shd).forEach((x) => x.remove()); if (!SH.open) return;
    const cols = G.collections;
    shd.insertAdjacentHTML('beforeend', `<div class="shx" role="dialog" aria-label="Marxy Inbox share extension"><div class="shx-h"><button class="btn sm ghost" data-sh="cancel">Cancel</button><b>Marxy Inbox</b><button class="btn sm primary" data-sh="save">Save</button></div>
      <div class="shx-b"><div class="shx-card"><div class="row">${ic('globe')}<b style="font-size:12.5px">${esc(PAGE.title)}</b><span class="faint" style="font-size:11.5px">${esc(PAGE.url.replace(/^https?:\/\//, ''))}</span></div><pre id="sh-prev">${esc(captured())}</pre><span class="faint" style="font-size:11.5px" id="sh-count"></span></div>
      <div class="frm"><span class="lab">Capture</span><div class="seg" role="group" aria-label="Capture">${[['sel', 'Selection'], ['page', 'Page as Markdown'], ['link', 'Link only']].map(([v, l]) => `<button data-mode="${v}" aria-pressed="${SH.mode === v}">${l}</button>`).join('')}</div>
        <span class="lab">Format</span><select class="field" id="sh-fmt" ${SH.mode !== 'sel' ? 'disabled' : ''}><option value="quote">Quote with source link</option><option value="md">Markdown as is</option></select>
        <label class="lab" for="sh-title">Title</label><input class="field" id="sh-title" value="${esc(PAGE.title)}">
        <label class="lab" for="sh-to">Save to</label><select class="field" id="sh-to">${cols.map((c) => `<option value="${c.id}"${c.id === 'inbox' ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
        <span></span><div class="stack" style="gap:4px"><label class="chk"><input type="checkbox" id="sh-open">Open in Marxy after saving</label></div></div></div></div>`);
    const x = $('.shx', shd); G.icons(x);
    $('#sh-fmt', x).value = SH.fmt;
    const upd = () => { $('#sh-prev', x).textContent = captured(); $('#sh-count', x).textContent = `${fmt(captured().length)} chars · saved as ${slug()}.md`; };
    const slug = () => G.transform('slug', $('#sh-title', x).value || 'capture');
    upd();
    $$('[data-mode]', x).forEach((bt) => (bt.onclick = () => { SH.mode = bt.dataset.mode; renderShare(); }));
    $('#sh-fmt', x).onchange = (e) => { SH.fmt = e.target.value; upd(); };
    $('#sh-title', x).oninput = upd;
    x.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.preventDefault(); SH.open = false; renderShare(); } if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); $('[data-sh="save"]', x).click(); } });
    x.addEventListener('click', (e) => {
      const a = e.target.closest('[data-sh]'); if (!a) return;
      if (a.dataset.sh === 'save') {
        const src = captured();
        const to = G.collections.find((c) => c.id === $('#sh-to', x).value).name;
        addInbox($('#sh-title', x).value || 'Capture', src, 'Share · Safari → ' + to);
        G.toast(`Saved to ${esc(to)} as ${slug()}.md`, { icon: 'inbox', action: $('#sh-open', x).checked ? null : { label: 'Open', run: () => G.toast('Marxy opens the capture', { icon: 'book-open-text' }) } });
      }
      SH.open = false; renderShare();
    });
    $('#sh-title', x).focus();
  }
  function renderInboxList() {
    const l = $('#sh-inbox'); if (!l) return;
    l.innerHTML = MX.inbox.length ? MX.inbox.map((c) => `<div class="rr" style="grid-template-columns:18px minmax(0,1fr) auto">${ic('inbox')}<span><b style="font-weight:600">${esc(c.title)}</b><br><span class="faint" style="font-size:11.5px">${esc(c.via)} · ${fmt(c.chars)} chars</span></span><span class="faint">${G.ago(c.at)}</span></div>`).join('') : '<div class="rr"><span class="faint">Nothing captured yet. Share the page, or use Services › Send to Marxy Inbox.</span></div>';
    G.icons(l);
  }
  G.on('mx-inbox', renderInboxList);
  MX.panel({
    id: 'share', title: 'Share extension', icon: 'share',
    desc: 'A Marxy Inbox target in the system share menu. From a browser it captures the selection as a quote with a source link, the whole page as Markdown, or just the link; from Finder it takes Markdown and text files. Select some text in the page below, then use the Share button in the browser toolbar.',
    meta: [['puzzle', 'Share extension (Swift target)'], ['folder-sync', 'Writes to the App Group container'], ['shield', 'Sandboxed']],
    prefs: () => MX.sw('shareExt', 'Share extension'),
    state: () => ({ text: G.prefs.shareExt === false ? 'Off' : 'On', on: G.prefs.shareExt !== false }),
    build(b) {
      b.innerHTML = `<div class="desk" id="shd" style="min-height:660px">${MX.mbar(['Safari', 'File', 'Edit', 'View', 'History', 'Bookmarks', 'Window', 'Help'])}
        <div class="mwin" style="left:40px;top:50px;right:40px;bottom:22px"><div class="brw-bar"><div class="lights" aria-hidden="true" style="padding:0 8px 0 0"><span></span><span></span><span></span></div>${ic('chevron-left')}${ic('chevron-right')}<div class="url">${ic('lock', 'ic-sm')}postgresql.org/support/versioning</div><button class="tb-btn" id="sh-btn" title="Share" aria-label="Share" aria-haspopup="menu">${ic('share')}</button><button class="tb-btn" aria-label="Tabs" tabindex="-1">${ic('copy')}</button></div>
        <div class="mwin-b"><div class="brw-page"><h1>${esc(PAGE.title)}</h1>${PAGE.paras.map((p) => `<p>${esc(p)}</p>`).join('')}</div></div></div></div>
        <div class="mx-cols"><div><div class="mx-h">${ic('inbox', 'ic-sm')}Captured to the Inbox</div><div class="ref" id="sh-inbox"></div></div><div class="mx-side"><div class="box"><b style="font-size:12.5px">Accepts</b><p class="mx-note">Web pages and URLs (one), plain and rich text, and up to 20 Markdown, text, CSV or JSON files. Images and PDFs are declined so the target does not appear where it cannot help.</p></div><div class="box"><b style="font-size:12.5px">Hand-off</b><p class="mx-note">The extension writes the capture into the shared App Group folder and pings Marxy; if Marxy is not running the capture waits there and is indexed at next launch.</p></div></div></div>`;
      shd = $('#shd', b);
      $('.brw-page', shd).addEventListener('mouseup', () => { const s = window.getSelection().toString().trim(); if (s) SH.lastSel = s; });
      $('#sh-btn', shd).onclick = (e) => {
        const s = window.getSelection().toString().trim(); if (s) SH.lastSel = s;
        const on = G.prefs.shareExt !== false;
        MX.mm.open(e.currentTarget, [{ label: 'AirDrop', icon: 'radio-tower' }, { label: 'Mail', icon: 'mail' }, { label: 'Messages', icon: 'message-circle' }, { label: 'Notes', icon: 'notebook-pen' }, { label: 'Reminders', icon: 'list-todo' }].map((x) => Object.assign({ run: () => G.toast(x.label + ': another app', { icon: x.icon }) }, x)).concat(on ? [{ label: 'Marxy Inbox', icon: 'book-open-text', run: () => { SH.open = true; SH.mode = SH.lastSel ? 'sel' : 'page'; renderShare(); } }] : []).concat([{ sep: true }, { label: 'Copy Link', icon: 'link', run: () => G.copy(PAGE.url, { as: 'URL' }) }, { label: 'Add Bookmark', icon: 'bookmark', run: () => G.toast('Bookmarked', { icon: 'bookmark' }) }, { label: 'Add to Reading List', icon: 'glasses', run: () => G.toast('Added to Reading List', { icon: 'glasses' }) }, { sep: true }, { label: 'Edit Extensions…', run: () => G.toast('System Settings › General › Login Items & Extensions › Sharing', { icon: 'settings' }) }]), { alignEnd: true, width: 230, label: 'Share' });
      };
      shd.addEventListener('mousedown', (e) => { if (SH.open && !e.target.closest('.shx')) { SH.open = false; renderShare(); } });
      renderInboxList();
    },
    onHide() { SH.open = false; }
  });
})();
</script>
<script>
/* ===== 10. Shortcuts.app actions (App Intents) ===== */
(function () {
  const G = Marxy, { $, $$, esc, ic, fmt } = G, MX = window.MX;
  const T = (id) => G.transforms.find((t) => t.id === id);
  const plainXf = G.transforms;
  const A = {
    history: { name: 'Get Clipboard History', icon: 'clipboard-list', params: [['Limit', ['1', '3', '5', '10']], ['Type', ['Any', 'Markdown', 'Code', 'URL', 'Plain']]], input: '–', output: 'Text (newest first)', desc: 'Recent clips with their source document and app', run: (p) => { const l = G.clips.items.filter((c) => p.Type === 'Any' || c.as === p.Type).slice(0, +p.Limit); return { text: l.map((c) => c.text).join('\n\n'), note: `${l.length} clip${l.length === 1 ? '' : 's'}` }; } },
    clean: { name: 'Clean Text', icon: 'eraser', params: [['Remove', ['Emoji', 'Front matter', 'Citation markers']]], input: 'Text', output: 'Text', desc: 'Marxy’s clean transforms', run: (p, v) => ({ text: G.transform({ 'Emoji': 'strip-emoji', 'Front matter': 'strip-frontmatter', 'Citation markers': 'strip-citations' }[p.Remove], v.text || '') }) },
    pipeline: { name: 'Run Pipeline', icon: 'workflow', params: [['Pipeline', MX.PIPES.map((x) => x[0])]], input: 'Text', output: 'Text', desc: 'Any saved pipeline, by name', run: (p, v) => ({ text: MX.PIPES.find((x) => x[0] === p.Pipeline)[1].reduce((s, id) => G.transform(id, s), v.text || '') }) },
    transform: { name: 'Transform Text', icon: 'wand-sparkles', params: [['Transform', plainXf.map((t) => t.name)]], input: 'Text', output: 'Text', desc: 'Any single transform', run: (p, v) => ({ text: plainXf.find((t) => t.name === p.Transform).fn(v.text || '', {}) }) },
    copyas: { name: 'Copy as Format', icon: 'clipboard-copy', params: [['Format', G.copyFormats.map((f) => f.name)]], input: 'Text', output: 'Text, also on the clipboard', desc: 'Every Copy As format, rich text included', run: (p, v) => { const f = G.copyFormats.find((x) => x.name === p.Format); G.copyAs(f.id, v.text || ''); return { text: f.fn(v.text || '') }; } },
    find: { name: 'Find Documents', icon: 'search', params: [['Collection', ['Any'].concat(G.collections.map((c) => c.name))], ['Kind', ['Any'].concat(Object.values(G.kinds).map((k) => k.name))], ['Modified', ['Any time', 'Today', 'This week']]], input: '–', output: 'Documents', desc: 'Queries the Library index: collection, kind, date, text', run: (p) => { const docs = G.docs.filter((d) => (p.Collection === 'Any' || G.collections.find((c) => c.id === d.collection).name === p.Collection) && (p.Kind === 'Any' || G.kinds[d.kind].name === p.Kind) && (p.Modified !== 'Today' || /min|today|now/.test(d.modified))); return { docs, text: docs.map((d) => d.title).join('\n'), note: `${docs.length} document${docs.length === 1 ? '' : 's'}` }; } },
    open: { name: 'Open Document', icon: 'book-open-text', params: [['View', ['Read', 'Split', 'Source']]], input: 'Document', output: '–', desc: 'Opens in Marxy at the chosen view', run: (p, v) => { const d = (v.docs || [])[0]; G.toast(d ? `Marxy opens ${esc(d.title)} in ${p.View}` : 'No document to open', { icon: 'book-open-text' }); return { docs: v.docs, text: v.text }; } },
    gettext: { name: 'Get Document Text', icon: 'file-text', params: [['Part', ['Whole document', 'Code blocks', 'Open tasks', 'Outline']]], input: 'Document', output: 'Text', desc: 'The source, or one part of it', run: (p, v) => { const d = (v.docs || [])[0]; if (!d) return { text: '' }; const s = d.src; const out = { 'Whole document': s, 'Code blocks': G.transform('x-code', s), 'Open tasks': G.transform('x-tasks', s), Outline: G.transform('x-headings', s) }[p.Part]; return { text: out, note: d.title }; } },
    inbox: { name: 'Add to Inbox', icon: 'inbox', params: [['Title', ['From first line', 'Date and time']]], input: 'Text', output: 'Document', desc: 'Saves text as a Markdown file in the Inbox', run: (p, v) => { const t = p.Title === 'Date and time' ? 'clip-' + new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '') : (v.text || 'Untitled').split('\n')[0].replace(/^#+\s*/, '').slice(0, 40); G.toast(`Added “${esc(t)}” to the Inbox`, { icon: 'inbox' }); return { text: v.text, note: t + '.md' }; } }
  };
  MX.intents = A;
  const EX = {
    'Plan to Slack': [['find', { Collection: 'Plans', Kind: 'Report', Modified: 'Today' }], ['gettext', { Part: 'Whole document' }], ['clean', { Remove: 'Front matter' }], ['copyas', { Format: 'Slack' }]],
    'Clipboard to Inbox': [['history', { Limit: '1' }], ['inbox', { Title: 'From first line' }]],
    'Handoff tasks for Jira': [['find', { Collection: 'Plans', Kind: 'Report' }], ['gettext', { Part: 'Open tasks' }], ['transform', { Transform: 'Markdown → Jira wiki' }], ['copyas', { Format: 'Plain text' }]]
  };
  let steps = [], exName = 'Plan to Slack', outs = [];
  const load = (n) => { exName = n; steps = EX[n].map(([id, p]) => ({ id, p: Object.assign(Object.fromEntries(A[id].params.map(([k, opts]) => [k, opts[0]])), p) })); outs = []; };
  function renderCanvas() {
    const c = $('#sc-canvas'); if (!c) return;
    c.innerHTML = steps.map((s, i) => { const a = A[s.id]; return `${i ? '<div class="sc-link"></div>' : ''}<div class="sc-act${outs[i] ? ' done' : ''}" data-step="${i}"><span class="aic">${ic(a.icon)}</span><b>${esc(a.name)}</b>${i && a.input !== '–' ? `<span class="tok var">${ic('corner-down-right')}${esc(A[steps[i - 1].id].name.replace(/^(Get|Find|Run) /, ''))}</span>` : ''}${a.params.map(([k, opts]) => `<label class="row" style="gap:4px"><span class="faint" style="font-size:12px">${esc(k)}</span><select class="tok" data-k="${esc(k)}" aria-label="${esc(a.name)}: ${esc(k)}">${opts.map((o) => `<option${o === s.p[k] ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select></label>`).join('')}<button class="tb-btn x" data-rm="${i}" title="Remove action" aria-label="Remove ${esc(a.name)}">${ic('x')}</button>${outs[i] ? `<div class="sc-out">${outs[i].note ? esc(outs[i].note) + '\n' : ''}${esc((outs[i].text || '').slice(0, 400)) || '(nothing)'}</div>` : ''}</div>`; }).join('') || '<div class="faint" style="padding:20px;text-align:center">Add actions from the list</div>';
    G.icons(c);
    $$('select[data-k]', c).forEach((x) => (x.onchange = () => { steps[+x.closest('[data-step]').dataset.step].p[x.dataset.k] = x.value; outs = []; renderCanvas(); }));
    $$('[data-rm]', c).forEach((x) => (x.onclick = () => { steps.splice(+x.dataset.rm, 1); outs = []; renderCanvas(); }));
  }
  async function runAll() {
    outs = []; renderCanvas(); let v = {};
    for (let i = 0; i < steps.length; i++) {
      const n = $(`[data-step="${i}"]`); if (n) n.classList.add('run');
      await new Promise((r) => setTimeout(r, 320));
      try { v = Object.assign({}, v, { note: '' }, A[steps[i].id].run(steps[i].p, v)); } catch (e) { v = { text: 'Error: ' + e.message }; }
      outs[i] = v; renderCanvas();
    }
    G.toast(`Shortcut “${esc(exName)}” finished · ${steps.length} actions`, { icon: 'circle-check' });
  }
  MX.panel({
    id: 'shortcuts', title: 'Shortcuts actions', icon: 'blocks',
    desc: 'Marxy’s App Intents: actions the Shortcuts app, Spotlight and Siri can run without opening a window. Each takes typed parameters and returns text or documents, so they chain with each other and with any other app’s actions. Pick an example shortcut, change a parameter, add or remove actions, and run it: every step uses Marxy’s real transforms on the sample library.',
    meta: [['blocks', 'App Intents (Swift)'], ['search', 'Also in Spotlight on macOS 26'], ['mic', 'App Shortcuts phrases for Siri']],
    state: () => ({ text: Object.keys(A).length + ' actions' }),
    build(b) {
      const rc = 'grid-template-columns:20px 170px minmax(0,1fr) 110px 150px 30px';
      b.innerHTML = `<div class="ref" id="sc-lib"><div class="rr hd" style="${rc}"><span></span><span>Action</span><span>Parameters</span><span>Input</span><span>Output</span><span></span></div>${Object.entries(A).map(([id, a]) => `<div class="rr" style="${rc}" title="${esc(a.desc)}">${ic(a.icon)}<b style="font-weight:600">${esc(a.name)}</b><span class="wrap faint">${a.params.map(([k, o]) => `${esc(k)} (${o.length > 5 ? o.length + ' choices' : o.map(esc).join(' / ')})`).join('; ')}</span><span>${esc(a.input)}</span><span>${esc(a.output)}</span><button class="tb-btn" data-add="${id}" title="Add to the shortcut" aria-label="Add ${esc(a.name)}">${ic('plus')}</button></div>`).join('')}</div>
        <div class="sc-wrap"><div class="stack"><div class="mx-row"><label class="row" style="gap:6px">Example <select class="field" id="sc-ex">${Object.keys(EX).map((n) => `<option>${esc(n)}</option>`).join('')}</select></label><button class="btn primary" id="sc-run">${ic('play')}Run</button><button class="btn" id="sc-reset">${ic('rotate-ccw')}Reset</button></div><div class="sc-canvas" id="sc-canvas" aria-live="polite"></div></div>
        <div class="mx-side"><div class="box"><b style="font-size:12.5px">App Shortcuts (no setup)</b><div class="stack" style="gap:3px;font-size:12.5px">${['Open the Marxy Inbox', 'Run a Marxy pipeline', 'Find documents in Marxy'].map((p) => `<span class="row" style="gap:6px">${ic('mic', 'ic-sm')}“${esc(p)}”</span>`).join('')}</div><p class="mx-note">Phrases ship with the app, so the actions appear in Shortcuts, Spotlight and Siri before the user builds anything.</p></div>
        <div class="box"><b style="font-size:12.5px">Entities</b><p class="mx-note">Documents and collections are App Entities with a query, so Shortcuts can offer a picker (“Postgres 14 → 16 upgrade plan”) and Spotlight can index them. Pipelines and copy formats are App Enums.</p></div>
        <div class="box"><b style="font-size:12.5px">Quick Action from a shortcut</b><p class="mx-note">Any shortcut built from these actions can be marked “Use as Quick Action”, which puts it in Finder and the Services menu next to Marxy’s own.</p></div></div></div>`;
      $('#sc-lib', b).addEventListener('click', (e) => { const a = e.target.closest('[data-add]'); if (!a) return; const id = a.dataset.add; steps.push({ id, p: Object.fromEntries(A[id].params.map(([k, o]) => [k, o[0]])) }); outs = []; renderCanvas(); G.toast(`Added ${esc(A[id].name)}`, { icon: 'plus' }); });
      $('#sc-ex', b).onchange = (e) => { load(e.target.value); renderCanvas(); };
      $('#sc-run', b).onclick = runAll;
      $('#sc-reset', b).onclick = () => { load($('#sc-ex', b).value); renderCanvas(); };
      load(exName); renderCanvas();
    }
  });
})();
</script>
<script>
/* ===== 11. Dock, 12. Spotlight, 13. Notifications ===== */
(function () {
  const G = Marxy, { $, $$, esc, ic, fmt } = G, MX = window.MX, DOC = MX.doc;
  const goDoc = (id) => () => G.toast(`Marxy opens ${esc(G.doc(id).title)}`, { icon: 'book-open-text', action: { label: 'Go', run: () => (location.href = G.page('workspace') + '#doc=' + id) } });

  /* ---------- Dock ---------- */
  let dd = null; const D = { prog: 0 };
  function renderDock() {
    if (!dd) return;
    $('.dock', dd).innerHTML = [['Finder', 'folder', 'c2'], ['Safari', 'compass', ''], ['Mail', 'mail', 'c3'], ['Terminal', 'square-terminal', '']].map(([n, i, c]) => `<button class="dk ${c}" title="${n}" aria-label="${n}" data-app="${n}">${ic(i)}<span class="run"></span></button>`).join('') +
      `<button class="dk marxy" id="dk-marxy" title="Marxy" aria-label="Marxy. Right-click or Shift-F10 for the Dock menu." aria-haspopup="menu">${ic('book-open-text')}<span class="run"></span>${D.prog ? `<span class="prog"><i style="width:${D.prog}%"></i></span>` : ''}</button>` +
      `<button class="dk c4" title="Notes" aria-label="Notes" data-app="Notes">${ic('notebook-pen')}</button><span class="dk-sep"></span><button class="dk" title="Downloads" aria-label="Downloads" data-app="Downloads">${ic('download')}</button><button class="dk" title="Trash" aria-label="Trash" data-app="Trash">${ic('trash-2')}</button>`;
    G.icons($('.dock', dd));
  }
  function dockMenu(anchor) {
    const custom = G.prefs.dockMenu === false ? [] : [{ header: 'Recent' }].concat(G.docs.slice(1, 5).map((d) => ({ label: d.path.split('/').pop(), icon: G.kinds[d.kind].icon, run: goDoc(d.id) }))).concat([{ sep: true }, { label: 'New Document from Clipboard', icon: 'clipboard-paste', run: () => MX.newFromClip() }, { label: 'Open Palette', icon: 'command', run: () => { MX.show('gpal'); setTimeout(() => MX.openGP(), 40); } }, { label: 'Clipboard Ring', icon: 'clipboard-list', run: () => { MX.show('ring'); setTimeout(() => MX.openRing(), 40); } }, { label: 'Pause Clipboard History', checked: !G.prefs.clipHistory, run: () => G.setPref('clipHistory', !G.prefs.clipHistory) }, { sep: true }]);
    const items = [{ label: DOC.title, checked: true, run: () => G.toast('Window to front', { icon: 'app-window' }) }, { label: 'Why is the indexer slow?', run: () => G.toast('Window to front', { icon: 'app-window' }) }, { sep: true }].concat(custom).concat([{ label: 'Options', src: 'system', sub: [{ label: 'Keep in Dock', checked: true }, { label: 'Open at Login', checked: !!G.prefs.openAtLogin, run: () => G.setPref('openAtLogin', !G.prefs.openAtLogin) }, { label: 'Show in Finder' }, { sep: true }, { header: 'Assign To' }, { label: 'All Desktops', radio: true, checked: false }, { label: 'This Desktop', radio: true, checked: false }, { label: 'None', radio: true, checked: true }].map((x) => (x.sep || x.header || x.run ? x : Object.assign({ run: () => G.toast(x.label + ' (system option)', { icon: 'info' }) }, x))) }, { sep: true }, { label: 'Show All Windows', run: () => G.toast('App Exposé', { icon: 'layout-grid' }) }, { label: 'Hide', run: () => G.toast('Marxy hidden', { icon: 'eye-off' }) }, { label: 'Quit', run: () => G.toast('Quit Marxy', { icon: 'power' }), alt: { label: 'Force Quit' } }]);
    MX.mm.open(anchor, items, { above: true, width: 270, label: 'Marxy Dock menu', returnFocus: anchor });
  }
  MX.panel({
    id: 'dock', title: 'Dock menu', icon: 'panel-bottom',
    desc: 'Right-click Marxy in the Dock for its open windows, recent documents and quick actions, followed by the system’s Options, Show All Windows, Hide and Quit. The icon shows indexing progress.',
    meta: [['panel-bottom', 'Dock menu: native delegate method'], ['activity', 'Progress: custom Dock tile view']],
    prefs: () => MX.sw('dockMenu', 'Marxy items in the Dock menu'),
    state: () => ({ text: G.prefs.dockMenu === false ? 'Menu off' : 'Menu on' }),
    build(b) {
      b.innerHTML = `<div class="desk" id="dd" style="min-height:600px">${MX.mbar(['Finder', 'File', 'Edit', 'View', 'Go', 'Window', 'Help'])}<div class="dock glass" role="toolbar" aria-label="Dock"></div></div>
        <div class="mx-row">
          <button class="btn" id="dk-menu">${ic('menu')}Show the Dock menu</button><button class="btn" id="dk-index">${ic('refresh-cw')}Re-index (progress on the icon)</button></div>
        <p class="mx-note">Recent documents also appear here automatically when Marxy records them with the system’s recent-documents list, so the custom section stays short.</p>`;
      dd = $('#dd', b);
      $('#dk-menu', b).onclick = () => dockMenu($('#dk-marxy', dd));
      $('#dk-index', b).onclick = () => { G.run('reindex'); D.prog = 1; const t = setInterval(() => { D.prog = Math.min(100, D.prog + 7); renderDock(); if (D.prog >= 100) { clearInterval(t); setTimeout(() => { D.prog = 0; renderDock(); }, 500); } }, 140); };
      dd.addEventListener('contextmenu', (e) => { const g = e.target.closest('#dk-marxy'); if (!g) return; e.preventDefault(); dockMenu(g); });
      dd.addEventListener('keydown', (e) => { const g = e.target.closest('#dk-marxy'); if (g && (e.key === 'ContextMenu' || (e.shiftKey && e.key === 'F10'))) { e.preventDefault(); dockMenu(g); } });
      dd.addEventListener('click', (e) => { const g = e.target.closest('#dk-marxy'); const o = e.target.closest('[data-app]'); if (g) G.toast(e.ctrlKey ? 'Control-click also opens the menu' : 'Marxy comes to the front', { icon: 'app-window' }); else if (o) G.toast(o.dataset.app + ' is another app', { icon: 'info' }); if (g && e.ctrlKey) dockMenu(g); });
      renderDock();
    },
    onPref(k) { if (['dockMenu', 'clipHistory'].includes(k)) renderDock(); }
  });

  /* ---------- Spotlight ---------- */
  let spd = null; const SP = { q: 'pg16 rollback', hot: 0, flat: [] };
  function spotResults() {
    const toks = SP.q.toLowerCase().split(/\s+/).filter(Boolean); const out = [];
    const fileHits = G.library.filter((d) => toks.length && toks.every((t) => (d.title + ' ' + d.path).toLowerCase().includes(t))).slice(0, 3);
    if (!G.prefs.spotlight) { if (fileHits.length || toks.length) out.push({ g: 'Documents', items: G.library.filter((d) => toks.some((t) => d.path.toLowerCase().includes(t))).slice(0, 5).map((d) => ({ type: 'file', icon: 'file-text', title: d.path.split('/').pop(), sub: 'Markdown document · ' + d.path.split('/').slice(-2, -1)[0], d })) }); return out; }
    const docs = G.docs.map((d) => { const hay = (d.title + ' ' + d.path + ' ' + d.src).toLowerCase(); return { d, ok: toks.length && toks.every((t) => hay.includes(t)), score: toks.filter((t) => (d.title + d.path).toLowerCase().includes(t)).length }; }).filter((x) => x.ok).sort((a, b) => b.score - a.score).map((x) => x.d);

    const secs = [];
    docs.forEach((d) => { const lines = d.src.split('\n'); lines.forEach((l, i) => { const h = l.match(/^(#{2,3})\s+(.*)/); if (!h) return; let end = lines.length; for (let j = i + 1; j < lines.length; j++) if (/^#{1,3}\s/.test(lines[j])) { end = j; break; } const body = (h[2] + ' ' + lines.slice(i + 1, end).join(' ')).toLowerCase(); if (toks.some((t) => body.includes(t) && !d.path.toLowerCase().includes(t))) secs.push({ type: 'sec', icon: 'hash', title: h[2], sub: d.title + ' · line ' + (i + 1), d, line: i + 1, body: lines.slice(i + 1, end).join('\n') }); }); });

    const acts = [['Clean Text', 'eraser', 'Remove emoji from the clipboard with Marxy'], ['Find Documents', 'search', 'Find “' + SP.q + '” in the Marxy Library']].filter(([n, , s]) => !toks.length || toks.some((t) => (n + s).toLowerCase().includes(t)) || true);
    out.push({ g: 'Marxy Actions', items: acts.map(([n, i, s]) => ({ type: 'act', icon: i, title: s, sub: 'Shortcuts action · ' + n, n })) });
    return out;
  }
  function spotPreview(it) {
    if (!it) return '';
    if (it.type === 'doc' || it.type === 'sec') { const d = it.d; const st = G.stats(d.src); const sum = it.type === 'sec' ? G.transform('to-plain', it.body).slice(0, 320) : G.transform('to-plain', G.transform('strip-frontmatter', d.src)).trim().slice(0, 320); return `<div class="big">${ic(G.kinds[d.kind].icon)}</div><b style="font-size:14px">${esc(it.type === 'sec' ? it.title : d.title)}</b>${it.type === 'sec' ? `<span class="faint">${esc(d.title)} › ${esc(it.title)}</span>` : ''}<span class="faint">${esc(d.path)}</span><div class="row" style="gap:4px;flex-wrap:wrap">${MX.chip(G.kinds[d.kind].icon, G.kinds[d.kind].name)}</div><div style="white-space:pre-wrap;line-height:1.45">${esc(sum)}</div><span class="faint">${fmt(st.words)} words · modified ${esc(d.modified)}</span><div class="row"><button class="btn sm primary" data-sp="open">Open in Marxy</button><button class="btn sm" data-sp="finder">Show in Finder</button></div>`; }
    if (it.type === 'act') return `<div class="big">${ic(it.icon)}</div><b>${esc(it.title)}</b><span class="faint">Runs Marxy’s ${esc(it.n)} action without opening a window. Return runs it.</span>`;
    return `<div class="big" style="background:var(--hover);color:var(--fg-muted)">${ic('file-text')}</div><b>${esc(it.title)}</b><span class="faint">Indexed by macOS as plain text. Turn Marxy Spotlight on to get titles, sections and summaries.</span>`;
  }
  function renderSpot(keep) {
    if (!spd) return; $$('.spot', spd).forEach((x) => x.remove());
    const gs = spotResults(); SP.flat = [];
    spd.insertAdjacentHTML('beforeend', `<div class="spot glass" role="dialog" aria-label="Spotlight"><div class="spot-in">${ic('search', 'ic-lg')}<input id="sp-q" value="${esc(SP.q)}" aria-label="Spotlight search" autocomplete="off"></div><div class="spot-cats"><span>${ic('app-window')}Applications</span><span>${ic('file')}Files</span><span>${ic('zap')}Actions</span><span>${ic('clipboard-list')}Clipboard</span></div>
      <div class="spot-body"><div class="spot-list" role="listbox">${gs.map((g) => `<div class="grp">${esc(g.g)}</div>` + g.items.map((it) => { const i = SP.flat.push(it) - 1; return `<div class="prow${i === SP.hot ? ' hot' : ''}" role="option" aria-selected="${i === SP.hot}" data-si="${i}"><span></span>${ic(it.icon)}<span class="t">${esc(it.title)}</span><span class="s">${esc(it.sub)}</span></div>`; }).join('')).join('') || '<div class="faint" style="padding:16px">No results</div>'}</div><div class="spot-prev">${spotPreview(SP.flat[SP.hot])}</div></div></div>`);
    const box = $('.spot', spd); G.icons(box);
    const q = $('#sp-q', box);
    q.addEventListener('input', () => { SP.q = q.value; SP.hot = 0; renderSpot(true); });
    q.addEventListener('keydown', (e) => { if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); SP.hot = Math.max(0, Math.min(SP.flat.length - 1, SP.hot + (e.key === 'ArrowDown' ? 1 : -1))); renderSpot(true); } else if (e.key === 'Enter') { e.preventDefault(); spotOpen(SP.flat[SP.hot], e.metaKey || e.ctrlKey); } else if (e.key === 'Escape') { SP.q = ''; renderSpot(true); } });
    $$('[data-si]', box).forEach((r) => { r.addEventListener('mousemove', () => { if (SP.hot !== +r.dataset.si) { SP.hot = +r.dataset.si; renderSpot(true); } }); r.addEventListener('click', () => spotOpen(SP.flat[+r.dataset.si], false)); });
    $$('[data-sp]', box).forEach((x) => (x.onclick = () => spotOpen(SP.flat[SP.hot], x.dataset.sp === 'finder')));

  }
  function spotOpen(it, finder) {
    if (!it) return;
    if (finder) return G.toast('Shown in Finder: ' + esc((it.d || {}).path || it.title), { icon: 'folder-open' });
    if (it.type === 'act') return it.n === 'Find Documents' ? MX.show('shortcuts') : MX.result(it.n, (G.clips.items[0] || { text: '' }).text, G.transform('strip-emoji', (G.clips.items[0] || { text: '' }).text), { via: 'Spotlight action' });
    if (it.type === 'sec') return G.toast(`Marxy opens ${esc(it.d.title)} at line ${it.line} (${esc(it.title)})`, { icon: 'hash', action: { label: 'Go', run: () => (location.href = G.page('workspace') + '#doc=' + it.d.id) } });
    if (it.type === 'doc') return goDoc(it.d.id)();
    G.toast('Opens in the default app for .md (Marxy)', { icon: 'file-text' });
  }
  MX.panel({
    id: 'spotlight', title: 'Spotlight', icon: 'search',
    desc: 'Library documents in Spotlight with their title, content type and the start of their text; every H2 and H3 is its own result that opens Marxy at that line; and Marxy’s Shortcuts actions run straight from the search field. Type below: results come from the same sample library as the rest of the prototype.',
    meta: [['database', 'Core Spotlight items from the app'], ['link', 'Opens via a marxy:// link or activity'], ['blocks', 'Actions come from App Intents']],
    prefs: () => MX.sw('spotlight', 'Marxy items in Spotlight'),
    state: () => ({ text: G.prefs.spotlight ? 'On' : 'Off', on: G.prefs.spotlight }),
    build(b) {
      b.innerHTML = `<div class="desk" id="spd" style="min-height:560px">${MX.mbar(['Finder', 'File', 'Edit', 'View', 'Go', 'Window', 'Help'])}</div>
        <div class="ref" id="sp-ref"></div>`;
      spd = $('#spd', b);
      const rc = 'grid-template-columns:150px minmax(0,1fr) 220px';
      $('#sp-ref', b).innerHTML = `<div class="rr hd" style="${rc}"><span>Indexed item</span><span>Attributes</span><span>Opens</span></div>` + [['Document', 'Title, path, content type, words, modified, first 2 KB of text', 'Marxy at the top of the file'], ['Section (H2, H3)', 'Heading text, parent document title, section text, line number', 'Marxy scrolled to that heading'], ['Collection', 'Name, folder, file count', 'Marxy’s Library at that collection'], ['Clip (opt-in)', 'Pinned clips only, never the full history', 'The clipboard ring with that clip selected']].map(([a, x, y]) => `<div class="rr" style="${rc}"><b style="font-weight:600">${a}</b><span class="wrap">${x}</span><span class="wrap faint">${y}</span></div>`).join('');
      renderSpot(false);
    },
    onShow() { renderSpot(); },
    onPref(k) { if (k === 'spotlight') renderSpot(false); }
  });

  /* ---------- Notifications ---------- */
  let nd = null; const N = { style: MX.store.get('notifyStyle', 'banner'), list: [], center: [] };
  const NDEF = { changed: false, pipeline: true, capture: true, index: false };
  const nset = () => Object.assign({}, NDEF, MX.store.get('notify', {}));
  const KINDS = {
    pipeline: { title: 'Pipeline “Notes → Slack” finished', body: 'Result is on the clipboard: 612 characters, Slack formatting', acts: [['paste', 'Show result'], ['open', 'Open source']] },
    capture: { title: 'Saved to the Inbox from Safari', body: 'Versioning policy · quote with source link', acts: [['inbox', 'Open Inbox']] },
    index: { title: 'Indexed 1,290 files', body: '3 collections watched · 6 near-duplicates · 4 broken paths', acts: [['library', 'Open Library']] },
    changed: { title: 'auth-refactor-handoff.md changed on disk', body: '+12 lines since you last read', acts: [['open', 'Open'], ['changes', 'Show changes']] }
  };
  MX.notify = (k = 'pipeline') => {
    if (!nset()[k]) return G.toast('That notification is off in the list below', { icon: 'bell-off' });
    const n = Object.assign({ k, id: Date.now(), at: Date.now() }, KINDS[k]);
    N.list.unshift(n); N.center.unshift(n); N.list = N.list.slice(0, 3);
    renderN();
    if (N.style === 'banner') setTimeout(() => { N.list = N.list.filter((x) => x !== n); renderN(); }, 7000);
  };
  function act(n, a) {
    N.list = N.list.filter((x) => x !== n); renderN();
    ({
      open: goDoc(n.k === 'changed' ? 'auth-handoff' : 'pg16-plan'),
      changes: () => MX.result('Changes since you last read', G.prevVersions['pg16-plan'].src, DOC.src, { icon: 'git-compare', beforeLabel: 'REV 3 · LAST READ', afterLabel: 'REV 6 · NOW', note: 'Downtime estimate, DNS rollback, disk risk and analytics check changed' }),
      paste: () => MX.result('Notes → Slack', DOC.src, G.transform('to-slack', G.transform('strip-bold', DOC.src)), { icon: 'workflow' }),
      inbox: () => G.toast('Marxy opens the Inbox', { icon: 'inbox' }),
      library: () => G.run('go-collections')
    })[a]();
  }
  function renderN() {
    if (!nd) return;
    $('.ntf-col', nd).innerHTML = N.list.map((n, i) => `<div class="ntf glass${N.style === 'alert' ? ' open' : ''}" data-n="${i}" role="alert" tabindex="0" aria-label="${esc(n.title)}"><button class="x" data-nx title="Close" aria-label="Close notification">${ic('x')}</button><span class="appic">${ic('book-open-text')}</span><span class="hd"><b style="font-weight:600;letter-spacing:.04em">MARXY</b><span class="grow"></span>${G.ago(n.at)}</span><span class="tt">${esc(n.title)}</span><span class="bd">${esc(n.body)}</span><div class="acts">${n.acts.map(([a, l]) => `<button data-na="${a}">${esc(l)}</button>`).join('')}</div></div>`).join('');
    G.icons($('.ntf-col', nd));
    const c = $('#n-center'); if (c) { c.innerHTML = N.center.length ? N.center.slice(0, 8).map((n) => `<div class="rr" style="grid-template-columns:18px minmax(0,1fr) auto">${ic('bell')}<span><b style="font-weight:600">${esc(n.title)}</b><br><span class="faint" style="font-size:11.5px">${esc(n.body)}</span></span><span class="faint">${G.ago(n.at)}</span></div>`).join('') : '<div class="rr"><span class="faint">Nothing yet. Simulate one above.</span></div>'; G.icons(c); }
  }
  MX.panel({
    id: 'notify', title: 'Notifications', icon: 'bell',
    desc: 'Marxy notifies when a pipeline finishes in the background, when a capture lands in the Inbox, when a watched file changes and when indexing completes. Hover a notification (or Tab to it) for its actions: Open, Show changes. Banners leave after a few seconds; alerts stay until acted on.',
    meta: [['bell', 'User Notifications framework'], ['mouse-pointer-click', 'Action buttons need a native category'], ['clock', 'Asked on first use, not at launch']],
    state: () => ({ text: N.style === 'alert' ? 'Alerts' : 'Banners' }),
    build(b) {
      b.innerHTML = `<div class="desk" id="nd" style="min-height:420px">${MX.mbar(['Terminal', 'Shell', 'Edit', 'View', 'Window', 'Help'])}<div class="mwin" style="left:30px;top:56px;width:460px;height:250px"><div class="mwin-t"><div class="lights" aria-hidden="true"><span></span><span></span><span></span></div><div class="ttl">zsh — plans</div><span style="width:52px"></span></div><div class="mwin-b" style="padding:12px 14px;font:12px/1.6 var(--face-code);color:var(--fg-muted);white-space:pre-wrap">$ pg_upgrade --link --check
Performing Consistency Checks
-----------------------------
Checking cluster versions                ok
Checking database user is the install user  ok
$ </div></div><div class="ntf-col" aria-live="polite"></div></div>
        <div class="mx-row"><button class="btn primary" id="n-fire">${ic('bell')}Pipeline finished</button><button class="btn" data-fire="capture">Capture saved</button><button class="btn" data-fire="index">Index finished</button><button class="btn" data-fire="changed">File changed</button>
          <div class="seg" role="group" aria-label="Style"><button data-ns="banner">Banners</button><button data-ns="alert">Alerts</button></div></div>
        <div class="mx-cols"><div><div class="mx-h">${ic('inbox', 'ic-sm')}Notification Centre</div><div class="ref" id="n-center"></div></div><div class="mx-side"><div class="box"><b style="font-size:12.5px">Notify me when</b><div id="n-set" class="stack" style="gap:4px"></div><p class="mx-note">Quiet by default for routine changes. Focus modes and the system’s per-app settings still win.</p></div></div></div>`;
      nd = $('#nd', b);
      $('#n-fire', b).onclick = () => MX.notify('pipeline');
      $$('[data-fire]', b).forEach((x) => (x.onclick = () => MX.notify(x.dataset.fire)));
      const sync = () => $$('[data-ns]', b).forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.ns === N.style)));
      $$('[data-ns]', b).forEach((x) => (x.onclick = () => { N.style = x.dataset.ns; MX.store.set('notifyStyle', N.style); sync(); renderN(); }));
      nd.addEventListener('click', (e) => { const card = e.target.closest('[data-n]'); if (!card) return; const n = N.list[+card.dataset.n]; if (e.target.closest('[data-nx]')) { N.list = N.list.filter((x) => x !== n); return renderN(); } const a = e.target.closest('[data-na]'); act(n, a ? a.dataset.na : n.acts[0][0]); });
      nd.addEventListener('keydown', (e) => { const card = e.target.closest('[data-n]'); if (card && e.key === 'Enter' && e.target === card) act(N.list[+card.dataset.n], N.list[+card.dataset.n].acts[0][0]); });

      $$('[data-nk]', b).forEach((x) => (x.onchange = () => { const v = nset(); v[x.dataset.nk] = x.checked; MX.store.set('notify', v); }));
      sync(); renderN();
      setTimeout(() => MX.notify('pipeline'), 400);
    },

  });

    ['Files in Desktop, Documents, Downloads', 'folder-lock', 'Library collections inside those folders', 'When a collection there is added or first watched. Folders chosen in an Open panel are granted by that choice.', 'That collection is not indexed; other collections work.'],
    ['Login item', 'power', 'Open at login, start in the menu bar only', 'When the user turns on Open at login; macOS lists Marxy under Login Items.', 'Marxy starts only when opened.'],
    ['Pasteboard access', 'clipboard', 'Clipboard history: reading the pasteboard when it changes, without a paste command', 'Recent macOS versions add a privacy prompt for programmatic pasteboard reads. Exact behaviour on the target macOS version is unverified.', 'History records only what is copied inside Marxy.'],
    ['Network (outgoing)', 'globe', 'Update checks, optional link checking', 'No prompt outside the App Sandbox; inside it, the outgoing-network entitlement.', 'Updates and link checks are skipped; everything else works offline.'],
    ['Input Monitoring', 'keyboard', 'Not needed: global shortcuts are registered hotkeys, not a key logger', 'Never.', '–'],
    ['Full Disk Access', 'hard-drive', 'Not needed', 'Never.', '–'],
    ['Automation (Apple Events)', 'workflow', 'Not needed by default; only if “Open in editor” scripts a specific editor', 'Per target app, on first use.', 'The file opens in the default editor instead.']
  ];
  const SETTINGS = [
    ['menubarExtra', 'Menu bar extra', 'sw', 'extra'], ['clipHistory', 'Record clipboard history', 'sw', 'extra'],
    ['globalClipRing', 'Clipboard ring shortcut', 'rec', 'ring'], ['globalPalette', 'Global palette shortcut', 'rec', 'gpal'], ['globalCapture', 'New from clipboard shortcut', 'rec', 'extra'],
    ['finderActions', 'Finder Quick Actions', 'sw', 'finder'], ['servicesMenu', 'Services', 'sw', 'services'], ['quicklook', 'Quick Look', 'sw', 'quicklook'], ['quicklookTheme', 'Quick Look uses Marxy’s theme', 'sw', 'quicklook'], ['shareExt', 'Share extension', 'sw', 'share'],
    ['spotlight', 'Spotlight', 'sw', 'spotlight'], ['dockMenu', 'Marxy items in the Dock menu', 'sw', 'dock'], ['openAtLogin', 'Open at login', 'sw', 'perms']
  ];
  function renderSettings() {
    const r = $('#pm-set'); if (!r) return;
    const rc = 'grid-template-columns:230px 150px 200px minmax(0,1fr)';
    r.innerHTML = `<div class="rr hd" style="${rc}"><span>Setting</span><span>Key</span><span>Value</span><span>Surface</span></div>` + SETTINGS.map(([k, l, t, p]) => `<div class="rr" style="${rc}"><span>${esc(l)}</span><code>${k}</code><span>${t === 'sw' ? `<label class="switch"><input type="checkbox" role="switch" data-pref="${k}" aria-label="${esc(l)}"${G.prefs[k] ? ' checked' : ''}><i></i></label>` : t === 'rec' ? MX.rec(k) : ''}</span><span><button class="btn sm ghost" data-go="${p}">${ic(MX.panels.find((x) => x.id === p).icon)}${esc(MX.panels.find((x) => x.id === p).title)}</button></span></div>`).join('');
    G.icons(r);
    $$('[data-go]', r).forEach((x) => (x.onclick = () => MX.show(x.dataset.go)));
    $$('[data-sel]', r).forEach((x) => (x.onchange = () => G.setPref(x.dataset.sel, x.value)));
  }
  MX.panel({
    id: 'perms', title: 'Permissions and settings', icon: 'shield-check',
    desc: 'What each surface asks macOS for, when it asks, and what still works if the answer is no. Below that, every setting this page binds, in one place; they are the same keys Settings › macOS uses.',
    meta: [['shield', 'Ask late, explain first'], ['package', 'Developer ID, notarised: Accessibility rules out the App Store sandbox', 'warn']],
    build(b) {
      const rc = 'grid-template-columns:20px 170px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)';
      b.innerHTML = `<div class="ref"><div class="rr hd" style="${rc}"><span></span><span>Permission</span><span>Needed by</span><span>When asked</span><span>If denied</span></div>${PERMS.map(([n, i, a, w, d]) => `<div class="rr" style="${rc}">${ic(i)}<b style="font-weight:600">${n}</b><span class="wrap">${a}</span><span class="wrap faint">${w}</span><span class="wrap">${d}</span></div>`).join('')}</div>
        <div class="mx-h">${ic('sliders-horizontal', 'ic-sm')}Settings this page binds</div><div class="ref" id="pm-set"></div>
        <p class="mx-note">The Touch Bar is not a surface: no Mac sold today has one. The design doc says so and nothing is built for it.</p>`;
      renderSettings();
    },
    onPref(k) { if (/^global/.test(k)) renderSettings(); }
  });

  /* ----- Boot ----- */
  const ORDER = ['toolbar', 'menubar', 'extra', 'ring', 'gpal', 'finder', 'services', 'quicklook', 'share', 'shortcuts', 'dock', 'spotlight', 'notify', 'perms'];
  MX.panels.sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id));
  G.command({ id: 'macos-customize-toolbar', name: 'Customize Toolbar…', icon: 'settings-2', group: 'macOS', run: () => MX.customizeToolbar() });
  G.command({ id: 'macos-ring', name: 'Show the clipboard ring', icon: 'clipboard-list', kbd: G.prefs.globalClipRing, group: 'macOS', run: () => { MX.show('ring'); setTimeout(() => MX.openRing(), 40); } });
  G.command({ id: 'macos-global-palette', name: 'Show the global palette', icon: 'command', kbd: G.prefs.globalPalette, group: 'macOS', run: () => { MX.show('gpal'); setTimeout(() => MX.openGP(), 40); } });
  G.command({ id: 'macos-reset', name: 'Reset every macOS demo', icon: 'rotate-ccw', group: 'macOS', run: () => $('#pg-reset').click() });
  $('#pg-reset').onclick = () => {
    MX.mm.closeAll();
    MX.panels.forEach((p) => p.reset && p.reset());
    MX.inbox = []; MX.store.set('inbox', []); G.emit('mx-inbox');
    G.toast('Every demo on this page is back to its starting state', { icon: 'rotate-ccw' });
  };
  G.boot({});
  MX.boot();
  window.addEventListener('resize', () => { if (MX.fitThumbs) MX.fitThumbs(document); if (MX.tbRender && MX.cur && MX.cur.id === 'toolbar') MX.tbRender(); });
})();
</script>
</body>
</html>
