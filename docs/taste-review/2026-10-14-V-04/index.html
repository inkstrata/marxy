<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes in Source, app beside mock</title>
<style>
  :root { --bg: #f6f5f2; --fg: #1d1d1f; --muted: #5d5f63; --line: #d9d7d2; --card: #ffffff; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111214; --fg: #e3e5e8; --muted: #9a9ea4; --line: #2a2c30; --card: #17181a; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 1700px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  small { color: var(--muted); font-size: 12.5px; }
  figure { margin: 12px 0 16px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
  figure > div { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  figure > div img { width: 100%; height: auto; display: block; border-radius: 4px; border: 1px solid var(--line); }
  figcaption { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 8px; font-size: 12px; color: var(--muted); padding-top: 6px; }
</style>
</head>
<body>
<main>
  <h1>Notes in Source, app beside mock</h1>
  <p><small>V-04. Made by capture.mjs beside this file; the mock side by mock-pair.mjs 02-source-folded --side mock.</small></p>
      <figure>
        <div><a href="02-source-notes-night-app.png"><img src="02-source-notes-night-app.png" alt="handoff.md in Source with three note marks, Night" loading="lazy"></a><a href="02-source-notes-night-app-more-contrast.png"><img src="02-source-notes-night-app-more-contrast.png" alt="the same with increase contrast, Night" loading="lazy"></a><a href="02-source-folded-night-mock.png"><img src="02-source-folded-night-mock.png" alt="mock-v2 Source, Night" loading="lazy"></a></div>
        <figcaption><span>App: three notes (a heading skips a level, a path is not there, a fence is never closed)</span><span>App, increase contrast</span><span>Mock-v2 Source (it has no note marks)</span><b>Night</b></figcaption>
      </figure>
      <figure>
        <div><a href="02-source-notes-paper-app.png"><img src="02-source-notes-paper-app.png" alt="handoff.md in Source with three note marks, Paper" loading="lazy"></a><a href="02-source-notes-paper-app-more-contrast.png"><img src="02-source-notes-paper-app-more-contrast.png" alt="the same with increase contrast, Paper" loading="lazy"></a><a href="02-source-folded-paper-mock.png"><img src="02-source-folded-paper-mock.png" alt="mock-v2 Source, Paper" loading="lazy"></a></div>
        <figcaption><span>App: three notes (a heading skips a level, a path is not there, a fence is never closed)</span><span>App, increase contrast</span><span>Mock-v2 Source (it has no note marks)</span><b>Paper</b></figcaption>
      </figure>
</main>
</body>
</html>
