<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App beside mock</title>
<style>
  :root { --bg: #f6f5f2; --fg: #1d1d1f; --muted: #5d5f63; --line: #d9d7d2; --card: #ffffff; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111214; --fg: #e3e5e8; --muted: #9a9ea4; --line: #2a2c30; --card: #17181a; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 1500px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  nav { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 24px; font-size: 13px; }
  nav a { color: inherit; }
  section { border-top: 1px solid var(--line); padding-top: 18px; margin-top: 28px; }
  h2 { font-size: 17px; margin: 0; }
  small { color: var(--muted); font-size: 12.5px; }
  figure { margin: 12px 0 16px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
  figure > div { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  figure > div img { width: 100%; height: auto; display: block; border-radius: 4px; border: 1px solid var(--line); }
  figcaption { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; font-size: 12px; color: var(--muted); padding-top: 6px; }
</style>
</head>
<body>
<main>
  <h1>App beside mock</h1>
  <nav><a href="#02-source">02-source</a> <a href="#02-source-folded">02-source-folded</a> <a href="#03-split">03-split</a></nav>
  <section id="02-source">
    <h2>02-source</h2>
    <p><small>Source, unfolded (mock 02-source)</small></p>
      <figure>
        <div><a href="02-source-night-app.png"><img src="02-source-night-app.png" alt="02-source, Night, the app" loading="lazy"></a><a href="02-source-night-mock.png"><img src="02-source-night-mock.png" alt="02-source, Night, the mock" loading="lazy"></a></div>
        <figcaption><span>App (V-05)</span><span>Mock v2</span><b>Night</b></figcaption>
      </figure>
      <figure>
        <div><a href="02-source-paper-app.png"><img src="02-source-paper-app.png" alt="02-source, Paper, the app" loading="lazy"></a><a href="02-source-paper-mock.png"><img src="02-source-paper-mock.png" alt="02-source, Paper, the mock" loading="lazy"></a></div>
        <figcaption><span>App (V-05)</span><span>Mock v2</span><b>Paper</b></figcaption>
      </figure>
  </section>
  <section id="02-source-folded">
    <h2>02-source-folded</h2>
    <p><small>Source, folded (mock 01-workspace, Source)</small></p>
      <figure>
        <div><a href="02-source-folded-night-app.png"><img src="02-source-folded-night-app.png" alt="02-source-folded, Night, the app" loading="lazy"></a><a href="02-source-folded-night-mock.png"><img src="02-source-folded-night-mock.png" alt="02-source-folded, Night, the mock" loading="lazy"></a></div>
        <figcaption><span>App (V-05)</span><span>Mock v2</span><b>Night</b></figcaption>
      </figure>
      <figure>
        <div><a href="02-source-folded-paper-app.png"><img src="02-source-folded-paper-app.png" alt="02-source-folded, Paper, the app" loading="lazy"></a><a href="02-source-folded-paper-mock.png"><img src="02-source-folded-paper-mock.png" alt="02-source-folded, Paper, the mock" loading="lazy"></a></div>
        <figcaption><span>App (V-05)</span><span>Mock v2</span><b>Paper</b></figcaption>
      </figure>
  </section>
  <section id="03-split">
    <h2>03-split</h2>
    <p><small>Split view (mock 01-workspace, Split)</small></p>
      <figure>
        <div><a href="03-split-night-app.png"><img src="03-split-night-app.png" alt="03-split, Night, the app" loading="lazy"></a><a href="03-split-night-mock.png"><img src="03-split-night-mock.png" alt="03-split, Night, the mock" loading="lazy"></a></div>
        <figcaption><span>App (V-05)</span><span>Mock v2</span><b>Night</b></figcaption>
      </figure>
      <figure>
        <div><a href="03-split-paper-app.png"><img src="03-split-paper-app.png" alt="03-split, Paper, the app" loading="lazy"></a><a href="03-split-paper-mock.png"><img src="03-split-paper-mock.png" alt="03-split, Paper, the mock" loading="lazy"></a></div>
        <figcaption><span>App (V-05)</span><span>Mock v2</span><b>Paper</b></figcaption>
      </figure>
  </section>
</main>
</body>
</html>
