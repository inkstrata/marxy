packages:
  - packages/*
  - apps/*
allowBuilds:
  esbuild: true
onlyBuiltDependencies:
  - esbuild
# Package scripts written `VAR=value command` need a shell that understands them; cmd.exe, pnpm's default on Windows, does not.
shellEmulator: true
# No script relies on pnpm's pre and post hooks.
enablePrePostScripts: false
# pdf.js's optional @napi-rs/canvas draws pages in Node; the app draws in the webview, so the native binary is never fetched.
ignoredOptionalDependencies:
  - '@napi-rs/canvas'
patchedDependencies:
  micromark@4.0.2: patches/micromark@4.0.2.patch
