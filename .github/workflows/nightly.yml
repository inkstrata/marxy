# What does not belong on the pull-request path.
#
# A check that re-runs work to see whether the answer changes is a flake detector, not an assertion:
# it cannot fail for a reason the author of the diff introduced, and every minute it costs is paid by
# every pull request. The aesthetics gate's CLS repeat pass was three more full corpus renders — 266s
# of the browser job's 356s — to confirm that a font/image window the single pass already measures is
# deterministic. It runs here instead, once a day, against main (MARXY-153).
#
# G-03 (ADR-0056) moved more here: the mechanical aesthetics gate's own run and the specimen gate, the
# Linux build, the release-profile binary and the CLI smoke, the fleet's tests and the slower WebKit
# files. A pull request holds the five commitments and nothing else. A red job here is a note for the
# next session, never a blocked merge (ADR-0032, ADR-0047): read it, and open a story if it is real.
name: nightly
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Regenerate the Linux aesthetics baselines (screenshots and rag) and upload them; runs only the aesthetics job"
        type: boolean
        default: false
concurrency:
  group: "nightly-${{ github.ref }}"
  cancel-in-progress: true
permissions: { contents: read }

jobs:
  # Through the app (B-02) one Linux pass is about ten minutes and each CLS repeat about five, so the
  # scheduled run takes about 26 of the 30 minutes it used to have; 45 leaves a loaded runner room.
  aesthetics-determinism:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: "pnpm-container-${{ hashFiles('pnpm-lock.yaml') }}"
      - run: pnpm config set store-dir ~/.pnpm-store && pnpm install --frozen-lockfile
      # Linux baselines come from this container, never from a Mac (ADR-0047). `--update` rewrites every
      # baseline and always exits 1 with one "baseline created" line per file; any other line is a real
      # failure. The step after it then compares against what was just written (without the repeat
      # passes), so a regenerated set that does not reproduce fails the run instead of being uploaded.
      - name: Regenerate the Linux baselines (dispatch with update_baselines)
        if: ${{ inputs.update_baselines }}
        shell: bash
        run: |
          mkdir -p results
          set +e
          node scripts/gate-aesthetics.mjs --update 2>&1 | tee results/update-baselines.log
          set -e
          if grep '^ - ' results/update-baselines.log | grep -v 'baseline created'; then exit 1; fi
      - name: The gate against the baselines just written
        if: ${{ inputs.update_baselines }}
        run: node scripts/gate-aesthetics.mjs
      - name: Aesthetics gate with the CLS repeat passes (MARXY-153)
        if: ${{ !inputs.update_baselines }}
        run: node scripts/gate-aesthetics.mjs --repeat 3
      # The specimen gate left the pull-request path with the `typography` job (G-03, ADR-0056); it is two
      # seconds, so it runs even when the aesthetics gate above is red and one night names both.
      - name: Specimen gate
        if: ${{ !inputs.update_baselines && !cancelled() }}
        run: pnpm gate:specimen
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.update_baselines }}
        with:
          name: linux-baselines
          path: |
            fixtures/baselines/webkit-linux/
            fixtures/baselines/rag/webkit-linux/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-results
          path: results/
          if-no-files-found: ignore

  built-app-smoke:
    if: ${{ !inputs.update_baselines }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: "pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
      - name: Linux webview, WebKitWebDriver and X deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb dbus webkit2gtk-driver
      - name: The webview library is visible to pkg-config
        run: pkg-config --exists glib-2.0 && pkg-config --modversion glib-2.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true
      - run: pnpm config set store-dir ~/.pnpm-store && pnpm install --frozen-lockfile
      - name: Install tauri-driver (Linux WebDriver intermediary)
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Build the frontend
        run: pnpm --filter @marxy/desktop build:web
      - name: Build the desktop binary (release, custom protocol)
        run: cd apps/desktop/src-tauri && cargo build --release --features tauri/custom-protocol --locked
      - name: Built-app smoke through real IPC (MARXY-254)
        run: xvfb-run -a dbus-run-session -- env MARXY_SMOKE_BUILT_REQUIRED=1 node scripts/smoke-built-app.mjs
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          NO_AT_BRIDGE: "1"

  # What a reader feels, measured on the app harness and recorded, never gated (ADR-0032, A-03): first
  # text and its stages for the corpus and the large files, the typeset viewport, live reload, opening
  # a second document, and palette search at 5k, 20k and 50k entries. Fails only when a measurement it
  # asked for produced no sample. Playwright WebKit on a hosted Linux runner: a trend, not the audit's Mac.
  perf-harness:
    if: ${{ !inputs.update_baselines }}
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: "pnpm-container-${{ hashFiles('pnpm-lock.yaml') }}"
      - run: pnpm config set store-dir ~/.pnpm-store && pnpm install --frozen-lockfile
      - name: Build the frontend
        run: pnpm --filter @marxy/desktop build:web
      - name: Perf harness over the corpus, 256 KB and 1 MB, reload, second open and palette
        run: pnpm perf --files corpus --large 256k,1m --reload --open-second --palette --record results/perf-nightly.json --summary "$GITHUB_STEP_SUMMARY"
        env:
          MARXY_RUNNER_CLASS: ubuntu-latest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-nightly
          path: results/
          if-no-files-found: ignore

  # The macOS build, which left the pull-request path (A-09, ADR-0046): the binary, its licence gate,
  # the command-line smoke and the shell's unit tests, plus start-up of the built app with every mark
  # of every launch, recorded, never gated (A-03). A launch that never paints still yields the shell's
  # stages and says no_paint; the measurement fails only when no launch printed a mark at all. The plan
  # calls this job build-macos; it keeps A-03's name because scripts/perf-harness.test.mjs pins it.
  startup-macos:
    if: ${{ !inputs.update_baselines }}
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      MARXY_BIN: ${{ github.workspace }}/apps/desktop/src-tauri/target/ci/marxy
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: "pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
      # One shared key with the pull-request `rust` job of ci.yml: a pull request has no run on main to
      # restore from, so this job's cache, written here after the steps at the end, is what warms it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: macos-rust
          cache-on-failure: true
      - run: pnpm config set store-dir ~/.pnpm-store && pnpm install --frozen-lockfile
      - name: Build the frontend
        run: pnpm --filter @marxy/desktop build:web
      # `tauri build` enables tauri/custom-protocol so the app serves the embedded frontend; a plain
      # cargo build must pass it explicitly or the window never loads a page.
      - name: Build the desktop binary with the ci profile
        run: cd apps/desktop/src-tauri && cargo build --locked --profile ci --features tauri/custom-protocol
      - name: Licence gate (post-build, populated cargo cache)
        run: node scripts/gate-licences.mjs --require-registry
      - name: CLI smoke check on the built binary
        run: pnpm --filter @marxy/desktop verify:cli
      - name: Start-up measurement rules selftest
        run: node scripts/measure-startup.mjs --selftest
      - name: Start-up measurement (nine launches, every mark)
        run: node scripts/measure-startup.mjs
        env:
          MARXY_PERF_REQUIRED: "1"
          MARXY_PERF_ENV: ci
          MARXY_RUNNER_CLASS: macos-latest
      # After the start-up measurement, never before: compiling the test harness writes a large new
      # target tree, and launches measured right after it came out with a cold launch faster than the
      # warm ones (cold_warm_ratio 0.77), which makes the record lie.
      - name: Rust unit tests
        run: cd apps/desktop/src-tauri && cargo test --locked --profile ci --features tauri/custom-protocol --quiet
      # What the pull-request `rust` job runs (G-03), here to compile the dev-profile dependencies it needs
      # into the cache saved below.
      - name: Rust format and clippy, as a pull request runs them
        run: pnpm lint:rust
      - name: Rust unit tests, as a pull request runs them
        run: cd apps/desktop/src-tauri && cargo test --locked --quiet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-macos
          path: results/
          if-no-files-found: ignore

  # The Linux build, which left the pull-request path in G-03 (ADR-0046 amended by ADR-0056: Linux builds
  # nightly, not on pull requests): webview libraries, the thin-LTO ci-profile binary, its licence gate,
  # the command-line smoke, the Rust tests with the custom protocol, and the bundle gate over the built
  # dist. A pull request runs format, clippy, the Rust tests and the licence gate on macOS instead.
  # Red here for a Linux-only reason is a note, and the cheapest answer is to delete the job until Linux
  # is a release goal again (docs/plan/roadmap-2026-10/09-ci-and-precheck.md §4).
  rust-linux:
    if: ${{ !inputs.update_baselines }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MARXY_BIN: ${{ github.workspace }}/apps/desktop/src-tauri/target/ci/marxy
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - name: Linux webview and X deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb dbus
      - name: The webview library is visible to pkg-config
        run: pkg-config --exists glib-2.0 && pkg-config --modversion glib-2.0
      - uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: "pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ci-profile
          cache-on-failure: true
      - run: pnpm config set store-dir ~/.pnpm-store && pnpm install --frozen-lockfile
      - name: Rust format and clippy
        run: pnpm lint:rust
      - name: Build the frontend
        run: pnpm --filter @marxy/desktop build:web
      - name: Build the desktop binary with the ci profile
        run: cd apps/desktop/src-tauri && cargo build --locked --profile ci --features tauri/custom-protocol
      - name: Licence gate (post-build, populated cargo cache)
        run: node scripts/gate-licences.mjs --require-registry
      - name: CLI smoke check on the built binary
        run: pnpm --filter @marxy/desktop verify:cli
      - name: Rust unit tests
        run: cd apps/desktop/src-tauri && cargo test --locked --profile ci --features tauri/custom-protocol --quiet
      - run: pnpm gate:bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-linux
          path: results/
          if-no-files-found: ignore

  # The fleet's tests. The fleet is paused (ADR-0051), so a pull request no longer runs them (G-03).
  fleet:
    if: ${{ !inputs.update_baselines }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: "pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
      - run: pnpm config set store-dir ~/.pnpm-store && pnpm install --frozen-lockfile
      - run: pnpm test:fleet

  # Every WebKit test, with WebKit required (A-10). A pull request runs only the desktop `test:lite`
  # set in ci.yml's browser-lite job; here run the whole desktop suite, its mutation check, and the
  # typeset, theme and core suites, whose WebKit tests no pull-request job runs (audit 04 §3). Each
  # suite runs even when one before it failed, so one night names every red suite.
  browser-full:
    if: ${{ !inputs.update_baselines }}
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 45
    env:
      MARXY_BROWSER_TESTS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: "pnpm-container-${{ hashFiles('pnpm-lock.yaml') }}"
      - run: pnpm config set store-dir ~/.pnpm-store && pnpm install --frozen-lockfile
      # The core suite compiles the Rust watcher's tests with rustc (packages/core/src/position/
      # watch-rust.test.ts), and the Playwright image ships no C linker. The desktop images test no
      # longer needs one (G-04), and browser-lite in ci.yml runs without it.
      - name: A C linker for the core suite's rustc test
        run: apt-get update -qq && apt-get install -y -qq build-essential
      - name: Desktop suite
        run: pnpm --filter @marxy/desktop test
      - name: Desktop mutation check
        if: ${{ !cancelled() }}
        run: pnpm --filter @marxy/desktop test:mutations
      - name: Theme suite
        if: ${{ !cancelled() }}
        run: pnpm --filter @marxy/theme test
      - name: Typeset suite
        if: ${{ !cancelled() }}
        run: pnpm --filter @marxy/typeset test
      - name: Core suite
        if: ${{ !cancelled() }}
        run: pnpm --filter @marxy/core test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-full
          path: results/
          if-no-files-found: ignore
