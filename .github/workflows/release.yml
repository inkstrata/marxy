name: release
# A tag push builds the DMG and publishes a pre-release with it attached. A manual dispatch builds
# the same DMG and offers it as a workflow artifact only: with no tagName, tauri-action creates no
# release and no tag, so a dry run is safe on any branch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write # a release needs it; nothing else in this workflow writes
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          # No Linux row: ADR-0046 makes Linux a release criterion only once Linux hardware exists,
          # so v0.1.0 is macOS only.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      # tauri.conf.json's beforeBuildCommand is empty, so the bundle would ship without a frontend
      # unless the web assets are built first.
      - run: pnpm --filter @marxy/desktop build:web
      # macOS signing + notarization is wired but off: tauri treats an APPLE_* variable that is set
      # to the empty string as configured and fails importing a certificate that is not there (the
      # first dry run did exactly that). So export each one only when its secret has a value; with
      # none set the build is unsigned, which is what v0.1.0 is.
      - name: Export Apple signing secrets (only the ones that exist)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "$name<<MARXY_EOF" >> "$GITHUB_ENV"
              echo "$value" >> "$GITHUB_ENV"
              echo "MARXY_EOF" >> "$GITHUB_ENV"
            fi
          done
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          # Empty on a dispatch, which makes the action build without creating a release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('marxy {0}', github.ref_name) || '' }}
          releaseBody: 'See CHANGELOG.md. Pre-release; the macOS build is unsigned (see the README Install section).'
          releaseDraft: false
          prerelease: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      # A bundle with only the linker's ad-hoc signature has no sealed resources, and Apple silicon
      # SIGKILLs it on launch (v0.1.0 shipped that way). tauri.conf.json's signingIdentity "-" seals
      # the bundle; this proves it did, on the DMG as built.
      - name: Verify the app bundle is sealed
        run: |
          dmg=$(ls apps/desktop/src-tauri/target/*/release/bundle/dmg/*.dmg | head -n 1)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          codesign --verify --deep --strict --verbose=2 "$mnt/Marxy.app"
          hdiutil detach "$mnt"
      - name: Offer the DMG as an artifact (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: marxy-dmg
          path: apps/desktop/src-tauri/target/**/bundle/dmg/*.dmg
          if-no-files-found: error
      # The installer-size budget and katex-in-bundle check: PR CI builds no installer, so this is
      # the only place they can measure one, and a missing bundle fails here instead of skipping.
      # (After the upload, so a failing gate still leaves the DMG to inspect.)
      - run: pnpm gate:bundle
        env: { MARXY_BUNDLE_REQUIRED: '1' }
