name: release
# A tag push builds the DMG and publishes a pre-release with it attached. A manual dispatch builds
# the same DMG and offers it as a workflow artifact only: with no tagName, tauri-action creates no
# release and no tag, so a dry run is safe on any branch.
#
# A tag publishes nothing until it has passed: the tag must name the version the app carries, `ci`
# must have passed on the tagged commit, and the release is made as a draft that is published only
# after the bundle's seal, its notices and the bundle gate are checked. A failure leaves a draft to
# inspect or delete, never a published release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write # a release needs it; nothing else in this workflow writes
  actions: read # to find the ci runs of the tagged commit
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          # No Linux or Windows row yet: Linux has never been built, and the Windows installer is made and
          # signed on the Windows machine with `pnpm work installer`.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The tag, the DMG's name and the About box must agree, so all four version strings are compared.
      - name: Check the tag names the version the app carries
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          pkg=$(jq -r .version apps/desktop/package.json)
          crate=$(awk -F'"' '/^version = / { print $2; exit }' apps/desktop/src-tauri/Cargo.toml)
          lock=$(awk '/^name = "marxy"$/ { getline; gsub(/version = |"/, ""); print; exit }' apps/desktop/src-tauri/Cargo.lock)
          echo "tag $want; tauri.conf.json $conf; package.json $pkg; Cargo.toml $crate; Cargo.lock $lock"
          for got in "$conf" "$pkg" "$crate" "$lock"; do
            [ "$got" = "$want" ] || { echo "::error::the tag says $want but a version string says $got"; exit 1; }
          done
          [ -f "docs/releases/$want.md" ] || { echo "::error::no release notes at docs/releases/$want.md"; exit 1; }
      # A tag on a commit whose checks failed, or never ran, would publish an untested build.
      - name: Require ci to have passed on the tagged commit
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          passed=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$passed" -lt 1 ]; then
            echo "::error::no passing ci run on $GITHUB_SHA; tag a commit of main whose ci is green"
            gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" || true
            exit 1
          fi
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      # tauri.conf.json's beforeBuildCommand is empty, so the bundle would ship without a frontend
      # unless the web assets are built first.
      - run: pnpm --filter @marxy/desktop build:web
      # macOS signing + notarization is wired but off: tauri treats an APPLE_* variable that is set
      # to the empty string as configured and fails importing a certificate that is not there (the
      # first dry run did exactly that). So export each one only when its secret has a value; with
      # none set the build is unsigned, which is what v0.1.0 is.
      - name: Export Apple signing secrets (only the ones that exist)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "$name<<MARXY_EOF" >> "$GITHUB_ENV"
              echo "$value" >> "$GITHUB_ENV"
              echo "MARXY_EOF" >> "$GITHUB_ENV"
            fi
          done
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          # Empty on a dispatch, which makes the action build without creating a release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('marxy {0}', github.ref_name) || '' }}
          # The notes are set from docs/releases/<version>.md when the draft is published, below.
          releaseBody: 'Release notes follow when the checks pass.'
          releaseDraft: true
          prerelease: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      # A bundle with only the linker's ad-hoc signature has no sealed resources, and Apple silicon
      # SIGKILLs it on launch (v0.1.0 shipped that way). tauri.conf.json's signingIdentity "-" seals
      # the bundle; this proves it did, on the DMG as built.
      - name: Verify the app bundle is sealed
        run: |
          dmg=$(ls apps/desktop/src-tauri/target/*/release/bundle/dmg/*.dmg | head -n 1)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          codesign --verify --deep --strict --verbose=2 "$mnt/Marxy.app"
          # MIT and the font licences must travel with the binary (the OFL files sit beside the fonts).
          for notice in LICENSE THIRD_PARTY_NOTICES.md; do
            [ -f "$mnt/Marxy.app/Contents/Resources/$notice" ] || { echo "::error::$notice is not in the bundle"; hdiutil detach "$mnt"; exit 1; }
          done
          hdiutil detach "$mnt"
      - name: Offer the DMG as an artifact (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: marxy-dmg
          path: apps/desktop/src-tauri/target/**/bundle/dmg/*.dmg
          if-no-files-found: error
      # The installer-size budget and katex-in-bundle check: PR CI builds no installer, so this is
      # the only place they can measure one, and a missing bundle fails here instead of skipping.
      # (After the upload, so a failing gate still leaves the DMG to inspect.)
      - run: pnpm gate:bundle
        env: { MARXY_BUNDLE_REQUIRED: '1' }
      - name: Publish the release with its notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Found by id from the list: GitHub's lookup by tag does not return drafts.
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\" and .draft) | .id" | head -n 1)
          [ -n "$id" ] || { echo "::error::no draft release for $GITHUB_REF_NAME to publish"; exit 1; }
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false -F prerelease=true -F body=@"docs/releases/${GITHUB_REF_NAME#v}.md" --jq .html_url
