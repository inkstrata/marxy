name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  conventions:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - name: Commit messages follow docs/conventions.md
        run: pnpm exec commitlint --from origin/${{ github.base_ref }} --to HEAD --verbose
      - name: PR title is a valid squash subject
        run: echo "${{ github.event.pull_request.title }}" | pnpm exec commitlint --verbose
      - name: PR body leads with a Summary section
        run: |
          body=$(gh pr view ${{ github.event.pull_request.number }} --json body --jq .body)
          echo "$body" | grep -q '^## Summary' || { echo "PR body must start with '## Summary' (docs/conventions.md)"; exit 1; }
        env: { GH_TOKEN: "${{ github.token }}" }
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test
      - run: pnpm gate:golden
      - run: pnpm gate:fidelity
      - run: pnpm gate:licences
      - name: Playwright browsers
        run: pnpm exec playwright install --with-deps webkit chromium
      - run: pnpm gate:no-network
      - run: pnpm gate:aesthetics
      - name: Build desktop app
        run: pnpm --filter @marxy/desktop build
      - name: Startup measurement (packaged app)
        run: node scripts/measure-startup.mjs
        env:
          MARXY_PERF_REQUIRED: '1'
          MARXY_PERF_ENV: ci
          MARXY_RUNNER_CLASS: "${{ matrix.os }}"
      - name: Perf gate rules selftest
        run: |
          node scripts/gate-perf.mjs --selftest
          node scripts/measure-startup.mjs --selftest
      - name: Perf gate (CI envelope and baseline, ADR-0022)
        run: pnpm gate:perf
        env:
          MARXY_PERF_ENV: ci
          MARXY_RUNNER_CLASS: "${{ matrix.os }}"
      - run: pnpm gate:bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "gate-results-${{ matrix.os }}", path: results/, if-no-files-found: ignore }
