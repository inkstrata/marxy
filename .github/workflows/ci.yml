name: ci
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
# Every commit on main gets its own completed run, so the first red one names the merge that broke it
# (MARXY-334). A group per ref would still drop runs there: GitHub keeps one pending run per group and
# cancels the rest. Pull requests keep one group per ref and cancel a superseded run.
concurrency:
  group: "ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions: { contents: read }
env:
  CARGO_TERM_COLOR: always
  PNPM_STORE: ~/.pnpm-store

jobs:
  # What changed decides what runs: a docs-only change never builds the app or starts a browser, a
  # change that touches no Rust never builds the app, and a push to main runs only `fast` (A-09). The
  # paths behind each output are in scripts/ci-changes.mjs and its test.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      web: ${{ steps.detect.outputs.web }}
      typography: ${{ steps.detect.outputs.typography }}
      rust: ${{ steps.detect.outputs.rust }}
      fleet: ${{ steps.detect.outputs.fleet }}
      lockfile: ${{ steps.detect.outputs.lockfile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # base...HEAD needs the merge base
      - id: detect
        run: node scripts/ci-changes.mjs ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'HEAD~1' }}

  conventions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: "pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
      - run: pnpm config set store-dir ~/.pnpm-store && pnpm install --frozen-lockfile
      - name: PR title is a valid squash subject
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node orchestration/pr-mark.mjs --bare | pnpm exec commitlint --verbose

  # Everything that needs neither a browser nor Rust: hygiene checks, types, lint, unit tests, goldens, fidelity, licences.
  fast:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: "pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
      - run: pnpm config set store-dir ~/.pnpm-store && pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - if: needs.changes.outputs.fleet == 'true'
        run: pnpm test:fleet
      - name: CommonMark spec selftest
        run: node --experimental-strip-types packages/core/scripts/commonmark-spec.ts --selftest
      # The spec is an immutable pinned version, and it was re-downloaded on every pull request: a
      # red build because spec.commonmark.org was slow or rate-limiting is a failure that has
      # nothing to do with the diff under review (MARXY-153). Fetched once and cached instead. The
      # key is the script's own hash, because the version pin lives only in that file and the
      # workflow is not allowed to name it.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/marxy-commonmark
          key: "commonmark-${{ hashFiles('packages/core/scripts/commonmark-spec.ts') }}"
      - name: CommonMark spec suite
        env:
          MARXY_COMMONMARK_SPEC: ${{ runner.temp }}/marxy-commonmark/spec.json
        run: |
          DEST=$(node --experimental-strip-types packages/core/scripts/commonmark-spec.ts --print-dest)
          URL=$(node --experimental-strip-types packages/core/scripts/commonmark-spec.ts --print-url)
          mkdir -p "$(dirname "$DEST")"
          test -s "$DEST" || curl -fsSL --retry 3 --retry-all-errors "$URL" -o "$DEST"
          pnpm --filter @marxy/core test:spec
          test -z "$(git status --porcelain)"
      - run: pnpm gate:golden
      - run: pnpm gate:fidelity
      - run: pnpm gate:licences

  # Browser gates in the official Playwright image: browsers and their system libraries are already
  # there. Pull requests and merge groups only: the push to main proves a tree its pull request proved.
  browser:
    needs: changes
    if: needs.changes.outputs.web == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: "pnpm-container-${{ hashFiles('pnpm-lock.yaml') }}"
      - run: pnpm config set store-dir ~/.pnpm-store && pnpm install --frozen-lockfile
      - run: pnpm gate:no-network
      # The desktop suite's WebKit tests (live reload, the open path, operations, Source mode) skip in
      # `fast`, which has no browser; here WebKit is in the image, so a skip would be a lie and is
      # refused. Nothing ran them on a pull request before MARXY-247, and the edit-after-reload data
      # loss MARXY-246 fixed reached main through that gap.
      # One desktop test compiles a small Rust crate (images.test.mjs), and the Playwright image ships
      # no C linker for cargo's build scripts.
      - name: A C linker for the desktop suite's Rust test
        run: apt-get update -qq && apt-get install -y -qq build-essential
      - name: Desktop suite with WebKit required
        run: pnpm --filter @marxy/desktop test
        env:
          MARXY_BROWSER_TESTS_REQUIRED: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: results/
          if-no-files-found: ignore

  # The typography gates, when what they render changed: the theme, the typesetter, the parse, render
  # and sanitise path, the corpus, the fonts, or a dependency (scripts/ci-changes.mjs).
  typography:
    needs: changes
    if: (needs.changes.outputs.typography == 'true' || needs.changes.outputs.lockfile == 'true') && github.event_name != 'push'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: "pnpm-container-${{ hashFiles('pnpm-lock.yaml') }}"
      - run: pnpm config set store-dir ~/.pnpm-store && pnpm install --frozen-lockfile
      - run: pnpm gate:aesthetics
      - run: pnpm gate:specimen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typography-results
          path: results/
          if-no-files-found: ignore

  # The desktop binary, on Ubuntu only (ADR-0046: Linux is a release criterion; macOS builds nightly),
  # when Rust, tauri.conf.json, the Vite config, the CLI smoke, the toolchain or a dependency changed.
  rust:
    needs: changes
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.lockfile == 'true') && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MARXY_BIN: ${{ github.workspace }}/apps/desktop/src-tauri/target/ci/marxy
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      # Plain apt, not cache-apt-pkgs-action: its cached restore dropped glib-2.0.pc, so clippy and
      # the build could not find glib on a cache hit and main went red (runs 35376241346, 35377516836).
      - name: Linux webview and X deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb dbus
      - name: The webview library is visible to pkg-config
        run: pkg-config --exists glib-2.0 && pkg-config --modversion glib-2.0
      - uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: "pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ci-profile
          cache-on-failure: true   # a red clippy or test must not throw away the compiled dependencies
      - run: pnpm config set store-dir ~/.pnpm-store && pnpm install --frozen-lockfile
      - name: Rust format and clippy
        run: pnpm lint:rust
      - name: Build the frontend
        run: pnpm --filter @marxy/desktop build:web
      # `tauri build` enables tauri/custom-protocol so the app serves the embedded frontend instead of the dev
      # server; a plain cargo build must pass it explicitly or the window never loads a page.
      - name: Build the desktop binary with the ci profile (thin LTO, cached dependencies)
        run: cd apps/desktop/src-tauri && cargo build --locked --profile ci --features tauri/custom-protocol
      - name: Licence gate (post-build, populated cargo cache)
        run: node scripts/gate-licences.mjs --require-registry
      - name: CLI smoke check on the built binary
        run: pnpm --filter @marxy/desktop verify:cli
      # The shell's own unit tests (watcher, navigation guard, argument paths, IPC decoding) ran nowhere
      # before MARXY-247. Same profile and features as the build above, so the dependencies are reused.
      - name: Rust unit tests
        run: cd apps/desktop/src-tauri && cargo test --locked --profile ci --features tauri/custom-protocol --quiet
      - run: pnpm gate:bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-results
          path: results/
          if-no-files-found: ignore

  # The one status check branch protection requires. It runs whatever happened above, so it reports on
  # every pull request, path-filtered or docs-only. Skipped jobs are fine; failed or cancelled ones are
  # not, and neither is a `changes` that did not answer every output, since a missing answer would
  # skip the job it gates and pass.
  ci:
    needs: [changes, conventions, fast, browser, typography, rust]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job that ran succeeded
        run: |
          echo '${{ toJSON(needs) }}' | node -e '
            const needs = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const bad = Object.entries(needs).filter(([, v]) => v.result === "failure" || v.result === "cancelled");
            for (const [k, v] of Object.entries(needs)) console.log(`${v.result === "success" ? "✓" : v.result === "skipped" ? "·" : "✗"} ${k}: ${v.result}`);
            const outputs = needs.changes?.outputs ?? {};
            const unanswered = ["docs_only", "web", "typography", "rust", "fleet", "lockfile"].filter(k => outputs[k] !== "true" && outputs[k] !== "false");
            if (needs.changes?.result === "success" && unanswered.length) { console.error(`changes did not answer: ${unanswered.join(", ")}`); bad.push(["changes"]); }
            if (bad.length) { console.error(`failed: ${bad.map(([k]) => k).join(", ")}`); process.exit(1); }'
