name: ci
# `pnpm verify` is the one definition of what checks a tree (scripts/verify.mjs, docs/testing.md); CI runs it and
# nothing of its own, on the two platforms the code is known on.
#
# - macOS (a product target): every step that passes there — typecheck, lint, `pnpm check`, the gates, every unit
#   suite, the Rust lint and tests, and the release build with its smoke launch. The browser suite is left out:
#   14 of its files still fail on macOS WebKit (work/todo.md, M4). When they pass, add `browser` here.
# - Windows (where the suite has always run green): `pnpm verify --tier changed` against the base on a pull request,
#   which runs the browser test files that cover the changed folders; `quick` on a push to main; any tier by hand.
#   Only `full` runs `check:tauri` (the real-window check); whether a hosted runner can drive WebView2 for it is
#   untried, so a run's integrator still runs it on a Windows desktop.
#
# The repository is public, so the minutes are free.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tier:
        description: "verify tier on Windows"
        type: choice
        options: [quick, changed, full]
        default: full
concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions: { contents: read }
env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: WebKit for the desktop unit files that start it
        run: pnpm exec playwright install webkit
      - name: Verify (every step that passes on macOS)
        run: >-
          node scripts/verify.mjs --tier full --no-lock --logs "$RUNNER_TEMP/verify"
          --only install,typecheck,lint,check,golden,fidelity,licences,unit-core,unit-theme,unit-typeset,unit-scripts,unit-desktop,unit-desktop-browser,lint-rust,cargo,build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-logs-macos
          path: ${{ runner.temp }}/verify
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # `changed` diffs against the merge base with the base branch
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: WebKit for the browser tests
        run: pnpm exec playwright install webkit
      - name: Verify
        env:
          TIER: ${{ inputs.tier || (github.event_name == 'pull_request' && 'changed') || 'quick' }}
          BASE: origin/${{ github.base_ref || 'main' }}
          MARXY_BROWSER_TESTS_REQUIRED: "1"
        run: node scripts/verify.mjs --tier "$TIER" --base "$BASE" --logs "$RUNNER_TEMP/verify" --no-lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-logs-windows
          path: ${{ runner.temp }}/verify
          if-no-files-found: ignore
