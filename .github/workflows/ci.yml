name: ci
# `pnpm verify` is the one definition of what checks a tree (scripts/verify.mjs, docs/testing.md); CI runs it and
# nothing of its own, on the two platforms the code is known on.
#
# - macOS (a product target): every step that passes there — typecheck, lint, `pnpm check`, the gates, every unit
#   suite, the Rust lint and tests, and the release build with its smoke launch. The browser suite is left out:
#   14 of its files still fail on macOS WebKit (work/todo.md, M4). When they pass, add `browser` here.
# - Windows: the same steps on a pull request and on main, but the release build. The browser suite is left out here
#   too: it is green on a Windows desktop (2536/0), but 14 of its files fail on a hosted runner, mostly timing budgets
#   that a slow machine misses (work/todo.md, M5); it takes two hours there as well. A run by hand takes the tier it is
#   given, browser suite included. Only `full` runs `check:tauri` (the real-window check); whether a hosted runner can
#   drive WebView2 for it is untried, so a run's integrator still runs it and the browser suite on a Windows desktop.
#
# The repository is public, so the minutes are free.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tier:
        description: "verify tier on Windows"
        type: choice
        options: [quick, changed, full]
        default: full
concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions: { contents: read }
env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # verify finds the merge base with the base branch even at `full`
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: WebKit for the desktop unit files that start it
        run: pnpm exec playwright install webkit
      - name: Verify (every step that passes on macOS)
        env:
          BASE: origin/${{ github.base_ref || 'main' }}
        run: >-
          node scripts/verify.mjs --tier full --base "$BASE" --no-lock --logs "$RUNNER_TEMP/verify"
          --only install,typecheck,lint,check,golden,fidelity,licences,unit-core,unit-theme,unit-typeset,unit-scripts,unit-desktop,unit-desktop-browser,lint-rust,cargo,build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-logs-macos
          path: ${{ runner.temp }}/verify
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    timeout-minutes: 180 # a run by hand at `full` takes the browser suite, about two hours
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # `changed` diffs against the merge base with the base branch
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: WebKit for the browser tests
        run: pnpm exec playwright install webkit
      - name: Verify
        env:
          TIER: ${{ inputs.tier || 'changed' }}
          BASE: origin/${{ github.base_ref || 'main' }}
          MARXY_BROWSER_TESTS_REQUIRED: "1"
          # Empty on a run by hand, which then runs its tier's steps.
          ONLY: ${{ github.event_name != 'workflow_dispatch' && 'install,typecheck,lint,check,golden,fidelity,licences,unit-core,unit-theme,unit-typeset,unit-scripts,unit-desktop,unit-desktop-browser,lint-rust,cargo' || '' }}
        run: node scripts/verify.mjs --tier "$TIER" --base "$BASE" --logs "$RUNNER_TEMP/verify" --no-lock ${ONLY:+--only "$ONLY"}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-logs-windows
          path: ${{ runner.temp }}/verify
          if-no-files-found: ignore

  # Branch protection on main requires the one check `ci`; it passes only when both platforms did.
  ci:
    if: always()
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Both platforms passed
        env:
          MACOS: ${{ needs.macos.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          echo "macos: $MACOS, windows: $WINDOWS"
          test "$MACOS" = success && test "$WINDOWS" = success
