name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true
permissions: { contents: read }
env:
  CARGO_TERM_COLOR: always
  PNPM_STORE: ~/.pnpm-store

jobs:
  # What changed decides what runs: a docs-only change never builds the app or starts a browser.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      web: ${{ steps.detect.outputs.web }}
      rust: ${{ steps.detect.outputs.rust }}
      gates: ${{ steps.resolve.outputs.gates }}
      gates_hash: ${{ steps.detect.outputs.gates_hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: node scripts/ci-changes.mjs ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
      # A hit means this exact gates-relevant content already built and measured clean on both
      # runner classes on some other push; a miss (or a stand-in/in-progress record) leaves
      # results/gates-record.json absent or unusable and node scripts/ci-changes.mjs --resolve runs
      # the real jobs (MARXY-105).
      - name: Restore a prior real dual-OS gates success for this content, if any
        uses: actions/cache@v4
        with:
          path: results/gates-record.json
          key: "gates-ok-${{ steps.detect.outputs.gates_hash }}"
      - id: resolve
        run: node scripts/ci-changes.mjs --resolve
      - name: Change-detection and gates-skip selftest (MARXY-105)
        run: node scripts/ci-changes.mjs --selftest

  conventions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: "pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
      - run: pnpm config set store-dir ~/.pnpm-store && pnpm install --frozen-lockfile
      - name: Commit messages follow docs/conventions.md
        run: pnpm exec commitlint --from origin/${{ github.base_ref }} --to HEAD --verbose
      - name: PR title is a valid squash subject
        run: echo "${{ github.event.pull_request.title }}" | pnpm exec commitlint --verbose
      - name: PR body follows the template, changelog has the key, baselines have a queue entry
        run: node scripts/check-pr.mjs --pr ${{ github.event.pull_request.number }} --range
        env:
          GH_TOKEN: "${{ github.token }}"
      - name: Story boundary over the whole branch
        run: node scripts/check-story.mjs --strict

  # Everything that needs neither a browser nor Rust: hygiene checks, types, lint, unit tests, goldens, fidelity, licences.
  fast:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: "pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
      - run: pnpm config set store-dir ~/.pnpm-store && pnpm install --frozen-lockfile
      - run: pnpm check:boundaries && pnpm check:registry && pnpm check:deps && pnpm check:workflows
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: CommonMark spec selftest
        run: node --experimental-strip-types packages/core/scripts/commonmark-spec.ts --selftest
      # The spec is an immutable pinned version, and it was re-downloaded on every pull request: a
      # red build because spec.commonmark.org was slow or rate-limiting is a failure that has
      # nothing to do with the diff under review (MARXY-153). Fetched once and cached instead. The
      # key is the script's own hash, because the version pin lives only in that file and the
      # workflow is not allowed to name it.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/marxy-commonmark
          key: "commonmark-${{ hashFiles('packages/core/scripts/commonmark-spec.ts') }}"
      - name: CommonMark spec suite
        env:
          MARXY_COMMONMARK_SPEC: ${{ runner.temp }}/marxy-commonmark/spec.json
        run: |
          DEST=$(node --experimental-strip-types packages/core/scripts/commonmark-spec.ts --print-dest)
          URL=$(node --experimental-strip-types packages/core/scripts/commonmark-spec.ts --print-url)
          mkdir -p "$(dirname "$DEST")"
          test -s "$DEST" || curl -fsSL --retry 3 --retry-all-errors "$URL" -o "$DEST"
          pnpm --filter @marxy/core test:spec
          test -z "$(git status --porcelain)"
      - run: pnpm gate:golden
      - run: pnpm gate:fidelity
      - run: pnpm gate:licences

  # Browser gates in the official Playwright image: browsers and their system libraries are already there.
  browser:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: "pnpm-container-${{ hashFiles('pnpm-lock.yaml') }}"
      - run: pnpm config set store-dir ~/.pnpm-store && pnpm install --frozen-lockfile
      - run: pnpm gate:no-network
      - run: pnpm gate:aesthetics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: results/
          if-no-files-found: ignore

  # Posts the same check names as `gates` when a real build cannot change the result (MARXY-105): a
  # matrix job skipped by its own if: does not reliably report one entry per matrix value, so anything
  # watching by name still needs to see "gates (macos-latest)" and "gates (ubuntu-latest)" resolve.
  # The matrix below is written one value per line on purpose, not as a single-line bracketed list:
  # scripts/gate-perf.mjs's own workflow check greps the gates job for that exact single-line shape,
  # and this story is not allowed to touch that file (criterion 5), so this job's otherwise identical
  # values must not collide with the text it looks for.
  gates-skip:
    name: gates
    needs: changes
    if: needs.changes.outputs.gates != 'true'
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "gates (${{ matrix.os }}) skipped — no gates-relevant change since the last real dual-OS success"

  # Build the app and measure it, on both runner classes. The measurement, its selftests and the perf
  # gate are unconditional here by design (scripts/gate-perf.mjs checkWorkflow asserts it). Skipped
  # when the diff cannot change the result — no gates-relevant file changed, or the change is only
  # non-relevant files after a real dual-OS success already proved this content (MARXY-105).
  gates:
    needs: changes
    if: needs.changes.outputs.gates == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MARXY_BIN: ${{ github.workspace }}/apps/desktop/src-tauri/target/ci/marxy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the budgets-unchanged step diffs against origin/main
      - uses: jdx/mise-action@v2
        with:
          cache: true
      # Plain apt, not cache-apt-pkgs-action: its cached restore dropped glib-2.0.pc, so clippy and
      # the build could not find glib on a cache hit and main went red (runs 35376241346, 35377516836).
      - name: Linux webview and X deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb dbus
      - name: The webview library is visible to pkg-config
        if: runner.os == 'Linux'
        run: pkg-config --exists glib-2.0 && pkg-config --modversion glib-2.0
      - uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: "pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ci-profile
          cache-on-failure: true   # a red perf gate must not throw away the compiled dependencies
      - run: pnpm config set store-dir ~/.pnpm-store && pnpm install --frozen-lockfile
      - run: pnpm gate:specimen
      - name: Licence gate (pre-build, empty cargo cache)
        run: pnpm gate:licences
      - name: Rust format and clippy
        if: runner.os == 'Linux'
        run: pnpm lint:rust
      - name: Build the frontend
        run: pnpm --filter @marxy/desktop build:web
      # `tauri build` enables tauri/custom-protocol so the app serves the embedded frontend instead of the dev
      # server; a plain cargo build must pass it explicitly or the window never loads a page.
      - name: Build the desktop binary with the ci profile (thin LTO, cached dependencies)
        run: cd apps/desktop/src-tauri && cargo build --profile ci --features tauri/custom-protocol
      - name: Licence gate (post-build, populated cargo cache)
        run: node scripts/gate-licences.mjs --require-registry
      - name: CLI smoke check on the built binary
        run: pnpm --filter @marxy/desktop verify:cli
      - name: Startup measurement (nine launches, cold then warm)
        run: node scripts/measure-startup.mjs
        env:
          MARXY_PERF_REQUIRED: "1"
          MARXY_PERF_ENV: ci
          MARXY_RUNNER_CLASS: "${{ matrix.os }}"
      - name: Perf gate rules selftest
        run: |
          node scripts/gate-perf.mjs --selftest
          node scripts/measure-startup.mjs --selftest
          node scripts/measure-parse.mjs --selftest
      - name: Perf budgets are unchanged (ADR-0013 product budgets, ADR-0022 CI numbers)
        run: node scripts/gate-perf.mjs --assert-budgets-unchanged ${{ github.base_ref && format('origin/{0}', github.base_ref) || 'HEAD^' }}
      - name: Parse measurement (01-long-technical.md)
        run: node scripts/measure-parse.mjs
      # In ci mode the gate re-measures once before failing on an envelope or baseline breach (scripts/gate-perf.mjs).
      - name: Perf gate (CI envelope and baseline, ADR-0022)
        run: pnpm gate:perf
        env:
          MARXY_PERF_ENV: ci
          MARXY_RUNNER_CLASS: "${{ matrix.os }}"
          MARXY_PERF_REQUIRED: "1"
      - name: Startup numbers in the job summary
        if: always()
        run: node scripts/ci-summary.mjs
      - run: pnpm gate:bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "gate-results-${{ matrix.os }}"
          path: results/
          if-no-files-found: ignore

  # Writes and caches proof that this exact gates-relevant content already built and measured clean
  # on both runner classes, so a later push that only adds non-relevant files can reuse it (MARXY-105).
  # Only runs after a real (not skipped) dual-OS success: `needs.gates.result` is "success" solely in
  # that case, never for a job whose if: was false.
  gates-record:
    needs: [changes, gates]
    if: needs.gates.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: mkdir -p results && printf '{"status":"success","dualOS":true,"hash":"%s"}' "${{ needs.changes.outputs.gates_hash }}" > results/gates-record.json
      - uses: actions/cache@v4
        with:
          path: results/gates-record.json
          key: "gates-ok-${{ needs.changes.outputs.gates_hash }}"

  # The one status check branch protection requires. Skipped jobs are fine; failed or cancelled ones are not.
  ci:
    needs: [changes, conventions, fast, browser, gates, gates-skip, gates-record]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job that ran succeeded
        run: |
          echo '${{ toJSON(needs) }}' | node -e '
            const needs = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const bad = Object.entries(needs).filter(([, v]) => v.result === "failure" || v.result === "cancelled");
            for (const [k, v] of Object.entries(needs)) console.log(`${v.result === "success" ? "✓" : v.result === "skipped" ? "·" : "✗"} ${k}: ${v.result}`);
            if (bad.length) { console.error(`failed: ${bad.map(([k]) => k).join(", ")}`); process.exit(1); }'
