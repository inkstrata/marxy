name: ci
# `pnpm verify` is the one definition of what checks a tree (scripts/verify.mjs, docs/testing.md); CI runs it and
# nothing of its own, on the three platforms the code builds on, and keeps a pull request lean:
#
# - A pull request runs the `changed` tier: the gates, and only the suites the diff touches (a docs-only change runs
#   none). A push to main runs `full`, so every suite still runs once per merge. `--skip` takes steps out of the tier
#   without losing that change mapping (`--only` would run its steps whatever changed).
# - Left out on both: `browser` (two hours on a hosted runner, and 14 files fail there; work/todo.md, M4/M5) and
#   `tauri` (the real-window check). A run's integrator runs those on a desktop.
# - macOS also leaves out `unit-desktop-browser`: its first WebKit boot misses the 90 s budget on a hosted macOS runner
#   about half the time (8 s on a laptop), and it passes on Windows, which runs it. `build` (the release build and its
#   smoke launch) runs on macOS on a push to main only; release.yml builds every tag.
# - A run by hand takes the tier it is given on Windows, browser suite included.
#
# The repository is public, so the minutes are free; the time is not.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tier:
        description: "verify tier on Windows"
        type: choice
        options: [quick, changed, full]
        default: full
concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions: { contents: read }
env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 45 || 90 }} # a push to main also runs the aesthetics gate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # verify finds the merge base with the base branch even at `full`
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: WebKit for the desktop unit files that start it
        run: pnpm exec playwright install webkit
      - name: Verify
        env:
          TIER: ${{ github.event_name == 'pull_request' && 'changed' || 'full' }}
          BASE: origin/${{ github.base_ref || 'main' }}
        run: >-
          node scripts/verify.mjs --tier "$TIER" --base "$BASE" --no-lock --logs "$RUNNER_TEMP/verify"
          --skip unit-desktop-browser,browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-logs-macos
          path: ${{ runner.temp }}/verify
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    timeout-minutes: 180 # only a run by hand at `full` takes the browser suite, about two hours
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # `changed` diffs against the merge base with the base branch
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: WebKit for the browser tests
        run: pnpm exec playwright install webkit
      - name: Verify
        env:
          TIER: ${{ inputs.tier || (github.event_name == 'pull_request' && 'changed' || 'full') }}
          BASE: origin/${{ github.base_ref || 'main' }}
          MARXY_BROWSER_TESTS_REQUIRED: "1"
          # Empty on a run by hand, which then runs its tier's steps.
          SKIP: ${{ github.event_name != 'workflow_dispatch' && 'browser,build,tauri' || '' }}
        run: node scripts/verify.mjs --tier "$TIER" --base "$BASE" --logs "$RUNNER_TEMP/verify" --no-lock ${SKIP:+--skip "$SKIP"}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-logs-windows
          path: ${{ runner.temp }}/verify
          if-no-files-found: ignore

  # Linux: the release build, the unit suites and the Rust tests on a hosted runner, no browser suite (work/todo.md, M3).
  # Green on two runs in a row before it joined `ci`.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - name: Tauri's Linux packages, and a virtual display for the smoke launch
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libssl-dev libxdo-dev build-essential pkg-config patchelf xvfb dbus
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Verify
        env:
          TIER: ${{ inputs.tier || (github.event_name == 'pull_request' && 'changed' || 'full') }}
          BASE: origin/${{ github.base_ref || 'main' }}
        run: >-
          node scripts/verify.mjs --tier "$TIER" --base "$BASE" --no-lock --logs "$RUNNER_TEMP/verify"
          --skip unit-desktop-browser,browser,aesthetics,tauri
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-logs-linux
          path: ${{ runner.temp }}/verify
          if-no-files-found: ignore

  # Branch protection on main requires the one check `ci`; it passes only when all three platforms did.
  ci:
    if: always()
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: All three platforms passed
        env:
          MACOS: ${{ needs.macos.result }}
          WINDOWS: ${{ needs.windows.result }}
          LINUX: ${{ needs.linux.result }}
        run: |
          echo "macos: $MACOS, windows: $WINDOWS, linux: $LINUX"
          test "$MACOS" = success && test "$WINDOWS" = success && test "$LINUX" = success
