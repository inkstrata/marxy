name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }
jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test
      - run: pnpm gate:golden
      - run: pnpm gate:fidelity
      - run: pnpm gate:licences
      - name: Playwright browsers
        run: pnpm exec playwright install --with-deps webkit chromium
      - run: pnpm gate:no-network
      - run: pnpm gate:aesthetics
      - name: Build desktop app
        run: pnpm --filter @marxy/desktop build
      - name: Startup measurement (packaged app)
        run: node scripts/measure-startup.mjs
        env: { MARXY_PERF_REQUIRED: '1' }
      - run: pnpm gate:perf
      - run: pnpm gate:bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: gate-results-${{ matrix.os }}, path: results/, if-no-files-found: ignore }
