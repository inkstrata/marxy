name: installers
# A nightly Linux installer build from main, so the Linux handheld (read-only root, no compiler) can download the
# real AppImage and install-test it. The repository is public, so the minutes are free. A change to this file builds
# on its own pull request, which is how it proves itself.
on:
  schedule:
    - cron: "30 9 * * *" # 01:30 Pacific
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/installers.yml"]
permissions: { contents: read }
concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - name: Tauri's Linux packages, and what the AppImage bundler needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libssl-dev libxdo-dev build-essential pkg-config patchelf file xdg-utils
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      # tauri.conf.json's beforeBuildCommand is empty, so the web assets are built first (as release.yml does).
      - run: pnpm --filter @marxy/desktop build:web
      # Not the `bundle` script: it runs tauri with the config's own targets (which include nsis, a Windows
      # installer) and cannot be handed `--bundles`. Calling tauri directly limits the build to the two Linux formats.
      # The bundler's linuxdeploy is itself an AppImage; the runner has no FUSE, so it is run extracted.
      - name: Bundle the AppImage and the deb
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm --filter @marxy/desktop exec tauri build --bundles appimage,deb -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 7
          if-no-files-found: error
