[package]
name = "marxy"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "A markdown reader. Free, open, quiet, and set like a book."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
