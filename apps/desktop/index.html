<!doctype html>
<html lang="en" data-marxy-variant="dark">
<head>
<meta charset="utf-8">
<title>Marxy</title>
<!-- marxy:fonts -->
<!-- marxy:default-theme -->
<style>
  /* The empty state only; the document is styled by the default theme above (MARXY-20). */
  .marxy-empty { color: var(--marxy-color-text-secondary); font: 15px/1.5 system-ui, sans-serif; padding: 2rem; }
  #marxy-main { min-height: 100vh; }
  /* A pane (D-01): the box its article's margins are measured against (--marxy-room). One pane fills
     #marxy-main exactly, so a single document is laid out as it always was. */
  .marxy-pane { container-type: inline-size; min-width: 0; min-height: inherit; }
  .marxy-pane:focus { outline: none; }
  .marxy-pane > [role="status"]:empty { display: none; }
  /* Notices are pills at the pane's foot, off the column (U-02): the region is the pane's last child, a zero-height
     layer pinned to the bottom edge of what the reader sees of the pane (sticky, so it holds as the pane or the window
     scrolls; the pane is at least a screen tall, so it holds for a short page too). The pills stack upward from it, newest
     nearest the edge, and centre on the pane. Nothing here is in the column's flow, so raising or dismissing one moves
     nothing (F-45's guard). Positioning only; the pill's own look is the theme's. */
  .marxy-pane > [role="status"] {
    position: sticky; bottom: var(--marxy-notice-foot, calc(var(--marxy-size-chrome) * 40 / 13)); z-index: 10; height: 0; box-sizing: border-box;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    gap: calc(var(--marxy-size-chrome) * 6 / 13); padding-inline: calc(var(--marxy-size-chrome) * 16 / 13); pointer-events: none;
  }
  .marxy-pane > [role="status"] > * { pointer-events: auto; }
  .marxy-pane > [role="status"] > [data-notice-held] { display: none; }
  .marxy-find-slot { position: sticky; top: 0; height: 0; }
  .marxy-find-slot:empty { display: none; }
  #marxy-palette:not([open]) { display: none; }
  #marxy-outline:not([open]), #marxy-find[hidden], .marxy-source-mount[hidden] { display: none; }
  /* One pane: Source covers the window (§09); the pane's notices stay above it at the window's foot. */
  #marxy-main:not([data-marxy-split]) .marxy-source-mount:not([hidden]) { position: fixed; inset: 0; overflow: auto; }
  /* Two panes, side by side: each scrolls on its own, and Source covers only its pane. */
  #marxy-main[data-marxy-split] { display: grid; height: 100vh; }
  #marxy-main[data-marxy-split] > .marxy-pane { position: relative; overflow-y: auto; height: 100vh; }
  #marxy-main[data-marxy-split] .marxy-source-mount:not([hidden]) { position: absolute; inset: 0; overflow: auto; }
  /* Source has no content in the pane's flow (the mount is out of it), so a sticky region would sit at the pane's head: the
     pills are placed by the box Source covers instead. One pane: the window's foot (the mount is fixed). Beside another
     pane: that pane's own foot (the mount is absolute in it). */
  #marxy-main:not([data-marxy-split]) > .marxy-pane[data-marxy-mode="source"] > [role="status"] { position: fixed; left: 0; right: 0; bottom: var(--marxy-notice-foot, calc(var(--marxy-size-chrome) * 40 / 13)); }
  #marxy-main[data-marxy-split] > .marxy-pane[data-marxy-mode="source"] > [role="status"] { position: absolute; left: 0; right: 0; bottom: var(--marxy-notice-foot, calc(var(--marxy-size-chrome) * 40 / 13)); }
</style>
</head>
<body data-marxy-mode="rendered" data-marxy-variant="dark">
  <main id="marxy-main">
    <section class="marxy-pane" data-marxy-pane="0" data-marxy-focus>
      <article id="doc" class="marxy-article"></article>
      <div id="marxy-source" class="marxy-source-mount" hidden></div>
      <div class="marxy-find-slot"></div>
      <div id="marxy-notices" role="status"></div>
    </section>
  </main>
  <dialog id="marxy-palette"></dialog>
  <dialog id="marxy-outline"></dialog>
  <div id="marxy-find" hidden></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
