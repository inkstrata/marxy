<!doctype html>
<html lang="en" data-marxy-variant="dark">
<head>
<meta charset="utf-8">
<title>Marxy</title>
<!-- marxy:fonts -->
<!-- marxy:default-theme -->
<style>
  /* The empty state only; the document is styled by the default theme above (MARXY-20). */
  .marxy-empty { color: var(--marxy-color-text-secondary); font: 15px/1.5 system-ui, sans-serif; padding: 2rem; }
  #marxy-main { min-height: 100vh; }
  /* Notices are pills at the pane's foot (U-02): the same placement as index.html's, which this page copies. */
  .marxy-pane { min-height: inherit; }
  .marxy-pane > [role="status"]:empty { display: none; }
  .marxy-pane > [role="status"] {
    position: sticky; bottom: var(--marxy-notice-foot, calc(var(--marxy-size-chrome) * 40 / 13)); z-index: 10; height: 0; box-sizing: border-box;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    gap: calc(var(--marxy-size-chrome) * 6 / 13); padding-inline: calc(var(--marxy-size-chrome) * 16 / 13); pointer-events: none;
  }
  .marxy-pane > [role="status"] > * { pointer-events: auto; }
  .marxy-pane > [role="status"] > [data-notice-held] { display: none; }
  /* Source covers the window, out of the pane's flow: the pills are placed by the window's foot. */
  body[data-marxy-mode="source"] .marxy-pane > [role="status"] { position: fixed; left: 0; right: 0; }
  #marxy-palette:not([open]) { display: none; }
  #marxy-outline:not([open]), #marxy-find[hidden], #marxy-source[hidden] { display: none; }
  /* Source mode mount (§09); visible only while `data-marxy-mode="source"`. */
  #marxy-source:not([hidden]) { position: fixed; inset: 0; overflow: auto; }
</style>
</head>
<body data-marxy-mode="rendered" data-marxy-variant="dark">
  <main id="marxy-main">
    <article id="doc" class="marxy-article"></article>
    <div id="marxy-notices" role="status"></div>
  </main>
  <div id="marxy-source" hidden></div>
  <dialog id="marxy-palette"></dialog>
  <dialog id="marxy-outline"></dialog>
  <div id="marxy-find" hidden></div>
  <script type="module" src="./src/harness/gate-entry.ts"></script>
</body>
</html>
