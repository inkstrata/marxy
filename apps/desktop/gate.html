<!doctype html>
<html lang="en" data-marxy-variant="dark">
<head>
<meta charset="utf-8">
<title>Marxy</title>
<!-- marxy:fonts -->
<!-- marxy:default-theme -->
<style>
  /* The empty state only; the document is styled by the default theme above (MARXY-20). */
  .marxy-empty { color: var(--marxy-color-text-secondary); font: 15px/1.5 system-ui, sans-serif; padding: 2rem; }
  #marxy-main { min-height: 100vh; }
  #marxy-notices:empty { display: none; }
  /* Notices float (F-46): the region is a zero-height layer pinned to its pane's top edge, so raising or dismissing a
     notice never moves the text. Positioning only; the notice's own look is the theme's. The negative margin takes
     back the region's half-line of padding, which is the only height it keeps. */
  .marxy-pane > [role="status"] { position: sticky; top: 0; z-index: 10; height: 0; margin-bottom: calc(var(--marxy-line-box) / -2); pointer-events: none; }
  .marxy-pane > [role="status"] > * { pointer-events: auto; }
  #marxy-palette:not([open]) { display: none; }
  #marxy-outline:not([open]), #marxy-find[hidden], #marxy-source[hidden] { display: none; }
  /* Source mode mount (§09); visible only while `data-marxy-mode="source"`. */
  #marxy-source:not([hidden]) { position: fixed; inset: 0; overflow: auto; }
  /* The Source overlay covers the whole window, notices included; a notice is still the app speaking. */
  body[data-marxy-mode="source"] #marxy-notices { position: fixed; top: 0; left: 0; right: 0; z-index: 10; }
</style>
</head>
<body data-marxy-mode="rendered" data-marxy-variant="dark">
  <main id="marxy-main">
    <div id="marxy-notices" role="status"></div>
    <article id="doc" class="marxy-article"></article>
  </main>
  <div id="marxy-source" hidden></div>
  <dialog id="marxy-palette"></dialog>
  <dialog id="marxy-outline"></dialog>
  <div id="marxy-find" hidden></div>
  <script type="module" src="./src/harness/gate-entry.ts"></script>
</body>
</html>
